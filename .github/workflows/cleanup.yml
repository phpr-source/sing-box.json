name: Advanced Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

# 2026-10-05 對齊主工作流的供應鏈姿勢：頂層僅讀，寫權限按 job 下沉
# （cleanup-workflows/cleanup-caches 需 actions:write；cleanup-releases 需
# contents:write）。
permissions:
  contents: read

jobs:
  cleanup-workflows:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
          # 2026-10-05：巡检 workflow 的每日 run 此前永不清理，一併納入
          delete_workflow_pattern: "Build sing-box,Patch Compatibility Check"
          delete_run_by_conclusion_pattern: "failure"
          delete_only_older_than_days: 0

  cleanup-caches:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prune Actions caches (family GC + budget)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 2026-10-03 借鑒上游官方管線的 cache_gc（sing-box-releases build-*.yml），
          # 取代原「7 天裁剪 + 家族無關預算淘汰」兩段式：
          # 1) 同 (ref, cache family) 只保留 created_at 最新一條——go.sum /
          #    CRONET_GO_VERSION / setup-go 等 key 變化後，舊 key 快取即成死重，
          #    原邏輯要等 7 天才清，且 7 天裁剪可能把某家族唯一的新快取也刪掉
          #    （冷重建）；家族 = key 去掉尾部 -<16+ 位 hex> 哈希後的剩餘部分。
          # 2) 9GB 預算只對「各族最新」計算，按 last_accessed 最舊先刪。
          # 注意：--paginate 跨頁時 --jq 會輸出多段 JSON，必須管道 jq -s 聚合，
          # 不能把 --jq 直接寫在 gh api 上按單文件解析。
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .ref, .created_at, .last_accessed_at, .size_in_bytes, .key] | @tsv' \
            > "$RUNNER_TEMP/caches.tsv"
          python3 - "${{ github.repository }}" "$RUNNER_TEMP/caches.tsv" <<'EOF'
          import re
          import subprocess
          import sys

          repository, list_path = sys.argv[1], sys.argv[2]
          budget = 9 * 1024 * 1024 * 1024
          rows = []
          with open(list_path) as list_file:
              for line in list_file:
                  cache_id, ref, created_at, accessed_at, size, key = line.rstrip("\n").split("\t")
                  family = key
                  while True:
                      stripped = re.sub(r"-[0-9a-f]{16,}$", "", family)
                      if stripped == family:
                          break
                      family = stripped
                  rows.append({
                      "id": cache_id, "ref": ref, "created": created_at,
                      "accessed": accessed_at, "size": int(size), "key": key,
                      "family": family,
                  })
          newest = {}
          for row in rows:
              group = (row["ref"], row["family"])
              if group not in newest or row["created"] > newest[group]["created"]:
                  newest[group] = row
          doomed = [row for row in rows if newest[(row["ref"], row["family"])] is not row]
          kept = [row for row in rows if newest[(row["ref"], row["family"])] is row]
          total = sum(row["size"] for row in kept)
          for row in sorted(kept, key=lambda entry: entry["accessed"]):
              if total <= budget:
                  break
              doomed.append(row)
              total -= row["size"]
          for row in doomed:
              print(f"delete {row['size'] >> 20}MB {row['key']} ({row['ref']})")
              subprocess.run(
                  ["gh", "api", "-X", "DELETE", f"repos/{repository}/actions/caches/{row['id']}"],
                  check=False,
              )
          print(f"kept {len(rows) - len(doomed)} caches, {total >> 20}MB total")
          EOF

  cleanup-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 2026-10-05 移除無用的 Checkout 步驟：本 job 僅使用 gh CLI（GH_TOKEN 已注入），
      # 不讀取任何倉庫檔案；原 checkout 還釘在 v4 SHA 與全倉 v6 不一致。
      - name: Safe Cleanup Releases & Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up Stable releases..."
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == false) | .tagName' | \
            tail -n +4 | while IFS= read -r TAG; do
              echo "Deleting stable release $TAG..."
              gh release delete "$TAG" --yes --cleanup-tag || true
              sleep 0.5
            done

          echo "Cleaning up Prerelease releases older than 30 days..."
          OLD_RELEASES=$(gh release list --limit 100 --exclude-drafts --repo "${{ github.repository }}" \
            --json tagName,publishedAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease == true)] | .[3:] | .[]? | select((.publishedAt | fromdateiso8601) < (now - 2592000)) | .tagName')
          
          if [ -n "$OLD_RELEASES" ]; then
            for TAG in $OLD_RELEASES; do
              echo "Deleting prerelease $TAG..."
              gh release delete "$TAG" --yes --cleanup-tag || true
              sleep 0.5
            done
          else
            echo "No old prereleases matched deletion criteria."
          fi

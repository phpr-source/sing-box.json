name: Update Comprehensive SRS

on:
  workflow_run:
    workflows: ["Custom Rule Merge"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      manual_name:
        required: false
      manual_url:
        required: false
  push:
    paths:
      - 'rule-providers.json'
      - 'scripts/build_factory.py'
      - '.github/workflows/main.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  URL_ADBLOCK: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json"
  URL_WEBRTC: "https://github.com/syccccc2333-oss/singbox_config/raw/refs/heads/main/webRTC.json"

jobs:
  build:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix Environment
        run: |
          mkdir -p rules src
          if [ -f "fakeip-filter-Remote-DNS.json" ]; then
            mv fakeip-filter-Remote-DNS.json src/
          fi
          if [ ! -f "rule-providers.json" ]; then
            echo '{"reject-list": "https://raw.githubusercontent.com/77160860/rule/main/reject.json"}' > rule-providers.json
          fi
          find rules/ -maxdepth 1 -type f ! -name "fakeip-filter.json" -delete

      - name: Install Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="sing-box-stable"
          echo "Fetching release: $RELEASE_TAG"

          ASSET_URL=$(curl -sL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.tar\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "::error::No Linux amd64 asset found in release $RELEASE_TAG"
            echo "::group::Available assets"
            curl -sL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
              | jq -r '.assets[].name'
            echo "::endgroup::"
            exit 1
          fi

          echo "Downloading: $(basename "$ASSET_URL")"
          curl -L --fail --retry 3 -o sing-box.tar.gz "$ASSET_URL"
          tar -xzf sing-box.tar.gz
          rm -f sing-box.tar.gz

          if [ ! -f "sing-box" ]; then
            FOUND=$(find . -maxdepth 2 -name "sing-box" -type f 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" ./sing-box
            fi
          fi

          if [ ! -f "sing-box" ]; then
            echo "::error::Binary not found after extraction"
            exit 1
          fi
          chmod +x sing-box

          SB_VER=$(./sing-box version 2>/dev/null | head -n 1 | awk '{print $3}')
          echo "SB_VERSION=${SB_VER:-unknown}" >> "$GITHUB_ENV"
          echo "Core version: ${SB_VER:-unknown}"

          FMT_VER=""
          for v in 5 4 3 2 1; do
            echo "{\"version\": $v, \"rules\": []}" > /tmp/test_fmt.json
            if ./sing-box rule-set compile /tmp/test_fmt.json -o /tmp/test_fmt.srs 2>/dev/null; then
              FMT_VER="$v"
              rm -f /tmp/test_fmt.json /tmp/test_fmt.srs
              break
            fi
            rm -f /tmp/test_fmt.json /tmp/test_fmt.srs
          done
          echo "FORMAT_VERSION=${FMT_VER:-1}" >> "$GITHUB_ENV"
          echo "Format version: ${FMT_VER:-1}"

      - name: Run Factory
        run: |
          if [[ -n "${{ inputs.manual_name }}" ]]; then
            python3 scripts/build_factory.py "${{ inputs.manual_name }}" "${{ inputs.manual_url }}"
          else
            python3 scripts/build_factory.py
          fi

      - name: Task A - Adblock
        run: |
          curl -sL --fail --retry 3 "$URL_ADBLOCK" -o raw_adblock.json
          jq --argjson v "$FORMAT_VERSION" '.version=$v' raw_adblock.json > rules/Adblock.json
          ./sing-box rule-set compile rules/Adblock.json -o rules/Adblock.srs
          rm -f raw_adblock.json

      - name: Task B - FakeIP
        run: |
          if [ ! -f "rules/fakeip-filter.json" ]; then
            echo "::error::rules/fakeip-filter.json not found"
            exit 1
          fi
          jq --argjson v "$FORMAT_VERSION" '.version=$v' rules/fakeip-filter.json > rules/fakeip-filter.tmp.json
          mv rules/fakeip-filter.tmp.json rules/fakeip-filter.json
          ./sing-box rule-set compile rules/fakeip-filter.json -o rules/fakeip-filter.srs

      - name: Task C - Remote DNS
        run: |
          SRC="src/fakeip-filter-Remote-DNS.json"
          if [ -f "$SRC" ]; then
            jq --argjson v "$FORMAT_VERSION" '.version=$v' "$SRC" > rules/fakeip-filter-Remote-DNS.json
            ./sing-box rule-set compile rules/fakeip-filter-Remote-DNS.json -o rules/fakeip-filter-Remote-DNS.srs
          fi

      - name: Task D - WebRTC
        run: |
          curl -sL --fail --retry 3 "$URL_WEBRTC" -o raw.json
          jq --argjson v "$FORMAT_VERSION" '{version: $v, rules: (.rules // [])}' raw.json > rules/webRTC.json
          ./sing-box rule-set compile rules/webRTC.json -o rules/webRTC.srs
          rm -f raw.json

      - name: Finalize
        run: |
          python3 scripts/build_factory.py --gen-readme
          rm -f sing-box /tmp/test_fmt.json /tmp/test_fmt.srs
          rm -f ./*.srs
          find . -maxdepth 1 -type f -name "*.json" ! -name "rule-providers.json" -delete

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🚀 Sync Comprehensive Rules (V${FORMAT_VERSION}) | Core: ${SB_VERSION} | $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

name: Update Comprehensive SRS

on:
  workflow_run:
    workflows: ["Custom Rule Merge"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      manual_name:
        required: false
      manual_url:
        required: false
  push:
    paths:
      - 'rule-providers.json'
      - 'scripts/build_factory.py'
      - '.github/workflows/update-comprehensive.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  URL_ADBLOCK: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json"
  URL_FAKEIP_S1: "https://raw.githubusercontent.com/77160860/rule/refs/heads/main/filter.json"
  URL_FAKEIP_S2_SRS: "https://github.com/DustinWin/ruleset_geodata/releases/download/sing-box-ruleset/fakeip-filter.srs"
  URL_FAKEIP_S3_LIST: "https://raw.githubusercontent.com/HenryChiao/mihomo_yamls/refs/heads/main/custom/domain/fake-ip-filter.list"
  URL_WEBRTC: "https://raw.githubusercontent.com/Kris-Channnn/sing-box-proxy/refs/heads/main/webRTC.json"
  TARGET_FORMAT_VERSION: 4

jobs:
  build:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix Environment
        run: |
          mkdir -p rules src
          if [ -f "fakeip-filter-Remote-DNS.json" ]; then
            mv fakeip-filter-Remote-DNS.json src/
          fi
          if [ ! -f "rule-providers.json" ]; then
            echo '{"reject-list": "https://raw.githubusercontent.com/77160860/rule/main/reject.json"}' > rule-providers.json
          fi
          find rules/ -maxdepth 1 -type f -delete

      - name: Install Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="sing-box-stable"
          echo "Fetching release: $RELEASE_TAG"

          ASSET_URL=$(curl -sL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.tar\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "::error::No Linux amd64 asset found in release $RELEASE_TAG"
            echo "::group::Available assets"
            curl -sL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
              | jq -r '.assets[].name'
            echo "::endgroup::"
            exit 1
          fi

          echo "Downloading: $(basename "$ASSET_URL")"
          curl -L --fail --retry 3 -o sing-box.tar.gz "$ASSET_URL"
          tar -xzf sing-box.tar.gz
          rm -f sing-box.tar.gz

          if [ ! -f "sing-box" ]; then
            echo "::error::Binary not found after extraction"
            exit 1
          fi
          chmod +x sing-box

          SB_VER=$(./sing-box version 2>/dev/null | head -n 1 | awk '{print $3}')
          echo "SB_VERSION=${SB_VER:-unknown}" >> $GITHUB_ENV
          echo "Core: $(./sing-box version 2>/dev/null | head -n 1 || echo 'unknown')"

      - name: Run Factory
        run: |
          if [[ -n "${{ inputs.manual_name }}" ]]; then
            python3 scripts/build_factory.py "${{ inputs.manual_name }}" "${{ inputs.manual_url }}"
          else
            python3 scripts/build_factory.py
          fi

      - name: Task A - Adblock
        run: |
          curl -sL --retry 3 "$URL_ADBLOCK" -o raw_adblock.json
          jq --argjson v "$TARGET_FORMAT_VERSION" '.version=$v' raw_adblock.json > Adblock.json
          ./sing-box rule-set compile Adblock.json -o Adblock.srs
          mv Adblock.srs rules/
          mv Adblock.json rules/

      - name: Task B - FakeIP
        run: |
          curl -sL --retry 3 "$URL_FAKEIP_S1" -o s1.json
          curl -sL --retry 3 "$URL_FAKEIP_S2_SRS" -o s2.srs
          curl -sL --retry 3 "$URL_FAKEIP_S3_LIST" -o s3.list
          ./sing-box rule-set decompile s2.srs -o s2.json
          python3 scripts/merge_fakeip.py
          jq --argjson v "$TARGET_FORMAT_VERSION" '.version=$v' fakeip-filter.json > temp_fakeip.json && mv temp_fakeip.json fakeip-filter.json
          ./sing-box rule-set compile fakeip-filter.json -o fakeip-filter.srs
          mv fakeip-filter.srs rules/
          mv fakeip-filter.json rules/

      - name: Task C - Remote DNS
        run: |
          SRC="src/fakeip-filter-Remote-DNS.json"
          if [ -f "$SRC" ]; then
            jq --argjson v "$TARGET_FORMAT_VERSION" '.version=$v' "$SRC" > temp.json
            ./sing-box rule-set compile temp.json -o fakeip-filter-Remote-DNS.srs
            mv fakeip-filter-Remote-DNS.srs rules/
            cp temp.json rules/fakeip-filter-Remote-DNS.json
            rm temp.json
          fi

      - name: Task D - WebRTC
        run: |
          curl -sL --retry 3 "$URL_WEBRTC" -o raw.json
          jq --argjson v "$TARGET_FORMAT_VERSION" '{version: $v, rules: (.rules // [])}' raw.json > webRTC.json
          ./sing-box rule-set compile webRTC.json -o webRTC.srs
          mv webRTC.srs rules/
          mv webRTC.json rules/

      - name: Finalize
        run: |
          python3 scripts/build_factory.py --gen-readme
          rm -f s1.json s2.json s2.srs s3.list raw.json raw_adblock.json sing-box sing-box.tar.gz temp_*.json
          rm -f *.srs
          find . -maxdepth 1 -type f -name "*.json" ! -name "rule-providers.json" -delete

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🚀 Sync Comprehensive Rules (V4) | Core: ${{ env.SB_VERSION }} | $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main

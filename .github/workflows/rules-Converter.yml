name: Update All Rules (Geosite & GeoIP)

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（2026-10-05 釘版）
        with:
          ref: main

      - name: Resolve Format Version
        run: |
          FMT_VER=$(curl -sL --retry 3 \
            "https://raw.githubusercontent.com/reF1nd/sing-box/refs/heads/reF1nd-testing/constant/rule.go" \
            2>/dev/null | grep -oP 'RuleSetVersionCurrent\s*=\s*RuleSetVersion\K\d+' || true)
          if [ -z "$FMT_VER" ]; then
            echo "::warning::Failed to read RuleSetVersionCurrent, falling back to 5"
            FMT_VER="5"
          fi
          echo "FORMAT_VER=$FMT_VER" >> "$GITHUB_ENV"
          echo "Resolved format version: $FMT_VER"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5（2026-10-05 釘版）
        with:
          go-version: '1.22'
          cache: true

      - name: Install Tools
        run: |
          go install github.com/runetfreedom/geodat2srs@latest
          cp "$(go env GOPATH)/bin/geodat2srs" .

      - name: Install Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 2026-10-05 兩處修復：①資產選擇排除 -upx 變體（字母序 -upx 排 . 前，
          # head -1 曾命中 glibc-upx 包）；②解包到 runner 臨時目錄——歸檔自
          # 2026-10-02 起為頂層目錄結構，在倉庫工作樹內解包會殘留
          # sing-box-<ver>-*/ 目錄，被下方 git add . 提交進倉庫
          # （98e2fa5 實錘提交了 sing-box-1.15.0-alpha.9-...-glibc-upx/LICENSE）。
          RELEASE_TAG="sing-box-testing"
          ASSET_URL=$(curl -sL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            | jq -r '.assets[] | select((.name | test("linux-amd64.*\\.tar\\.gz$")) and (.name | test("-upx") | not)) | .browser_download_url' \
            | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "::warning::No testing release found, falling back to stable"
            RELEASE_TAG="sing-box-stable"
            ASSET_URL=$(curl -sL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
              | jq -r '.assets[] | select((.name | test("linux-amd64.*\\.tar\\.gz$")) and (.name | test("-upx") | not)) | .browser_download_url' \
              | head -n 1)
          fi

          if [ -z "$ASSET_URL" ]; then
            echo "::error::No Linux amd64 asset found in any release"
            exit 1
          fi

          curl -L --fail --retry 3 -o sb-core.tar.gz "$ASSET_URL"
          mkdir -p "$RUNNER_TEMP/sb-core-extract"
          tar -xzf sb-core.tar.gz -C "$RUNNER_TEMP/sb-core-extract"
          rm -f sb-core.tar.gz

          FOUND=$(find "$RUNNER_TEMP/sb-core-extract" -maxdepth 2 -name "sing-box" -type f 2>/dev/null | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::Binary not found after extraction"
            exit 1
          fi
          mv "$FOUND" ./sb-core
          chmod +x sb-core

      - name: Download & Process
        run: |
          set -euo pipefail
          mkdir -p temp/json rules/geosite-srs rules/geosite-json rules/geoip-srs rules/geoip-json
          rm -f rules/geosite-srs/* rules/geosite-json/*
          rm -f rules/geoip-srs/* rules/geoip-json/*
          export FORMAT_VER

          # geosite 類別已增長到數千個，串行 decompile→jq→compile 穩定超過
          # 60 分鐘作業超時（連續多日被取消）。改為 4 核並行流水線。
          convert_geosite() {
            f="$1"
            rule="$(basename "$f" .srs)"
            ./sb-core rule-set decompile --output "temp/json/$rule.json" "$f" || exit 1
            jq --argjson v "$FORMAT_VER" '.version=$v' "temp/json/$rule.json" > "rules/geosite-json/$rule.json" || exit 1
            ./sb-core rule-set compile --output "rules/geosite-srs/$rule.srs" "rules/geosite-json/$rule.json" || exit 1
          }
          export -f convert_geosite

          convert_geoip() {
            rule="$1"
            ./sb-core rule-set decompile --output "temp/json/$rule.json" "temp_ip/$rule.srs" || exit 1
            jq --argjson v "$FORMAT_VER" '.version=$v' "temp/json/$rule.json" > "rules/geoip-json/$rule.json" || exit 1
            ./sb-core rule-set compile --output "rules/geoip-srs/$rule.srs" "rules/geoip-json/$rule.json" || exit 1
          }
          export -f convert_geoip

          wget -q --timeout=30 -O temp/geosite.dat https://github.com/elysias123/geosite/releases/latest/download/geosite.dat
          wget -q --timeout=30 -O temp/geoip.dat https://github.com/elysias123/geosite/releases/latest/download/geoip.dat

          ./geodat2srs geosite -i temp/geosite.dat -o temp_site --prefix ""
          find temp_site -name '*.srs' | sort | xargs -P 8 -I {} bash -ec 'convert_geosite "$@"' _ {}

          ./geodat2srs geoip -i temp/geoip.dat -o temp_ip --prefix ""
          WANTED_IP="cn cloudflare cloudfront facebook fastly google netflix telegram twitter"
          echo "$WANTED_IP" | tr ' ' '\n' | xargs -P 8 -I {} bash -ec 'convert_geoip "$@"' _ {}

          rm -rf temp temp_site temp_ip
          total=$(find rules -name '*.srs' | wc -l)
          echo "Converted $total rule sets."

      - name: Commit and Push
        run: |
          rm -f geodat2srs sb-core
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update: Base Rules (V${FORMAT_VER}) $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

name: Custom Rule Merge

on:
  workflow_run:
    workflows: ["Update All Rules (Geosite & GeoIP)"]
    types:
      - completed
  workflow_dispatch:

jobs:
  merge:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pip install requests urllib3 orjson msgpack blake3 z3-solver
          # 直接取 sing-box-testing release 的標準 linux-amd64 包。
          # 歷史缺陷：此處曾 wget 一個獨立的 singbox helper release，該 release
          # 被 cleanup.yml 的 cleanup-releases 當作普通 stable release 刪除後，
          # wget 404（退出碼 8），且無人察覺——上游規則轉換連續超時把它掩蓋了 14 天。
          RELEASE_TAG="sing-box-testing"
          ASSET_URL=$(curl -sL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            | jq -r '.assets[] | select(.name | test("linux-amd64\\.tar\\.gz$")) | .browser_download_url' \
            | head -n 1)
          if [ -z "$ASSET_URL" ]; then
            echo "::error::No linux-amd64 asset found in $RELEASE_TAG"
            exit 1
          fi
          curl -L --fail --retry 3 -o sb-core.tar.gz "$ASSET_URL"
          tar -xzf sb-core.tar.gz
          rm -f sb-core.tar.gz
          FOUND=$(find . -maxdepth 2 -name "sing-box" -type f 2>/dev/null | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::sing-box binary not found after extraction"
            exit 1
          fi
          mv "$FOUND" ./sb-core
          chmod +x ./sb-core

      - name: Clean Old Merged Rules
        run: |
          mkdir -p rules/merged-json rules/merged-srs
          rm -f rules/merged-json/*
          rm -f rules/merged-srs/*

      - name: Run Custom Merge
        env:
          SB_CORE_PATH: ./sb-core
        run: python scripts/merge_custom.py

      - name: Commit and Push
        run: |
          rm -f sb-core
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update Custom Merged Rules (Hybrid V4) $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

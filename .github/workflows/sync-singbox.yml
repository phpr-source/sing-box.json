name: Build sing-box reFind

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch (Select "all" for full sync)'
        type: choice
        options: ['all', 'reF1nd-testing', 'reF1nd-stable', 'reF1nd-oldstable']
        default: 'all'
      upx:
        description: 'Enable UPX for Linux builds'
        type: boolean
        default: true
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_builds: ${{ steps.set.outputs.has_builds }}
    steps:
      - id: set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          BRANCHES=("reF1nd-testing|singbox-testing|Testing|false" "reF1nd-stable|singbox-stable|Stable|true" "reF1nd-oldstable|singbox-oldstable|OldStable|false")
          JSON="[]"
          HAS="false"
          
          for e in "${BRANCHES[@]}"; do
            IFS='|' read -r BR TAG TIT LAT <<< "$e"
            
            if [ "$EVENT" == "workflow_dispatch" ] && [ "$IN_BRANCH" != "all" ] && [ "$IN_BRANCH" != "$BR" ]; then continue; fi
            
            SHA=$(git ls-remote https://github.com/reF1nd/sing-box.git refs/heads/$BR | awk '{print $1}' | cut -c1-7)
            L_SHA="none"
            
            if gh release view $TAG --repo ${{ github.repository }} &>/dev/null; then
              if gh release download $TAG --pattern commit.txt --repo ${{ github.repository }} -O commit.txt 2>/dev/null; then
                L_SHA=$(head -n 1 commit.txt | tr -d '[:space:]')
              fi
            fi
            
            if [ "$EVENT" == "workflow_dispatch" ] || [ "$SHA" != "$L_SHA" ] || [ "$L_SHA" == "none" ]; then
              JSON=$(echo "$JSON" | jq -c --arg branch "$BR" --arg tag "$TAG" --arg title "$TIT" --argjson latest "$LAT" --arg sha "$SHA" --arg local_sha "$L_SHA" '. += [{"branch": $branch, "tag": $tag, "title": $title, "latest": $latest, "sha": $sha, "local_sha": $local_sha}]')
              HAS="true"
            fi
          done
          
          if [ "$JSON" == "[]" ]; then HAS="false"; fi
          
          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT
          echo "has_builds=$HAS" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.prepare.outputs.matrix).include }}
        target:
          - { os: linux, arch: amd64, amd: v3, upx: true }
          - { os: linux, arch: arm64, upx: true }
          - { os: linux, arch: arm, arm: 7, upx: true }
          - { os: linux, arch: mipsle, mips: softfloat, upx: false }
          - { os: windows, arch: amd64, amd: v3, upx: false }
          - { os: darwin, arch: amd64, upx: false }
          - { os: darwin, arch: arm64, upx: false }
          - { os: android, arch: arm64, upx: false }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ matrix.branch_info.branch }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - uses: crazy-max/ghaction-upx@v3
        if: matrix.target.upx == true
        with:
          install-only: true

      - name: Build & Archive
        run: |
          export GOOS=${{ matrix.target.os }}
          export GOARCH=${{ matrix.target.arch }}
          export CGO_ENABLED=0
          
          SUF=""
          if [ -n "${{ matrix.target.amd }}" ]; then
            export GOAMD64="${{ matrix.target.amd }}"
            SUF="v${{ matrix.target.amd }}"
          fi
          if [ -n "${{ matrix.target.arm }}" ]; then
            export GOARM="${{ matrix.target.arm }}"
            SUF="v${{ matrix.target.arm }}"
          fi
          if [ -n "${{ matrix.target.mips }}" ]; then
            export GOMIPS="${{ matrix.target.mips }}"
            SUF="-${{ matrix.target.mips }}"
          fi

          APP_VER=$(git describe --tags --abbrev=0 2>/dev/null || grep -oE '["'\''`][^"'\''`]+["'\''`]' constant/version.go 2>/dev/null | tr -d '"'\''`' | head -n 1 || date +%Y%m%d)
          NAME="sing-box-${APP_VER}-${{ matrix.branch_info.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${SUF}"
          
          if [ "${{ matrix.target.os }}" == "windows" ]; then
            BIN="sing-box.exe"
          else
            BIN="sing-box"
          fi
          
          TAGS="with_gvisor,with_quic,with_utls,with_acme,with_clash_api,with_v2ray_api,with_ech"
          LDFLAGS="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${APP_VER}-${{ matrix.branch_info.branch }}-${{ matrix.branch_info.sha }}"
          
          go build -trimpath -ldflags "$LDFLAGS" -tags "$TAGS" -o "$BIN" ./cmd/sing-box
          chmod +x "$BIN"
          
          if [ "${{ github.event.inputs.upx }}" != "false" ] && [ "${{ matrix.target.upx }}" == "true" ]; then
            upx --lzma --best "$BIN" || true
          fi
          
          cat << 'EOF' > config.json
          {
            "log": { "level": "info" },
            "inbounds": [{ "type": "mixed", "listen": "127.0.0.1", "listen_port": 2080 }],
            "outbounds": [{ "type": "selector", "tag": "proxy", "outbounds": ["direct"] }, { "type": "direct", "tag": "direct" }]
          }
          EOF
          
          mkdir "$NAME"
          mv "$BIN" "$NAME/"
          mv config.json "$NAME/"
          
          mkdir output
          if [ "${{ matrix.target.os }}" == "windows" ]; then
            zip -9 -r -q "output/${NAME}.zip" "$NAME"
          else
            tar -czf "output/${NAME}.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.branch_info.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.amd }}${{ matrix.target.arm }}${{ matrix.target.mips }}
          path: output/*

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch_info: ${{ fromJson(needs.prepare.outputs.matrix).include }}
    steps:
      - name: Checkout Source for Changelog
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ matrix.branch_info.branch }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Generate Changelog
        run: |
          if [ "${{ matrix.branch_info.local_sha }}" != "none" ] && git cat-file -t ${{ matrix.branch_info.local_sha }} >/dev/null 2>&1; then
            LOG=$(git log --pretty=format:"- %s (%h)" ${{ matrix.branch_info.local_sha }}..${{ matrix.branch_info.sha }})
            if [ -z "$LOG" ]; then LOG="- 無新增提交紀錄 (本次為手動強制重構建)"; fi
          else
            LOG=$(git log --pretty=format:"- %s (%h)" -n 5 ${{ matrix.branch_info.sha }})
            LOG="- *由於無本地歷史，顯示最近 5 次提交：*
          $LOG"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.branch_info.branch }}-*
          merge-multiple: true
          path: release_assets

      - name: Prepare Assets & Checksums
        run: |
          cd release_assets
          curl -L --retry 3 --retry-delay 2 -o geoip.db https://github.com/SagerNet/sing-geoip/releases/latest/download/geoip.db
          curl -L --retry 3 --retry-delay 2 -o geosite.db https://github.com/SagerNet/sing-geosite/releases/latest/download/geosite.db
          
          GO_VER=$(go version | awk '{print $3}')
          echo "GO_VERSION=$GO_VER" >> $GITHUB_ENV
          
          sha256sum *.zip *.tar.gz geoip.db geosite.db > sha256sums.txt
          
          echo "${{ matrix.branch_info.sha }}" > commit.txt
          echo "HASHES<<EOF" >> $GITHUB_ENV
          cat sha256sums.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Clean Old Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ matrix.branch_info.tag }} --cleanup-tag -y --repo ${{ github.repository }} 2>/dev/null || true
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete refs/tags/${{ matrix.branch_info.tag }} 2>/dev/null || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.branch_info.tag }}
          name: sing-box reFind | ${{ matrix.branch_info.title }}
          make_latest: ${{ matrix.branch_info.latest }}
          body: |
            ## 🚀 sing-box Core (${{ matrix.branch_info.title }})
            
            > 🤖 自動同步上游 [${{ matrix.branch_info.branch }}](https://github.com/reF1nd/sing-box/tree/${{ matrix.branch_info.branch }}) 分支
            
            ### 📝 更新日誌 (Changelog)
            ${{ env.CHANGELOG }}
            
            ### 📦 構建資訊
            - **源碼提交**: [`${{ matrix.branch_info.sha }}`](https://github.com/reF1nd/sing-box/commit/${{ matrix.branch_info.sha }})
            - **編譯環境**: `${{ env.GO_VERSION }}`
            - **編譯標籤 (Tags)**: `with_gvisor,with_quic,with_utls,with_acme,with_clash_api,with_v2ray_api,with_ech`
            - **開箱即用**: 附帶基礎版 `config.json` 及最新 `geoip.db` / `geosite.db`
            
            <details>
            <summary>🛡️ <b>展開查看校驗碼 (SHA-256)</b></summary>
            
            ```text
            ${{ env.HASHES }}
            ```
            </details>
          files: release_assets/*

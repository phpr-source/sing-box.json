name: Smart Build sing-box

on:
  workflow_dispatch:
    inputs:
      branch_to_build:
        description: 'Target branch (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - reF1nd-testing
          - reF1nd-stable
          - reF1nd-oldstable
      force_build:
        description: 'Force build (ignore commit check)'
        required: false
        type: boolean
        default: false
      enable_upx:
        description: 'Enable UPX compression'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 */6 * * *'

env:
  UPSTREAM_REPO: "reF1nd/sing-box"
  BRANCH_PREFIX: "reF1nd-"

jobs:
  build-and-release:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.branch_to_build == '' ||
      inputs.branch_to_build == matrix.branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.branch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: reF1nd-testing
            tag: singbox-testing
            name: Testing
            latest: false
          - branch: reF1nd-stable
            tag: singbox-stable
            name: Stable
            latest: true
          - branch: reF1nd-oldstable
            tag: singbox-oldstable
            name: OldStable
            latest: false

    steps:
      - name: Get Upstream Commit
        id: upstream
        run: |
          SHA=$(git ls-remote "https://github.com/${{ env.UPSTREAM_REPO }}.git" "refs/heads/${{ matrix.branch }}" | awk '{ print $1 }')
          if [ -z "${SHA}" ]; then
            echo "::error::Failed to fetch upstream commit."
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check Local Release
        id: local
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_SHA="none"
          if gh release view "${{ matrix.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release download "${{ matrix.tag }}" --pattern commit.txt --repo "${{ github.repository }}" -O commit.txt >/dev/null 2>&1; then
              [ -s commit.txt ] && LOCAL_SHA=$(tr -d '[:space:]' < commit.txt)
            fi
          fi
          echo "local_sha=${LOCAL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Evaluate Build Requirement
        id: eval
        run: |
          FORCE="${{ inputs.force_build }}"
          if [ "$FORCE" == "true" ] || [ "${{ steps.local.outputs.local_sha }}" == "none" ] || [ "${{ steps.upstream.outputs.sha }}" != "${{ steps.local.outputs.local_sha }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Source
        if: steps.eval.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Setup Go
        if: steps.eval.outputs.build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup UPX
        if: steps.eval.outputs.build == 'true'
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build and Package
        if: steps.eval.outputs.build == 'true'
        run: |
          go mod download
          
          RAW_VER=$(git describe --tags --abbrev=0 2>/dev/null | tr -d '[:space:]' | sed 's/^v//' || echo "")
          [ -z "${RAW_VER}" ] && RAW_VER=$(awk -F'"' '/Version[ \t]*=/ {print $2}' constant/version.go 2>/dev/null | tr -d '[:space:]' || echo "")
          [ -z "${RAW_VER}" ] && RAW_VER="${{ steps.upstream.outputs.short_sha }}"
          
          GO_VER=$(go version | awk '{print $3}' | sed 's/go//')
          SHORT_BRANCH="${matrix.branch#${{ env.BRANCH_PREFIX }}}"
          
          ENABLE_UPX="false"
          UPX_MSG="Disabled"
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ inputs.enable_upx }}" == "true" ]; then
            ENABLE_UPX="true"
            UPX_MSG="Enabled"
          fi
          
          echo "APP_VERSION=${RAW_VER}" >> "$GITHUB_ENV"
          echo "GO_VERSION=${GO_VER}" >> "$GITHUB_ENV"
          echo "UPX_STATUS=${UPX_MSG}" >> "$GITHUB_ENV"
          
          LDFLAGS="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${RAW_VER}-${SHORT_BRANCH}-${{ steps.upstream.outputs.short_sha }}"
          
          TARGETS=(
            "linux amd64"
            "linux amd64 v3"
            "linux arm64"
            "linux arm 7"
            "linux mips softfloat"
            "linux mipsle softfloat"
            "linux mips64"
            "linux mips64le"
            "windows amd64"
            "windows arm64"
            "darwin amd64"
            "darwin arm64"
            "android arm64"
          )
          
          > failed_targets.txt
          export CGO_ENABLED=0
          
          for TARGET in "${TARGETS[@]}"; do
            read -r LOCAL_GOOS LOCAL_GOARCH EXTRA <<< "${TARGET}"
            
            export GOOS="${LOCAL_GOOS}"
            export GOARCH="${LOCAL_GOARCH}"
            export GOARM="" GOMIPS="" GOMIPS64="" GOAMD64=""
            
            BASE_TAGS="with_quic,with_dhcp,with_wireguard,with_ech,with_utls,with_reality,with_clash_api,with_acme"
            if [ "${LOCAL_GOOS}" = "linux" ] && [[ ! "${LOCAL_GOARCH}" == mips* ]]; then
              BUILD_TAGS="with_gvisor,${BASE_TAGS}"
            else
              BUILD_TAGS="${BASE_TAGS}"
            fi
            
            ARCH_SUFFIX="-${LOCAL_GOARCH}"
            
            if [ "${LOCAL_GOARCH}" = "amd64" ] && [ -n "${EXTRA}" ]; then
              export GOAMD64="${EXTRA}"
              ARCH_SUFFIX="${ARCH_SUFFIX}-${EXTRA}"
            elif [[ "${LOCAL_GOARCH}" == *"mips64"* ]] && [ -n "${EXTRA}" ]; then
              export GOMIPS64="${EXTRA}"
              ARCH_SUFFIX="${ARCH_SUFFIX}-${EXTRA}"
            elif [[ "${LOCAL_GOARCH}" == *"mips"* ]] && [ -n "${EXTRA}" ]; then
              export GOMIPS="${EXTRA}"
              ARCH_SUFFIX="${ARCH_SUFFIX}-${EXTRA}"
            elif [ -n "${EXTRA}" ]; then
              export GOARM="${EXTRA}"
              ARCH_SUFFIX="${ARCH_SUFFIX}v${EXTRA}"
            fi
            
            EXT=$([ "${LOCAL_GOOS}" = "windows" ] && echo ".exe" || echo "")
            BIN_NAME="sing-box${EXT}"
            ARCHIVE_NAME="sing-box-${RAW_VER}-${SHORT_BRANCH}-${LOCAL_GOOS}${ARCH_SUFFIX}"
            
            BUILD_TIMEOUT=$([ "${LOCAL_GOARCH}" = "arm" ] || [[ "${LOCAL_GOARCH}" == *"mips"* ]] && echo "25m" || echo "15m")
            
            rm -f "${BIN_NAME}" build_err.log
            if ! timeout "${BUILD_TIMEOUT}" go build -trimpath -ldflags "${LDFLAGS}" -tags "${BUILD_TAGS}" -o "${BIN_NAME}" ./cmd/sing-box 2>build_err.log; then
              ERR_REASON=$(tail -n 10 build_err.log 2>/dev/null | tr '\n' ' ' | sed 's/[^[:print:]]//g' | sed 's/  */ /g' || echo "Compilation failed")
              printf -- '- ❌ `%s`: %s\n' "${ARCHIVE_NAME}" "${ERR_REASON:0:150}..." >> failed_targets.txt
              continue
            fi
            
            if [ -f "${BIN_NAME}" ]; then
              chmod +x "${BIN_NAME}"
              
              if [ "${ENABLE_UPX}" = "true" ] && { [[ "${LOCAL_GOOS}" == "linux" && "${LOCAL_GOARCH}" =~ ^(amd64|arm64|arm)$ ]] || [[ "${LOCAL_GOOS}" == "windows" && "${LOCAL_GOARCH}" == "amd64" ]]; }; then
                upx --lzma --best "${BIN_NAME}" >/dev/null 2>&1 || true
              fi
              
              if [ "${LOCAL_GOOS}" = "windows" ]; then
                zip -9 -q "${ARCHIVE_NAME}.zip" "${BIN_NAME}"
              else
                tar -czf "${ARCHIVE_NAME}.tar.gz" "${BIN_NAME}"
              fi
              rm -f "${BIN_NAME}" build_err.log
            fi
          done
          
          BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"
          
          [ -s failed_targets.txt ] && echo "PARTIAL_FAIL=true" >> "$GITHUB_ENV"
          
          shopt -s nullglob
          archives=(*.zip *.tar.gz)
          if [ ${#archives[@]} -gt 0 ]; then
            echo "| 📦 檔案名稱 (File) | 🛡️ SHA-256 校驗碼 (Hash) |" > hash_table.md
            echo "| :--- | :--- |" >> hash_table.md
            for arch in "${archives[@]}"; do
              hash=$(sha256sum "$arch" | awk '{print $1}')
              echo "| \`$arch\` | \`$hash\` |" >> hash_table.md
            done
            echo "${{ steps.upstream.outputs.sha }}" > commit.txt
          else
            echo "::error::Critical Failure: No binaries compiled successfully."
            exit 1
          fi

      - name: Generate Release Notes
        if: steps.eval.outputs.build == 'true'
        run: |
          cat > release_notes.md <<EOF
          <div align="center">
          
          # 🚀 Sing-box Core Optimized
          ### ${{ matrix.name }} 核心自動構建版
          
          ![Version](https://img.shields.io/badge/Version-v${{ env.APP_VERSION }}-3B82F6?style=for-the-badge&logo=github)
          ![Go Version](https://img.shields.io/badge/Go-${{ env.GO_VERSION }}-00ADD8?style=for-the-badge&logo=go)
          ![UPX](https://img.shields.io/badge/UPX-${{ env.UPX_STATUS }}-10B981?style=for-the-badge)
          
          *提供純淨、輕量、高性能的核心體驗*
          
          </div>
          
          ---
          
          ### 📌 構建資訊 (Build Info)
          
          | 屬性 | 詳情 |
          | :--- | :--- |
          | 👤 **上游倉庫** | [\`${{ env.UPSTREAM_REPO }}\`](https://github.com/${{ env.UPSTREAM_REPO }}) |
          | 🌿 **代碼分支** | [\`${{ matrix.branch }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/tree/${{ matrix.branch }}) |
          | 🎯 **源碼提交** | [\`${{ steps.upstream.outputs.short_sha }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${{ steps.upstream.outputs.sha }}) |
          | 🕒 **編譯時間** | \`${{ env.BUILD_TIME }}\` (UTC+8) |
          
          ### ⚙️ 包含模組與特性 (Build Tags)
          
          > 採用 \`CGO_ENABLED=0\` 純靜態編譯，確保極致的跨平台兼容性。
          
          - **通用模組**: \`with_quic, with_dhcp, with_wireguard, with_ech, with_utls, with_reality, with_clash_api, with_acme\`
          - **Linux 系統** *(除 mips 外)*: 額外包含 \`with_gvisor\` 模組。
          
          ### 📥 檔案下載與校驗 (Downloads & Checksums)
          
          EOF
          
          cat hash_table.md >> release_notes.md
          
          if [ -s failed_targets.txt ]; then
            echo -e "\n### ⚠️ 編譯失敗的架構 (Build Failures)\n" >> release_notes.md
            cat failed_targets.txt >> release_notes.md
          fi

      - name: Atomic Publish Release
        if: steps.eval.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(*.zip *.tar.gz commit.txt)
          RELEASE_TITLE="Sing-box v${{ env.APP_VERSION }} (${{ matrix.name }})"
          
          LATEST_FLAG="--prerelease"
          if [ "${{ matrix.latest }}" == "true" ]; then
            LATEST_FLAG="--latest"
          fi
          
          git push origin ":refs/tags/${{ matrix.tag }}" >/dev/null 2>&1 || true
          gh release delete "${{ matrix.tag }}" --cleanup-tag -y --repo "${{ github.repository }}" >/dev/null 2>&1 || true
          sleep 3
          
          gh release create "${{ matrix.tag }}" "${FILES[@]}" \
            --repo "${{ github.repository }}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            ${LATEST_FLAG}

      - name: Enforce Workflow Status
        if: steps.eval.outputs.build == 'true' && env.PARTIAL_FAIL == 'true'
        run: |
          echo "::error::Partial build failure detected. Check release notes for details."
          exit 1

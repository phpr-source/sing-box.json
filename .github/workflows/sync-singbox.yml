name: Smart Build sing-box

on:
  workflow_dispatch:
    inputs:
      branch_to_build:
        description: 'Target branch (leave empty for all)'
        required: false
        type: string
      enable_upx:
        description: 'Enable UPX compression'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: reF1nd-testing
            tag: singbox-testing
            name: Testing
            latest: 'false'
          - branch: reF1nd-stable
            tag: singbox-stable
            name: Stable
            latest: 'true'
          - branch: reF1nd-oldstable
            tag: singbox-oldstable
            name: OldStable
            latest: 'false'

    steps:
      - name: Check Status & Upstream
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.inputs.branch_to_build }}
        run: |
          # 1. 檢查是否因為手動輸入而需要跳過當前分支
          if [ -n "$TARGET_BRANCH" ] && [ "$TARGET_BRANCH" != "${{ matrix.branch }}" ]; then
            echo "status=skip" >> $GITHUB_OUTPUT
            echo "Skipping branch ${{ matrix.branch }} as it does not match input $TARGET_BRANCH"
            exit 0
          fi

          # 2. 獲取上游最新 SHA
          UPSTREAM_SHA=$(git ls-remote https://github.com/reF1nd/sing-box.git refs/heads/${{ matrix.branch }} | awk '{ print $1 }')
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::Failed to fetch upstream commit for ${{ matrix.branch }}."
            exit 1
          fi
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # 3. 獲取本地 Release 的 SHA
          LOCAL_SHA="none"
          if gh release view ${{ matrix.tag }} --repo ${{ github.repository }} &>/dev/null; then
            if gh release download ${{ matrix.tag }} --pattern commit.txt --repo ${{ github.repository }} -O commit.txt 2>/dev/null; then
              [ -s commit.txt ] && LOCAL_SHA=$(tr -d '[:space:]' < commit.txt)
            fi
          fi

          # 4. 判斷是否需要編譯
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$LOCAL_SHA" == "none" ] || [ "$SHORT_SHA" != "$LOCAL_SHA" ]; then
            echo "status=build" >> $GITHUB_OUTPUT
            echo "Update found or forced build. Upstream: $SHORT_SHA, Local: $LOCAL_SHA"
          else
            echo "status=skip" >> $GITHUB_OUTPUT
            echo "No update needed. SHA: $SHORT_SHA"
          fi

      - name: Checkout Source
        if: steps.check.outputs.status == 'build'
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Setup Go
        if: steps.check.outputs.status == 'build'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Download Go Modules
        if: steps.check.outputs.status == 'build'
        run: go mod download

      - name: Setup UPX
        if: steps.check.outputs.status == 'build'
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build, Compress and Package
        if: steps.check.outputs.status == 'build'
        run: |
          # 環境變數設定
          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"
          IN_UPX="${{ github.event.inputs.enable_upx }}"
          if [ "$IS_SCHEDULE" = "true" ] || [ "$IN_UPX" != "false" ]; then
            ENABLE_UPX="true"
            echo "UPX_STATUS=✅ Enabled" >> $GITHUB_ENV
          else
            ENABLE_UPX="false"
            echo "UPX_STATUS=❌ Disabled" >> $GITHUB_ENV
          fi

          APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || grep -E '^[[:space:]]*Version[[:space:]]*=[[:space:]]*' constant/version.go 2>/dev/null | grep -oE '["'\''`][^"'\''`]+["'\''`]' | tr -d '"'\''`' | head -n 1 || echo "")
          [ -z "$APP_VERSION" ] && APP_VERSION="$(date +%Y%m%d)"
          
          BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          BUILD_TAGS="with_gvisor,with_quic,with_utls,with_acme,with_clash_api"
          GO_VER=$(go version | awk '{print $3}')
          
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "BUILD_TAGS=$BUILD_TAGS" >> $GITHUB_ENV
          echo "GO_VERSION=$GO_VER" >> $GITHUB_ENV
          
          LDFLAGS="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${APP_VERSION}-${{ matrix.branch }}-${{ steps.check.outputs.short_sha }}"
          
          TARGETS=(
            "linux amd64"
            "linux arm64"
            "linux arm 7"
            "windows amd64"
            "darwin amd64"
            "darwin arm64"
            "android arm64"
          )
          
          > failed_targets.txt
          mkdir -p output_archives
          
          # 執行多架構編譯
          for TARGET in "${TARGETS[@]}"; do
            read -r LOCAL_GOOS LOCAL_GOARCH LOCAL_GOARM <<< "$TARGET"
            
            EXT=$([ "$LOCAL_GOOS" = "windows" ] && echo ".exe" || echo "")
            BIN_NAME="sing-box${EXT}"
            
            ARM_SUFFIX=$([ -n "$LOCAL_GOARM" ] && echo "v${LOCAL_GOARM}" || echo "")
            ARCHIVE_NAME="sing-box-${APP_VERSION}-${{ matrix.branch }}-${LOCAL_GOOS}-${LOCAL_GOARCH}${ARM_SUFFIX}"
            
            echo "Building $ARCHIVE_NAME..."
            
            # 編譯
            if ! env GOOS=$LOCAL_GOOS GOARCH=$LOCAL_GOARCH GOARM=$LOCAL_GOARM CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -tags "$BUILD_TAGS" -o "$BIN_NAME" ./cmd/sing-box; then
              echo "- ❌ $ARCHIVE_NAME (Build Failed)" >> failed_targets.txt
              continue
            fi
            
            chmod +x "$BIN_NAME"
            
            # UPX 壓縮 (僅限 Linux 與 Windows)
            if [ "$ENABLE_UPX" = "true" ] && [[ "$LOCAL_GOOS" == "linux" || "$LOCAL_GOOS" == "windows" ]]; then
              echo "Compressing $BIN_NAME with UPX..."
              upx --lzma --best "$BIN_NAME" || echo "UPX failed for $BIN_NAME, skipping compression."
            fi
            
            # 壓縮打包至 output_archives 目錄
            if [ "$LOCAL_GOOS" = "windows" ]; then
              zip -9 -q "output_archives/${ARCHIVE_NAME}.zip" "$BIN_NAME"
            else
              tar -czf "output_archives/${ARCHIVE_NAME}.tar.gz" "$BIN_NAME"
            fi
            
            rm -f "$BIN_NAME"
          done
          
          # 生成校驗碼與提交紀錄
          cd output_archives
          if ls *.zip *.tar.gz 1> /dev/null 2>&1; then
            sha256sum *.zip *.tar.gz > sha256sums.txt
            echo "FILE_HASHES<<EOF" >> $GITHUB_ENV
            cat sha256sums.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "${{ steps.check.outputs.short_sha }}" > commit.txt
          else
            echo "::error::No archive files were successfully built."
            exit 1
          fi
          cd ..
          
          # 處理錯誤訊息
          if [ -s failed_targets.txt ]; then
            echo "FAILED_MSG<<EOF" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "### ⚠️ 編譯失敗目標" >> $GITHUB_ENV
            cat failed_targets.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Clean Old Release
        if: steps.check.outputs.status == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ matrix.tag }} --cleanup-tag -y --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin refs/tags/${{ matrix.tag }} 2>/dev/null || true

      - name: Publish Release
        if: steps.check.outputs.status == 'build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: sing-box v${{ env.APP_VERSION }} (${{ matrix.name }})
          make_latest: ${{ matrix.latest }}
          body: |
            ## 🚀 sing-box Core | ${{ matrix.name }}
            
            > 💡 **自動構建報告**：本版本由 GitHub Actions 自動追蹤上游源碼並編譯，提供純淨、開箱即用的跨平台核心。
            
            ### 📦 構建資訊
            | 屬性 | 詳情 |
            | :--- | :--- |
            | 🔖 **核心版本** | `v${{ env.APP_VERSION }}` |
            | 🌿 **編譯分支** | [`${{ matrix.branch }}`](https://github.com/reF1nd/sing-box/tree/${{ matrix.branch }}) |
            | 🎯 **源碼提交** | [`${{ steps.check.outputs.short_sha }}`](https://github.com/reF1nd/sing-box/commit/${{ steps.check.outputs.short_sha }}) |
            | 🕒 **編譯時間** | `${{ env.BUILD_TIME }}` (UTC+8) |
            
            ### 🛠️ 核心配置
            - **Go 環境**: `${{ env.GO_VERSION }}`
            - **編譯標籤 (Tags)**: `${{ env.BUILD_TAGS }}`
            - **UPX 壓縮**: `${{ env.UPX_STATUS }}` (僅限 Linux & Windows)
            
            <details>
            <summary>🛡️ <b>展開查看檔案校驗碼 (SHA-256 Checksums)</b></summary>
            
            ```text
            ${{ env.FILE_HASHES }}
            ```
            </details>
            ${{ env.FAILED_MSG }}
          files: |
            output_archives/*.zip
            output_archives/*.tar.gz
            output_archives/sha256sums.txt
            output_archives/commit.txt

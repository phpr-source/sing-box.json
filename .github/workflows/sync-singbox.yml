name: Smart Build sing-box

on:
  workflow_dispatch:
    inputs:
      branch_to_build:
        description: 'Target branch (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - reF1nd-testing
          - reF1nd-stable
          - reF1nd-oldstable
      force_build:
        description: 'Force build (ignore commit check)'
        required: false
        type: boolean
        default: false
      enable_upx:
        description: 'Enable UPX compression'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 */6 * * *'

env:
  UPSTREAM_REPO: "reF1nd/sing-box"
  BRANCH_PREFIX: "reF1nd-"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.branch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: reF1nd-testing
            tag: singbox-testing
            name: Testing
            latest: false
          - branch: reF1nd-stable
            tag: singbox-stable
            name: Stable
            latest: true
          - branch: reF1nd-oldstable
            tag: singbox-oldstable
            name: OldStable
            latest: false

    steps:
      - name: Evaluate Build Requirement
        id: eval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.branch_to_build }}" ] && [ "${{ inputs.branch_to_build }}" != "${{ matrix.branch }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA=$(git ls-remote "https://github.com/${{ env.UPSTREAM_REPO }}.git" "refs/heads/${{ matrix.branch }}" | awk '{ print $1 }')
          if [ -z "${SHA}" ]; then
            echo "::error::Failed to fetch upstream commit."
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

          LOCAL_SHA="none"
          if gh release view "${{ matrix.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release download "${{ matrix.tag }}" --pattern commit.txt --repo "${{ github.repository }}" -O commit.txt >/dev/null 2>&1; then
              [ -s commit.txt ] && LOCAL_SHA=$(tr -d '[:space:]' < commit.txt)
            fi
          fi

          if [ "${{ inputs.force_build }}" == "true" ] || [ "$LOCAL_SHA" == "none" ] || [ "$SHA" != "$LOCAL_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Source
        if: steps.eval.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Setup Go
        if: steps.eval.outputs.build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup UPX
        if: steps.eval.outputs.build == 'true'
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build and Package
        if: steps.eval.outputs.build == 'true'
        run: |
          go mod download
          
          FULL_BRANCH="${{ matrix.branch }}"
          PREFIX="${{ env.BRANCH_PREFIX }}"
          SHORT_BRANCH="${FULL_BRANCH#$PREFIX}"
          SHORT_SHA="${{ steps.eval.outputs.short_sha }}"
          
          RAW_VER=$(git describe --tags --abbrev=0 2>/dev/null | tr -d '[:space:]' | sed 's/^v//' || echo "")
          [ -z "${RAW_VER}" ] && RAW_VER=$(awk -F'"' '/Version[ \t]*=/ {print $2}' constant/version.go 2>/dev/null | tr -d '[:space:]' || echo "")
          [ -z "${RAW_VER}" ] && RAW_VER="$SHORT_SHA"
          
          GO_VER=$(go version | awk '{print $3}' | sed 's/go//')
          
          ENABLE_UPX="false"
          UPX_MSG="Disabled"
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ inputs.enable_upx }}" == "true" ]; then
            ENABLE_UPX="true"
            UPX_MSG="Enabled"
          fi
          
          echo "APP_VERSION=${RAW_VER}" >> "$GITHUB_ENV"
          echo "GO_VERSION=${GO_VER}" >> "$GITHUB_ENV"
          echo "UPX_STATUS=${UPX_MSG}" >> "$GITHUB_ENV"
          
          LDFLAGS="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${RAW_VER}-${SHORT_BRANCH}-${SHORT_SHA}"
          
          TARGETS=(
            "linux amd64" "linux amd64 v3" "linux arm64" "linux arm 7"
            "linux mips softfloat" "linux mipsle softfloat" "linux mips64" "linux mips64le"
            "windows amd64" "windows arm64" "darwin amd64" "darwin arm64" "android arm64"
          )
          
          > failed_targets.txt
          export CGO_ENABLED=0
          
          for TARGET in "${TARGETS[@]}"; do
            read -r LOCAL_GOOS LOCAL_GOARCH EXTRA <<< "${TARGET}"
            export GOOS="${LOCAL_GOOS}" GOARCH="${LOCAL_GOARCH}" GOARM="" GOMIPS="" GOMIPS64="" GOAMD64=""
            
            BASE_TAGS="with_quic,with_dhcp,with_wireguard,with_ech,with_utls,with_reality,with_clash_api,with_acme"
            BUILD_TAGS="$BASE_TAGS"
            [[ "${LOCAL_GOOS}" == "linux" && ! "${LOCAL_GOARCH}" == mips* ]] && BUILD_TAGS="with_gvisor,$BASE_TAGS"
            
            ARCH_SUFFIX="-$LOCAL_GOARCH"
            if [ "$LOCAL_GOARCH" = "amd64" ] && [ -n "$EXTRA" ]; then
              export GOAMD64="$EXTRA"; ARCH_SUFFIX="$ARCH_SUFFIX-$EXTRA"
            elif [[ "$LOCAL_GOARCH" == *"mips64"* ]] && [ -n "$EXTRA" ]; then
              export GOMIPS64="$EXTRA"; ARCH_SUFFIX="$ARCH_SUFFIX-$EXTRA"
            elif [[ "$LOCAL_GOARCH" == *"mips"* ]] && [ -n "$EXTRA" ]; then
              export GOMIPS="$EXTRA"; ARCH_SUFFIX="$ARCH_SUFFIX-$EXTRA"
            elif [ -n "$EXTRA" ]; then
              export GOARM="$EXTRA"; ARCH_SUFFIX="${ARCH_SUFFIX}v$EXTRA"
            fi
            
            EXT=$([ "$LOCAL_GOOS" = "windows" ] && echo ".exe" || echo "")
            BIN_NAME="sing-box$EXT"
            ARCHIVE_NAME="sing-box-${RAW_VER}-${SHORT_BRANCH}-${LOCAL_GOOS}${ARCH_SUFFIX}"
            TIMEOUT=$([ "$LOCAL_GOARCH" = "arm" ] || [[ "$LOCAL_GOARCH" == *"mips"* ]] && echo "25m" || echo "15m")
            
            rm -f "$BIN_NAME" build_err.log
            if ! timeout "$TIMEOUT" go build -trimpath -ldflags "$LDFLAGS" -tags "$BUILD_TAGS" -o "$BIN_NAME" ./cmd/sing-box 2>build_err.log; then
              ERR_REASON=$(tail -n 5 build_err.log 2>/dev/null | tr '\n' ' ' | sed 's/[^[:print:]]//g' | sed 's/  */ /g' || echo "Failed")
              printf -- '- ❌ `%s`: %s\n' "$ARCHIVE_NAME" "${ERR_REASON:0:120}..." >> failed_targets.txt
              continue
            fi
            
            if [ -f "$BIN_NAME" ]; then
              chmod +x "$BIN_NAME"
              if [ "$ENABLE_UPX" = "true" ] && { [[ "$LOCAL_GOOS" == "linux" && "$LOCAL_GOARCH" =~ ^(amd64|arm64|arm)$ ]] || [[ "$LOCAL_GOOS" == "windows" && "$LOCAL_GOARCH" == "amd64" ]]; }; then
                upx --lzma --best "$BIN_NAME" >/dev/null 2>&1 || true
              fi
              [ "$LOCAL_GOOS" = "windows" ] && zip -9 -q "$ARCHIVE_NAME.zip" "$BIN_NAME" || tar -czf "$ARCHIVE_NAME.tar.gz" "$BIN_NAME"
              rm -f "$BIN_NAME"
            fi
          done
          
          echo "BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          [ -s failed_targets.txt ] && echo "PARTIAL_FAIL=true" >> "$GITHUB_ENV"
          
          shopt -s nullglob
          archives=(*.zip *.tar.gz)
          if [ ${#archives[@]} -gt 0 ]; then
            echo "| 📦 檔案名稱 (File) | 🛡️ SHA-256 校驗碼 (Hash) |" > hash_table.md
            echo "| :--- | :--- |" >> hash_table.md
            for arch in "${archives[@]}"; do
              echo "| \`$arch\` | \`$(sha256sum "$arch" | awk '{print $1}')\` |" >> hash_table.md
            done
            echo "${{ steps.eval.outputs.sha }}" > commit.txt
          else
            exit 1
          fi

      - name: Generate Release Notes
        if: steps.eval.outputs.build == 'true'
        run: |
          cat > release_notes.md <<EOF
          <div align="center">
          
          # 🚀 Sing-box Core Optimized
          ### ${{ matrix.name }} 核心自動構建版
          
          ![Version](https://img.shields.io/badge/Version-v${{ env.APP_VERSION }}-3B82F6?style=for-the-badge&logo=github)
          ![Go Version](https://img.shields.io/badge/Go-${{ env.GO_VERSION }}-00ADD8?style=for-the-badge&logo=go)
          ![UPX](https://img.shields.io/badge/UPX-${{ env.UPX_STATUS }}-10B981?style=for-the-badge)
          
          </div>
          
          ---
          
          ### 📌 構建資訊 (Build Info)
          
          | 屬性 | 詳情 |
          | :--- | :--- |
          | 👤 **上游倉庫** | [\`${{ env.UPSTREAM_REPO }}\`](https://github.com/${{ env.UPSTREAM_REPO }}) |
          | 🌿 **代碼分支** | [\`${{ matrix.branch }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/tree/${{ matrix.branch }}) |
          | 🎯 **源碼提交** | [\`${{ steps.eval.outputs.short_sha }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${{ steps.eval.outputs.sha }}) |
          | 🕒 **編譯時間** | \`${{ env.BUILD_TIME }}\` (UTC+8) |
          
          ### ⚙️ 包含模組與特性 (Build Tags)
          
          - **通用模組**: \`with_quic, with_dhcp, with_wireguard, with_ech, with_utls, with_reality, with_clash_api, with_acme\`
          - **Linux 系統** *(除 mips 外)*: 額外包含 \`with_gvisor\` 模組。
          
          ### 📥 檔案下載與校驗 (Downloads & Checksums)
          
          EOF
          cat hash_table.md >> release_notes.md
          [ -s failed_targets.txt ] && echo -e "\n### ⚠️ 編譯失敗的架構\n$(cat failed_targets.txt)" >> release_notes.md

      - name: Atomic Publish Release
        if: steps.eval.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(*.zip *.tar.gz commit.txt)
          git push origin ":refs/tags/${{ matrix.tag }}" >/dev/null 2>&1 || true
          gh release delete "${{ matrix.tag }}" --cleanup-tag -y --repo "${{ github.repository }}" >/dev/null 2>&1 || true
          sleep 5
          gh release create "${{ matrix.tag }}" "${FILES[@]}" \
            --repo "${{ github.repository }}" \
            --title "Sing-box v${{ env.APP_VERSION }} (${{ matrix.name }})" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            $([ "${{ matrix.latest }}" == "true" ] && echo "--latest" || echo "--prerelease")

      - name: Enforce Workflow Status
        if: steps.eval.outputs.build == 'true' && env.PARTIAL_FAIL == 'true'
        run: exit 1

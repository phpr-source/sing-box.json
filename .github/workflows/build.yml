  publish_release:
    runs-on: ubuntu-latest
    if: always()
    needs:
      [detect_singbox_oldstable, build_singbox_oldstable,
       detect_singbox_stable, build_singbox_stable,
       detect_singbox_testing, build_singbox_testing,
       detect_ref1nd_oldstable, build_ref1nd_oldstable,
       detect_ref1nd_stable, build_ref1nd_stable, build_android_ref1nd_stable,
       detect_ref1nd_testing, build_ref1nd_testing, build_android_ref1nd_testing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare releases
        run: |
          mkdir -p dist
          for prefix in oldstable stable testing ref1nd-oldstable ref1nd-stable ref1nd-testing; do
            eval "SKIP=\$needs.detect_${prefix//[-]/_}.outputs.skip"
            if [ "$SKIP" != "true" ]; then
              for f in artifacts/${prefix}-*/*; do
                if [ -f "$f" ]; then cp "$f" dist/ && [[ "$f" == *linux* ]] && chmod +x "dist/$(basename "$f")"; fi
              done
            fi
          done
          cp artifacts/apk-*/* dist/ 2>/dev/null || true
      - name: UPX compress
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: dist/*linux*
          args: --best --lzma
      - name: Create tar packages
        run: |
          cd dist
          for f in *linux-*; do
            if [ -f "$f" ]; then DIR="${f%.*}" && mkdir -p "$DIR" && cp "$f" "$DIR/" && tar -czvf "${DIR}.tar.gz" "$DIR/" && rm -rf "$DIR" "$f"; fi
          done
      - name: Check files
        id: check
        run: if ls dist/* >/dev/null 2>&1; then echo "has_files=true" >> $GITHUB_OUTPUT; else echo "has_files=false" >> $GITHUB_OUTPUT; fi
      - name: Generate notes
        if: steps.check.outputs.has_files == 'true'
        run: |
          cat > release_notes.md << EOF
          # sing-box 编译版本
          
          ## SagerNet/sing-box
          | 分支 | 版本 | 日期 |
          |------|------|------|
          | OldStable | ${OLDSTABLE_VER:-'-'} | ${OLDSTABLE_TIME:-'-'} |
          | Stable | ${STABLE_VER:-'-'} | ${STABLE_TIME:-'-'} |
          | Testing | ${TESTING_VER:-'-'} | ${TESTING_TIME:-'-'} |
          
          ## reF1nd/sing-box
          | 分支 | 版本 | 日期 |
          |------|------|------|
          | OldStable | ${REF1ND_OLDSTABLE_VER:-'-'} | ${REF1ND_OLDSTABLE_TIME:-'-'} |
          | Stable | ${REF1ND_STABLE_VER:-'-'} | ${REF1ND_STABLE_TIME:-'-'} |
          | Testing | ${REF1ND_TESTING_VER:-'-'} | ${REF1ND_TESTING_TIME:-'-'} |
          
          构建: $(date -u '+%Y-%m-%d %H:%M UTC') | NaiveProxy: ${NAIVE_STATUS:-'Disabled'}
          EOF
        env:
          OLDSTABLE_VER: ${{ needs.detect_singbox_oldstable.outputs.version }}
          STABLE_VER: ${{ needs.detect_singbox_stable.outputs.version }}
          TESTING_VER: ${{ needs.detect_singbox_testing.outputs.version }}
          REF1ND_OLDSTABLE_VER: ${{ needs.detect_ref1nd_oldstable.outputs.version }}
          REF1ND_STABLE_VER: ${{ needs.detect_ref1nd_stable.outputs.version }}
          REF1ND_TESTING_VER: ${{ needs.detect_ref1nd_testing.outputs.version }}
          NAIVE_STATUS: ${{ github.event.inputs.enable_naive == 'true' && 'Enabled' || 'Disabled' }}
      - name: Release
        if: steps.check.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sing-box
          name: "sing-box Releases"
          body_path: release_notes.md
          files: dist/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_telegram:
    runs-on: ubuntu-latest
    if: github.event.inputs.enable_telegram == 'true' && always()
    needs: [publish_release]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Send notification
        uses: xz-dev/TelegramFileUploader@v1
        with:
          to-who: "${{ secrets.TELEGRAM_CHAT_ID }}"
          message: |
            **sing-box 构建完成**
            
            **SagerNet**
            • OldStable: `${{ needs.detect_singbox_oldstable.outputs.version || 'N/A' }}`
            • Stable: `${{ needs.detect_singbox_stable.outputs.version || 'N/A' }}`
            • Testing: `${{ needs.detect_singbox_testing.outputs.version || 'N/A' }}`
            
            **reF1nd**
            • OldStable: `${{ needs.detect_ref1nd_oldstable.outputs.version || 'N/A' }}`
            • Stable: `${{ needs.detect_ref1nd_stable.outputs.version || 'N/A' }}`
            • Testing: `${{ needs.detect_ref1nd_testing.outputs.version || 'N/A' }}`
            
            📥 [Download](https://github.com/${{ github.repository }}/releases/tag/sing-box)
          files: dist/*
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

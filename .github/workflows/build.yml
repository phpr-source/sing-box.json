name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      rebuild_target:
        description: "Rebuild specific target only (leave empty for all)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "reF1nd_Stable"
          - "reF1nd_Testing"
      build_commit:
        description: "Build specific commit SHA (leave empty for branch HEAD)"
        required: false
        type: string
        default: ""
      skip_version_check:
        description: "Skip version check API calls and build immediately"
        required: false
        type: boolean
        default: false
      force_build:
        description: "Force build all targets (Ignore version match)"
        required: false
        type: boolean
        default: false
      override_version:
        description: "Override version (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      enable_naive:
        description: "Enable naive outbound (Linux/Windows only)"
        required: false
        type: boolean
        default: false
      publish_type:
        description: "Release publishing strategy"
        required: false
        type: choice
        default: "rolling"
        options:
          - "rolling"
          - "versioned"
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-sing-box.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write
  actions: write
  issues: write
  packages: write
  id-token: write
  attestations: write

env:
  TAGS_COMMON: "badlinkname,tfogo_checklinkname0,with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api,with_wireguard,with_tailscale"
  TAGS_CLI_EXTRA: "with_dhcp,with_acme,with_ccm,with_ocm"
  TAGS_SFA_EXTRA: "ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird"
  TAGS_ANDROID_EXTRA: "with_conntrack,with_naive_outbound"
  CURL_TIMEOUT_API: 60
  CURL_TIMEOUT_FILE: 120

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go.outputs.version }}
      start_time: ${{ steps.time.outputs.start }}
      android_secrets_valid: ${{ steps.validate.outputs.android_secrets_valid }}
      version_code: ${{ steps.calc.outputs.code }}
    steps:
      - name: Record Start Time
        id: time
        run: echo "start=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Calculate Android Version Code
        id: calc
        run: |
          CODE=$(( ($(date +%s) / 60) + ${{ github.run_number }} ))
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Get Go latest version
        id: go
        run: |
          VERSION=$(curl -m ${CURL_TIMEOUT_API} -sL https://go.dev/VERSION?m=text | head -n 1 | sed 's/go//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Validate Secrets
        id: validate
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          CHAT_ID: ${{ secrets.CHAT_ID || '' }}
          API_ID: ${{ secrets.API_ID || '' }}
          API_HASH: ${{ secrets.API_HASH || '' }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.enable_telegram }}" == "true" ]]; then
            if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$CHAT_ID" || -z "$API_ID" || -z "$API_HASH" ]]; then
              echo "::warning::Telegram secrets missing. Notifications may fail."
            fi
          fi
          if [[ -z "$ANDROID_KEYSTORE" || -z "$KEYSTORE_PASS" || -z "$ALIAS_NAME" || -z "$ALIAS_PASS" ]]; then
            echo "::warning::Android Keystore secrets missing."
            echo "android_secrets_valid=false" >> $GITHUB_OUTPUT
          else
            echo "android_secrets_valid=true" >> $GITHUB_OUTPUT
          fi

  check:
    needs: [init]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_update: ${{ steps.check.outputs.has_update }}
    steps:
      - name: Check versions and generate matrix
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api_call_with_retry() {
            local url="$1"
            curl -sfL -m ${CURL_TIMEOUT_API} --retry 3 --retry-delay 5 --retry-connrefused -H "Authorization: token $GH_TOKEN" "$url" || echo "[]"
          }

          FORCE_BUILD="${{ github.event.inputs.force_build || 'false' }}"
          OVERRIDE_VERSION="${{ github.event.inputs.override_version || '' }}"
          TARGET_FILTER="${{ github.event.inputs.rebuild_target || '' }}"
          SKIP_CHECK="${{ github.event.inputs.skip_version_check || 'false' }}"

          LAST_BUILD_INFO="{}"
          if [ "$SKIP_CHECK" != "true" ]; then
            CONTENT=$(gh api "repos/${{ github.repository }}/contents/build-info.json?ref=release-info" -q ".content" 2>/dev/null || true)
            if [ -n "$CONTENT" ]; then
              LAST_BUILD_INFO=$(echo "$CONTENT" | base64 -d 2>/dev/null || echo "{}")
            fi
            if ! echo "$LAST_BUILD_INFO" | jq empty 2>/dev/null; then LAST_BUILD_INFO="{}"; fi
          fi

          echo "" > release_notes.txt
          rm -f /tmp/has_update_flag
          > /tmp/matrix.jsonl

          check_branch() {
            local id="${1:-}" repo="${2:-}" branch="${3:-}" sfa_repo="${4:-}" sfa_branch="${5:-}"

            if [ -n "$TARGET_FILTER" ] && [ "$TARGET_FILTER" != "$id" ]; then
              return 0
            fi

            local ver="" time="" commit_msg="" core_ref=""

            if [ -n "$OVERRIDE_VERSION" ]; then
              ver="${OVERRIDE_VERSION}"
              core_ref="v${OVERRIDE_VERSION}"
              time="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            elif [ "$SKIP_CHECK" = "true" ]; then
              ver="unknown"
              core_ref="$branch"
              time="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            else
              local tag_data=$(api_call_with_retry "https://api.github.com/repos/$repo/tags")
              if [[ "$branch" == *"testing"* ]]; then
                ver=$(echo "$tag_data" | jq -r '[.[] | select(.name | type == "string" and contains("reF1nd") and test("alpha|beta|rc"))][0].name // empty' 2>/dev/null | sed 's/^v//' || true)
              else
                ver=$(echo "$tag_data" | jq -r '[.[] | select(.name | type == "string" and contains("reF1nd") and (test("alpha|beta|rc") | not))][0].name // empty' 2>/dev/null | sed 's/^v//' || true)
              fi

              if [ -z "$ver" ] || [ "$ver" = "null" ]; then
                local commit_data=$(api_call_with_retry "https://api.github.com/repos/$repo/commits?sha=$branch&per_page=1")
                ver=$(echo "$commit_data" | jq -r '.[0].sha // empty' 2>/dev/null | cut -c1-8 || true)
                core_ref="$ver"
              else
                core_ref="v$ver"
              fi

              if [ -n "$ver" ] && [ "$ver" != "null" ]; then
                local commit_info=$(api_call_with_retry "https://api.github.com/repos/$repo/commits/$branch")
                local commit_date=$(echo "$commit_info" | jq -r '.commit.committer.date // empty' 2>/dev/null || echo "")
                commit_msg=$(echo "$commit_info" | jq -r '.commit.message // empty' 2>/dev/null | head -n 5 | sed 's/\r//g' || echo "無更新說明")
                
                if [ -n "$commit_date" ] && [ "$commit_date" != "null" ]; then
                  time=$(TZ=Asia/Shanghai date -d "$commit_date" '+%Y-%m-%d' 2>/dev/null || TZ=Asia/Shanghai date '+%Y-%m-%d')
                else
                  time="unknown"
                fi
              fi
            fi

            if [ -z "$ver" ] || [ "$ver" = "null" ] || [ -z "$time" ]; then
              echo "::warning::[$id] Cannot read valid version or time. Skipping."
              return 0
            fi

            if [[ "$sfa_repo" != "none" ]]; then
              if ! timeout 10 git ls-remote --heads "https://github.com/${sfa_repo}.git" "$sfa_branch" 2>/dev/null | grep -qw "$sfa_branch"; then
                echo "::warning::[$id] Android branch $sfa_repo/$sfa_branch not found. Disabling Android."
                sfa_repo="none"
                sfa_branch="none"
              fi
            fi

            local display_name="$id"
            local marker="[${id} v${ver}]"
            local branch_url="https://github.com/$repo/tree/$branch"

            LAST_VER=$(echo "$LAST_BUILD_INFO" | jq -r --arg id "$id" '.targets[]? | select(.target_id == $id) | .version_name // empty' 2>/dev/null | head -n 1)

            if [ "$FORCE_BUILD" = "true" ] || [ -n "$OVERRIDE_VERSION" ] || [ -n "$TARGET_FILTER" ] || [ "$SKIP_CHECK" = "true" ]; then
              echo "true" > /tmp/has_update_flag
              echo "- 🔄 強制構建 **[$display_name]($branch_url)** \`v$ver\` ($time) $marker" >> release_notes.txt
              jq -n -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg core_ref "$core_ref" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" --arg msg "$commit_msg" '{id:$id, repo:$repo, branch:$branch, core_ref:$core_ref, sfa_repo:$sfa_repo, sfa_branch:$sfa_branch, ver:$ver, time:$time, msg:$msg}' >> /tmp/matrix.jsonl
            elif [ "$LAST_VER" != "$ver" ] || [ -z "$LAST_VER" ]; then
              echo "true" > /tmp/has_update_flag
              echo "- ✨ 更新 **[$display_name]($branch_url)** 至 \`v$ver\`，發佈於 $time $marker" >> release_notes.txt
              jq -n -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg core_ref "$core_ref" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" --arg msg "$commit_msg" '{id:$id, repo:$repo, branch:$branch, core_ref:$core_ref, sfa_repo:$sfa_repo, sfa_branch:$sfa_branch, ver:$ver, time:$time, msg:$msg}' >> /tmp/matrix.jsonl
            fi
          }

          check_branch "reF1nd_Stable"     "reF1nd/sing-box"   "reF1nd-stable"  "reF1nd/sing-box-for-android" "reF1nd-stable"
          check_branch "reF1nd_Testing"    "reF1nd/sing-box"   "reF1nd-testing" "reF1nd/sing-box-for-android" "reF1nd-testing"

          sed -i '/^ *$/d' release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "- 📝 自動構建完成（無版本變更檢測）" > release_notes.txt
          fi

          VALIDATED_MATRIX=$(jq -s -c '[.[] | select(.ver != null and .ver != "" and .time != null and .time != "")]' /tmp/matrix.jsonl 2>/dev/null || echo "[]")
          if [ -z "$VALIDATED_MATRIX" ] || ! echo "$VALIDATED_MATRIX" | jq empty 2>/dev/null; then
            VALIDATED_MATRIX="[]"
          fi

          echo "matrix=${VALIDATED_MATRIX}" >> $GITHUB_OUTPUT

          if [ -f /tmp/has_update_flag ] && [ "$VALIDATED_MATRIX" != "[]" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Metadata
        if: steps.check.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-metadata
          path: release_notes.txt
          retention-days: 1
          compression-level: 0

  build_core:
    needs: [init, check]
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != ''
    timeout-minutes: ${{ github.event.inputs.enable_naive == 'true' && 60 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event.inputs.enable_naive == 'true' && 2 || 8 }}
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        platform:
          - { name: linux-amd64-v3-glibc, goos: linux, goarch: amd64, goamd64: v3, variant: glibc, cgo: 1, upx: true }
          - { name: linux-amd64-v3-musl,  goos: linux, goarch: amd64, goamd64: v3, variant: musl,  cgo: 1, upx: true, cc: musl-gcc }
          - { name: linux-amd64-v3-purego,goos: linux, goarch: amd64, goamd64: v3, variant: purego,cgo: 0, upx: true, tags_extra: with_purego }
          - { name: linux-arm64-glibc,   goos: linux, goarch: arm64, variant: glibc, cgo: 1, upx: true }
          - { name: linux-arm64-musl,    goos: linux, goarch: arm64, variant: musl,  cgo: 1, upx: true }
          - { name: linux-arm64-purego,  goos: linux, goarch: arm64, variant: purego,cgo: 0, upx: true, tags_extra: with_purego }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3, upx: false }
          - { name: windows-arm64, goos: windows, goarch: arm64, upx: false }
          - { name: darwin-amd64-v3, goos: darwin, goarch: amd64, goamd64: v3, upx: false, cgo: "1" }
          - { name: darwin-arm64, goos: darwin, goarch: arm64, upx: false, cgo: "1" }
          - { name: android-arm64, goos: android, goarch: arm64, upx: false, cgo: "1", cc_triple: "aarch64-linux-android23" }
    runs-on: ${{ matrix.platform.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      GOOS: ${{ matrix.platform.goos }}
      GOARCH: ${{ matrix.platform.goarch }}
      GOAMD64: ${{ matrix.platform.goamd64 }}
      GOARM: ${{ matrix.platform.goarm }}
      GOMIPS: ${{ matrix.platform.gomips }}
    steps:
      - name: Check Naive Compatibility
        id: check_naive
        run: |
          if [ "${{ github.event.inputs.enable_naive }}" = "true" ]; then
            if [[ "${{ matrix.platform.goos }}" != "linux" && "${{ matrix.platform.goos }}" != "windows" ]]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "::notice::Naive outbound not supported on ${{ matrix.platform.goos }}. Skipping."
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Commit
        if: steps.check_naive.outputs.skip != 'true'
        id: resolve
        run: |
          COMMIT="${{ github.event.inputs.build_commit || '' }}"
          COMMIT="$(echo "$COMMIT" | xargs)"
          [ -z "$COMMIT" ] && COMMIT="${{ matrix.target.core_ref }}"
          echo "ref=$COMMIT" >> $GITHUB_OUTPUT

      - name: Checkout Core
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          path: sing-box
          fetch-depth: 1

      - name: Clean Workspace
        if: steps.check_naive.outputs.skip != 'true'
        working-directory: sing-box
        run: |
          git clean -fdx
          git reset --hard

      - name: Setup Go
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}
          cache: true
          cache-dependency-path: 'sing-box/go.sum'

      - name: Configure Tags and CGO
        if: steps.check_naive.outputs.skip != 'true'
        id: env
        run: |
          TAGS="${{ env.TAGS_COMMON }},${{ env.TAGS_CLI_EXTRA }}"
          CGO_VAL="${{ matrix.platform.cgo || '0' }}"
          ARCHIVE_SUFFIX=""
          ENABLE_NAIVE="${{ github.event.inputs.enable_naive || 'false' }}"

          if [ -n "${{ matrix.platform.tags_extra }}" ]; then
            TAGS="${TAGS},${{ matrix.platform.tags_extra }}"
          fi

          if [ "$ENABLE_NAIVE" = "true" ]; then
            TAGS="${TAGS},with_naive_outbound"
            if [ "${{ matrix.platform.goos }}" = "windows" ]; then
              TAGS="${TAGS},with_purego"
            fi
          fi

          case "${{ matrix.platform.variant }}" in
            musl)
              if [[ "${{ matrix.platform.name }}" != *-musl ]]; then ARCHIVE_SUFFIX="-musl"; fi
              if [ "${{ matrix.platform.goarch }}" = "amd64" ]; then
                sudo apt-get update && sudo apt-get install -y musl-tools
                echo "CC=musl-gcc" >> $GITHUB_ENV
              fi
              ;;
            purego)
              if [[ "${{ matrix.platform.name }}" != *-purego ]]; then ARCHIVE_SUFFIX="-purego"; fi
              ;;
            glibc)
              if [[ "${{ matrix.platform.name }}" != *-glibc ]]; then ARCHIVE_SUFFIX="-glibc"; fi
              ;;
            *)
              ;;
          esac

          TAGS=$(echo "${TAGS}" | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "suffix=${ARCHIVE_SUFFIX}" >> $GITHUB_OUTPUT
          echo "cgo_val=${CGO_VAL}" >> $GITHUB_OUTPUT

      - name: Setup Android NDK
        if: matrix.platform.goos == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup Zig for CGO cross compilation
        if: steps.check_naive.outputs.skip != 'true' && matrix.platform.goarch != 'amd64' && steps.env.outputs.cgo_val == '1' && matrix.platform.goos == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Export Zig CC
        if: steps.check_naive.outputs.skip != 'true' && matrix.platform.goarch == 'arm64' && steps.env.outputs.cgo_val == '1' && matrix.platform.goos == 'linux'
        run: |
          if [ "${{ matrix.platform.variant }}" = "musl" ]; then
            echo "CC=zig cc -target aarch64-linux-musl" >> "$GITHUB_ENV"
            echo "CXX=zig c++ -target aarch64-linux-musl" >> "$GITHUB_ENV"
          else
            echo "CC=zig cc -target aarch64-linux-gnu" >> "$GITHUB_ENV"
            echo "CXX=zig c++ -target aarch64-linux-gnu" >> "$GITHUB_ENV"
          fi

      - name: Cache Chromium toolchain
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.platform.goarch }}-${{ matrix.platform.variant || 'default' }}-${{ hashFiles('sing-box/.github/CRONET_GO_VERSION') }}
          restore-keys: chromium-toolchain-${{ matrix.platform.goarch }}-${{ matrix.platform.variant || 'default' }}-

      - name: Free disk space for cronet toolchain
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Setup ccache
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-cgo-${{ matrix.platform.goarch }}

      - name: Export ccache compilers
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        run: |
          echo "CC=ccache gcc" >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"

      - name: Setup cronet-go
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/cronet-go/.git" ]; then
            rm -rf "$HOME/cronet-go" || true
            CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION 2>/dev/null || echo "main")
            git init "$HOME/cronet-go"
            git -C "$HOME/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "$HOME/cronet-go" fetch --depth=1 origin "$CRONET_GO_VERSION"
            git -C "$HOME/cronet-go" checkout FETCH_HEAD
          fi

          TARGET="${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}"

          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            git -C "$HOME/cronet-go" submodule update --init --recursive --depth=1 2>/dev/null || true
            rm -f "$HOME/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg" 2>/dev/null || true
            cd "$HOME/cronet-go"

            if ! GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh; then
              sleep 10
              GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh || exit 1
            fi

            for i in 1 2 3; do
              if go run ./cmd/build-naive --target="$TARGET" download-toolchain; then break; fi
              echo "::warning::cronet toolchain download failed, retrying ($i/3)..."
              sleep $((i * 10))
              if [ "$i" -eq 3 ]; then exit 1; fi
            done

            go run ./cmd/build-naive --target="$TARGET" env 2>/dev/null | grep -E '^[A-Za-z0-9_]+=' >> "$GITHUB_ENV" || exit 1

          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            mkdir -p "$GITHUB_WORKSPACE/sing-box/dist"
            cd "$HOME/cronet-go"
            CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target="windows/${{ matrix.platform.goarch }}" -o "$GITHUB_WORKSPACE/sing-box/dist"
          fi

      - name: Log Build Environment
        if: steps.check_naive.outputs.skip != 'true'
        run: |
          echo "=============================================="
          echo "🌍 Build Environment"
          echo "=============================================="
          echo "Target:        ${{ matrix.target.id }}"
          echo "Version:       ${{ matrix.target.ver }}"
          echo "Platform:      ${{ matrix.platform.name }}"
          echo "GOOS/GOARCH:   ${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}"
          echo "GOAMD64:       ${{ matrix.platform.goamd64 }}"
          echo "GOARM:         ${{ matrix.platform.goarm }}"
          echo "CGO_ENABLED:   ${{ steps.env.outputs.cgo_val }}"
          echo "Tags:          ${{ steps.env.outputs.tags }}"
          echo "UPX Supported: ${{ matrix.platform.upx }}"
          echo "Naive Enabled: ${{ github.event.inputs.enable_naive || 'false' }}"
          echo "CC:            ${CC:-not set}"
          echo "CXX:           ${CXX:-not set}"
          echo "=============================================="

      - name: Build Core
        if: steps.check_naive.outputs.skip != 'true'
        env:
          CGO_ENABLED: ${{ steps.env.outputs.cgo_val }}
        run: |
          set -euo pipefail
          cd sing-box
          mkdir -p dist
          cp LICENSE dist/ 2>/dev/null || true

          if [[ -n "${{ matrix.platform.cc_triple }}" ]]; then
            export CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.platform.cc_triple }}-clang"
          fi

          TAGS_STR="${{ steps.env.outputs.tags }}"
          LDFLAGS="-checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }}' -s -w -buildid="

          if [ "${{ matrix.platform.variant }}" = "musl" ] && [ "$CGO_ENABLED" = "1" ]; then
            LDFLAGS="$LDFLAGS -extldflags '-static'"
            TAGS_STR="$TAGS_STR,osusergo,netgo"
          fi

          echo "$TAGS_STR" > dist/build_tags.txt
          echo "${{ matrix.platform.upx }}" > dist/upx_supported.txt

          BIN_NAME="sing-box"
          if [ "${{ matrix.platform.goos }}" = "windows" ]; then BIN_NAME="sing-box.exe"; fi

          go build -v -trimpath -ldflags "$LDFLAGS" -tags "$TAGS_STR" -o "dist/$BIN_NAME" ./cmd/sing-box

          echo "{\"target_id\": \"${{ matrix.target.id }}\", \"platform\": \"${{ matrix.platform.name }}\", \"suffix\": \"${{ steps.env.outputs.suffix }}\", \"version_name\": \"${{ matrix.target.ver }}\", \"tags\": \"$TAGS_STR\"}" > dist/artifact-meta.json

      - name: Verify Binary Integrity
        if: steps.check_naive.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd sing-box/dist || exit 1
          BIN_NAME="sing-box"
          [ "${{ matrix.platform.goos }}" = "windows" ] && BIN_NAME="sing-box.exe"

          if [ ! -f "$BIN_NAME" ]; then
            echo "::error::Binary not found at sing-box/dist/$BIN_NAME"
            exit 1
          fi

          chmod +x "$BIN_NAME" 2>/dev/null || true

          BIN_SIZE=$(stat -c%s "$BIN_NAME" 2>/dev/null || stat -f%z "$BIN_NAME" 2>/dev/null || echo 0)
          if [ "$BIN_SIZE" -lt 500000 ]; then
             echo "::error::Binary size too small ($BIN_SIZE bytes). Build likely failed."
             exit 1
          fi

          FILE_HEADER=$(file "$BIN_NAME")
          echo "Detected: $FILE_HEADER"

          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            if ! echo "$FILE_HEADER" | grep -qi "ELF"; then
              echo "::error::File is not a valid ELF executable!"; exit 1
            fi
          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            if ! echo "$FILE_HEADER" | grep -qiE "PE32.*executable"; then
              echo "::error::File is not a valid PE executable!"; exit 1
            fi
          fi

          echo "✅ Verification passed."

      - name: Compress and Package
        if: steps.check_naive.outputs.skip != 'true'
        working-directory: sing-box/dist
        run: |
          BIN_NAME="sing-box"
          [ "${{ matrix.platform.goos }}" = "windows" ] && BIN_NAME="sing-box.exe"
          TARGET_ID="${{ matrix.target.id }}"
          PLATFORM="${{ matrix.platform.name }}"
          VER="${{ matrix.target.ver }}"
          UPX_SUPPORTED="${{ matrix.platform.upx }}"
          SUFFIX="${{ steps.env.outputs.suffix }}"

          mkdir -p release_files
          
          STANDALONE_NAME="sing-box-${TARGET_ID}-${PLATFORM}${SUFFIX}-${VER}"

          if [ "$UPX_SUPPORTED" = "true" ]; then
            if [[ "${PLATFORM}" == *"mips"* ]] || [[ "${PLATFORM}" == *"armv7"* ]]; then
              file "$BIN_NAME" | grep -qE "ELF.*executable" && upx -9 "$BIN_NAME" 2>/dev/null || true
            elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
              file "$BIN_NAME" | grep -qiE "^PE32.*executable" && upx --best --lzma "$BIN_NAME" 2>/dev/null || true
            else
              file "$BIN_NAME" | grep -qE "ELF.*executable" && upx --best --lzma "$BIN_NAME" 2>/dev/null || true
            fi
            cp "$BIN_NAME" "${STANDALONE_NAME}.upx"
            echo "standalone_bin=${STANDALONE_NAME}.upx" >> $GITHUB_ENV
          else
            if [ "${{ matrix.platform.goos }}" = "windows" ]; then
              cp "$BIN_NAME" "${STANDALONE_NAME}.exe"
              echo "standalone_bin=${STANDALONE_NAME}.exe" >> $GITHUB_ENV
            else
              cp "$BIN_NAME" "${STANDALONE_NAME}"
              echo "standalone_bin=${STANDALONE_NAME}" >> $GITHUB_ENV
            fi
          fi

          if [ "${{ matrix.platform.goos }}" = "windows" ]; then
            ZIP_NAME="${STANDALONE_NAME}.zip"
            if [ -f "libcronet.dll" ]; then
              zip -q9 "release_files/${ZIP_NAME}" "$BIN_NAME" "libcronet.dll" LICENSE 2>/dev/null || zip -q9 "release_files/${ZIP_NAME}" "$BIN_NAME" "libcronet.dll"
            else
              zip -q9 "release_files/${ZIP_NAME}" "$BIN_NAME" LICENSE 2>/dev/null || zip -q9 "release_files/${ZIP_NAME}" "$BIN_NAME"
            fi
            echo "package_file=${ZIP_NAME}" >> $GITHUB_ENV
          else
            TAR_NAME="${STANDALONE_NAME}.tar.gz"
            if [ -f "libcronet.so" ]; then
              tar --no-same-owner -czf "release_files/${TAR_NAME}" "$BIN_NAME" "libcronet.so" LICENSE 2>/dev/null || tar --no-same-owner -czf "release_files/${TAR_NAME}" "$BIN_NAME" "libcronet.so"
            else
              tar --no-same-owner -czf "release_files/${TAR_NAME}" "$BIN_NAME" LICENSE 2>/dev/null || tar --no-same-owner -czf "release_files/${TAR_NAME}" "$BIN_NAME"
            fi
            echo "package_file=${TAR_NAME}" >> $GITHUB_ENV
          fi

      - name: Upload Package Artifact
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: |
            sing-box/dist/release_files/*
          retention-days: 1
          compression-level: 0

      - name: Upload Standalone Binary Artifact
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: sing-box/dist/${{ env.standalone_bin }}
          retention-days: 1
          compression-level: 0

      - name: Upload Metadata Artifact
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: sing-box/dist/artifact-meta.json
          retention-days: 1
          compression-level: 0

  build_android:
    runs-on: ubuntu-latest
    needs: [init, check]
    timeout-minutes: 60
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != '' &&
      github.event.inputs.enable_naive != 'true' &&
      needs.init.outputs.android_secrets_valid == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Skip if no Android client
        if: matrix.target.sfa_repo == 'none'
        run: |
          echo "::notice::Skipping Android build for ${{ matrix.target.id }} (no client configured)"
          exit 0

      - name: Checkout Core
        if: matrix.target.sfa_repo != 'none'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.core_ref }}
          path: sing-box
          fetch-depth: 0

      - name: Checkout Android Client
        if: matrix.target.sfa_repo != 'none'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.sfa_repo }}
          ref: ${{ matrix.target.sfa_branch }}
          path: sing-box-for-android

      - name: Setup Go
        if: matrix.target.sfa_repo != 'none'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}
          cache: true
          cache-dependency-path: 'sing-box/go.sum'

      - name: Setup Android NDK
        if: matrix.target.sfa_repo != 'none'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup Gradle
        if: matrix.target.sfa_repo != 'none'
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: sing-box-for-android
          cache-read-only: false

      - name: Configure Gradle Properties
        if: matrix.target.sfa_repo != 'none'
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

      - name: Setup OpenJDK
        if: matrix.target.sfa_repo != 'none'
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Log Build Environment
        if: matrix.target.sfa_repo != 'none'
        run: |
          echo "=============================================="
          echo "🌍 Android Build Environment"
          echo "=============================================="
          echo "Target:        ${{ matrix.target.id }}"
          echo "Version:       ${{ matrix.target.ver }}"
          echo "Core Ref:      ${{ matrix.target.core_ref }}"
          echo "SFA Branch:    ${{ matrix.target.sfa_branch }}"
          echo "Tags Common:   ${{ env.TAGS_COMMON }}"
          echo "Tags SFA Extra:${{ env.TAGS_SFA_EXTRA }}"
          echo "Tags Android:  ${{ env.TAGS_ANDROID_EXTRA }}"
          echo "NDK Version:   r28"
          echo "Java:          $(java -version 2>&1 | head -n 1)"
          echo "=============================================="

      - name: Build Library (libbox.aar)
        if: matrix.target.sfa_repo != 'none'
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"

          TAGS="${{ env.TAGS_COMMON }},${{ env.TAGS_SFA_EXTRA }},${{ env.TAGS_ANDROID_EXTRA }}"
          TAGS=$(echo "${TAGS}" | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')

          gomobile bind -v \
            -o libbox.aar \
            -target android \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -tags="${TAGS}" \
            -ldflags="-checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }}' -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid=" \
            ./experimental/libbox/
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Prepare Android Client
        if: matrix.target.sfa_repo != 'none'
        run: |
          mkdir -p ./sing-box-for-android/app/libs/
          cp -f ./sing-box/*.aar ./sing-box-for-android/app/libs/

      - name: Decode Keystore
        if: matrix.target.sfa_repo != 'none'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > ./sing-box-for-android/app/release.keystore

      - name: Build SFA APK
        if: matrix.target.sfa_repo != 'none'
        run: |
          cd ./sing-box-for-android/
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Collect APK and Metadata
        if: matrix.target.sfa_repo != 'none'
        run: |
          cd sing-box-for-android
          mkdir -p apks
          REL_DIR="app/build/outputs/apk/other/release"
          [ -d "$REL_DIR" ] || REL_DIR="app/build/outputs/apk/release"
          VER="${{ matrix.target.ver }}"

          for apk in "$REL_DIR"/*.apk; do
            [ -f "$apk" ] || continue
            
            ABI=""
            if [[ "$apk" == *"arm64-v8a"* ]]; then
              ABI="-arm64-v8a"
            elif [[ "$apk" == *"armeabi-v7a"* ]]; then
              ABI="-armeabi-v7a"
            elif [[ "$apk" == *"x86_64"* ]]; then
              ABI="-x86_64"
            elif [[ "$apk" == *"x86"* ]]; then
              ABI="-x86"
            elif [[ "$apk" == *"universal"* ]]; then
              ABI="-universal"
            fi
            
            new_name="SFA-${{ matrix.target.id }}${ABI}-${VER}.apk"
            mv -f "$apk" "apks/$new_name"
          done

          TAGS_USED="${{ env.TAGS_COMMON }},${{ env.TAGS_SFA_EXTRA }},${{ env.TAGS_ANDROID_EXTRA }}"
          TAGS_USED=$(echo "$TAGS_USED" | tr ',' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')

          jq -n \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg version_name "${{ matrix.target.ver }}" \
            --arg target_id "${{ matrix.target.id }}" \
            --arg tags "$TAGS_USED" \
            '{
              target_id: $target_id,
              version_name: $version_name,
              build_time: $built_at,
              build_tags: $tags
            }' > "apks/SFA-${{ matrix.target.id }}-metadata.json"

      - name: Upload APK Artifacts
        if: matrix.target.sfa_repo != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target.id }}
          path: |
            sing-box-for-android/apks/*.apk
            sing-box-for-android/apks/*-metadata.json
          retention-days: 1
          compression-level: 0

  publish:
    runs-on: ubuntu-latest
    needs: [init, check, build_core, build_android]
    if: >-
      always() &&
      (needs.init.result == 'success' || needs.init.result == 'skipped') &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clean temp dir
        run: rm -rf ./tmp/* || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./tmp/

      - name: Process, Collect & Prepare Release (${{ matrix.target.id }})
        run: |
          mkdir -p ./release_files/{linux,windows,darwin,android}

          target_id="${{ matrix.target.id }}"
          ver="${{ matrix.target.ver }}"
          commit_msg="${{ matrix.target.msg }}"

          PUBLISH_TYPE="${{ github.event.inputs.publish_type || 'rolling' }}"

          if [ "$PUBLISH_TYPE" = "versioned" ]; then
            tag_name="v${ver}"
            if [[ "$ver" =~ (alpha|beta|rc) ]]; then
              prerelease="true"
              make_latest="false"
            else
              prerelease="false"
              make_latest="true"
            fi
            release_title="${target_id} v${ver}"
          else
            if [[ "$target_id" == *"Testing"* ]]; then
              tag_name="sing-box-testing"
              prerelease="true"
              make_latest="false"
              release_title="sing-box Testing Build"
            else
              tag_name="sing-box-stable"
              prerelease="false"
              make_latest="true"
              release_title="sing-box Stable Build"
            fi
          fi

          declare -A BUILDTAGS_MAP
          declare -A LINUX_FILES WINDOWS_FILES DARWIN_FILES ANDROID_FILES

          for pkg_dir in ./tmp/pkg-${target_id}-*; do
            if [[ -d "$pkg_dir" ]]; then
              platform=$(basename "$pkg_dir" | sed "s/pkg-${target_id}-//")
              for f in "$pkg_dir"/*; do
                [ -f "$f" ] || continue
                name=$(basename "$f")
                if [[ "$platform" == *"windows"* ]]; then
                  cp "$f" "release_files/windows/$name"
                  WINDOWS_FILES["$platform"]="$name"
                elif [[ "$platform" == *"darwin"* ]]; then
                  cp "$f" "release_files/darwin/$name"
                  DARWIN_FILES["$platform"]="$name"
                else
                  cp "$f" "release_files/linux/$name"
                  LINUX_FILES["$platform"]="$name"
                fi
              done
            fi
          done

          for bin_dir in ./tmp/bin-${target_id}-*; do
            if [[ -d "$bin_dir" ]]; then
              platform=$(basename "$bin_dir" | sed "s/bin-${target_id}-//")
              for f in "$bin_dir"/*; do
                [ -f "$f" ] || continue
                name=$(basename "$f")
                if [[ "$platform" == *"windows"* ]]; then
                  cp "$f" "release_files/windows/$name"
                elif [[ "$platform" == *"darwin"* ]]; then
                  cp "$f" "release_files/darwin/$name"
                else
                  cp "$f" "release_files/linux/$name"
                fi
              done
            fi
          done

          for meta_dir in ./tmp/meta-${target_id}-*; do
            if [[ -d "$meta_dir" ]]; then
              platform=$(basename "$meta_dir" | sed "s/meta-${target_id}-//")
              if [ -f "$meta_dir/artifact-meta.json" ]; then
                tags=$(jq -r '.tags // ""' "$meta_dir/artifact-meta.json")
                BUILDTAGS_MAP["$platform"]="$tags"
              fi
            fi
          done

          apk_dir="./tmp/apk-${target_id}"
          if [[ -d "$apk_dir" ]]; then
            for apk in "$apk_dir"/*.apk; do
              [ -f "$apk" ] || continue
              APK_NAME=$(basename "$apk")
              cp "$apk" "release_files/android/${APK_NAME}"
              ANDROID_FILES["apk"]="$APK_NAME"
            done
            cp "$apk_dir"/*-metadata.json release_files/android/ 2>/dev/null || true
          fi

          jq -n --arg target_id "$target_id" --arg ver "$ver" --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            target_id: $target_id,
            version_name: $ver,
            built_at: $built_at
          }' > release_files/build-info.json

          cat > release_body.txt <<EOF
          # 🚀 ${release_title}

          > 🔒 此 Release 已通過 [GitHub Artifact Attestations](https://github.com/advanced-security/artifact-attestations) 驗證，防範供應鏈攻擊。

          ## 📝 Changelog (更新日誌)
          \`\`\`text
          ${commit_msg}
          \`\`\`

          ## 🔧 構建標籤
          EOF

          for p in "${!BUILDTAGS_MAP[@]}"; do
            echo "- **${p}**: \`${BUILDTAGS_MAP[$p]}\`" >> release_body.txt
          done

          cat >> release_body.txt <<EOF

          ## 📦 Assets (產物下載)
          EOF

          if [ ${#LINUX_FILES[@]} -gt 0 ]; then
            cat >> release_body.txt <<EOF

          <details>
          <summary><b>🐧 Linux 產物</b></summary>

          | 架構 | 文件名 | 說明 |
          |------|--------|------|
          EOF
            for plat in "${!LINUX_FILES[@]}"; do
              file_name="${LINUX_FILES[$plat]}"
              plat_display="${plat#linux-}"
              if [[ "$file_name" == *.upx ]]; then
                echo "| ${plat_display} | \`${file_name}\` | 獨立二進制 (UPX) |" >> release_body.txt
              elif [[ "$file_name" == *.tar.gz ]]; then
                echo "| ${plat_display} | \`${file_name}\` | 打包壓縮檔 |" >> release_body.txt
              else
                echo "| ${plat_display} | \`${file_name}\` | 獨立二進制 |" >> release_body.txt
              fi
            done
            echo "</details>" >> release_body.txt
          fi

          if [ ${#WINDOWS_FILES[@]} -gt 0 ]; then
            cat >> release_body.txt <<EOF

          <details>
          <summary><b>🪟 Windows 產物</b></summary>

          | 架構 | 文件名 | 說明 |
          |------|--------|------|
          EOF
            for plat in "${!WINDOWS_FILES[@]}"; do
              file_name="${WINDOWS_FILES[$plat]}"
              plat_display="${plat#windows-}"
              if [[ "$file_name" == *.upx ]]; then
                echo "| ${plat_display} | \`${file_name}\` | 獨立二進制 (UPX) |" >> release_body.txt
              elif [[ "$file_name" == *.zip ]]; then
                echo "| ${plat_display} | \`${file_name}\` | 打包壓縮檔 |" >> release_body.txt
              else
                echo "| ${plat_display} | \`${file_name}\` | 獨立二進制 |" >> release_body.txt
              fi
            done
            echo "</details>" >> release_body.txt
          fi

          if [ ${#DARWIN_FILES[@]} -gt 0 ]; then
            cat >> release_body.txt <<EOF

          <details>
          <summary><b>🍎 Darwin 產物</b></summary>

          | 架構 | 文件名 | 說明 |
          |------|--------|------|
          EOF
            for plat in "${!DARWIN_FILES[@]}"; do
              file_name="${DARWIN_FILES[$plat]}"
              plat_display="${plat#darwin-}"
              echo "| ${plat_display} | \`${file_name}\` | 打包壓縮檔 |" >> release_body.txt
            done
            echo "</details>" >> release_body.txt
          fi

          if [ ${#ANDROID_FILES[@]} -gt 0 ]; then
            cat >> release_body.txt <<EOF

          <details>
          <summary><b>🤖 Android 產物</b></summary>

          | 類型 | 文件名 |
          |------|--------|
          EOF
            for key in "${!ANDROID_FILES[@]}"; do
              file_name="${ANDROID_FILES[$key]}"
              echo "| SFA APK | \`${file_name}\` |" >> release_body.txt
            done
            echo "</details>" >> release_body.txt
          fi

          cat >> release_body.txt <<EOF

          ---
          ### 📜 History (歷史更新)
          EOF

          gh release list --repo "${{ github.repository }}" --limit 3 --json tagName,name,publishedAt --jq '.[] | "- \(.publishedAt[0:10]) \(.tagName): \(.name)"' >> release_body.txt || echo "- 暫無歷史記錄" >> release_body.txt

          sed -i 's/^[ \t]*//' release_body.txt

          echo "TAG_NAME=${tag_name}" >> $GITHUB_ENV
          echo "PRERELEASE=${prerelease}" >> $GITHUB_ENV
          echo "MAKE_LATEST=${make_latest}" >> $GITHUB_ENV

      - name: Generate install script (${{ matrix.target.id }})
        run: |
          cat > release_files/linux/install-linux.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          if [ "$(id -u)" -ne 0 ]; then SUDO_CMD="sudo"; else SUDO_CMD=""; fi
          REPO="${{ github.repository }}"
          TAG="${1:-stable}"
          if [ "$TAG" = "testing" ]; then
            TAG="sing-box-testing"
          else
            TAG="sing-box-stable"
          fi
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) FILE_ARCH="amd64-v3" ;;
            aarch64|arm64) FILE_ARCH="arm64" ;;
            armv7l) FILE_ARCH="armv7" ;;
            armv6l) FILE_ARCH="armv6" ;;
            mips*) FILE_ARCH="mips" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          echo "Fetching latest release for $FILE_ARCH (tag: $TAG)..."

          ASSET_PATH=$(curl -sSL "https://github.com/$REPO/releases/expanded_assets/$TAG" | grep -oE 'href="[^"]+"' | grep "linux" | grep "$FILE_ARCH" | grep "\.tar\.gz" | head -n 1 | cut -d '"' -f 2)

          [ -z "$ASSET_PATH" ] && { echo "❌ No release found for $FILE_ARCH"; exit 1; }
          ASSET_URL="https://github.com${ASSET_PATH}"
          
          echo "Downloading $ASSET_URL ..."
          curl -fLO "$ASSET_URL" || { echo "❌ Download failed"; exit 1; }
          FILE_NAME=$(basename "$ASSET_URL")
          tar -xzf "$FILE_NAME"
          chmod +x sing-box
          $SUDO_CMD mv sing-box /usr/local/bin/
          echo "✅ Installation complete."
          EOF
          sed -i 's/^[ \t]*//' release_files/linux/install-linux.sh
          chmod +x release_files/linux/install-linux.sh

      - name: Generate SHA256
        run: |
          cd release_files
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.apk" -o -name "*.upx" \) -exec sha256sum {} \; > SHA256SUMS.txt
          awk '{printf "| `%s` | `%s` |\n", $2, $1}' SHA256SUMS.txt > SHA256SUMS_TABLE.md

          cat >> ../release_body.txt <<EOF

          ## 🔐 SHA256 Checksums
          | 文件名稱 | SHA-256 |
          |----------|---------|
          EOF
          sed -i 's/^[ \t]*//' ../release_body.txt
          cat SHA256SUMS_TABLE.md >> ../release_body.txt

      - name: Check if release files exist
        id: check_files
        run: |
          if find ./release_files -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.apk" \) | grep -q .; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Delete existing tag and release if exists
        if: steps.check_files.outputs.files_exist == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG_NAME }}"
          echo "Checking if release/tag $TAG exists..."

          if gh release view "$TAG" --json id -q '.id' 2>/dev/null; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Deleting stray tag $TAG..."
            git push origin ":refs/tags/$TAG"
          fi

      - name: Publish Release (${{ matrix.target.id }})
        if: steps.check_files.outputs.files_exist == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ matrix.target.id }}
          tag_name: ${{ env.TAG_NAME }}
          make_latest: ${{ env.MAKE_LATEST }}
          prerelease: ${{ env.PRERELEASE }}
          body_path: release_body.txt
          files: |
            release_files/**/*
          fail_on_unmatched_files: true

      - name: Generate Build Provenance
        if: steps.check_files.outputs.files_exist == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './release_files/**/*'

      - name: Upload Build Info Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ matrix.target.id }}
          path: release_files/build-info.json
          retention-days: 1
          compression-level: 0

      - name: Upload Release Files Artifact for Telegram
        if: steps.check_files.outputs.files_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ matrix.target.id }}
          path: |
            release_files/**/*.tar.gz
            release_files/**/*.zip
            release_files/**/*.apk
            release_files/**/*.upx
          retention-days: 1
          compression-level: 0

  finalize:
    needs: [check, build_core, build_android, publish]
    runs-on: ubuntu-latest
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Metadata & Build Infos
        uses: actions/download-artifact@v4
        with:
          path: ./downloads/

      - name: Merge Build Infos
        run: |
          mkdir -p metadata
          mv ./downloads/workflow-metadata/release_notes.txt ./metadata/ 2>/dev/null || echo "" > ./metadata/release_notes.txt

          jq -n \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${{ github.run_id }}" \
            --arg commit "${{ github.sha }}" \
            '{
              built_at: $built_at,
              run_id: $run_id,
              commit_sha: $commit,
              targets: []
            }' > build-info-base.json

          for f in ./downloads/build-info-*/build-info.json; do
            if [ -f "$f" ]; then
              target=$(jq -r '.target_id' "$f")
              version=$(jq -r '.version_name' "$f")
              jq --arg target "$target" --arg version "$version" \
                '.targets += [{"target_id": $target, "version_name": $version}]' \
                build-info-base.json > tmp.json && mv tmp.json build-info-base.json
            fi
          done

          mv build-info-base.json build-info.json

      - name: Update release-info branch
        run: |
          git checkout --orphan release-info-temp
          git add build-info.json

          if ! git diff --cached --quiet; then
            git commit -m "build: update release metadata" || true
            git branch -M release-info
            git push origin release-info --force 2>/dev/null || true
          fi

      - name: Update build-artifacts branch
        run: |
          git checkout --orphan build-artifacts-temp
          git rm -rfq . || true
          git clean -fdx || true

          git checkout ${{ github.ref_name }} -- README.md LICENSE .github/workflows/ 2>/dev/null || true
          echo "* text=auto" > .gitattributes

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: update artifacts from successful workflow" || true
            git branch -M build-artifacts
            git push origin build-artifacts --force 2>/dev/null || true
          fi

      - name: Log Build Summary
        if: always()
        run: |
          echo "### 📊 構建摘要" >> "$GITHUB_STEP_SUMMARY"
          echo "| 任務 | 執行狀態 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 核心編譯 | ${{ needs.build_core.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 客戶端編譯 | ${{ needs.build_android.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 發佈打包 | ${{ needs.publish.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "#### 📦 產物詳情" >> "$GITHUB_STEP_SUMMARY"
          echo "| 目標 | 版本 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "build-info.json" ]; then
            jq -r '.targets[]? | "| \(.target_id) | \(.version_name) |"' build-info.json >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "| N/A | N/A |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate README
        run: |
          cat > README.md <<EOF
          # 🚀 sing-box 自動編譯系統

          > 自動檢測並編譯 [reF1nd/sing-box](https://github.com/reF1nd/sing-box) 的 Stable 和 Testing 分支。

          ## 📦 最新版本狀態 ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M UTC+8'))

          $(cat ./metadata/release_notes.txt 2>/dev/null || echo "暫無更新記錄")

          ---

          ## 📥 快速安裝 (Linux)

          使用動態路由自動安裝最新版對應架構：
          \`\`\`bash
          bash <(curl -sSL https://github.com/${{ github.repository }}/releases/download/sing-box-stable/install-linux.sh)
          \`\`\`

          若要安裝 Testing 版本，請指定參數：
          \`\`\`bash
          bash <(curl -sSL https://github.com/${{ github.repository }}/releases/download/sing-box-testing/install-linux.sh) testing
          \`\`\`

          ## 📦 文件命名規則

          - **打包版本** (\`xxx.tar.gz\` / \`xxx.zip\`): 包含 LICENSE 的標準發行版
          - **獨立二進制** (\`xxx.upx\` / \`xxx\`): 可直接替換執行檔，方便軟路由使用

          ## 🛠️ 支持的版本與特性

          | 版本 | 分支 | 平台支持 | Release 標籤 |
          |------|------|---------|-------------|
          | reF1nd Stable | reF1nd-stable | Linux/Windows/macOS/Android | \`sing-box-stable\` (Latest) |
          | reF1nd Testing | reF1nd-testing | Linux/Windows/macOS/Android | \`sing-box-testing\` (Pre-release) |

          ## 🔔 Telegram 通知配置
          若需啟用 Telegram 推送，請在倉庫 Secrets 中配置：
          - \`TELEGRAM_BOT_TOKEN\`, \`CHAT_ID\`, \`API_ID\`, \`API_HASH\`

          [🔗 前往 Releases 下載](https://github.com/${{ github.repository }}/releases)

          ![Build Status](https://img.shields.io/github/actions/workflow/status/${{ github.repository }}/build-sing-box.yml?branch=${{ github.ref_name }})
          EOF
          sed -i 's/^[ \t]*//' README.md

      - name: Commit and Push README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'README.md';
            const branch = '${{ github.ref_name }}';

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = data.sha;
            } catch (e) {
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'docs: update README with latest build info',
              content: Buffer.from(readme).toString('base64'),
              branch,
              ...(sha && { sha }),
              headers: { 'X-GitHub-Api-Version': '2022-11-28' }
            });

  telegram_notify:
    needs: [build_core, build_android, publish, finalize]
    runs-on: ubuntu-latest
    if: always() && (github.event.inputs.enable_telegram == 'true' || github.event_name == 'schedule')
    steps:
      - name: Generate Telegram Message
        id: status
        run: |
          TG_STATUS="success"
          declare -a STATUS_LINES

          for job in build_core build_android publish; do
            RESULT=""
            if [ "$job" = "build_core" ]; then RESULT="${{ needs.build_core.result }}"
            elif [ "$job" = "build_android" ]; then RESULT="${{ needs.build_android.result }}"
            elif [ "$job" = "publish" ]; then RESULT="${{ needs.publish.result }}"
            fi

            case "$RESULT" in
              success) STATUS_LINES+=("✅ ${job}: success") ;;
              failure) TG_STATUS="failed"; STATUS_LINES+=("❌ ${job}: failure") ;;
              skipped) STATUS_LINES+=("⏭️ ${job}: skipped") ;;
              *) STATUS_LINES+=("❓ ${job}: ${RESULT}") ;;
            esac
          done

          TG_DETAILS=$(IFS=$'\n'; echo "${STATUS_LINES[*]}")

          escape_tg_markdown() {
            echo "$1" | sed -e 's/\\/\\\\/g' \
                            -e 's/_/\\_/g' -e 's/\*/\\*/g' -e 's/\[/\\[/g' -e 's/\]/\\]/g' \
                            -e 's/~/\\~/g' -e 's/`/\\`/g' -e 's/>/\\>/g' -e 's/#/\\#/g' \
                            -e 's/+/\\+/g' -e 's/-/\\-/g' -e 's/=/\\=/g' -e 's/|/\\|/g' \
                            -e 's/{/\\{/g' -e 's/}/\\}/g' -e 's/!/\\!/g'
          }

          TG_DETAILS_SAFE=$(escape_tg_markdown "$TG_DETAILS")
          REPO_SAFE=$(escape_tg_markdown "${{ github.repository }}")

          if [ "$TG_STATUS" = "failed" ]; then
            MSG="❌ *sing\-box 自動編譯失敗*

          *構建詳情：*
          ${TG_DETAILS_SAFE}

          *建議操作：*
          1\. 前往 Actions頁面查看日誌
          2\. 檢查是否有 GitHub API限流"
          else
            MSG="🚀 *sing\-box 自動編譯完成*

          已檢測到代碼更新或觸發強制編譯，最新內核與 Android APK 已經打包完畢。

          *構建詳情：*
          ${TG_DETAILS_SAFE}

          📥 [點擊前往 GitHub下載](https://github\.com/${REPO_SAFE}/releases)"
          fi

          EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1 2>/dev/null || echo "EOM")
          printf '%s\n' "TG_MESSAGE<<$EOF_MARKER" >> "$GITHUB_ENV"
          printf '%s\n' "$MSG" >> "$GITHUB_ENV"
          printf '%s\n' "$EOF_MARKER" >> "$GITHUB_ENV"

          echo "status=$TG_STATUS" >> $GITHUB_OUTPUT

      - name: Download release packages for TG
        if: ${{ steps.status.outputs.status == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: release-files-*
          path: dist
          merge-multiple: true

      - name: Prepare SFA TG Files
        if: ${{ steps.status.outputs.status == 'success' }}
        run: |
          files=$(find dist -type f -name "SFA-*.apk" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" == *"Testing"* ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_APK_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_APK_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_APK=true" >> $GITHUB_ENV
          fi

      - name: Send SFA APKs to Telegram
        if: env.SEND_APK == 'true'
        uses: xz-dev/TelegramFileUploader@v1
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🤖 *SFA APK 更新*
            `${{ env.TG_APK_TAG }}`
          files: ${{ env.TG_APK_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Android CLI TG Files
        if: ${{ steps.status.outputs.status == 'success' }}
        run: |
          files=$(find dist -type f -name "sing-box-*-android-*.tar.gz" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" == *"Testing"* ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_ACLI_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_ACLI_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_ACLI=true" >> $GITHUB_ENV
          fi

      - name: Send Android CLI binaries to Telegram
        if: env.SEND_ACLI == 'true'
        uses: xz-dev/TelegramFileUploader@v1
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            📱 *Android CLI 二進制*
            `${{ env.TG_ACLI_TAG }}`
          files: ${{ env.TG_ACLI_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Linux TG Files
        if: ${{ steps.status.outputs.status == 'success' }}
        run: |
          files=$(find dist -type f -name "sing-box-*-linux-*.tar.gz" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" == *"Testing"* ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_LINUX_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_LINUX_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_LINUX=true" >> $GITHUB_ENV
          fi

      - name: Send Linux binaries to Telegram
        if: env.SEND_LINUX == 'true'
        uses: xz-dev/TelegramFileUploader@v1
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🐧 *Linux 二進制*
            `${{ env.TG_LINUX_TAG }}`
          files: ${{ env.TG_LINUX_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Windows TG Files
        if: ${{ steps.status.outputs.status == 'success' }}
        run: |
          files=$(find dist -type f -name "sing-box-*-windows-*.zip" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" == *"Testing"* ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_WIN_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_WIN_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_WIN=true" >> $GITHUB_ENV
          fi

      - name: Send Windows binaries to Telegram
        if: env.SEND_WIN == 'true'
        uses: xz-dev/TelegramFileUploader@v1
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🪟 *Windows 二進制*
            `${{ env.TG_WIN_TAG }}`
          files: ${{ env.TG_WIN_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Darwin TG Files
        if: ${{ steps.status.outputs.status == 'success' }}
        run: |
          files=$(find dist -type f -name "sing-box-*-darwin-*.tar.gz" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" == *"Testing"* ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_DARWIN_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_DARWIN_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_DARWIN=true" >> $GITHUB_ENV
          fi

      - name: Send Darwin binaries to Telegram
        if: env.SEND_DARWIN == 'true'
        uses: xz-dev/TelegramFileUploader@v1
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🍎 *Darwin 二進制*
            `${{ env.TG_DARWIN_TAG }}`
          files: ${{ env.TG_DARWIN_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  create_issue_on_failure:
    needs: [build_core, build_android, publish, finalize]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create Issue with logs
        run: |
          echo "Fetching failed logs..."
          gh run view ${{ github.run_id }} --repo "${{ github.repository }}" --log-failed --exit-status 0 | tail -n 100 > /tmp/error.log || echo "Failed to fetch logs." > /tmp/error.log

          cat > issue_body.md <<EOF
          構建在工作流 \`${{ github.workflow }}\` 中失敗。

          [查看完整的 Actions 日誌](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 🔍 錯誤日誌摘要 (Tail 100 lines)
          \`\`\`log
          EOF
          cat /tmp/error.log >> issue_body.md
          echo '```' >> issue_body.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🔴 定時構建失敗: sing-box" \
            --body-file issue_body.md \
            --label "bug" || true

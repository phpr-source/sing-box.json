    runs-on: ubuntu-latest
    needs: go
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout reF1nd-testing
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Get version
        id: version
        run: |
          echo "version=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and (test("alpha|beta|rc"))) | .name' | head -n 1 | sed 's/^v//')" >> $GITHUB_OUTPUT
          echo "time=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/commits/$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and (test("alpha|beta|rc"))) | .name' | head -n 1) | jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "tags=with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$current_body" | grep -q "reF1nd-Test|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
          else
            echo "skip_update=false" >> $GITHUB_OUTPUT
          fi

  ref1nd_testing_cross:
    runs-on: ubuntu-latest
    if: ${{ needs.ref1nd_testing_version.outputs.skip_update != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    needs:
      - go
      - ref1nd_testing_version
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.ref1nd_testing_version.outputs.version }}
      TAGS: ${{ needs.ref1nd_testing_version.outputs.tags }}
    steps:
      - name: Checkout reF1nd-testing
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ref1nd-testing-${{ matrix.name }}
          path: sing-box*

  # ========== Push & Release ==========
  
  push_sing-box:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - oldstable_version
      - oldstable_cross
      - stable_version
      - stable_cross
      - testing_version
      - testing_cross
      - ref1nd_oldstable_version
      - ref1nd_oldstable_cross
      - ref1nd_stable_version
      - ref1nd_stable_cross
      - ref1nd_testing_version
      - ref1nd_testing_cross
    env:
      OLDSTABLE_VERSION: ${{ needs.oldstable_version.outputs.version }}
      OLDSTABLE_TIME: ${{ needs.oldstable_version.outputs.time }}
      OLDSTABLE_SKIP: ${{ needs.oldstable_version.outputs.skip_update }}
      STABLE_VERSION: ${{ needs.stable_version.outputs.version }}
      STABLE_TIME: ${{ needs.stable_version.outputs.time }}
      STABLE_SKIP: ${{ needs.stable_version.outputs.skip_update }}
      TESTING_VERSION: ${{ needs.testing_version.outputs.version }}
      TESTING_TIME: ${{ needs.testing_version.outputs.time }}
      TESTING_SKIP: ${{ needs.testing_version.outputs.skip_update }}
      REF1ND_OLDSTABLE_VERSION: ${{ needs.ref1nd_oldstable_version.outputs.version }}
      REF1ND_OLDSTABLE_TIME: ${{ needs.ref1nd_oldstable_version.outputs.time }}
      REF1ND_OLDSTABLE_SKIP: ${{ needs.ref1nd_oldstable_version.outputs.skip_update }}
      REF1ND_STABLE_VERSION: ${{ needs.ref1nd_stable_version.outputs.version }}
      REF1ND_STABLE_TIME: ${{ needs.ref1nd_stable_version.outputs.time }}
      REF1ND_STABLE_SKIP: ${{ needs.ref1nd_stable_version.outputs.skip_update }}
      REF1ND_TESTING_VERSION: ${{ needs.ref1nd_testing_version.outputs.version }}
      REF1ND_TESTING_TIME: ${{ needs.ref1nd_testing_version.outputs.time }}
      REF1ND_TESTING_SKIP: ${{ needs.ref1nd_testing_version.outputs.skip_update }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./tmp/

      - name: Prepare files
        run: |
          mkdir -p ./sing-box/
          
          for ver in oldstable stable testing ref1nd-oldstable ref1nd-stable ref1nd-testing; do
            eval "skip=\$$(echo \$${ver//[-]/_}SKIP | tr '[:lower:]' '[:upper:]')"
            if [ "$skip" != "true" ]; then
              echo "Processing $ver..."
              
              for arch in amd64-v1 amd64-v3 arm64 armv7; do
                if [ -f "./tmp/sing-box-${ver}-linux-${arch}/sing-box" ]; then
                  cp "./tmp/sing-box-${ver}-linux-${arch}/sing-box" "./sing-box/sing-box-${ver}-linux-${arch}"
                  chmod +x "./sing-box/sing-box-${ver}-linux-${arch}"
                fi
              done
              
              for arch in amd64-v1 amd64-v3 arm64; do
                if [ -f "./tmp/sing-box-${ver}-windows-${arch}/sing-box.exe" ]; then
                  cp "./tmp/sing-box-${ver}-windows-${arch}/sing-box.exe" "./sing-box/sing-box-${ver}-windows-${arch}.exe"
                fi
              done
            fi
          done

      - name: UPX compress Linux binaries
        if: ${{ env.OLDSTABLE_SKIP != 'true' || env.STABLE_SKIP != 'true' || env.TESTING_SKIP != 'true' || env.REF1ND_OLDSTABLE_SKIP != 'true' || env.REF1ND_STABLE_SKIP != 'true' || env.REF1ND_TESTING_SKIP != 'true' }}
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: ./sing-box/*linux-*
          args: --best --lzma

      - name: Check files exist
        id: check
        run: |
          if ls ./sing-box/* >/dev/null 2>&1; then
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: ${{ steps.check.outputs.has_files == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sing-box
          name: sing-box Releases
          body: |
            # 📦 sing-box 编译版本
            
            ## SagerNet/sing-box
            
            | 版本 | 版本号 | 发布日期 |
            |------|--------|----------|
            | OldStable | ${{ env.OLDSTABLE_VERSION }} | ${{ env.OLDSTABLE_TIME }} |
            | Stable | ${{ env.STABLE_VERSION }} | ${{ env.STABLE_TIME }} |
            | Testing | ${{ env.TESTING_VERSION }} | ${{ env.TESTING_TIME }} |
            
            ## reF1nd/sing-box
            
            | 版本 | 版本号 | 发布日期 |
            |------|--------|----------|
            | OldStable | ${{ env.REF1ND_OLDSTABLE_VERSION }} | ${{ env.REF1ND_OLDSTABLE_TIME }} |
            | Stable | ${{ env.REF1ND_STABLE_VERSION }} | ${{ env.REF1ND_STABLE_TIME }} |
            | Testing | ${{ env.REF1ND_TESTING_VERSION }} | ${{ env.REF1ND_TESTING_TIME }} |
            
            ---
            
            **构建时间:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            **构建架构:** Linux (amd64-v1/v3, arm64, armv7), Windows (amd64-v1/v3, arm64)
            **压缩方式:** UPX (Linux), 原始 (Windows)
          files: ./sing-box/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== Update README ==========
  
  Update_Readme:
    runs-on: ubuntu-latest
    if: always()
    needs: [push_sing-box]
    steps:
      - uses: actions/checkout@v4

      - name: Generate README
        run: |
          cat > README.md << 'EOF'
          # 🚀 sing-box 自动编译
          
          > 自动从 [SagerNet/sing-box](https://github.com/SagerNet/sing-box) 和 [reF1nd/sing-box](https://github.com/reF1nd/sing-box) 编译最新版本
          
          ## 📥 下载地址
          
          ### SagerNet/sing-box
          
          - **OldStable:** [下载](${{ github.server_url }}/${{ github.repository }}/releases/download/sing-box/sing-box-oldstable-linux-amd64-v3)
          - **Stable:** [下载](${{ github.server_url }}/${{ github.repository }}/releases/download/sing-box/sing-box-stable-linux-amd64-v3)
          - **Testing:** [下载](${{ github.server_url }}/${{ github.repository }}/releases/download/sing-box/sing-box-testing-linux-amd64-v3)
          
          ### reF1nd/sing-box
          
          - **OldStable:** [下载](${{ github.server_url }}/${{ github.repository }}/releases/download/sing-box/sing-box-ref1nd-oldstable-linux-amd64-v3)
          - **Stable:** [下载](${{ github.server_url }}/${{ github.repository }}/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3)
          - **Testing:** [下载](${{ github.server_url }}/${{ github.repository }}/releases/download/sing-box/sing-box-ref1nd-testing-linux-amd64-v3)
          
          ## 🔄 更新频率
          
          每 6 小时自动检查更新
          
          ## 📋 支持架构
          
          - Linux: amd64-v1, amd64-v3, arm64, armv7
          - Windows: amd64-v1, amd64-v3, arm64
          
          ---
          
          *由 GitHub Actions 自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')*
          EOF

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README $(date -u '+%Y-%m-%d')" || exit 0
          git push

name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      enable_naive:
        description: "Enable NaiveProxy"
        required: false
        type: boolean
        default: false
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: "Force rebuild (skip version check)"
        required: false
        type: boolean
        default: false
      custom_patch_url:
        description: "Custom patch URL (optional)"
        required: false
        type: string
        default: ''
  schedule:
    - cron: "0 */6 * * *"

env:
  GO_VERSION: "~1.25.8"
  TAGS_COMMON: "badlinkname,tfogo_checklinkname0,with_clash_api,with_gvisor,with_quic,with_utls,with_wireguard"
  TAGS_ANDROID_EXTRA: "with_conntrack"
  PATCH_URL_BASE: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/patches"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go.outputs.version }}
    steps:
      - name: Get Go version
        id: go
        run: |
          echo "version=$(curl -sSL https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | jq -r '.[0].version')" >> $GITHUB_OUTPUT

  detect_singbox_oldstable:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      version: ${{ steps.detect.outputs.version }}
      time: ${{ steps.detect.outputs.time }}
      tags: ${{ steps.detect.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: oldstable
          fetch-depth: 0
      - name: Detect oldstable version
        id: detect
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "oldstable-$(git log -1 --format=%h)")
          TIME=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS_COMMON}" >> $GITHUB_OUTPUT
      - name: Compare versions
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0; fi
          CURRENT=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$CURRENT" | grep -q "sing-box OldStable|${{ steps.detect.outputs.version }}|${{ steps.detect.outputs.time }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  detect_singbox_stable:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      version: ${{ steps.detect.outputs.version }}
      time: ${{ steps.detect.outputs.time }}
      tags: ${{ steps.detect.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Detect stable version
        id: detect
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | \
            jq -r '.[] | select(.tag_name | test("alpha|beta|rc") | not) | .tag_name' | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | \
            jq -r '.[] | select(.tag_name | test("alpha|beta|rc") | not) | (.published_at // .created_at)' | head -n 1 | \
            xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS_COMMON}" >> $GITHUB_OUTPUT
      - name: Compare versions
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0; fi
          CURRENT=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$CURRENT" | grep -q "sing-box Stable|${{ steps.detect.outputs.version }}|${{ steps.detect.outputs.time }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  detect_singbox_testing:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      version: ${{ steps.detect.outputs.version }}
      time: ${{ steps.detect.outputs.time }}
      tags: ${{ steps.detect.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Detect testing version
        id: detect
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | \
            jq -r '.[] | select(.tag_name | test("alpha|beta|rc")) | .tag_name' | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | \
            jq -r '.[] | select(.tag_name | test("alpha|beta|rc")) | (.published_at // .created_at)' | head -n 1 | \
            xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS_COMMON}" >> $GITHUB_OUTPUT
      - name: Compare versions
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0; fi
          CURRENT=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$CURRENT" | grep -q "sing-box Test|${{ steps.detect.outputs.version }}|${{ steps.detect.outputs.time }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  detect_ref1nd_oldstable:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      version: ${{ steps.detect.outputs.version }}
      time: ${{ steps.detect.outputs.time }}
      tags: ${{ steps.detect.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Detect reF1nd-oldstable version
        id: detect
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | \
            jq -r '[.[] | select(.name | contains("reF1nd") and (contains("alpha") | not)) | .name] | sort_by(.) | reverse | .[0]' | sed 's/^v//')
          COMMIT=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | \
            jq -r '[.[] | select(.name | contains("reF1nd") and (contains("alpha") | not)) | .name] | sort_by(.) | reverse | .[0]')
          TIME=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/commits/${COMMIT} | \
            jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS_COMMON}" >> $GITHUB_OUTPUT
      - name: Compare versions
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0; fi
          CURRENT=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$CURRENT" | grep -q "reF1nd-OldStable|${{ steps.detect.outputs.version }}|${{ steps.detect.outputs.time }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  detect_ref1nd_stable:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      version: ${{ steps.detect.outputs.version }}
      time: ${{ steps.detect.outputs.time }}
      tags: ${{ steps.detect.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Detect reF1nd-stable version
        id: detect
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | \
            jq -r '.[] | select(.name | contains("reF1nd") and (contains("alpha") | not)) | .name' | head -n 1 | sed 's/^v//')
          COMMIT=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | \
            jq -r '.[] | select(.name | contains("reF1nd") and (contains("alpha") | not)) | .name' | head -n 1)
          TIME=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/commits/${COMMIT} | \
            jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS_COMMON}" >> $GITHUB_OUTPUT
      - name: Compare versions
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0; fi
          CURRENT=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$CURRENT" | grep -q "reF1nd-Stable|${{ steps.detect.outputs.version }}|${{ steps.detect.outputs.time }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  detect_ref1nd_testing:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      version: ${{ steps.detect.outputs.version }}
      time: ${{ steps.detect.outputs.time }}
      tags: ${{ steps.detect.outputs.tags }}
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Detect reF1nd-testing version
        id: detect
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | \
            jq -r '.[] | select(.name | contains("reF1nd") and (test("alpha|beta|rc"))) | .name' | head -n 1 | sed 's/^v//')
          COMMIT=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | \
            jq -r '.[] | select(.name | contains("reF1nd") and (test("alpha|beta|rc"))) | .name' | head -n 1)
          TIME=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/commits/${COMMIT} | \
            jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS_COMMON}" >> $GITHUB_OUTPUT
      - name: Compare versions
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0; fi
          CURRENT=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$CURRENT" | grep -q "reF1nd-Test|${{ steps.detect.outputs.version }}|${{ steps.detect.outputs.time }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build_singbox_oldstable:
    runs-on: ubuntu-latest
    if: needs.detect_singbox_oldstable.outputs.skip != 'true'
    needs: [setup, detect_singbox_oldstable]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.detect_singbox_oldstable.outputs.version }}
      TAGS: ${{ needs.detect_singbox_oldstable.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: oldstable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.setup.outputs.go_version }}
          cache: true
      - name: Apply custom patch
        if: github.event.inputs.custom_patch_url != ''
        run: curl -sfL "${{ github.event.inputs.custom_patch_url }}" | git apply -v || true
      - name: Build
        run: go build -v -trimpath -o "sing-box-${{ matrix.name }}" \
          -tags "${TAGS}" \
          -ldflags "-s -w -buildid= -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}'" \
          ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: oldstable-${{ matrix.name }}
          path: sing-box-*

  build_singbox_stable:
    runs-on: ubuntu-latest
    if: needs.detect_singbox_stable.outputs.skip != 'true'
    needs: [setup, detect_singbox_stable]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.detect_singbox_stable.outputs.version }}
      TAGS: ${{ needs.detect_singbox_stable.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: stable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.setup.outputs.go_version }}
          cache: true
      - name: Apply custom patch
        if: github.event.inputs.custom_patch_url != ''
        run: curl -sfL "${{ github.event.inputs.custom_patch_url }}" | git apply -v || true
      - name: Build
        run: go build -v -trimpath -o "sing-box-${{ matrix.name }}" \
          -tags "${TAGS}" \
          -ldflags "-s -w -buildid= -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}'" \
          ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.name }}
          path: sing-box-*

  build_singbox_testing:
    runs-on: ubuntu-latest
    if: needs.detect_singbox_testing.outputs.skip != 'true'
    needs: [setup, detect_singbox_testing]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.detect_singbox_testing.outputs.version }}
      TAGS: ${{ needs.detect_singbox_testing.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: testing
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.setup.outputs.go_version }}
          cache: true
      - name: Apply custom patch
        if: github.event.inputs.custom_patch_url != ''
        run: curl -sfL "${{ github.event.inputs.custom_patch_url }}" | git apply -v || true
      - name: Build
        run: go build -v -trimpath -o "sing-box-${{ matrix.name }}" \
          -tags "${TAGS}" \
          -ldflags "-s -w -buildid= -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}'" \
          ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: testing-${{ matrix.name }}
          path: sing-box-*

  build_ref1nd_oldstable:
    runs-on: ubuntu-latest
    if: needs.detect_ref1nd_oldstable.outputs.skip != 'true'
    needs: [setup, detect_ref1nd_oldstable]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.detect_ref1nd_oldstable.outputs.version }}
      TAGS: ${{ needs.detect_ref1nd_oldstable.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-oldstable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.setup.outputs.go_version }}
          cache: true
      - name: Apply default patches
        run: |
          curl -sfL "$PATCH_URL_BASE/concurrent_dial.patch" | git apply -v || true
          curl -sfL "$PATCH_URL_BASE/make_log_better.patch" | git apply -v || true
      - name: Apply custom patch
        if: github.event.inputs.custom_patch_url != ''
        run: curl -sfL "${{ github.event.inputs.custom_patch_url }}" | git apply -v || true
      - name: Build
        run: go build -v -trimpath -o "sing-box-${{ matrix.name }}" \
          -tags "${TAGS}" \
          -ldflags "-s -w -buildid= -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}'" \
          ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: ref1nd-oldstable-${{ matrix.name }}
          path: sing-box-*

  build_ref1nd_stable:
    runs-on: ubuntu-latest
    if: needs.detect_ref1nd_stable.outputs.skip != 'true'
    needs: [setup, detect_ref1nd_stable]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.detect_ref1nd_stable.outputs.version }}
      TAGS: ${{ needs.detect_ref1nd_stable.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.setup.outputs.go_version }}
          cache: true
      - name: Apply default patches
        run: |
          curl -sfL "$PATCH_URL_BASE/concurrent_dial.patch" | git apply -v || true
          curl -sfL "$PATCH_URL_BASE/make_log_better.patch" | git apply -v || true
      - name: Apply custom patch
        if: github.event.inputs.custom_patch_url != ''
        run: curl -sfL "${{ github.event.inputs.custom_patch_url }}" | git apply -v || true
      - name: Build
        run: go build -v -trimpath -o "sing-box-${{ matrix.name }}" \
          -tags "${TAGS}" \
          -ldflags "-s -w -buildid= -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}'" \
          ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: ref1nd-stable-${{ matrix.name }}
          path: sing-box-*

  build_ref1nd_testing:
    runs-on: ubuntu-latest
    if: needs.detect_ref1nd_testing.outputs.skip != 'true'
    needs: [setup, detect_ref1nd_testing]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.detect_ref1nd_testing.outputs.version }}
      TAGS: ${{ needs.detect_ref1nd_testing.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.setup.outputs.go_version }}
          cache: true
      - name: Apply default patches
        run: |
          curl -sfL "$PATCH_URL_BASE/concurrent_dial.patch" | git apply -v || true
          curl -sfL "$PATCH_URL_BASE/make_log_better.patch" | git apply -v || true
      - name: Apply custom patch
        if: github.event.inputs.custom_patch_url != ''
        run: curl -sfL "${{ github.event.inputs.custom_patch_url }}" | git apply -v || true
      - name: Build
        run: go build -v -trimpath -o "sing-box-${{ matrix.name }}" \
          -tags "${TAGS}" \
          -ldflags "-s -w -buildid= -X 'github.com/sagernet/sing-box/constant.Version=${VERSION}'" \
          ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: ref1nd-testing-${{ matrix.name }}
          path: sing-box-*

  build_android_ref1nd_stable:
    runs-on: ubuntu-latest
    if: needs.detect_ref1nd_stable.outputs.skip != 'true'
    needs: [setup, detect_ref1nd_stable]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.setup.outputs.go_version }}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Setup JDK
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless
      - name: Set tag
        run: git tag "v${{ needs.detect_ref1nd_stable.outputs.version }}" -f
      - name: Build library
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*') }}
      - uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-android
          ref: reF1nd-stable
          path: clients/android
      - name: Update version
        run: cd clients/android && go run -v ../../../sing-box/cmd/internal/update_android_version --ci --nightly
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > clients/android/app/release.keystore
          sed -i '/fun getProps(propName: String): String {/,/^}/c\
          fun getProps(propName: String): String {\
              System.getenv(propName)?.let { return it }\
              val propsFile = rootProject.file("local.properties")\
              if (propsFile.exists()) {\
                  val props = Properties()\
                  props.load(FileInputStream(propsFile))\
                  props.getProperty(propName)?.let { return it }\
              }\
              return ""\
          }' clients/android/app/build.gradle.kts
      - name: Streamline update module
        run: |
          cd clients/android
          echo "" | base64 -d > streamline.patch && git apply streamline.patch || true
      - name: Prepare library
        run: mkdir -p clients/android/app/libs/ && cp -f libbox.aar clients/android/app/libs/
      - name: Build APK
        run: |
          cd clients/android && chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: Prepare APK
        run: |
          cd clients/android/app/build/outputs/apk/other/release
          mkdir -p ../../../../apks/ref1nd-stable
          for file in *.apk; do mv "$file" "../../../../apks/ref1nd-stable/${file/SFA-*-reF1nd/SFA-ref1nd-stable}" 2>/dev/null || mv "$file" "../../../../apks/ref1nd-stable/"; done
      - uses: actions/upload-artifact@v4
        with:
          name: apk-ref1nd-stable
          path: apks/ref1nd-stable/*


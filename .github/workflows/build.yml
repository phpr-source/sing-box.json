    strategy:
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
      fail-fast: false
    needs:
      - go
      - ref1nd_stable_version
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.ref1nd_stable_version.outputs.version }}
      TAGS: ${{ needs.ref1nd_stable_version.outputs.tags }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-stable
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build sing-box reF1nd-Stable core
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ref1nd-stable-${{ matrix.name }}
          path: sing-box*

  ref1nd_stable_android:
    runs-on: ubuntu-latest
    if: ${{ needs.ref1nd_stable_version.outputs.skip_update != 'true' }}
    needs:
      - go
      - ref1nd_stable_version
    env:
      VERSION: ${{ needs.ref1nd_stable_version.outputs.version }}
      TAGS: ${{ needs.ref1nd_stable_version.outputs.tags }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-stable
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable
          path: sing-box
          fetch-depth: 0

      - name: Checkout reF1nd/sing-box-for-android
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-android
          ref: reF1nd-stable
          path: sing-box-for-android

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('sing-box-for-android/**/*.gradle') }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > ./sing-box-for-android/app/release.keystore

      - name: Build library
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v \
            -target android/arm64 \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -tags="${{ env.TAGS }},${{ env.TAGS_ANDROID_EXTRA }}" \
            -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ env.VERSION }} -s -w -buildid=" \
            ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Prepare Android client
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/

      - name: Build SFA-reF1nd-Stable apk
        run: |
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Rename apks
        run: |
          mkdir -p ./sfa-ref1nd-stable/
          for file in ./sing-box-for-android/app/build/outputs/apk/other/release/*.apk; do
            mv -f "${file}" "./sfa-ref1nd-stable/$(basename "${file/SFA-*-reF1nd/SFA-ref1nd-stable}")"
          done

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sfa-ref1nd-stable-apks
          path: ./sfa-ref1nd-stable/*

  ref1nd_testing_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-testing
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing
          fetch-depth: 0

      - name: Get sing-box reF1nd-Testing version
        id: version
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and test("alpha|beta|rc")) | .name' | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/commits/$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and test("alpha|beta|rc")) | .name' | head -n 1) | jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TAGS_COMMON }}" >> $GITHUB_OUTPUT

      - name: Compare versions with current release
        id: compare
        run: |
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          arch="sing-box reF1nd-Testing|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"
          IFS="|" read -r name version time <<< "$arch"
          if echo "${current_body}" | grep -q "${name}.*${version}.*${time}"; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
          else
            echo "skip_update=false" >> $GITHUB_OUTPUT
          fi

  ref1nd_testing_cross:
    runs-on: ubuntu-latest
    if: ${{ needs.ref1nd_testing_version.outputs.skip_update != 'true' }}
    strategy:
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
      fail-fast: false
    needs:
      - go
      - ref1nd_testing_version
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.ref1nd_testing_version.outputs.version }}
      TAGS: ${{ needs.ref1nd_testing_version.outputs.tags }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-testing
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build sing-box reF1nd-Testing core
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ref1nd-testing-${{ matrix.name }}
          path: sing-box*

  ref1nd_testing_android:
    runs-on: ubuntu-latest
    if: ${{ needs.ref1nd_testing_version.outputs.skip_update != 'true' }}
    needs:
      - go
      - ref1nd_testing_version
    env:
      VERSION: ${{ needs.ref1nd_testing_version.outputs.version }}
      TAGS: ${{ needs.ref1nd_testing_version.outputs.tags }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-testing
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing
          path: sing-box
          fetch-depth: 0

      - name: Checkout reF1nd/sing-box-for-android
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-android
          ref: reF1nd-testing
          path: sing-box-for-android

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('sing-box-for-android/**/*.gradle') }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > ./sing-box-for-android/app/release.keystore

      - name: Build library
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -v \
            -target android/arm64 \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -tags="${{ env.TAGS }},${{ env.TAGS_ANDROID_EXTRA }}" \
            -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ env.VERSION }} -s -w -buildid=" \
            ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Prepare Android client
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/

      - name: Build SFA-reF1nd-Testing apk
        run: |
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Rename apks
        run: |
          mkdir -p ./sfa-ref1nd-testing/
          for file in ./sing-box-for-android/app/build/outputs/apk/other/release/*.apk; do
            mv -f "${file}" "./sfa-ref1nd-testing/$(basename "${file/SFA-*-reF1nd/SFA-ref1nd-testing}")"
          done

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sfa-ref1nd-testing-apks
          path: ./sfa-ref1nd-testing/*

  # ==================== Release and Publish ====================

  push_sing-box:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - singbox_oldstable_version
      - singbox_oldstable_cross
      - singbox_stable_version
      - singbox_stable_cross
      - singbox_testing_version
      - singbox_testing_cross
      - ref1nd_oldstable_version
      - ref1nd_oldstable_cross
      - ref1nd_stable_version
      - ref1nd_stable_cross
      - ref1nd_stable_android
      - ref1nd_testing_version
      - ref1nd_testing_cross
      - ref1nd_testing_android
    env:
      SINGBOX_OLDSTABLE_VERSION: ${{ needs.singbox_oldstable_version.outputs.version }}
      SINGBOX_OLDSTABLE_TIME: ${{ needs.singbox_oldstable_version.outputs.time }}
      SINGBOX_OLDSTABLE_SKIP: ${{ needs.singbox_oldstable_version.outputs.skip_update }}
      SINGBOX_STABLE_VERSION: ${{ needs.singbox_stable_version.outputs.version }}
      SINGBOX_STABLE_TIME: ${{ needs.singbox_stable_version.outputs.time }}
      SINGBOX_STABLE_SKIP: ${{ needs.singbox_stable_version.outputs.skip_update }}
      SINGBOX_TESTING_VERSION: ${{ needs.singbox_testing_version.outputs.version }}
      SINGBOX_TESTING_TIME: ${{ needs.singbox_testing_version.outputs.time }}
      SINGBOX_TESTING_SKIP: ${{ needs.singbox_testing_version.outputs.skip_update }}
      REF1ND_OLDSTABLE_VERSION: ${{ needs.ref1nd_oldstable_version.outputs.version }}
      REF1ND_OLDSTABLE_TIME: ${{ needs.ref1nd_oldstable_version.outputs.time }}
      REF1ND_OLDSTABLE_SKIP: ${{ needs.ref1nd_oldstable_version.outputs.skip_update }}
      REF1ND_STABLE_VERSION: ${{ needs.ref1nd_stable_version.outputs.version }}
      REF1ND_STABLE_TIME: ${{ needs.ref1nd_stable_version.outputs.time }}
      REF1ND_STABLE_SKIP: ${{ needs.ref1nd_stable_version.outputs.skip_update }}
      REF1ND_TESTING_VERSION: ${{ needs.ref1nd_testing_version.outputs.version }}
      REF1ND_TESTING_TIME: ${{ needs.ref1nd_testing_version.outputs.time }}
      REF1ND_TESTING_SKIP: ${{ needs.ref1nd_testing_version.outputs.skip_update }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Download files from workspace
        uses: actions/download-artifact@v8
        with:
          path: ./tmp/

      - name: Prepare sing-box Oldstable files
        if: ${{ env.SINGBOX_OLDSTABLE_SKIP != 'true' }}
        run: |
          mkdir -p ./sing-box/
          linux_archs=(amd64-v1 amd64-v3 armv5 armv6 armv7 arm64 mips-softfloat mipsle-softfloat mipsle-hardfloat)
          for arch in "${linux_archs[@]}"; do
            if [ -f "./tmp/sing-box-oldstable-linux-${arch}/sing-box" ]; then
              mv -f "./tmp/sing-box-oldstable-linux-${arch}/sing-box" ./sing-box/sing-box-oldstable-linux-${arch}.upx
              chmod +x ./sing-box/sing-box-oldstable-linux-${arch}.upx
            fi
          done
          windows_archs=(amd64-v1 amd64-v3 arm64)
          for arch in "${windows_archs[@]}"; do
            if [ -f "./tmp/sing-box-oldstable-windows-${arch}/sing-box.exe" ]; then
              mv -f "./tmp/sing-box-oldstable-windows-${arch}/sing-box.exe" ./sing-box/sing-box-oldstable-windows-${arch}.exe
            fi
          done

      - name: Prepare sing-box Stable files
        if: ${{ env.SINGBOX_STABLE_SKIP != 'true' }}
        run: |
          mkdir -p ./sing-box/
          linux_archs=(amd64-v1 amd64-v3 armv5 armv6 armv7 arm64 mips-softfloat mipsle-softfloat mipsle-hardfloat)
          for arch in "${linux_archs[@]}"; do
            if [ -f "./tmp/sing-box-stable-linux-${arch}/sing-box" ]; then
              mv -f "./tmp/sing-box-stable-linux-${arch}/sing-box" ./sing-box/sing-box-stable-linux-${arch}.upx
              chmod +x ./sing-box/sing-box-stable-linux-${arch}.upx
            fi
          done
          windows_archs=(amd64-v1 amd64-v3 arm64)
          for arch in "${windows_archs[@]}"; do
            if [ -f "./tmp/sing-box-stable-windows-${arch}/sing-box.exe" ]; then
              mv -f "./tmp/sing-box-stable-windows-${arch}/sing-box.exe" ./sing-box/sing-box-stable-windows-${arch}.exe
            fi
          done

      - name: Prepare sing-box Testing files
        if: ${{ env.SINGBOX_TESTING_SKIP != 'true' }}
        run: |
          mkdir -p ./sing-box/
          linux_archs=(amd64-v1 amd64-v3 armv5 armv6 armv7 arm64 mips-softfloat mipsle-softfloat mipsle-hardfloat)
          for arch in "${linux_archs[@]}"; do
            if [ -f "./tmp/sing-box-testing-linux-${arch}/sing-box" ]; then
              mv -f "./tmp/sing-box-testing-linux-${arch}/sing-box" ./sing-box/sing-box-testing-linux-${arch}.upx
              chmod +x ./sing-box/sing-box-testing-linux-${arch}.upx
            fi
          done
          windows_archs=(amd64-v1 amd64-v3 arm64)
          for arch in "${windows_archs[@]}"; do
            if [ -f "./tmp/sing-box-testing-windows-${arch}/sing-box.exe" ]; then
              mv -f "./tmp/sing-box-testing-windows-${arch}/sing-box.exe" ./sing-box/sing-box-testing-windows-${arch}.exe
            fi
          done

      - name: Prepare sing-box reF1nd-Oldstable files
        if: ${{ env.REF1ND_OLDSTABLE_SKIP != 'true' }}
        run: |
          mkdir -p ./sing-box/
          linux_archs=(amd64-v1 amd64-v3 armv5 armv6 armv7 arm64 mips-softfloat mipsle-softfloat mipsle-hardfloat)
          for arch in "${linux_archs[@]}"; do
            if [ -f "./tmp/sing-box-ref1nd-oldstable-linux-${arch}/sing-box" ]; then
              mv -f "./tmp/sing-box-ref1nd-oldstable-linux-${arch}/sing-box" ./sing-box/sing-box-ref1nd-oldstable-linux-${arch}.upx
              chmod +x ./sing-box/sing-box-ref1nd-oldstable-linux-${arch}.upx
            fi
          done
          windows_archs=(amd64-v1 amd64-v3 arm64)
          for arch in "${windows_archs[@]}"; do
            if [ -f "./tmp/sing-box-ref1nd-oldstable-windows-${arch}/sing-box.exe" ]; then
              mv -f "./tmp/sing-box-ref1nd-oldstable-windows-${arch}/sing-box.exe" ./sing-box/sing-box-ref1nd-oldstable-windows-${arch}.exe
            fi
          done

      - name: Prepare sing-box reF1nd-Stable files
        if: ${{ env.REF1ND_STABLE_SKIP != 'true' }}
        run: |
          mkdir -p ./sing-box/
          linux_archs=(amd64-v1 amd64-v3 armv5 armv6 armv7 arm64 mips-softfloat mipsle-softfloat mipsle-hardfloat)
          for arch in "${linux_archs[@]}"; do
            if [ -f "./tmp/sing-box-ref1nd-stable-linux-${arch}/sing-box" ]; then
              mv -f "./tmp/sing-box-ref1nd-stable-linux-${arch}/sing-box" ./sing-box/sing-box-ref1nd-stable-linux-${arch}.upx
              chmod +x ./sing-box/sing-box-ref1nd-stable-linux-${arch}.upx
            fi
          done
          windows_archs=(amd64-v1 amd64-v3 arm64)
          for arch in "${windows_archs[@]}"; do
            if [ -f "./tmp/sing-box-ref1nd-stable-windows-${arch}/sing-box.exe" ]; then
              mv -f "./tmp/sing-box-ref1nd-stable-windows-${arch}/sing-box.exe" ./sing-box/sing-box-ref1nd-stable-windows-${arch}.exe
            fi
          done
          if ls ./tmp/sfa-ref1nd-stable-apks/*.apk >/dev/null 2>&1; then
            mv -f ./tmp/sfa-ref1nd-stable-apks/*.apk ./sing-box/
          fi

      - name: Prepare sing-box reF1nd-Testing files
        if: ${{ env.REF1ND_TESTING_SKIP != 'true' }}
        run: |
          mkdir -p ./sing-box/
          linux_archs=(amd64-v1 amd64-v3 armv5 armv6 armv7 arm64 mips-softfloat mipsle-softfloat mipsle-hardfloat)
          for arch in "${linux_archs[@]}"; do
            if [ -f "./tmp/sing-box-ref1nd-testing-linux-${arch}/sing-box" ]; then
              mv -f "./tmp/sing-box-ref1nd-testing-linux-${arch}/sing-box" ./sing-box/sing-box-ref1nd-testing-linux-${arch}.upx
              chmod +x ./sing-box/sing-box-ref1nd-testing-linux-${arch}.upx
            fi
          done
          windows_archs=(amd64-v1 amd64-v3 arm64)
          for arch in "${windows_archs[@]}"; do
            if [ -f "./tmp/sing-box-ref1nd-testing-windows-${arch}/sing-box.exe" ]; then
              mv -f "./tmp/sing-box-ref1nd-testing-windows-${arch}/sing-box.exe" ./sing-box/sing-box-ref1nd-testing-windows-${arch}.exe
            fi
          done
          if ls ./tmp/sfa-ref1nd-testing-apks/*.apk >/dev/null 2>&1; then
            mv -f ./tmp/sfa-ref1nd-testing-apks/*.apk ./sing-box/
          fi

      - name: Setup UPX and compress files
        if: ${{ env.SINGBOX_OLDSTABLE_SKIP != 'true' || env.SINGBOX_STABLE_SKIP != 'true' || env.SINGBOX_TESTING_SKIP != 'true' || env.REF1ND_OLDSTABLE_SKIP != 'true' || env.REF1ND_STABLE_SKIP != 'true' || env.REF1ND_TESTING_SKIP != 'true' }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: ./sing-box/*.upx

      - name: Check if files exist
        id: check
        run: |
          if ls ./sing-box/* >/dev/null 2>&1; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Release and upload assets
        if: ${{ steps.check.outputs.files_exist == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box
          tag: sing-box
          overwrite: true
          body: |
            更新 [sing-box Oldstable 版](https://github.com/SagerNet/sing-box/tree/oldstable)至 v${{ env.SINGBOX_OLDSTABLE_VERSION }}，发布于 ${{ env.SINGBOX_OLDSTABLE_TIME }}
            更新 [sing-box Stable 版](https://github.com/SagerNet/sing-box/tree/stable)至 v${{ env.SINGBOX_STABLE_VERSION }}，发布于 ${{ env.SINGBOX_STABLE_TIME }}
            更新 [sing-box Testing 版](https://github.com/SagerNet/sing-box/tree/testing)至 v${{ env.SINGBOX_TESTING_VERSION }}，发布于 ${{ env.SINGBOX_TESTING_TIME }}
            更新 [sing-box reF1nd-Oldstable 版](https://github.com/reF1nd/sing-box/tree/reF1nd-oldstable)至 v${{ env.REF1ND_OLDSTABLE_VERSION }}，发布于 ${{ env.REF1ND_OLDSTABLE_TIME }}
            更新 [sing-box reF1nd-Stable 版](https://github.com/reF1nd/sing-box/tree/reF1nd-stable)至 v${{ env.REF1ND_STABLE_VERSION }}，发布于 ${{ env.REF1ND_STABLE_TIME }}
            更新 [sing-box reF1nd-Testing 版](https://github.com/reF1nd/sing-box/tree/reF1nd-testing)至 v${{ env.REF1ND_TESTING_VERSION }}，发布于 ${{ env.REF1ND_TESTING_TIME }}
          file_glob: true
          file: ./sing-box/*

  # ==================== Telegram Notification ====================

  telegram_notify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_telegram == 'true' }}
    needs:
      - push_sing-box
      - singbox_oldstable_version
      - singbox_stable_version
      - singbox_testing_version
      - ref1nd_oldstable_version
      - ref1nd_stable_version
      - ref1nd_testing_version
    steps:
      - name: Send Telegram notification
        uses: xz-dev/TelegramFileUploader@v1
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            **sing-box Build Completed**

            **SagerNet/sing-box**
            - Oldstable: v${{ needs.singbox_oldstable_version.outputs.version }} (${{ needs.singbox_oldstable_version.outputs.time }})
            - Stable: v${{ needs.singbox_stable_version.outputs.version }} (${{ needs.singbox_stable_version.outputs.time }})
            - Testing: v${{ needs.singbox_testing_version.outputs.version }} (${{ needs.singbox_testing_version.outputs.time }})

            **reF1nd/sing-box**
            - Oldstable: v${{ needs.ref1nd_oldstable_version.outputs.version }} (${{ needs.ref1nd_oldstable_version.outputs.time }})
            - Stable: v${{ needs.ref1nd_stable_version.outputs.version }} (${{ needs.ref1nd_stable_version.outputs.time }})
            - Testing: v${{ needs.ref1nd_testing_version.outputs.version }} (${{ needs.ref1nd_testing_version.outputs.time }})

            [Download](https://github.com/${{ github.repository }}/releases/tag/sing-box)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  # ==================== Update README ====================

  update_readme:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - push_sing-box
      - singbox_oldstable_version
      - singbox_stable_version
      - singbox_testing_version
      - ref1nd_oldstable_version
      - ref1nd_stable_version
      - ref1nd_testing_version
    steps:
      - uses: actions/checkout@v6

      - name: Generate README
        run: |
          cat > README.md <<EOF
          # sing-box 自动编译

          自动检测并编译 [SagerNet/sing-box](https://github.com/SagerNet/sing-box) 和 [reF1nd/sing-box](https://github.com/reF1nd/sing-box) 的多个版本。

          ## 支持版本

          | 版本 | 仓库 | 分支 |
          |------|------|------|
          | Oldstable | SagerNet/sing-box | oldstable |
          | Stable | SagerNet/sing-box | stable |
          | Testing | SagerNet/sing-box | testing |
          | reF1nd-Oldstable | reF1nd/sing-box | reF1nd-oldstable |
          | reF1nd-Stable | reF1nd/sing-box | reF1nd-stable |
          | reF1nd-Testing | reF1nd/sing-box | reF1nd-testing |

          ## 支持平台

          ### Linux
          - amd64-v1, amd64-v3
          - armv5, armv6, armv7, arm64
          - mips-softfloat, mipsle-softfloat, mipsle-hardfloat

          ### Windows
          - amd64-v1, amd64-v3, arm64

          ### Android

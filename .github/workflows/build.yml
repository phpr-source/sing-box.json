name: Build sing-box Core & SFA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target version (Select "all" for forced full sync)'
        type: choice
        options: ['all', 'reF1nd-Testing', 'reF1nd-Stable', 'Official-Alpha', 'Official-Stable']
        default: 'all'
  schedule:
    - cron: '0 */4 * * *'
  repository_dispatch:
    types: [upstream_sync]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check_updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
      has_builds: ${{ steps.set_matrix.outputs.has_builds }}
      core_targets: ${{ steps.set_matrix.outputs.core_targets }}
      sfa_sha: ${{ steps.fetch_deps.outputs.sfa_sha }}
      geoip_tag: ${{ steps.fetch_deps.outputs.geoip_tag }}
      geosite_tag: ${{ steps.fetch_deps.outputs.geosite_tag }}
      meta_sha: ${{ steps.fetch_deps.outputs.meta_sha }}
      yacd_sha: ${{ steps.fetch_deps.outputs.yacd_sha }}
    steps:
      - name: Fetch External Dependencies
        id: fetch_deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SFA_SHA=$(git ls-remote https://github.com/SagerNet/sing-box-for-android.git refs/heads/main | awk '{print $1}')
          GEOIP_TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-geoip/releases/latest | jq -r .tag_name)
          GEOSITE_TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-geosite/releases/latest | jq -r .tag_name)
          META_SHA=$(git ls-remote https://github.com/MetaCubeX/metacubexd.git refs/heads/gh-pages | awk '{print $1}')
          YACD_SHA=$(git ls-remote https://github.com/haishanh/yacd.git refs/heads/gh-pages | awk '{print $1}')

          for var in SFA_SHA GEOIP_TAG GEOSITE_TAG META_SHA YACD_SHA; do
            if [ -z "${!var}" ] || [ "${!var}" = "null" ]; then
              echo "::error::Failed to fetch dependency $var."
              exit 1
            fi
          done

          echo "sfa_sha=$SFA_SHA" >> "$GITHUB_OUTPUT"
          echo "geoip_tag=$GEOIP_TAG" >> "$GITHUB_OUTPUT"
          echo "geosite_tag=$GEOSITE_TAG" >> "$GITHUB_OUTPUT"
          echo "meta_sha=$META_SHA" >> "$GITHUB_OUTPUT"
          echo "yacd_sha=$YACD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determine Build Matrix & Targets
        id: set_matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ github.event.inputs.branch }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch || '' }}
          SFA_SHA: ${{ steps.fetch_deps.outputs.sfa_sha }}
          GEOIP_TAG: ${{ steps.fetch_deps.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ steps.fetch_deps.outputs.geosite_tag }}
          META_SHA: ${{ steps.fetch_deps.outputs.meta_sha }}
          YACD_SHA: ${{ steps.fetch_deps.outputs.yacd_sha }}
        run: |
          set -euo pipefail

          CORE_TARGETS_JSON=$(cat << 'EOF' | jq -c .
          [
            {"os":"linux","arch":"amd64","amd":"v3","flavor":"full","upx":false},
            {"os":"linux","arch":"amd64","flavor":"full","upx":false},
            {"os":"linux","arch":"arm64","flavor":"full","upx":false},
            {"os":"linux","arch":"arm","arm":"7","flavor":"full","upx":true},
            {"os":"linux","arch":"arm","arm":"7","flavor":"lite","upx":true},
            {"os":"linux","arch":"arm","arm":"5","flavor":"lite","upx":true},
            {"os":"linux","arch":"mipsle","flavor":"lite","upx":true},
            {"os":"linux","arch":"mipsle","mips":"softfloat","flavor":"lite","upx":true},
            {"os":"windows","arch":"amd64","amd":"v3","flavor":"full","upx":false},
            {"os":"darwin","arch":"amd64","flavor":"full","upx":false},
            {"os":"darwin","arch":"arm64","flavor":"full","upx":false}
          ]
          EOF
          )
          echo "core_targets=$CORE_TARGETS_JSON" >> "$GITHUB_OUTPUT"

          TARGETS=(
            "reF1nd/sing-box|reF1nd-testing|reF1nd-Testing|true"
            "reF1nd/sing-box|reF1nd-stable|reF1nd-Stable|false"
            "SagerNet/sing-box|dev|Official-Alpha|true"
            "SagerNet/sing-box|testing|Official-Stable|false" 
          )

          JSON="[]"
          HAS="false"

          for e in "${TARGETS[@]}"; do
            IFS='|' read -r REPO BR TIT ROLLING <<< "$e"

            if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_BRANCH" != "all" ] && [ "$IN_BRANCH" != "$TIT" ]; then
              continue
            fi
            if [ "$EVENT" = "repository_dispatch" ] && [ -n "$PAYLOAD_BRANCH" ]; then
              if [ "$PAYLOAD_BRANCH" != "$BR" ] && [ "$PAYLOAD_BRANCH" != "$TIT" ]; then
                continue
              fi
            fi

            BR_INPUT="$BR"
            SHA=""
            for search_br in "$BR_INPUT" "dev" "testing" "main-next" "dev-next" "next" "main"; do
              SHA=$(git ls-remote "https://github.com/${REPO}.git" "refs/heads/$search_br" | awk '{print $1}')
              if [ -n "$SHA" ]; then
                if [ "$search_br" != "$BR_INPUT" ]; then
                  echo "::warning::Branch '$BR_INPUT' not found in $REPO. Safely fell back to alternative branch: '$search_br'."
                  BR="$search_br"
                fi
                break
              fi
            done

            if [ -z "$SHA" ]; then
              echo "::warning::No alternative branches found for $REPO. Attempting HEAD fallback."
              SHA=$(git ls-remote "https://github.com/${REPO}.git" "HEAD" | awk '{print $1}')
            fi

            if [ -z "$SHA" ]; then
              echo "::error::Critical failure: Could not resolve ANY valid branch or HEAD for $REPO. Upstream branch is missing."
              exit 1
            fi

            SHORT_SHA="${SHA:0:7}"

            TMPDIR="$(mktemp -d)"
            git clone --bare --filter=blob:none "https://github.com/${REPO}.git" "$TMPDIR" >/dev/null 2>&1
            APP_VER=$(git --git-dir="$TMPDIR" describe --tags --abbrev=0 "$SHA" 2>/dev/null | sed 's/^v//' || true)
            rm -rf "$TMPDIR"

            [ -z "$APP_VER" ] && APP_VER="$SHORT_SHA"
            
            BUILD_VER="$SHA"
            DISPLAY_VER="$APP_VER"

            if [ "$ROLLING" = "false" ]; then 
              CHK_TAG="v${DISPLAY_VER}-${TIT}"
            else 
              CHK_TAG="${TIT}"
            fi

            OLD_META=$(gh release download "$CHK_TAG" --pattern metadata.json --repo "${{ github.repository }}" -O - 2>/dev/null || echo "{}")
            L_SHA=$(echo "$OLD_META" | jq -r '.sha // "none"')
            L_SFA=$(echo "$OLD_META" | jq -r '.sfa_sha // "none"')
            L_GEOIP=$(echo "$OLD_META" | jq -r '.geoip_tag // "none"')
            L_GEOSITE=$(echo "$OLD_META" | jq -r '.geosite_tag // "none"')
            L_META=$(echo "$OLD_META" | jq -r '.meta_sha // "none"')
            L_YACD=$(echo "$OLD_META" | jq -r '.yacd_sha // "none"')

            NEEDS_UPDATE="false"
            UPDATE_REASON=""

            if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_BRANCH" = "all" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Forced Full Sync"
            elif [ "$L_SHA" = "none" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Initial Release"
            elif [ "$SHA" != "$L_SHA" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Core Updates"
            elif [ "$SFA_SHA" != "$L_SFA" ] || [ "$GEOIP_TAG" != "$L_GEOIP" ] || [ "$GEOSITE_TAG" != "$L_GEOSITE" ] || [ "$META_SHA" != "$L_META" ] || [ "$YACD_SHA" != "$L_YACD" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Dependency Updates"
            fi
            
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_BRANCH" != "all" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Manual Branch Sync"
            fi

            if [ "$NEEDS_UPDATE" = "true" ]; then
              JSON=$(echo "$JSON" | jq -c \
                --arg repo "$REPO" \
                --arg branch "$BR" \
                --arg title "$TIT" \
                --argjson rolling "$ROLLING" \
                --arg sha "$SHA" \
                --arg local_sha "$L_SHA" \
                --arg short_sha "$SHORT_SHA" \
                --arg build_ver "$BUILD_VER" \
                --arg display_ver "$DISPLAY_VER" \
                --arg tag "$CHK_TAG" \
                --arg reason "$UPDATE_REASON" \
                '. += [{"repo": $repo, "branch": $branch, "title": $title, "rolling": $rolling, "sha": $sha, "local_sha": $local_sha, "short_sha": $short_sha, "build_ver": $build_ver, "display_ver": $display_ver, "tag": $tag, "reason": $reason}]')
              HAS="true"
            fi
          done

          echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"
          echo "has_builds=$HAS" >> "$GITHUB_OUTPUT"

  build_core:
    needs: check_updates
    if: needs.check_updates.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.check_updates.outputs.matrix).include }}
        target: ${{ fromJson(needs.check_updates.outputs.core_targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - uses: crazy-max/ghaction-upx@v3
        if: matrix.target.upx == true
        with:
          install-only: true

      - name: Build Core
        run: |
          set -euo pipefail
          export GOOS=${{ matrix.target.os }}
          export GOARCH=${{ matrix.target.arch }}
          export CGO_ENABLED=0

          SUF=""
          if [ -n "${{ matrix.target.amd || '' }}" ]; then export GOAMD64="${{ matrix.target.amd }}"; SUF="${{ matrix.target.amd }}"; fi
          if [ -n "${{ matrix.target.arm || '' }}" ]; then export GOARM="${{ matrix.target.arm }}"; SUF="v${{ matrix.target.arm }}"; fi
          if [ -n "${{ matrix.target.mips || '' }}" ]; then export GOMIPS="${{ matrix.target.mips }}"; SUF="-${{ matrix.target.mips }}"; fi

          TAGS="with_quic,with_utls,with_clash_api"
          [ "${{ matrix.target.flavor }}" != "lite" ] && TAGS="${TAGS},with_gvisor,with_acme,with_v2ray_api,with_wireguard"

          IDENTIFIER="${{ matrix.target.os }}-${{ matrix.target.arch }}${SUF}-${{ matrix.target.flavor }}"
          NAME="sing-box-${{ matrix.branch_info.display_ver }}-${{ matrix.branch_info.title }}-${IDENTIFIER}"
          BIN="sing-box"
          [ "${{ matrix.target.os }}" = "windows" ] && BIN="sing-box.exe"

          if [ "${{ matrix.branch_info.display_ver }}" = "${{ matrix.branch_info.short_sha }}" ]; then
            VERSION_LDFLAG="${{ matrix.branch_info.display_ver }}"
          else
            VERSION_LDFLAG="${{ matrix.branch_info.display_ver }}-${{ matrix.branch_info.short_sha }}"
          fi
          
          LDFLAGS="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=$VERSION_LDFLAG"

          go build -trimpath -ldflags "$LDFLAGS" -tags "$TAGS" -o "$BIN" ./cmd/sing-box
          chmod +x "$BIN"

          mkdir -p output
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            zip -9 -j -q "output/${NAME}.zip" "$BIN"
          else
            tar -czf "output/${NAME}.tar.gz" "$BIN"
          fi

          if [ "${{ matrix.target.upx }}" = "true" ] && upx --lzma --best "$BIN"; then
            cp "$BIN" "output/${NAME}-upx.upx"
          fi

          touch "output/SUCCESS-${IDENTIFIER}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'output/*'

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.branch_info.title }}-core-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.amd || '' }}${{ matrix.target.arm != '' && format('v{0}', matrix.target.arm) || '' }}${{ matrix.target.mips != '' && format('-{0}', matrix.target.mips) || '' }}-${{ matrix.target.flavor }}
          path: output/*

  build_android:
    needs: check_updates
    if: needs.check_updates.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.check_updates.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.sha }}
          fetch-depth: 0
          path: sing-box

      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ needs.check_updates.outputs.sfa_sha }}
          fetch-depth: 0
          path: sfa
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: sing-box/go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android AAR & APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASS: ${{ secrets.KEY_PASS || 'password' }}
        run: |
          set -euo pipefail
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

          cd sing-box
          make lib_install
          make lib_android

          AAR_FILE="$(find . -type f \( -name 'libbox*.aar' -o -name '*.aar' \) | head -n 1 || true)"
          if [ -z "$AAR_FILE" ] || [ ! -f "$AAR_FILE" ]; then
            echo "::error::AAR not found. Core build for Android failed."
            exit 1
          fi

          mkdir -p ../sfa/app/libs
          rm -f ../sfa/app/libs/*.aar
          cp "$AAR_FILE" ../sfa/app/libs/

          cd ../sfa
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_HOME" "$ANDROID_NDK_HOME" > local.properties
          printf 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\nkotlin.daemon.jvmargs=-Xmx2g -Djava.awt.headless=true\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties

          mkdir -p ../output

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is empty! Failing strictly to prevent un-upgradable APKs from being published."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > ci-release.jks

          if ! ./gradlew clean :app:assemblePlayRelease --no-daemon --stacktrace -x lint \
            -Pandroid.injected.signing.store.file=$(pwd)/ci-release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"; then
            echo "::error::SFA APK Compilation failed. Halting Android workflow."
            exit 1
          fi

          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::APK generation failed."
            exit 1
          fi
          
          APK_NAME="SFA-${{ matrix.branch_info.display_ver }}-${{ matrix.branch_info.title }}-universal.apk"
          cp "$APK_PATH" "../output/$APK_NAME"
          echo "APK_NAME=$APK_NAME" > ../output/apk_meta.env
          echo "APK_STATUS=success" >> ../output/apk_meta.env

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bin-${{ matrix.branch_info.title }}-android-apk
          path: output/*
          if-no-files-found: ignore

  release:
    needs: [check_updates, build_core, build_android]
    if: always() && needs.check_updates.outputs.has_builds == 'true' && needs.check_updates.result == 'success' && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.check_updates.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.sha }}
          fetch-depth: 0

      - name: Generate Smart Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SFA_SHA: ${{ needs.check_updates.outputs.sfa_sha }}
          GEOIP_TAG: ${{ needs.check_updates.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.check_updates.outputs.geosite_tag }}
          META_SHA: ${{ needs.check_updates.outputs.meta_sha }}
          YACD_SHA: ${{ needs.check_updates.outputs.yacd_sha }}
        run: |
          LOCAL_SHA="${{ matrix.branch_info.local_sha }}"
          if [ "$LOCAL_SHA" != "none" ] && [ -n "$LOCAL_SHA" ]; then
            LOG_RAW=$(git log --pretty=format:"- %s (%h)" ${LOCAL_SHA}..${{ matrix.branch_info.sha }} 2>/dev/null || true)
          fi
          if [ -z "${LOG_RAW:-}" ]; then
            LOG_RAW=$(git log --pretty=format:"- %s (%h)" -n 15 ${{ matrix.branch_info.sha }} 2>/dev/null || true)
          fi

          OLD_META=$(gh release download "${{ matrix.branch_info.tag }}" --pattern metadata.json --repo "${{ github.repository }}" -O - 2>/dev/null || echo "{}")
          L_SFA=$(echo "$OLD_META" | jq -r '.sfa_sha // "none"')
          L_GEOIP=$(echo "$OLD_META" | jq -r '.geoip_tag // "none"')
          L_GEOSITE=$(echo "$OLD_META" | jq -r '.geosite_tag // "none"')
          L_META=$(echo "$OLD_META" | jq -r '.meta_sha // "none"')
          L_YACD=$(echo "$OLD_META" | jq -r '.yacd_sha // "none"')

          DEP_CHANGES=""
          [ "$L_SFA" != "none" ] && [ "$L_SFA" != "$SFA_SHA" ] && DEP_CHANGES="$DEP_CHANGES\n- ⬆️ **SFA Android**: \`$L_SFA\` -> \`${SFA_SHA:0:7}\`"
          [ "$L_GEOIP" != "none" ] && [ "$L_GEOIP" != "$GEOIP_TAG" ] && DEP_CHANGES="$DEP_CHANGES\n- 🌍 **GeoIP**: \`$L_GEOIP\` -> \`$GEOIP_TAG\`"
          [ "$L_GEOSITE" != "none" ] && [ "$L_GEOSITE" != "$GEOSITE_TAG" ] && DEP_CHANGES="$DEP_CHANGES\n- 🌍 **Geosite**: \`$L_GEOSITE\` -> \`$GEOSITE_TAG\`"
          [ "$L_META" != "none" ] && [ "$L_META" != "$META_SHA" ] && DEP_CHANGES="$DEP_CHANGES\n- 🖥️ **Metacubexd**: \`${L_META:0:7}\` -> \`${META_SHA:0:7}\`"
          [ "$L_YACD" != "none" ] && [ "$L_YACD" != "$YACD_SHA" ] && DEP_CHANGES="$DEP_CHANGES\n- 🖥️ **YACD**: \`${L_YACD:0:7}\` -> \`${YACD_SHA:0:7}\`"

          {
            echo "CHANGELOG<<EOF"
            echo "### 🚦 Build Reason"
            echo "- **Triggered by**: ${{ matrix.branch_info.reason }}"
            echo ""
            if [ -n "$DEP_CHANGES" ]; then
              echo "### 📦 Dependency Updates"
              echo -e "$DEP_CHANGES"
              echo ""
            fi
            echo "### 🔄 Core Commits"
            echo "$LOG_RAW" | grep -v "Merge pull request" || echo "- No new core commits."
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.branch_info.title }}-*
          merge-multiple: true
          path: release_assets

      - name: Prepare Assets & Generate Traceability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SFA_SHA: ${{ needs.check_updates.outputs.sfa_sha }}
          GEOIP_TAG: ${{ needs.check_updates.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.check_updates.outputs.geosite_tag }}
          META_SHA: ${{ needs.check_updates.outputs.meta_sha }}
          YACD_SHA: ${{ needs.check_updates.outputs.yacd_sha }}
          EVENT_NAME: ${{ github.event_name }}
          CORE_TARGETS_JSON: ${{ needs.check_updates.outputs.core_targets }}
        run: |
          set -euo pipefail
          cd release_assets

          if [ -f "apk_meta.env" ]; then
            source apk_meta.env
          else
            APK_STATUS="failed"
            echo "::warning::apk_meta.env missing. Android build failed or was skipped."
          fi
          echo "APK_STATUS=$APK_STATUS" >> "$GITHUB_ENV"

          SUCCESS_LIST=""
          FAILED_LIST=""

          while read -r target_encoded; do
            OS=$(echo "$target_encoded" | base64 --decode | jq -r '.os')
            ARCH=$(echo "$target_encoded" | base64 --decode | jq -r '.arch')
            AMD=$(echo "$target_encoded" | base64 --decode | jq -r '.amd // empty')
            ARM=$(echo "$target_encoded" | base64 --decode | jq -r '.arm // empty')
            MIPS=$(echo "$target_encoded" | base64 --decode | jq -r '.mips // empty')
            FLAVOR=$(echo "$target_encoded" | base64 --decode | jq -r '.flavor')

            SUF=""
            [ -n "$AMD" ] && SUF="$AMD"
            [ -n "$ARM" ] && SUF="v$ARM"
            [ -n "$MIPS" ] && SUF="-$MIPS"

            IDENTIFIER="${OS}-${ARCH}${SUF}-${FLAVOR}"
            
            if [ -f "SUCCESS-$IDENTIFIER" ]; then
              SUCCESS_LIST="$SUCCESS_LIST\n- ✅ \`$IDENTIFIER\`"
            else
              FAILED_LIST="$FAILED_LIST\n- ❌ \`$IDENTIFIER\` (Failed or Skipped)"
            fi
          done <<< "$(echo "$CORE_TARGETS_JSON" | jq -r '.[] | @base64')"

          if [ -z "$(echo -e "$SUCCESS_LIST" | tr -d '[:space:]')" ]; then
            echo "::error::All core platform builds failed! Refusing to release empty artifacts."
            exit 1
          fi

          {
            echo "EXPLICIT_SUCCESS<<EOF"
            echo -e "$SUCCESS_LIST"
            echo "EOF"
            echo "EXPLICIT_FAILED<<EOF"
            echo -e "$FAILED_LIST"
            echo "EOF"
          } >> "$GITHUB_ENV"

          rm -f SUCCESS-* apk_meta.env

          mkdir -p Essential-Assets/ui
          cat << 'EOF' > Essential-Assets/config.json
          { "log": { "level": "info" }, "inbounds": [{ "type": "mixed", "listen": "127.0.0.1", "listen_port": 2080 }], "outbounds": [{ "type": "selector", "tag": "proxy", "outbounds": ["direct"] }, { "type": "direct", "tag": "direct" }] }
          EOF

          curl -fL --retry 3 -o Essential-Assets/geoip.db "https://github.com/SagerNet/sing-geoip/releases/download/${GEOIP_TAG}/geoip.db"
          curl -fL --retry 3 -o Essential-Assets/geosite.db "https://github.com/SagerNet/sing-geosite/releases/download/${GEOSITE_TAG}/geosite.db"
          if ! curl -fL --retry 3 -o Essential-Assets/geosite-cn.srs "https://github.com/SagerNet/sing-geosite/releases/download/${GEOSITE_TAG}/geosite-cn.srs"; then
            echo "::warning::geosite-cn.srs not found, skipping soft dependency."
          fi

          curl -fL -sS -o metacubexd.zip "https://github.com/MetaCubeX/metacubexd/archive/${META_SHA}.zip"
          unzip -q metacubexd.zip -d tmp_meta/ && mv $(find tmp_meta -mindepth 1 -maxdepth 1 -type d | head -n 1) Essential-Assets/ui/metacubexd
          curl -fL -sS -o yacd.zip "https://github.com/haishanh/yacd/archive/${YACD_SHA}.zip"
          unzip -q yacd.zip -d tmp_yacd/ && mv $(find tmp_yacd -mindepth 1 -maxdepth 1 -type d | head -n 1) Essential-Assets/ui/yacd
          rm -rf tmp_* *.zip

          zip -9 -r "sing-box-${{ matrix.branch_info.title }}-Essential-Assets.zip" Essential-Assets/
          rm -rf Essential-Assets/

          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

          find . -maxdepth 1 -type f \( ! -name 'sha256sums.txt' ! -name 'metadata.json' ! -name 'temp_hashes.txt' \) -print0 | xargs -0 sha256sum > temp_hashes.txt
          HASHES_JSON=$(awk '{printf "{\"file\":\"%s\",\"hash\":\"%s\"}\n", $2, $1}' temp_hashes.txt | jq -s -c '.')

          jq -n \
            --arg repo "${{ matrix.branch_info.repo }}" \
            --arg branch "${{ matrix.branch_info.branch }}" \
            --arg sha "${{ matrix.branch_info.sha }}" \
            --arg build_ver "${{ matrix.branch_info.build_ver }}" \
            --arg display_ver "${{ matrix.branch_info.display_ver }}" \
            --arg build_time "$BUILD_TIME" \
            --arg sfa_sha "$SFA_SHA" \
            --arg geoip_tag "$GEOIP_TAG" \
            --arg geosite_tag "$GEOSITE_TAG" \
            --arg meta_sha "$META_SHA" \
            --arg yacd_sha "$YACD_SHA" \
            --arg trigger "$EVENT_NAME" \
            --arg apk_status "$APK_STATUS" \
            --argjson hashes "$HASHES_JSON" \
            '{repo: $repo, branch: $branch, sha: $sha, build_ver: $build_ver, display_ver: $display_ver, build_time: $build_time, sfa_sha: $sfa_sha, geoip_tag: $geoip_tag, geosite_tag: $geosite_tag, meta_sha: $meta_sha, yacd_sha: $yacd_sha, trigger_event: $trigger, apk_status: $apk_status, artifacts: $hashes}' > metadata.json

          cat temp_hashes.txt > sha256sums.txt
          sha256sum metadata.json >> sha256sums.txt
          rm temp_hashes.txt

      - name: Build Release Body
        env:
          SFA_SHA: ${{ needs.check_updates.outputs.sfa_sha }}
          GEOIP_TAG: ${{ needs.check_updates.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.check_updates.outputs.geosite_tag }}
          META_SHA: ${{ needs.check_updates.outputs.meta_sha }}
          YACD_SHA: ${{ needs.check_updates.outputs.yacd_sha }}
        run: |
          TITLE="${{ matrix.branch_info.title }}"
          DISPLAY_VER="${{ matrix.branch_info.display_ver }}"
          REL_NAME="v$DISPLAY_VER | $TITLE"
          [ "${{ matrix.branch_info.rolling }}" = "true" ] && REL_NAME="$TITLE (Rolling) | $DISPLAY_VER"

          cat << EOF > release_body.md
          ## 🚀 sing-box Core ($TITLE)
          > ⏱️ **Build Time (UTC)**: \`${BUILD_TIME}\`
          > 🤖 **Provenance**: 部分容錯發佈 (Partial Tolerance Release)，具備標準校驗鏈。

          $CHANGELOG

          ### 📦 產物與容錯狀態清單
          EOF

          if [ "$APK_STATUS" = "success" ]; then
            echo "- ✅ **Android GUI**: SFA Universal APK 構建成功 (SFA Commit: \`${SFA_SHA:0:7}\`)." >> release_body.md
          else
            echo "- ❌ **Android GUI**: 構建失敗或憑證缺失。本次發佈未包含 APK。" >> release_body.md
          fi

          cat << EOF >> release_body.md
          - ✅ **一體化資源包**:
            - *GeoIP*: \`${GEOIP_TAG}\` | *Geosite*: \`${GEOSITE_TAG}\`
            - *Metacubexd*: \`${META_SHA:0:7}\` | *YACD*: \`${YACD_SHA:0:7}\`
          
          <details open>
          <summary><b>🚦 Core 平台構建報告</b></summary>
          
          **Successful Targets:**
          $EXPLICIT_SUCCESS

          **Failed or Skipped Targets:**
          $EXPLICIT_FAILED

          </details>
          
          > 💡 **聲明**: 本倉庫採容錯策略運行，未列於成功清單的平台即代表本次構建失敗被跳過。請核對 \`sha256sums.txt\` 以確保下載檔案一致性。
          EOF

          echo "REL_NAME=$REL_NAME" >> "$GITHUB_ENV"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.branch_info.tag }}
          name: ${{ env.REL_NAME }}
          prerelease: ${{ matrix.branch_info.rolling }}
          make_latest: ${{ matrix.branch_info.rolling == false && 'true' || 'false' }}
          files: release_assets/*
          body_path: release_body.md

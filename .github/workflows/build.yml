name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build all targets (Ignore version match)"
        required: false
        type: boolean
        default: false
      override_version:
        description: "Override version (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      enable_naive:
        description: "Enable naive outbound (Linux/Windows only, NOT supported for Android)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/workflows/delete-old-workflows.yml"
      - ".github/workflows/update-dashboard.yml"
      - ".github/workflows/update-adguardhome.yml"
      - ".github/workflows/update-mihomo.yml"

permissions:
  contents: write
  actions: write

env:
  TAGS_SAGERNET_BASE: "with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api,with_wireguard,badlinkname"
  TAGS_REF1ND_BASE: "with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api,with_wireguard,badlinkname"
  TAGS_PUERNYA: "with_quic,with_dhcp,with_wireguard,with_shadowsocksr,with_ech,with_utls,with_clash_api,with_gvisor,badlinkname"
  TAGS_ANDROID_EXTRA: "with_conntrack"
  TAGS_NEW: "tfogo_checklinkname0"
  CURL_TIMEOUT: 15

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go.outputs.version }}
      start_time: ${{ steps.time.outputs.start }}
      android_secrets_valid: ${{ steps.validate.outputs.android_secrets_valid }}
    steps:
      - name: Record Start Time
        id: time
        run: echo "start=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Get Go latest version
        id: go
        run: echo "version=$(curl -m ${CURL_TIMEOUT} -sSL https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | jq -r '.[0].version')" >> $GITHUB_OUTPUT

      - name: Validate Secrets
        id: validate
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          CHAT_ID: ${{ secrets.CHAT_ID || '' }}
          API_ID: ${{ secrets.API_ID || '' }}
          API_HASH: ${{ secrets.API_HASH || '' }}
        run: |
          if [ "${{ github.event.inputs.enable_telegram }}" = "true" ]; then
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHAT_ID" ] || [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
              echo "::warning::Telegram secrets missing. Disabling Android build to be safe."
              echo "android_secrets_valid=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$ALIAS_NAME" ] || [ -z "$ALIAS_PASS" ]; then
            echo "::warning::Android Keystore secrets missing."
            echo "android_secrets_valid=false" >> $GITHUB_OUTPUT
          else
            echo "android_secrets_valid=true" >> $GITHUB_OUTPUT
          fi

  puernya_version:
    runs-on: ubuntu-latest
    needs: init
    outputs:
      version: ${{ steps.puernya.outputs.version }}
      time: ${{ steps.puernya.outputs.time }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: PuerNya/sing-box
          ref: building
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.init.outputs.go_version }}

      - name: Get PuerNya version via read_tag
        id: puernya
        run: |
          set +e
          git remote add sekai https://github.com/SagerNet/sing-box.git 2>/dev/null || true
          git fetch --tags sekai 2>/dev/null || true
          
          puernya_version=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag 2>/dev/null || echo "")
          set -e
          
          if [ -z "$puernya_version" ]; then
            echo "::warning::read_tag failed, using commit-based fallback"
            puernya_version="building-$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
            puernya_time="$(date -u '+%Y-%m-%d')"
          else
            ver_commit=$(echo "${puernya_version}" | awk -F '-' '{print $3}')
            if [ -n "$ver_commit" ] && [ "$ver_commit" != "" ] && [ "$ver_commit" != "null" ]; then
              puernya_time=$(git log -1 --format=%cd --date=format:'%Y-%m-%d' "$ver_commit" 2>/dev/null || echo "")
            else
              puernya_time="$(date -u '+%Y-%m-%d')"
            fi
          fi
          
          echo "version=${puernya_version}" >> $GITHUB_OUTPUT
          echo "time=${puernya_time}" >> $GITHUB_OUTPUT

  check:
    needs: [init, puernya_version]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_update: ${{ steps.check.outputs.has_update }}
    steps:
      - name: Check versions and generate matrix
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          RATE_LIMIT_RESPONSE=$(curl -m ${CURL_TIMEOUT} -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/rate_limit" 2>/dev/null || echo '{}')
          RATE_LIMIT_REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.resources.core.remaining' 2>/dev/null || echo "999")
          if [ "$RATE_LIMIT_REMAINING" != "999" ] && [ -n "$RATE_LIMIT_REMAINING" ] && [ "$RATE_LIMIT_REMAINING" -lt 30 ] 2>/dev/null; then
            echo "::warning::GitHub API rate limit low ($RATE_LIMIT_REMAINING remaining). Checks may be incomplete."
          fi

          targets="[]"
          has_update="false"
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          OVERRIDE_VERSION="${{ github.event.inputs.override_version }}"
          
          current_release=$(curl -m ${CURL_TIMEOUT} -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""' 2>/dev/null || echo "")
          echo "" > release_notes.txt

          check_branch() {
            local id="${1:-}"
            local repo="${2:-}"
            local branch="${3:-}"
            local sfa_repo="${4:-}"
            local sfa_branch="${5:-}"
            
            local ver="" time=""
            
            if [ -n "$OVERRIDE_VERSION" ]; then
              ver="$OVERRIDE_VERSION"
              time="$(date -u '+%Y-%m-%d')"
            elif [[ "$id" == "PuerNya_Building" ]]; then
              ver="${{ needs.puernya_version.outputs.version }}"
              time="${{ needs.puernya_version.outputs.time }}"
            else
              local release_data=$(curl -m ${CURL_TIMEOUT} -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases" 2>/dev/null)
              if [[ "$repo" == *"reF1nd"* ]]; then
                local tag_data=$(curl -m ${CURL_TIMEOUT} -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/tags" 2>/dev/null)
                if [[ "$branch" == *"testing"* ]]; then
                  ver=$(echo "$tag_data" | jq -r '[.[] | select(.name | contains("reF1nd") and test("alpha|beta|rc"))][0].name' | sed 's/^v//' 2>/dev/null || true)
                else
                  ver=$(echo "$tag_data" | jq -r '[.[] | select(.name | contains("reF1nd") and (test("alpha|beta|rc") | not))][0].name' | sed 's/^v//' 2>/dev/null || true)
                fi
              else
                if [[ "$branch" == *"testing"* ]]; then
                  ver=$(echo "$release_data" | jq -r '[.[] | select(.tag_name | test("alpha|beta|rc"))][0].tag_name' | sed 's/^v//' 2>/dev/null || true)
                else
                  ver=$(echo "$release_data" | jq -r '[.[] | select(.tag_name | (test("alpha|beta|rc") | not))][0].tag_name' | sed 's/^v//' 2>/dev/null || true)
                fi
              fi
              
              if [ -n "$ver" ] && [ "$ver" != "null" ]; then
                local commit_date=$(curl -m ${CURL_TIMEOUT} -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/commits/$branch" | jq -r '.commit.committer.date' 2>/dev/null)
                [ -n "$commit_date" ] && [ "$commit_date" != "null" ] && time=$(date -u -d "$commit_date +8 hours" '+%Y-%m-%d' 2>/dev/null) || time="unknown"
              fi
            fi

            if [ -z "$ver" ] || [ "$ver" = "null" ] || [ -z "$time" ]; then
              echo "::warning::[$id] Cannot read valid version or time via API. Skipping."
              return 0
            fi

            if [[ "$sfa_repo" != "none" ]]; then
              if ! git ls-remote --heads "https://github.com/${sfa_repo}.git" "$sfa_branch" &>/dev/null; then
                echo "::warning::[$id] Android branch $sfa_repo/$sfa_branch not found. Disabling Android."
                sfa_repo="none"
                sfa_branch="none"
              fi
            fi
            
            local display_name="$id"
            local marker="$display_name|$ver|$time"
            local branch_url="https://github.com/$repo/tree/$branch"
            
            if [ "$FORCE_BUILD" = "true" ] || [ -n "$OVERRIDE_VERSION" ]; then
              has_update="true"
              echo "- 🔄 強制構建 **[$display_name]($branch_url)** \`v$ver\` ($time)" >> release_notes.txt
              echo "$marker" >> markers.txt
              targets=$(echo "$targets" | jq -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" '. += [{"id": $id, "repo": $repo, "branch": $branch, "sfa_repo": $sfa_repo, "sfa_branch": $sfa_branch, "ver": $ver, "time": $time}]')
            elif ! echo "$current_release" | grep -q "${display_name}.*${ver}.*${time}"; then
              has_update="true"
              echo "- ✨ 更新 **[$display_name]($branch_url)** 至 \`v$ver\`，發佈於 $time" >> release_notes.txt
              echo "$marker" >> markers.txt
              targets=$(echo "$targets" | jq -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" '. += [{"id": $id, "repo": $repo, "branch": $branch, "sfa_repo": $sfa_repo, "sfa_branch": $sfa_branch, "ver": $ver, "time": $time}]')
            fi
          }

          check_branch "SagerNet_Oldstable" "SagerNet/sing-box" "oldstable" "SagerNet/sing-box-for-android" "oldstable"
          check_branch "SagerNet_Stable" "SagerNet/sing-box" "stable" "SagerNet/sing-box-for-android" "stable"
          check_branch "SagerNet_Testing" "SagerNet/sing-box" "testing" "SagerNet/sing-box-for-android" "testing"
          check_branch "reF1nd_Oldstable" "reF1nd/sing-box" "reF1nd-oldstable" "reF1nd/sing-box-for-android" "reF1nd-oldstable"
          check_branch "reF1nd_Stable" "reF1nd/sing-box" "reF1nd-stable" "reF1nd/sing-box-for-android" "reF1nd-stable"
          check_branch "reF1nd_Testing" "reF1nd/sing-box" "reF1nd-testing" "reF1nd/sing-box-for-android" "reF1nd-testing"
          check_branch "PuerNya_Building" "PuerNya/sing-box" "building" "none" "none"

          if [ ! -s release_notes.txt ]; then
            echo "- 📝 自動構建完成（無版本變更檢測）" > release_notes.txt
          fi
          if [ ! -s markers.txt ]; then
            echo "no-updates-$(date +%s)" > markers.txt
          fi

          VALIDATED_MATRIX=$(echo "$targets" | jq -c '[.[] | select(.ver != "" and .ver != null and .time != "" and .time != null)]')
          echo "matrix=${VALIDATED_MATRIX}" >> $GITHUB_OUTPUT
          
          if [ "$VALIDATED_MATRIX" = "[]" ] || [ -z "$VALIDATED_MATRIX" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "has_update=${has_update}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Patch Hashes
        if: steps.check.outputs.has_update == 'true'
        run: |
          set -euo pipefail
          mkdir -p .github
          echo "declare -A EXPECTED_SHA256" > .github/patch_hashes.sh
          
          if echo "${{ steps.check.outputs.matrix }}" | grep -q '"reF1nd"'; then
            BASE_URL="https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box"
            for patch in concurrent_dial make_log_better fix_interrupt_connections; do
              content=$(curl -m ${CURL_TIMEOUT} -sfL "${BASE_URL}/${patch}.patch" || true)
              if [ -n "$content" ]; then
                sha=$(echo "$content" | sha256sum | awk '{print $1}')
                echo "EXPECTED_SHA256[$patch]=\"$sha\"" >> .github/patch_hashes.sh
              fi
            done
          fi

      - name: Upload Metadata
        if: steps.check.outputs.has_update == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workflow-metadata
          path: |
            markers.txt
            release_notes.txt
            .github/patch_hashes.sh

  build_core:
    needs: [init, check]
    timeout-minutes: 30
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        platform:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.platform.goos }}
      GOARCH: ${{ matrix.platform.goarch }}
      GOAMD64: ${{ matrix.platform.goamd64 }}
      GOARM: ${{ matrix.platform.goarm }}
      GOMIPS: ${{ matrix.platform.gomips }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout Core
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.branch }}
          path: sing-box

      - name: Download Metadata
        uses: actions/download-artifact@v8
        with:
          name: workflow-metadata
          path: ./metadata/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.init.outputs.go_version }}
        
      - name: Go Build Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Fix sniff
        if: contains(matrix.target.repo, 'PuerNya')
        run: |
          cd sing-box
          if [ -f "./experimental/clashapi/trafficontrol/tracker.go" ]; then
            grep -q "sniffHosts" ./experimental/clashapi/trafficontrol/tracker.go && sed -i 's/sniffHosts/sniffHost/' ./experimental/clashapi/trafficontrol/tracker.go || true
          fi

      - name: Configure Tags and CGO
        id: env
        run: |
          if [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]]; then
            BASE_TAGS="${{ env.TAGS_REF1ND_BASE }}"
          elif [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            BASE_TAGS="${{ env.TAGS_PUERNYA }}"
          else
            BASE_TAGS="${{ env.TAGS_SAGERNET_BASE }}"
          fi
          
          if [[ "${{ matrix.target.branch }}" == *"testing"* ]] || [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]] || [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            BASE_TAGS="${BASE_TAGS},${{ env.TAGS_NEW }}"
          fi
          FINAL_TAGS="${BASE_TAGS}"
          
          CGO_VAL="0"
          ARCHIVE_SUFFIX=""
          if [ "${{ github.event.inputs.enable_naive }}" = "true" ]; then
            FINAL_TAGS="${FINAL_TAGS},with_naive_outbound"
            if [ "${{ matrix.platform.goos }}" = "windows" ]; then
              FINAL_TAGS="${FINAL_TAGS},with_purego"
            elif [ "${{ matrix.platform.goos }}" = "linux" ]; then
              CGO_VAL="1"
              ARCHIVE_SUFFIX="-glibc"
            fi
          fi
          echo "tags=${FINAL_TAGS}" >> $GITHUB_OUTPUT
          echo "suffix=${ARCHIVE_SUFFIX}" >> $GITHUB_OUTPUT
          echo "cgo_val=${CGO_VAL}" >> $GITHUB_OUTPUT

      - name: Apply patches
        if: contains(matrix.target.repo, 'reF1nd')
        run: |
          set -euo pipefail
          cd sing-box
          source ../metadata/.github/patch_hashes.sh || true
          
          PATCH_FAILED=false
          for patch in concurrent_dial make_log_better fix_interrupt_connections; do
            url="https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/${patch}.patch"
            content=$(curl -m ${CURL_TIMEOUT} -sfL "$url" || echo "")
            if [ -z "$content" ]; then continue; fi
            
            actual_sha=$(echo "$content" | sha256sum | awk '{print $1}')
            expected_sha="${EXPECTED_SHA256[$patch]:-}"
            
            if [ -n "$expected_sha" ] && [ "$actual_sha" = "$expected_sha" ]; then
              echo "$content" | git apply -v --whitespace=fix || PATCH_FAILED=true
            elif [ -z "$expected_sha" ]; then
              echo "$content" | git apply -v --whitespace=fix || PATCH_FAILED=true
            else
              echo "::error::Patch $patch SHA256 mismatch!"
              PATCH_FAILED=true
            fi
          done
          
          if [ "$PATCH_FAILED" = "true" ]; then
            echo "::error::Critical patch failed!"
            exit 1
          fi

      - name: Setup ccache
        if: github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-cgo-${{ matrix.platform.goarch }}

      - name: Cache cronet-go
        if: github.event.inputs.enable_naive == 'true'
        uses: actions/cache@v5
        with:
          path: ~/cronet-go
          key: cronet-${{ runner.os }}-${{ matrix.platform.goarch }}-${{ hashFiles('sing-box/.github/CRONET_GO_VERSION') }}

      - name: Setup cronet-go
        if: github.event.inputs.enable_naive == 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/cronet-go/.git" ]; then
            rm -rf "$HOME/cronet-go" || true
            CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION 2>/dev/null || echo "main")
            git init "$HOME/cronet-go"
            git -C "$HOME/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "$HOME/cronet-go" fetch --depth=1 origin "$CRONET_GO_VERSION"
            git -C "$HOME/cronet-go" checkout FETCH_HEAD
          fi
          
          TARGET="${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}"
          [ -n "${{ matrix.platform.goamd64 }}" ] && TARGET="${TARGET}/${{ matrix.platform.goamd64 }}"
          
          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            git -C "$HOME/cronet-go" submodule update --init --recursive --depth=1 2>/dev/null || true
            rm -f "$HOME/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg" 2>/dev/null || true
            cd "$HOME/cronet-go"
            GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh 2>/dev/null || true
            go run ./cmd/build-naive --target="$TARGET" download-toolchain || exit 1
            go run ./cmd/build-naive --target="$TARGET" env >> $GITHUB_ENV
          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            cd "$HOME/cronet-go"
            CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target="windows/${{ matrix.platform.goarch }}" -o "$GITHUB_WORKSPACE/sing-box/dist" || exit 1
          fi

      - name: Build Core
        env:
          CGO_ENABLED: ${{ steps.env.outputs.cgo_val || '0' }}
        run: |
          set -euo pipefail
          cd sing-box
          mkdir -p dist
          cp LICENSE dist/ 2>/dev/null || true
          go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }}' -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" -tags "${{ steps.env.outputs.tags }}" -o "dist/sing-box" ./cmd/sing-box
          
          if [ ! -f "dist/sing-box" ] && [ ! -f "dist/sing-box.exe" ]; then
            echo "::error::Build failed - no output file found"
            exit 1
          fi

      - name: Verify Binary Integrity
        run: |
          set -euo pipefail
          cd sing-box/dist || exit 1
          BIN_NAME="sing-box"
          [ "${{ matrix.platform.goos }}" = "windows" ] && BIN_NAME="sing-box.exe"
          
          if [ ! -f "$BIN_NAME" ]; then exit 1; fi
          chmod +x "$BIN_NAME" 2>/dev/null || true
          
          BIN_SIZE=$(stat -c%s "$BIN_NAME" 2>/dev/null || stat -f%z "$BIN_NAME" 2>/dev/null || echo 0)
          if [ "$BIN_SIZE" -lt 1000000 ]; then exit 1; fi
          
          if [ "${{ matrix.platform.goos }}" = "linux" ] && [ "${{ matrix.platform.goarch }}" = "amd64" ]; then
            ./"$BIN_NAME" version || exit 1
          fi

      - name: Generate Core Build Summary
        if: always()
        run: |
          echo "### Core Build Matrix" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.target.id }} | ${{ matrix.platform.name }} | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Core
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: sing-box/dist/*

  build_android:
    needs: [init, check]
    timeout-minutes: 45
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != '' &&
      needs.init.outputs.android_secrets_valid == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        android_arch:
          - { GOARCH: arm64, ABI: arm64-v8a }
    runs-on: ubuntu-latest
    steps:
      - name: Check if SFA branch exists
        id: sfa_check
        run: |
          if [ "${{ matrix.target.sfa_repo }}" != "none" ] && git ls-remote --heads https://github.com/${{ matrix.target.sfa_repo }}.git ${{ matrix.target.sfa_branch }} | grep -q ${{ matrix.target.sfa_branch }}; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Core
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.branch }}
          path: sing-box

      - name: Checkout SFA
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.target.sfa_repo }}
          ref: ${{ matrix.target.sfa_branch }}
          path: sing-box-for-android

      - name: Setup Go
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.init.outputs.go_version }}
          
      - name: Go Build Cache
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-android-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-android-

      - name: Setup Android NDK
        if: steps.sfa_check.outputs.exists == 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Verify NDK
        if: steps.sfa_check.outputs.exists == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -f "$ANDROID_NDK_HOME/ndk-build" ]; then
            exit 1
          fi

      - name: Setup OpenJDK
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Custom Gradle Cache
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sing-box-for-android/**/*.gradle*', 'sing-box-for-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Calculate Version Code
        if: steps.sfa_check.outputs.exists == 'true'
        id: version_code
        run: VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 )) && echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Streamline "Update" module & Apply Tweaks
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd sing-box-for-android
          
          if [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]]; then
            if [ -f "../.github/patches/streamline-update.patch" ]; then
              git apply ../.github/patches/streamline-update.patch 2>/dev/null || echo "::warning::Streamline patch failed"
            else
              cat << 'EOF' | base64 -d > /tmp/patch.diff
              
EOF
              if [ -s /tmp/patch.diff ]; then
                git apply /tmp/patch.diff 2>/dev/null || echo "::warning::Streamline patch failed"
              fi
              rm -f /tmp/patch.diff
            fi
          fi

          echo "VERSION_CODE=${{ steps.version_code.outputs.code }}" > version.properties
          echo "VERSION_NAME=${{ matrix.target.ver }}" >> version.properties
          echo "GO_VERSION=${{ needs.init.outputs.go_version }}" >> version.properties
          
          GRADLE_FILE="app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/applicationId\s*=\s*".*"/applicationId = "com.android.internal.net"/' "$GRADLE_FILE"
          else
            GRADLE_FILE="app/build.gradle"
            sed -i '/applicationId/s/io\..*/com.android.internal.net/' "$GRADLE_FILE" || true
          fi

          UPDATE_FILE=$(find . -name "GitHubUpdateChecker.kt" -type f 2>/dev/null | head -n 1)
          if [ -n "$UPDATE_FILE" ] && [ -f "$UPDATE_FILE" ]; then
            sed -i "s|reF1nd/sing-box-releases|${{ github.repository }}|g" "$UPDATE_FILE"
            sed -i "s|SagerNet/sing-box|${{ github.repository }}|g" "$UPDATE_FILE"
          fi

      - name: Build libbox.aar
        if: steps.sfa_check.outputs.exists == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          if [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]]; then
            BASE_TAGS="${{ env.TAGS_REF1ND_BASE }}"
          elif [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            BASE_TAGS="${{ env.TAGS_PUERNYA }}"
          else
            BASE_TAGS="${{ env.TAGS_SAGERNET_BASE }}"
          fi
          
          if [[ "${{ matrix.target.branch }}" == *"testing"* ]] || [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]] || [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            BASE_TAGS="${BASE_TAGS},${{ env.TAGS_NEW }}"
          fi
          
          FINAL_TAGS="${BASE_TAGS},${{ env.TAGS_ANDROID_EXTRA }}"
          echo "FINAL_TAGS_EXPORT=${FINAL_TAGS}" >> $GITHUB_ENV
          
          CGO_ENABLED=0 gomobile bind -v -o libbox.aar -target android/${{ matrix.android_arch.GOARCH }} -androidapi 23 -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false -tags="${FINAL_TAGS}" -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" ./experimental/libbox

      - name: Verify libbox.aar
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          if [ ! -f "sing-box/libbox.aar" ]; then
            echo "::error::libbox.aar not found!"
            exit 1
          fi

      - name: Decode Keystore & Build APK
        if: steps.sfa_check.outputs.exists == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          
          if [ -z "${FINAL_TAGS_EXPORT:-}" ]; then
            FINAL_TAGS_EXPORT="unknown"
          fi
          
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > ./sing-box-for-android/app/release.keystore
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/
          
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
          
          mkdir -p ../apks
          find app/build/outputs/apk/other/release -type f -name "*.apk" ! -name "*arm64-v8a*" -delete 2>/dev/null || true
          for file in app/build/outputs/apk/other/release/*.apk; do
            if [ -f "$file" ]; then
              basename_file=$(basename "$file")
              mv -f "$file" "../apks/SFA-${{ matrix.target.id }}-${{ matrix.android_arch.ABI }}-${basename_file}"
              
              jq -n \
                --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg run_id "${{ github.run_id }}" \
                --argjson naive_enabled "${{ github.event.inputs.enable_naive }}" \
                --arg version_code "${{ steps.version_code.outputs.code }}" \
                --arg version_name "${{ matrix.target.ver }}" \
                --arg target_repo "${{ matrix.target.repo }}" \
                --arg branch "${{ matrix.target.branch }}" \
                --arg build_tags "${FINAL_TAGS_EXPORT}" \
                '{version_code: $version_code|tonumber, version_name: $version_name, build_time: $built_at, workflow_run_id: $run_id, naive_enabled: $naive_enabled, target_repo: $target_repo, branch: $branch, build_tags: $build_tags}' \
                > "../apks/SFA-${{ matrix.target.id }}-${{ matrix.android_arch.ABI }}-metadata.json"
            fi
          done

      - name: Verify APK Signature
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$(find $ANDROID_HOME/build-tools -name 'apksigner' -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -f "$APKSIGNER" ]; then exit 1; fi
          for apk in apks/*.apk; do
            if [ -f "$apk" ]; then $APKSIGNER verify -v "$apk" || exit 1; fi
          done

      - name: Upload APK
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.target.id }}-${{ matrix.android_arch.ABI }}
          path: apks/*

  publish:
    needs: [init, check, build_core, build_android]
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.init.result != 'cancelled' &&
      needs.check.result == 'success' &&
      needs.check.result != 'cancelled' &&
      needs.check.outputs.has_update == 'true' &&
      (needs.build_core.result == 'success' || needs.build_android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| init | ${{ needs.init.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| check | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build_core | ${{ needs.build_core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build_android | ${{ needs.build_android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Version**: ${{ needs.init.outputs.go_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force Build**: ${{ github.event.inputs.force_build || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Naive Proxy**: ${{ github.event.inputs.enable_naive || 'false' }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build_core.result }}" = "failure" ]; then
             echo "### ❌ Core Build Failure Detected" >> $GITHUB_STEP_SUMMARY
             echo "Please check individual job logs for \`build_core\` to investigate compilation errors." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Clean temp dir
        run: rm -rf ./tmp/* || true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./tmp/
          merge-multiple: true

      - name: Process, Compress & Package
        run: |
          mkdir -p ./release_files
          
          package_windows() {
            local dir="$1"
            local base="$2"
            mv "$dir"/*sing-box* "sing-box.exe" 2>/dev/null || true
            if [ -f "sing-box.exe" ]; then
              cp "sing-box.exe" "sing-box-original.exe"
              case "$base" in
                *amd64-v3*|*arm64*) upx -9 "sing-box.exe" 2>/dev/null || true ;;
                *amd64-v1*) upx -5 "sing-box.exe" 2>/dev/null || true ;;
              esac
              
              [ -f "$dir/LICENSE" ] && cp "$dir/LICENSE" . 2>/dev/null || true

              if [ -f "$dir/libcronet.dll" ]; then
                mv "$dir/libcronet.dll" .
                zip -q9 "release_files/sing-box-${base}.zip" "sing-box.exe" "libcronet.dll" "LICENSE" 2>/dev/null || true
                zip -q9 "release_files/sing-box-${base}-original.zip" "sing-box-original.exe" "libcronet.dll" "LICENSE" 2>/dev/null || true
                rm -f libcronet.dll
              else
                zip -q9 "release_files/sing-box-${base}.zip" "sing-box.exe" "LICENSE" 2>/dev/null || true
                zip -q9 "release_files/sing-box-${base}-original.zip" "sing-box-original.exe" "LICENSE" 2>/dev/null || true
              fi
              rm -f "sing-box.exe" "sing-box-original.exe" "LICENSE"
            fi
          }
          
          package_linux() {
            local dir="$1"
            local base="$2"
            mv "$dir"/*sing-box* "sing-box" 2>/dev/null || true
            if [ -f "sing-box" ]; then
              chmod +x "sing-box"
              cp "sing-box" "sing-box-original"
              
              if [[ "$base" != *"mips"* ]] && [[ "$base" != *"armv5"* ]] && [[ "$base" != *"armv6"* ]]; then
                case "$base" in
                  *amd64-v3*|*arm64*|*armv7*) upx -9 "sing-box" 2>/dev/null || true ;;
                  *amd64-v1*) upx -5 "sing-box" 2>/dev/null || true ;;
                esac
                
                mkdir -p pkg_dir pkg_orig_dir
                cp "sing-box" pkg_dir/
                cp "sing-box-original" pkg_orig_dir/sing-box
                if [ -f "$dir/LICENSE" ]; then 
                  cp "$dir/LICENSE" pkg_dir/ 2>/dev/null || true
                  cp "$dir/LICENSE" pkg_orig_dir/ 2>/dev/null || true
                fi

                tar --no-same-owner -czf "release_files/sing-box-${base}.tar.gz" -C pkg_dir .
                tar --no-same-owner -czf "release_files/sing-box-${base}-original.tar.gz" -C pkg_orig_dir .
                rm -rf pkg_dir pkg_orig_dir
              else
                mkdir -p pkg_dir
                cp "sing-box" pkg_dir/
                if [ -f "$dir/LICENSE" ]; then cp "$dir/LICENSE" pkg_dir/ 2>/dev/null || true; fi
                tar --no-same-owner -czf "release_files/sing-box-${base}.tar.gz" -C pkg_dir .
                rm -rf pkg_dir
              fi
              rm -f "sing-box" "sing-box-original" "LICENSE"
            fi
          }

          for dir in ./tmp/core-*; do
            if [[ -d "$dir" ]]; then
              base=$(basename "$dir" | sed 's/core-//' | sed 's/-[0-9]*$//')
              if [[ "$base" == *"windows"* ]]; then
                package_windows "$dir" "$base"
              else
                package_linux "$dir" "$base"
              fi
            fi
          done
          
          for dir in ./tmp/apk-*; do
            if [[ -d "$dir" ]]; then mv "$dir"/* release_files/ 2>/dev/null || true; fi
          done

          jq -n \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${{ github.run_id }}" \
            --argjson naive_enabled "${{ github.event.inputs.enable_naive }}" \
            '{built_at: $built_at, run_id: $run_id, naive_enabled: $naive_enabled}' \
            > release_files/build-info.json

          echo -e "# 🚀 sing-box 自動編譯\n\n## 📦 本次更新內容\n" > release_body.txt
          if [ -f "./tmp/workflow-metadata/release_notes.txt" ]; then cat ./tmp/workflow-metadata/release_notes.txt >> release_body.txt; fi
          
          echo "" >> release_body.txt
          echo "### 🔨 構建狀態" >> release_body.txt
          echo "| 目標 | 狀態 |" >> release_body.txt
          echo "|------|------|" >> release_body.txt
          echo "| 核心編譯 (Core) | ${{ needs.build_core.result }} |" >> release_body.txt
          echo "| 安卓編譯 (Android) | ${{ needs.build_android.result }} |" >> release_body.txt
          
          echo "" >> release_body.txt
          echo "### ⏱️ 構建時間統計" >> release_body.txt
          ACTUAL_START="${{ needs.init.outputs.start_time }}"
          if [ -z "$ACTUAL_START" ]; then ACTUAL_START=$(date -u '+%Y-%m-%dT%H:%M:%SZ'); fi
          echo "- **開始時間**: $ACTUAL_START" >> release_body.txt
          END_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "- **結束時間**: $END_TIME" >> release_body.txt
          
          START_EPOCH=$(date -d "$ACTUAL_START" +%s 2>/dev/null || date -u -d "$ACTUAL_START" +%s 2>/dev/null || echo "")
          END_EPOCH=$(date -d "$END_TIME" +%s 2>/dev/null || echo "")
          if [ -n "$START_EPOCH" ] && [ -n "$END_EPOCH" ]; then
            DURATION=$((END_EPOCH - START_EPOCH))
            MINUTES=$((DURATION / 60))
            SECONDS=$((DURATION % 60))
            echo "- **總耗時**: ${MINUTES} 分 ${SECONDS} 秒" >> release_body.txt
          fi

      - name: Verify post-UPX integrity
        run: |
          for f in release_files/*.tar.gz; do
            if [ -f "$f" ]; then tar xzf "$f" -O > /dev/null 2>&1 || exit 1; fi
          done

      - name: Check if release files exist
        id: check_files
        run: |
          if ls ./release_files/* >/dev/null 2>&1; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Read release body
        id: body
        if: steps.check_files.outputs.files_exist == 'true'
        run: |
          EOF="RELEASE_BODY_EOF_MARKER"
          echo "content<<$EOF" >> $GITHUB_OUTPUT
          cat release_body.txt >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Upload Release Files for TG
        if: steps.check_files.outputs.files_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ github.run_id }}
          path: ./release_files/*
          retention-days: 1

      - name: Publish Release
        if: steps.check_files.outputs.files_exist == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box
          tag: sing-box
          overwrite: true
          file_glob: true
          file: ./release_files/*
          body: ${{ steps.body.outputs.content }}

      - name: Clean old releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=3
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | \
          tail -n +$((KEEP + 1)) | while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: Delete old workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_RUN="${{ github.run_id }}"
          ALL_RUNS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.id != $CURRENT_RUN) | .id" 2>/dev/null || echo "")
          TOTAL=$(echo "$ALL_RUNS" | grep -c '[0-9]' || echo "0")
          KEEP=5
          if [ "$TOTAL" -gt "$KEEP" ]; then
            echo "$ALL_RUNS" | tail -n +$((KEEP + 1)) | while read run_id; do
              [ -n "$run_id" ] && gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>/dev/null || true
            done
          fi

  telegram_notify:
    needs: [build_core, build_android, publish]
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.enable_telegram == 'true'
    steps:
      - name: Generate Telegram Message
        id: status
        run: |
          TG_STATUS="success"
          declare -a STATUS_LINES
          
          for job in build_core build_android publish; do
            RESULT=""
            if [ "$job" = "build_core" ]; then RESULT="${{ needs.build_core.result }}"
            elif [ "$job" = "build_android" ]; then RESULT="${{ needs.build_android.result }}"
            elif [ "$job" = "publish" ]; then RESULT="${{ needs.publish.result }}"
            fi
            
            case "$RESULT" in
              success) STATUS_LINES+=("✅ ${job}: success") ;;
              failure) TG_STATUS="failed"; STATUS_LINES+=("❌ ${job}: failure") ;;
              skipped) STATUS_LINES+=("⏭️ ${job}: skipped") ;;
              *) STATUS_LINES+=("❓ ${job}: ${RESULT}") ;;
            esac
          done
          
          TG_DETAILS=$(IFS=$'\n'; echo "${STATUS_LINES[*]}")
          
          {
            echo "TG_MESSAGE<<XEOF"
            if [ "$TG_STATUS" = "failed" ]; then
              cat << EOF
          ❌ *sing-box 自動編譯失敗*
          
          *構建詳情：*
          ${TG_DETAILS}
          
          *建議操作：*
          1. 前往 Actions頁面查看日誌
          2. 檢查是否有 GitHub API限流
          3. 嘗試手動觸發 \`force_build: true\`
          EOF
            else
              cat << EOF
          🚀 *sing-box 自動編譯完成*
          
          已檢測到代碼更新或觸發強制編譯，最新內核與 Android APK 已經打包完畢。
          
          *構建詳情：*
          ${TG_DETAILS}
          
          📥 [點擊前往 GitHub下載全平台文件](https://github.com/${{ github.repository }}/releases/tag/sing-box)
          EOF
            fi
            echo "XEOF"
          } >> "$GITHUB_ENV"
          
          echo "status=$TG_STATUS" >> $GITHUB_OUTPUT

      - name: Download release packages for TG
        if: steps.status.outputs.status == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: release-packages-*
          path: dist
          merge-multiple: true

      - name: Find key files for TG
        if: steps.status.outputs.status == 'success'
        id: find_files
        run: |
          find_latest_file() {
            local pattern=$1
            find dist -type f -name "$pattern" ! -name "*-original*" 2>/dev/null | sort -V | tail -n 1
          }
          
          ANDROID_APK=$(find dist -name "*.apk" -type f 2>/dev/null | head -n 1)
          LINUX_TAR=$(find_latest_file '*linux*amd64*v3*.tar.gz')
          [ -z "$LINUX_TAR" ] && LINUX_TAR=$(find_latest_file '*linux*amd64*v3*glibc*.tar.gz')
          WINDOWS_ZIP=$(find_latest_file '*windows*amd64*v3*.zip')
          
          FILES=""
          [ -n "$ANDROID_APK" ] && FILES="$FILES%0A$ANDROID_APK"
          [ -n "$LINUX_TAR" ] && FILES="$FILES%0A$LINUX_TAR"
          [ -n "$WINDOWS_ZIP" ] && FILES="$FILES%0A$WINDOWS_ZIP"
          echo "upload_files=$FILES" >> $GITHUB_OUTPUT

      - name: Telegram notification
        if: steps.status.outputs.status == 'success' || steps.status.outputs.status == 'failed'
        uses: xz-dev/TelegramFileUploader@v1
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: ${{ env.TG_MESSAGE }}
          files: |
            ${{ steps.find_files.outputs.upload_files }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  update_readme:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean temp dir
        run: rm -rf ./metadata/* || true

      - name: Download Metadata
        uses: actions/download-artifact@v8
        with:
          name: workflow-metadata
          path: ./metadata/

      - name: Generate README
        run: |
          sed -e 's/^ *//' > README.md <<EOF
          # 🚀 sing-box 自動編譯系統
          
          > 自動檢測並編譯 [SagerNet/sing-box](https://github.com/SagerNet/sing-box)、[reF1nd/sing-box](https://github.com/reF1nd/sing-box) 和 [PuerNya/sing-box](https://github.com/PuerNya/sing-box)
          
          ## 📦 最新版本狀態 ($(date '+%Y-%m-%d %H:%M UTC'))
          
          $(cat ./metadata/release_notes.txt 2>/dev/null || echo "暫無更新記錄")
          
          ---
          
          ## 📥 快速安裝 (Linux AMD64)
          
          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/download/sing-box/sing-box-SagerNet_Stable-linux-amd64-v3.tar.gz
          tar -xzf sing-box-SagerNet_Stable-linux-amd64-v3.tar.gz
          chmod +x sing-box
          sudo mv sing-box /usr/local/bin/
          \`\`\`
          
          ## 📦 文件命名規則
          
          - **默認版本** (\`xxx.tar.gz\` / \`xxx.zip\`): UPX壓縮版（體積小）
          - **原始版本** (\`xxx-original.tar.gz\` / \`xxx-original.zip\`): 未壓縮版（兼容性好）
          - MIPS/ARMv5/v6: 僅提供原始版本（UPX不支持這些架構）
          
          ## 🛠️ 支持的版本與特性
          
          | 版本 | 分支 | 平台支持 |
          |------|------|---------|
          | SagerNet OldStable | oldstable | Linux/Windows/Android |
          | SagerNet Stable | stable | Linux/Windows/Android |
          | SagerNet Testing | testing | Linux/Windows/Android |
          | reF1nd OldStable | reF1nd-oldstable | Linux/Windows/Android |
          | reF1nd Stable | reF1nd-stable | Linux/Windows/Android |
          | reF1nd Testing | reF1nd-testing | Linux/Windows/Android |
          | PuerNya Building | building | Linux/Windows |
          
          ## 🔔 Telegram 通知配置
          若需啟用 Telegram 推送，請在倉庫 Secrets 中配置：
          - \`TELEGRAM_BOT_TOKEN\`, \`CHAT_ID\`, \`API_ID\`, \`API_HASH\`
          
          [🔗 前往 Releases 下載](https://github.com/${{ github.repository }}/releases/tag/sing-box)
          EOF

      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update README with latest build info" && git push

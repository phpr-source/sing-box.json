name: Build sing-box Core & SFA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target version (Select "all" for forced full sync)'
        type: choice
        options: ['all', 'reF1nd-Testing', 'reF1nd-Stable', 'Official-Alpha', 'Official-Stable']
        default: 'all'
  schedule:
    - cron: '0 */4 * * *'
  repository_dispatch:
    types: [upstream_sync]

env:
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check_updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
      has_builds: ${{ steps.set_matrix.outputs.has_builds }}
      core_targets: ${{ steps.set_matrix.outputs.core_targets }}
      sfa_sha: ${{ steps.fetch_deps.outputs.sfa_sha }}
      geoip_tag: ${{ steps.fetch_deps.outputs.geoip_tag }}
      geosite_tag: ${{ steps.fetch_deps.outputs.geosite_tag }}
      meta_sha: ${{ steps.fetch_deps.outputs.meta_sha }}
      yacd_sha: ${{ steps.fetch_deps.outputs.yacd_sha }}
    steps:
      - name: Fetch External Dependencies
        id: fetch_deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local attempt=1 max_attempts=3 out
            while [ "$attempt" -le "$max_attempts" ]; do
              if out="$("$@")"; then
                printf '%s' "$out"
                return 0
              fi
              echo "::warning::Command failed: $* . Retrying ($attempt/$max_attempts)..."
              sleep 3
              attempt=$((attempt + 1))
            done
            return 1
          }

          git_head() {
            git ls-remote "$1" "$2" | awk 'NR==1{print $1}'
          }

          latest_tag() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$1" | jq -r '.tag_name // empty'
          }

          SFA_SHA="$(fetch_with_retry git_head https://github.com/SagerNet/sing-box-for-android.git refs/heads/main)"
          [ -z "$SFA_SHA" ] && SFA_SHA="$(fetch_with_retry git_head https://github.com/SagerNet/sing-box-for-android.git refs/heads/master)"

          GEOIP_TAG="$(fetch_with_retry latest_tag https://api.github.com/repos/SagerNet/sing-geoip/releases/latest)"
          GEOSITE_TAG="$(fetch_with_retry latest_tag https://api.github.com/repos/SagerNet/sing-geosite/releases/latest)"
          META_SHA="$(fetch_with_retry git_head https://github.com/MetaCubeX/metacubexd.git refs/heads/gh-pages)"
          YACD_SHA="$(fetch_with_retry git_head https://github.com/haishanh/yacd.git refs/heads/gh-pages)"

          for var in SFA_SHA GEOIP_TAG GEOSITE_TAG META_SHA YACD_SHA; do
            if [ -z "${!var}" ] || [ "${!var}" = "null" ]; then
              echo "::error::Failed to fetch dependency: $var"
              exit 1
            fi
          done

          echo "sfa_sha=$SFA_SHA" >> "$GITHUB_OUTPUT"
          echo "geoip_tag=$GEOIP_TAG" >> "$GITHUB_OUTPUT"
          echo "geosite_tag=$GEOSITE_TAG" >> "$GITHUB_OUTPUT"
          echo "meta_sha=$META_SHA" >> "$GITHUB_OUTPUT"
          echo "yacd_sha=$YACD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determine Build Matrix & Targets
        id: set_matrix
        env:
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ github.event.inputs.branch }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch || '' }}
          SFA_SHA: ${{ steps.fetch_deps.outputs.sfa_sha }}
          GEOIP_TAG: ${{ steps.fetch_deps.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ steps.fetch_deps.outputs.geosite_tag }}
          META_SHA: ${{ steps.fetch_deps.outputs.meta_sha }}
          YACD_SHA: ${{ steps.fetch_deps.outputs.yacd_sha }}
        shell: bash
        run: |
          set -euo pipefail

          CORE_TARGETS_JSON='[{"os":"linux","arch":"amd64","amd":"v3","flavor":"full","upx":false},{"os":"linux","arch":"amd64","flavor":"full","upx":false},{"os":"linux","arch":"arm64","flavor":"full","upx":false},{"os":"linux","arch":"arm","arm":"7","flavor":"full","upx":true},{"os":"linux","arch":"arm","arm":"7","flavor":"lite","upx":true},{"os":"linux","arch":"arm","arm":"5","flavor":"lite","upx":true},{"os":"linux","arch":"mipsle","flavor":"lite","upx":true},{"os":"linux","arch":"mipsle","mips":"softfloat","flavor":"lite","upx":true},{"os":"windows","arch":"amd64","amd":"v3","flavor":"full","upx":false},{"os":"darwin","arch":"amd64","flavor":"full","upx":false},{"os":"darwin","arch":"arm64","flavor":"full","upx":false}]'

          TARGETS=(
            "reF1nd/sing-box|reF1nd-testing|reF1nd-Testing|true"
            "reF1nd/sing-box|reF1nd-stable|reF1nd-Stable|false"
            "SagerNet/sing-box|testing|Official-Alpha|true"
            "SagerNet/sing-box|stable|Official-Stable|false"
          )

          JSON="[]"
          HAS="false"

          for e in "${TARGETS[@]}"; do
            IFS='|' read -r REPO BR TIT ROLLING <<< "$e"

            if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_BRANCH" != "all" ] && [ "$IN_BRANCH" != "$TIT" ]; then
              continue
            fi

            if [ "$EVENT" = "repository_dispatch" ] && [ -n "$PAYLOAD_BRANCH" ]; then
              if [ "$PAYLOAD_BRANCH" != "$BR" ] && [ "$PAYLOAD_BRANCH" != "$TIT" ]; then
                continue
              fi
            fi

            RESOLVED_BR="$BR"
            SHA=""

            for search_br in "$BR" "testing" "stable" "oldstable" "main"; do
              SHA="$(git ls-remote "https://github.com/${REPO}.git" "refs/heads/$search_br" | awk 'NR==1{print $1}')"
              if [ -n "$SHA" ]; then
                if [ "$search_br" != "$BR" ]; then
                  echo "::warning::Branch '$BR' not found in $REPO. Fallback branch used: '$search_br'."
                  RESOLVED_BR="$search_br"
                fi
                break
              fi
            done

            if [ -z "$SHA" ]; then
              SHA="$(git ls-remote "https://github.com/${REPO}.git" HEAD | awk 'NR==1{print $1}')"
            fi

            if [ -z "$SHA" ]; then
              echo "::error::Could not resolve a valid commit for $REPO"
              exit 1
            fi

            SHORT_SHA="${SHA:0:7}"

            TMPDIR="$(mktemp -d)"
            git clone --bare --filter=blob:none "https://github.com/${REPO}.git" "$TMPDIR" >/dev/null 2>&1 || true
            APP_VER="$(git --git-dir="$TMPDIR" describe --tags --abbrev=0 "$SHA" 2>/dev/null | sed 's/^v//' || true)"
            rm -rf "$TMPDIR"

            [ -z "$APP_VER" ] && APP_VER="$SHORT_SHA"

            BUILD_VER="$SHA"
            DISPLAY_VER="$APP_VER"

            if [ "$ROLLING" = "false" ]; then
              CHK_TAG="v${DISPLAY_VER}-${TIT}"
              IS_ROLLING=false
            else
              CHK_TAG="${TIT}"
              IS_ROLLING=true
            fi

            OLD_META_DIR="$(mktemp -d)"
            OLD_META='{}'
            if gh release download "$CHK_TAG" --pattern metadata.json --repo "${{ github.repository }}" --dir "$OLD_META_DIR" >/dev/null 2>&1; then
              if [ -f "$OLD_META_DIR/metadata.json" ]; then
                OLD_META="$(cat "$OLD_META_DIR/metadata.json")"
              fi
            fi
            rm -rf "$OLD_META_DIR"

            L_SHA="$(echo "$OLD_META" | jq -r '.sha // "none"')"
            L_SFA="$(echo "$OLD_META" | jq -r '.sfa_sha // "none"')"
            L_GEOIP="$(echo "$OLD_META" | jq -r '.geoip_tag // "none"')"
            L_GEOSITE="$(echo "$OLD_META" | jq -r '.geosite_tag // "none"')"
            L_META="$(echo "$OLD_META" | jq -r '.meta_sha // "none"')"
            L_YACD="$(echo "$OLD_META" | jq -r '.yacd_sha // "none"')"

            NEEDS_UPDATE="false"
            UPDATE_REASON=""

            if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_BRANCH" = "all" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Forced Full Sync"
            elif [ "$L_SHA" = "none" ] || [ -z "$L_SHA" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Initial Release"
            elif [ "$SHA" != "$L_SHA" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Core Updates"
            elif [ "$SFA_SHA" != "$L_SFA" ] || [ "$GEOIP_TAG" != "$L_GEOIP" ] || [ "$GEOSITE_TAG" != "$L_GEOSITE" ] || [ "$META_SHA" != "$L_META" ] || [ "$YACD_SHA" != "$L_YACD" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Dependency Updates"
            fi

            if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_BRANCH" != "all" ]; then
              NEEDS_UPDATE="true"
              UPDATE_REASON="Manual Branch Sync"
            fi

            if [ "$NEEDS_UPDATE" = "true" ]; then
              JSON="$(echo "$JSON" | jq -c \
                --arg repo "$REPO" \
                --arg branch "$RESOLVED_BR" \
                --arg title "$TIT" \
                --argjson rolling "$IS_ROLLING" \
                --arg sha "$SHA" \
                --arg local_sha "$L_SHA" \
                --arg short_sha "$SHORT_SHA" \
                --arg build_ver "$BUILD_VER" \
                --arg display_ver "$DISPLAY_VER" \
                --arg tag "$CHK_TAG" \
                --arg reason "$UPDATE_REASON" \
                '. += [{"repo": $repo, "branch": $branch, "title": $title, "rolling": $rolling, "sha": $sha, "local_sha": $local_sha, "short_sha": $short_sha, "build_ver": $build_ver, "display_ver": $display_ver, "tag": $tag, "reason": $reason}]')"
              HAS="true"
            fi
          done

          echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"
          echo "has_builds=$HAS" >> "$GITHUB_OUTPUT"
          echo "core_targets=$CORE_TARGETS_JSON" >> "$GITHUB_OUTPUT"

  build_core:
    needs: check_updates
    if: needs.check_updates.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.check_updates.outputs.matrix).include }}
        target: ${{ fromJson(needs.check_updates.outputs.core_targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - uses: crazy-max/ghaction-upx@v3
        if: matrix.target.upx == true
        with:
          install-only: true

      - name: Compute Artifact Name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          [ -n "${{ matrix.target.amd || '' }}" ] && suffix="${suffix}${{ matrix.target.amd }}"
          [ -n "${{ matrix.target.arm || '' }}" ] && suffix="${suffix}v${{ matrix.target.arm }}"
          [ -n "${{ matrix.target.mips || '' }}" ] && suffix="${suffix}-${{ matrix.target.mips }}"
          echo "artifact_name=bin-${{ matrix.branch_info.title }}-core-${{ matrix.target.os }}-${{ matrix.target.arch }}${suffix}-${{ matrix.target.flavor }}" >> "$GITHUB_OUTPUT"

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          export GOOS="${{ matrix.target.os }}"
          export GOARCH="${{ matrix.target.arch }}"
          export CGO_ENABLED=0

          if [ -n "${{ matrix.target.amd || '' }}" ]; then export GOAMD64="${{ matrix.target.amd }}"; fi
          if [ -n "${{ matrix.target.arm || '' }}" ]; then export GOARM="${{ matrix.target.arm }}"; fi
          if [ -n "${{ matrix.target.mips || '' }}" ]; then export GOMIPS="${{ matrix.target.mips }}"; fi

          TAGS="with_quic,with_utls,with_clash_api"
          [ "${{ matrix.target.flavor }}" != "lite" ] && TAGS="${TAGS},with_gvisor,with_acme,with_v2ray_api,with_wireguard"

          BIN="sing-box"
          [ "${{ matrix.target.os }}" = "windows" ] && BIN="sing-box.exe"

          if [ -z "${{ matrix.branch_info.display_ver }}" ] || [ -z "${{ matrix.branch_info.short_sha }}" ]; then
            echo "::error::Missing version metadata."
            exit 1
          fi

          if [ "${{ matrix.branch_info.display_ver }}" = "${{ matrix.branch_info.short_sha }}" ]; then
            VERSION_LDFLAG="${{ matrix.branch_info.display_ver }}"
          else
            VERSION_LDFLAG="${{ matrix.branch_info.display_ver }}-${{ matrix.branch_info.short_sha }}"
          fi

          LDFLAGS="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=$VERSION_LDFLAG"

          go build -trimpath -ldflags "$LDFLAGS" -tags "$TAGS" -o "$BIN" ./cmd/sing-box
          chmod +x "$BIN"

          mkdir -p output
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            zip -9 -j -q "output/${{ steps.meta.outputs.artifact_name }}.zip" "$BIN"
          else
            tar -czf "output/${{ steps.meta.outputs.artifact_name }}.tar.gz" "$BIN"
          fi

          if [ "${{ matrix.target.upx }}" = "true" ]; then
            upx --lzma --best "$BIN" || true
            cp "$BIN" "output/${{ steps.meta.outputs.artifact_name }}-upx"
          fi

          touch "output/SUCCESS-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.amd || '' }}${{ matrix.target.arm != '' && format('v{0}', matrix.target.arm) || '' }}${{ matrix.target.mips != '' && format('-{0}', matrix.target.mips) || '' }}-${{ matrix.target.flavor }}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'output/*'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: output/*
          if-no-files-found: error

  build_android:
    needs: check_updates
    if: needs.check_updates.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.check_updates.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.sha }}
          fetch-depth: 0
          path: sing-box

      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ needs.check_updates.outputs.sfa_sha }}
          fetch-depth: 0
          path: sfa
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Prepare Android Environment
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK_ROOT" ] || [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "::error::Android SDK not found on runner."
            exit 1
          fi

          NDK_VERSION="$(grep -hE '(ndkVersion|ndk[[:space:]]*=)' $(find sfa -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'libs.versions.toml' \)) 2>/dev/null | head -n 1 | sed -E "s/.*[\"']([^\"']+)[\"'].*/\1/" | tr -d '\r' || true)"
          [ -z "$NDK_VERSION" ] && NDK_VERSION="26.3.11579264"

          echo "::info::Using NDK version: $NDK_VERSION"

          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" ]; then
            SDK_MGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            [ ! -x "$SDK_MGR" ] && SDK_MGR="$(command -v sdkmanager || true)"
            if [ -n "${SDK_MGR:-}" ] && [ -x "$SDK_MGR" ]; then
              yes | "$SDK_MGR" "ndk;$NDK_VERSION" >/dev/null 2>&1 || true
            fi
          fi

          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "::error::NDK install failed for version $NDK_VERSION."
            exit 1
          fi

          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nANDROID_NDK_HOME=%s\n' \
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" "$ANDROID_SDK_ROOT" "$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      # 階段一：強制使用 Java 17，專心編譯 Go 源碼產出 libbox.aar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Phase 1 - Build Android AAR (libbox)
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          export PATH="$PATH:$(go env GOPATH)/bin"

          cd sing-box
          make lib_install
          make lib_android

          AAR_FILE="$(find . -type f -name '*.aar' | sort -r | head -n 1 || true)"
          if [ -z "$AAR_FILE" ] || [ ! -f "$AAR_FILE" ]; then
            echo "::error::AAR generation failed."
            exit 1
          fi

          mkdir -p ../sfa/app/libs
          cp "$AAR_FILE" ../sfa/app/libs/libbox.aar
          cd ..

          # 🔥 物理隔離大法：徹底抹除源碼！防止稍後 Gradle 自作主張觸發重新編譯
          echo "::info::Purging sing-box source to isolate Gradle build..."
          rm -rf sing-box

          # 🔥 依賴綁定大法：修改 SFA，強制它讀取剛剛生成的本地 AAR，而不是遠端舊包
          cd sfa
          sed -i 's/libs\.libbox/files("libs\/libbox.aar")/g' app/build.gradle.kts || true

      # 階段二：強制切換為 Java 21，使用極度乾淨的內存環境專心打包 APK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Phase 2 - Build Android APK (SFA)
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASS: ${{ secrets.KEY_PASS || 'password' }}
        shell: bash
        run: |
          set -euo pipefail

          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"

          cd sfa
          chmod +x ./gradlew

          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_HOME" "$ANDROID_NDK_HOME" > local.properties

          # 優化 JVM 參數以防止 Daemon 內存崩潰
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
            echo "org.gradle.caching=false"
            echo "org.gradle.configuration-cache=false"
            echo "kotlin.daemon.jvmargs=-Xmx1g -Djava.awt.headless=true"
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
            echo "org.gradle.daemon=false"
          } >> gradle.properties

          mkdir -p ../output

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is empty, generating a temporary keystore."
            keytool -genkeypair -v \
              -keystore ci-release.jks \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=sing-box,O=CI,C=US"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ci-release.jks
          fi

          BUILD_TASK=""
          for task in assemblePlayRelease assembleRelease assembleFossRelease assembleFdroidRelease; do
            if ./gradlew help --task "$task" >/dev/null 2>&1; then
              BUILD_TASK=":app:$task"
              break
            fi
          done

          if [ -z "$BUILD_TASK" ]; then
            echo "::error::No supported APK assemble task found."
            ./gradlew tasks --all || true
            exit 1
          fi

          run_gradle() {
            ./gradlew clean "$BUILD_TASK" \
              --no-daemon \
              --stacktrace \
              --info \
              --no-build-cache \
              --refresh-dependencies \
              -x lint \
              -Pandroid.injected.signing.store.file="$(pwd)/ci-release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tee gradle-build.log
          }

          if ! run_gradle; then
            echo "::warning::Gradle build failed. Purging cache and retrying once."
            ./gradlew --stop || true
            rm -rf "$GRADLE_USER_HOME/caches" "$GRADLE_USER_HOME/daemon" "$GRADLE_USER_HOME/native"
            if ! run_gradle; then
              tail -n 200 gradle-build.log || true
              cp gradle-build.log ../output/gradle-build-error.log || true
              echo "::error::SFA APK Compilation failed."
              exit 1
            fi
          fi

          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1 || true)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::APK generation failed."
            exit 1
          fi

          APK_NAME="SFA-${{ matrix.branch_info.display_ver }}-${{ matrix.branch_info.title }}-universal.apk"
          cp "$APK_PATH" "../output/$APK_NAME"
          echo "APK_NAME=$APK_NAME" > ../output/apk_meta.env
          echo "APK_STATUS=success" >> ../output/apk_meta.env

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bin-${{ matrix.branch_info.title }}-android-apk
          path: output/*
          if-no-files-found: ignore

  release:
    needs: [check_updates, build_core, build_android]
    if: always() && needs.check_updates.outputs.has_builds == 'true' && needs.check_updates.result == 'success' && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.check_updates.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.sha }}
          fetch-depth: 0

      - name: Pre-flight Artifact Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          COUNT="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" | jq '.total_count // 0')"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No artifacts found for this run."
            exit 1
          fi

      - name: Generate Smart Changelog
        env:
          SFA_SHA: ${{ needs.check_updates.outputs.sfa_sha }}
          GEOIP_TAG: ${{ needs.check_updates.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.check_updates.outputs.geosite_tag }}
          META_SHA: ${{ needs.check_updates.outputs.meta_sha }}
          YACD_SHA: ${{ needs.check_updates.outputs.yacd_sha }}
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_SHA="${{ matrix.branch_info.local_sha }}"
          LOG_RAW=""

          if [ "$LOCAL_SHA" != "none" ] && [ -n "$LOCAL_SHA" ]; then
            LOG_RAW="$(git log --pretty=format:"- %s (%h)" "${LOCAL_SHA}..${{ matrix.branch_info.sha }}" 2>/dev/null || true)"
          fi

          if [ -z "$LOG_RAW" ]; then
            LOG_RAW="$(git log --pretty=format:"- %s (%h)" -n 15 "${{ matrix.branch_info.sha }}" 2>/dev/null || true)"
          fi

          OLD_META_DIR="$(mktemp -d)"
          OLD_META='{}'
          if gh release download "${{ matrix.branch_info.tag }}" --pattern metadata.json --repo "${{ github.repository }}" --dir "$OLD_META_DIR" >/dev/null 2>&1; then
            if [ -f "$OLD_META_DIR/metadata.json" ]; then
              OLD_META="$(cat "$OLD_META_DIR/metadata.json")"
            fi
          fi
          rm -rf "$OLD_META_DIR"

          L_SFA="$(echo "$OLD_META" | jq -r '.sfa_sha // "none"')"
          L_GEOIP="$(echo "$OLD_META" | jq -r '.geoip_tag // "none"')"
          L_GEOSITE="$(echo "$OLD_META" | jq -r '.geosite_tag // "none"')"
          L_META="$(echo "$OLD_META" | jq -r '.meta_sha // "none"')"
          L_YACD="$(echo "$OLD_META" | jq -r '.yacd_sha // "none"')"

          DEP_CHANGES=""
          [ "$L_SFA" != "none" ] && [ "$L_SFA" != "$SFA_SHA" ] && DEP_CHANGES="${DEP_CHANGES}\n- ⬆️ **SFA Android**: \`$L_SFA\` -> \`${SFA_SHA:0:7}\`"
          [ "$L_GEOIP" != "none" ] && [ "$L_GEOIP" != "$GEOIP_TAG" ] && DEP_CHANGES="${DEP_CHANGES}\n- 🌍 **GeoIP**: \`$L_GEOIP\` -> \`$GEOIP_TAG\`"
          [ "$L_GEOSITE" != "none" ] && [ "$L_GEOSITE" != "$GEOSITE_TAG" ] && DEP_CHANGES="${DEP_CHANGES}\n- 🌍 **Geosite**: \`$L_GEOSITE\` -> \`$GEOSITE_TAG\`"
          [ "$L_META" != "none" ] && [ "$L_META" != "$META_SHA" ] && DEP_CHANGES="${DEP_CHANGES}\n- 🖥️ **Metacubexd**: \`${L_META:0:7}\` -> \`${META_SHA:0:7}\`"
          [ "$L_YACD" != "none" ] && [ "$L_YACD" != "$YACD_SHA" ] && DEP_CHANGES="${DEP_CHANGES}\n- 🖥️ **YACD**: \`${L_YACD:0:7}\` -> \`${YACD_SHA:0:7}\`"

          {
            echo "CHANGELOG<<EOF"
            echo "### 🚦 Build Reason"
            echo "- **Triggered by**: ${{ matrix.branch_info.reason }}"
            echo ""
            if [ -n "$DEP_CHANGES" ]; then
              echo "### 📦 Dependency Updates"
              printf '%b\n' "$DEP_CHANGES"
              echo ""
            fi
            echo "### 🔄 Core Commits"
            if [ -n "$LOG_RAW" ]; then
              printf '%s\n' "$LOG_RAW" | grep -v "Merge pull request" || true
            else
              echo "- No new core commits."
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.branch_info.title }}-*
          merge-multiple: true
          path: release_assets

      - name: Prepare Assets & Generate Traceability
        env:
          SFA_SHA: ${{ needs.check_updates.outputs.sfa_sha }}
          GEOIP_TAG: ${{ needs.check_updates.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.check_updates.outputs.geosite_tag }}
          META_SHA: ${{ needs.check_updates.outputs.meta_sha }}
          YACD_SHA: ${{ needs.check_updates.outputs.yacd_sha }}
          EVENT_NAME: ${{ github.event_name }}
          CORE_TARGETS_JSON: ${{ needs.check_updates.outputs.core_targets }}
        shell: bash
        run: |
          set -euo pipefail
          cd release_assets

          if [ -f "apk_meta.env" ]; then
            source apk_meta.env
          else
            APK_STATUS="failed"
            echo "::warning::apk_meta.env missing. Android build failed or was skipped."
          fi
          echo "APK_STATUS=$APK_STATUS" >> "$GITHUB_ENV"

          SUCCESS_LIST=""
          FAILED_LIST=""

          while read -r target_encoded; do
            ITEM="$(echo "$target_encoded" | base64 --decode)"
            OS="$(echo "$ITEM" | jq -r '.os')"
            ARCH="$(echo "$ITEM" | jq -r '.arch')"
            AMD="$(echo "$ITEM" | jq -r '.amd // empty')"
            ARM="$(echo "$ITEM" | jq -r '.arm // empty')"
            MIPS="$(echo "$ITEM" | jq -r '.mips // empty')"
            FLAVOR="$(echo "$ITEM" | jq -r '.flavor')"

            SUF=""
            [ -n "$AMD" ] && SUF="$SUF$AMD"
            [ -n "$ARM" ] && SUF="$SUFv$ARM"
            [ -n "$MIPS" ] && SUF="$SUF-$MIPS"

            IDENTIFIER="${OS}-${ARCH}${SUF}-${FLAVOR}"

            if [ -f "SUCCESS-$IDENTIFIER" ]; then
              SUCCESS_LIST="${SUCCESS_LIST}\n- ✅ \`$IDENTIFIER\`"
            else
              FAILED_LIST="${FAILED_LIST}\n- ❌ \`$IDENTIFIER\` (Failed or Skipped)"
            fi
          done <<< "$(echo "$CORE_TARGETS_JSON" | jq -r '.[] | @base64')"

          if [ -z "$(printf '%b' "$SUCCESS_LIST" | tr -d '[:space:]')" ]; then
            echo "::error::All core platform builds failed."
            exit 1
          fi

          {
            echo "EXPLICIT_SUCCESS<<EOF"
            printf '%b\n' "$SUCCESS_LIST"
            echo "EOF"
            echo "EXPLICIT_FAILED<<EOF"
            printf '%b\n' "$FAILED_LIST"
            echo "EOF"
          } >> "$GITHUB_ENV"

          rm -f SUCCESS-* apk_meta.env gradle-build-error.log

          mkdir -p Essential-Assets/ui
          echo '{ "log": { "level": "info" }, "inbounds": [{ "type": "mixed", "listen": "127.0.0.1", "listen_port": 2080 }], "outbounds": [{ "type": "selector", "tag": "proxy", "outbounds": ["direct"] }, { "type": "direct", "tag": "direct" }] }' > Essential-Assets/config.json

          fetch_with_retry() {
            local attempt=1 max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then return 0; fi
              echo "::warning::Command failed: $* . Retrying ($attempt/$max_attempts)..."
              sleep 3
              attempt=$((attempt + 1))
            done
            return 1
          }

          safe_download() {
            local url="$1"
            local dest="$2"
            local tmpfile
            tmpfile="$(mktemp)"
            if fetch_with_retry curl -fL -sS -o "$tmpfile" "$url"; then
              mv "$tmpfile" "$dest"
            else
              rm -f "$tmpfile"
              echo "::warning::Download failed: $dest"
            fi
          }

          safe_download "https://github.com/SagerNet/sing-geoip/releases/download/${GEOIP_TAG}/geoip.db" "Essential-Assets/geoip.db" || true
          safe_download "https://github.com/SagerNet/sing-geosite/releases/download/${GEOSITE_TAG}/geosite.db" "Essential-Assets/geosite.db" || true
          safe_download "https://github.com/SagerNet/sing-geosite/releases/download/${GEOSITE_TAG}/geosite-cn.srs" "Essential-Assets/geosite-cn.srs" || true

          rm -rf tmp_meta tmp_yacd metacubexd.zip yacd.zip

          if fetch_with_retry curl -fL -sS -o metacubexd.zip "https://github.com/MetaCubeX/metacubexd/archive/${META_SHA}.zip"; then
            if unzip -q metacubexd.zip -d tmp_meta/; then
              META_DIR="$(find tmp_meta -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
              [ -n "$META_DIR" ] && mv "$META_DIR" Essential-Assets/ui/metacubexd || true
            fi || true
          fi || true

          if fetch_with_retry curl -fL -sS -o yacd.zip "https://github.com/haishanh/yacd/archive/${YACD_SHA}.zip"; then
            if unzip -q yacd.zip -d tmp_yacd/; then
              YACD_DIR="$(find tmp_yacd -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
              [ -n "$YACD_DIR" ] && mv "$YACD_DIR" Essential-Assets/ui/yacd || true
            fi || true
          fi || true

          rm -rf tmp_* *.zip

          zip -9 -r "sing-box-${{ matrix.branch_info.title }}-Essential-Assets.zip" Essential-Assets/ || echo "::warning::Failed to zip Essential-Assets"
          rm -rf Essential-Assets/

          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

          find . -maxdepth 1 -type f \( ! -name 'sha256sums.txt' ! -name 'metadata.json' ! -name 'temp_hashes.txt' \) -print0 | xargs -0 -r sha256sum | sed 's| \./|  |' > temp_hashes.txt
          HASHES_JSON="$(awk '{printf "{\"file\":\"%s\",\"hash\":\"%s\"}\n", $2, $1}' temp_hashes.txt | jq -s -c '.' || echo "[]")"
          [ -z "$HASHES_JSON" ] && HASHES_JSON="[]"

          jq -n \
            --arg repo "${{ matrix.branch_info.repo }}" \
            --arg branch "${{ matrix.branch_info.branch }}" \
            --arg sha "${{ matrix.branch_info.sha }}" \
            --arg build_ver "${{ matrix.branch_info.build_ver }}" \
            --arg display_ver "${{ matrix.branch_info.display_ver }}" \
            --arg build_time "$BUILD_TIME" \
            --arg sfa_sha "$SFA_SHA" \
            --arg geoip_tag "$GEOIP_TAG" \
            --arg geosite_tag "$GEOSITE_TAG" \
            --arg meta_sha "$META_SHA" \
            --arg yacd_sha "$YACD_SHA" \
            --arg trigger "$EVENT_NAME" \
            --arg apk_status "$APK_STATUS" \
            --argjson hashes "$HASHES_JSON" \
            '{repo: $repo, branch: $branch, sha: $sha, build_ver: $build_ver, display_ver: $display_ver, build_time: $build_time, sfa_sha: $sfa_sha, geoip_tag: $geoip_tag, geosite_tag: $geosite_tag, meta_sha: $meta_sha, yacd_sha: $yacd_sha, trigger_event: $trigger, apk_status: $apk_status, artifacts: $hashes}' > metadata.json

          cat temp_hashes.txt > sha256sums.txt
          sha256sum metadata.json >> sha256sums.txt
          rm -f temp_hashes.txt

      - name: Build Release Body
        id: release_meta
        env:
          SFA_SHA: ${{ needs.check_updates.outputs.sfa_sha }}
          GEOIP_TAG: ${{ needs.check_updates.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.check_updates.outputs.geosite_tag }}
          META_SHA: ${{ needs.check_updates.outputs.meta_sha }}
          YACD_SHA: ${{ needs.check_updates.outputs.yacd_sha }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ matrix.branch_info.title }}"
          DISPLAY_VER="${{ matrix.branch_info.display_ver }}"
          REL_NAME="v$DISPLAY_VER | $TITLE"
          [ "${{ matrix.branch_info.rolling }}" = "true" ] && REL_NAME="$TITLE (Rolling) | $DISPLAY_VER"

          {
            echo "## 🚀 sing-box Core ($TITLE)"
            echo "> ⏱️ **Build Time (UTC)**: \`${BUILD_TIME}\`"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "### 📦 產物與容錯狀態清單"
          } > release_body.md

          if [ "${APK_STATUS:-failed}" = "success" ]; then
            echo "- ✅ **Android GUI**: SFA Universal APK 構建成功 (SFA Commit: \`${SFA_SHA:0:7}\`)." >> release_body.md
          else
            echo "- ❌ **Android GUI**: 構建失敗或未產出 APK。" >> release_body.md
          fi

          {
            echo "- ✅ **一體化資源包**:"
            echo "  - *GeoIP*: \`${GEOIP_TAG}\` | *Geosite*: \`${GEOSITE_TAG}\`"
            echo "  - *Metacubexd*: \`${META_SHA:0:7}\` | *YACD*: \`${YACD_SHA:0:7}\`"
            echo ""
            echo "<details open>"
            echo "<summary><b>🚦 Core 平台構建報告</b></summary>"
            echo ""
            echo "**Successful Targets:**"
            printf '%b\n' "$EXPLICIT_SUCCESS"
            echo ""
            echo "**Failed or Skipped Targets:**"
            printf '%b\n' "$EXPLICIT_FAILED"
            echo ""
            echo "</details>"
            echo ""
            echo "> 💡 **聲明**: 本倉庫採容錯策略運行，未列於成功清單的平台即代表本次構建失敗被跳過。請核對 \`sha256sums.txt\` 以確保下載檔案一致性。"
          } >> release_body.md

          echo "REL_NAME=$REL_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ matrix.branch_info.tag }}
          name: ${{ steps.release_meta.outputs.REL_NAME }}
          prerelease: ${{ matrix.branch_info.rolling == true }}
          makeLatest: ${{ matrix.branch_info.rolling == false }}
          artifacts: "release_assets/*"
          bodyFile: release_body.md
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

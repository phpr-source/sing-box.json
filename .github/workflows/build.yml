name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      enable_naive:
        description: "Enable naive outbound (requires cronet)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/**"

env:
  GO_VERSION: "~1.23"
  TAGS_COMMON: "with_gvisor,with_quic,with_dhcp,with_utls,with_wireguard,with_clash_api,with_ech"
  TAGS_ANDROID_EXTRA: "with_conntrack"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_update: ${{ steps.check.outputs.has_update }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check versions and generate matrix
        id: check
        run: |
          targets="[]"
          has_update="false"
          current_release=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')

          check_branch() {
            local id=$1
            local repo=$2
            local branch=$3
            local sfa_repo=$4
            local sfa_branch=$5

            echo "Checking $id ($repo@$branch)..."
            if ! git clone -b "$branch" --depth 1 "https://github.com/$repo.git" "$id" 2>/dev/null; then
              return
            fi

            cd "$id"
            local ver=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag 2>/dev/null || echo "unknown")
            local time=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')
            cd ..
            rm -rf "$id"

            if [ "$ver" = "unknown" ]; then return; fi
            local marker=""
            echo "$marker" >> markers.txt

            if echo "$current_release" | grep -q "$marker"; then
              echo "[$id] Already up to date."
            else
              echo "[$id] Update detected."
              has_update="true"
              targets=$(echo "$targets" | jq --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" \
                '. += [{"id": $id, "repo": $repo, "branch": $branch, "sfa_repo": $sfa_repo, "sfa_branch": $sfa_branch, "ver": $ver, "time": $time}]')
            fi
          }

          check_branch "sager_oldstable" "SagerNet/sing-box" "oldstable" "SagerNet/sing-box-for-android" "oldstable"
          check_branch "sager_stable" "SagerNet/sing-box" "stable" "SagerNet/sing-box-for-android" "stable"
          check_branch "sager_testing" "SagerNet/sing-box" "testing" "SagerNet/sing-box-for-android" "main"
          check_branch "ref1nd_oldstable" "reF1nd/sing-box" "reF1nd-oldstable" "reF1nd/sing-box-for-android" "reF1nd-stable"
          check_branch "ref1nd_stable" "reF1nd/sing-box" "reF1nd-stable" "reF1nd/sing-box-for-android" "reF1nd-stable"
          check_branch "ref1nd_testing" "reF1nd/sing-box" "reF1nd-testing" "reF1nd/sing-box-for-android" "reF1nd-testing"

          echo "matrix=${targets}" >> $GITHUB_OUTPUT
          echo "has_update=${has_update}" >> $GITHUB_OUTPUT

      - name: Upload markers
        if: steps.check.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-markers
          path: markers.txt

  build_core:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        platform:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.platform.goos }}
      GOARCH: ${{ matrix.platform.goarch }}
      GOAMD64: ${{ matrix.platform.goamd64 }}
      GOARM: ${{ matrix.platform.goarm }}
      GOMIPS: ${{ matrix.platform.gomips }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.branch }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Apply patches (reF1nd only)
        if: contains(matrix.target.repo, 'reF1nd')
        run: |
          curl -sfL https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/concurrent_dial.patch | git apply -v || true
          curl -sfL https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/make_log_better.patch | git apply -v || true
          curl -sfL https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/fix_interrupt_connections.patch | git apply -v || true

      - name: Configure Tags
        id: tags
        run: |
          FINAL_TAGS="${{ env.TAGS_COMMON }}"
          if [ "${{ github.event.inputs.enable_naive }}" = "true" ]; then
            FINAL_TAGS="${FINAL_TAGS},with_naive_outbound"
            if [ "${{ matrix.platform.goos }}" = "windows" ]; then
              FINAL_TAGS="${FINAL_TAGS},with_purego"
            fi
          fi
          echo "tags=${FINAL_TAGS}" >> $GITHUB_OUTPUT

      - name: Build Core
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }}' -s -w -buildid=" -tags "${{ steps.tags.outputs.tags }}" ./cmd/sing-box

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target.id }}-${{ matrix.platform.name }}
          path: sing-box*

  build_android:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.branch }}
          path: sing-box

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Check if SFA branch exists
        id: sfa_check
        run: |
          if git ls-remote --heads https://github.com/${{ matrix.target.sfa_repo }}.git ${{ matrix.target.sfa_branch }} | grep -q ${{ matrix.target.sfa_branch }}; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout SFA
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.sfa_repo }}
          ref: ${{ matrix.target.sfa_branch }}
          path: sing-box-for-android

      - name: Setup OpenJDK
        if: steps.sfa_check.outputs.exists == 'true'
        run: sudo apt update && sudo apt install -y openjdk-17-jdk-headless

      - name: Apply SFA Streamline Patch (reF1nd only)
        if: steps.sfa_check.outputs.exists == 'true' && contains(matrix.target.sfa_repo, 'reF1nd')
        run: |
          cd sing-box-for-android
          # 借鑑代碼中的精簡更新模塊補丁
          echo "" | base64 -d > ./streamline-update.patch
          git apply ./streamline-update.patch || true

      - name: Build libbox.aar
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          cd sing-box
          make lib_install
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          FINAL_TAGS="${{ env.TAGS_COMMON }},${{ env.TAGS_ANDROID_EXTRA }}"
          if [ "${{ github.event.inputs.enable_naive }}" = "true" ]; then FINAL_TAGS="${FINAL_TAGS},with_naive_outbound"; fi
          
          gomobile bind -v -o libbox.aar -target android -androidapi 23 -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false -tags="${FINAL_TAGS}" -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Decode Keystore
        if: steps.sfa_check.outputs.exists == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > ./sing-box-for-android/app/release.keystore

      - name: Build and Rename APK
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
          
          mkdir -p ../apks
          for file in app/build/outputs/apk/other/release/*.apk; do
            mv -f "$file" "../apks/SFA-${{ matrix.target.id }}.apk"
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target.id }}
          path: apks/*.apk

  publish:
    needs: [check, build_core, build_android]
    if: always() && needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./tmp/

      - name: Process and Compress
        run: |
          mkdir -p ./release_files
          
          for dir in ./tmp/core-*; do
            if [[ -d "$dir" ]]; then
              base=$(basename "$dir" | sed 's/core-//')
              if [[ "$base" == *"windows"* ]]; then
                mv "$dir"/sing-box* "release_files/sing-box-${base}.exe"
              else
                mv "$dir"/sing-box* "release_files/sing-box-${base}"
                chmod +x "release_files/sing-box-${base}"
                upx --best "release_files/sing-box-${base}" || true
              fi
            fi
          done
          
          for dir in ./tmp/apk-*; do
            if [[ -d "$dir" ]]; then mv "$dir"/*.apk release_files/; fi
          done

          # 整合 markers 創建發布說明
          echo -e "# Sing-Box 自動編譯發布\n" > release_body.txt
          if [ -f "./tmp/update-markers/markers.txt" ]; then
            cat ./tmp/update-markers/markers.txt >> release_body.txt
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sing-box
          name: sing-box
          body_path: release_body.txt
          files: ./release_files/*
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  telegram_notify:
    needs: publish
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.enable_telegram == 'true'
    steps:
      - name: Download artifacts for TG
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Telegram notification
        uses: xz-dev/TelegramFileUploader@v1
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            **sing-box Build Completed**
            更新已檢測並編譯打包完畢。
            [Download Releases](https://github.com/${{ github.repository }}/releases/tag/sing-box)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  update_readme:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v6

      - name: Generate README
        run: |
          cat > README.md <<EOF
          # sing-box 自动编译

          自动检测并编译 [SagerNet/sing-box](https://github.com/SagerNet/sing-box) 和 [reF1nd/sing-box](https://github.com/reF1nd/sing-box) 的多个版本。

          ## 支持平台与特性
          - 架构支持完善 (amd64, arm, mips)
          - SFA Android 客戶端同步編譯
          - 自動動態拉取最新 Tag (取代脆弱的 API 檢測)
          - reF1nd 分支默認合併防中斷與日誌優化補丁

          ## 编译标签
          \`\`\`text
          ${{ env.TAGS_COMMON }}
          \`\`\`

          [前往 Releases 页面下载](https://github.com/${{ github.repository }}/releases/tag/sing-box)
          EOF

      - name: Commit README
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update README" || echo "No changes"
          git push

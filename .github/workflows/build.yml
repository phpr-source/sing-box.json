name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      rebuild_target:
        description: "Rebuild specific target only (leave empty for all)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "SagerNet_Oldstable"
          - "SagerNet_Stable"
          - "SagerNet_Testing"
          - "reF1nd_Oldstable"
          - "reF1nd_Stable"
          - "reF1nd_Testing"
          - "PuerNya_Building"
      build_commit:
        description: "Build specific commit SHA (leave empty for branch HEAD)"
        required: false
        type: string
        default: ""
      skip_version_check:
        description: "Skip version check API calls and build immediately"
        required: false
        type: boolean
        default: false
      force_build:
        description: "Force build all targets (Ignore version match)"
        required: false
        type: boolean
        default: false
      override_version:
        description: "Override version (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      enable_naive:
        description: "Enable naive outbound (Linux/Windows amd64-v3 only)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write
  actions: write
  issues: write
  packages: write
  id-token: write

env:
  TAGS_COMMON: "with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api,with_wireguard,badlinkname,tfogo_checklinkname0"
  TAGS_PUERNYA_EXTRA: "with_shadowsocksr,with_ech"
  TAGS_ANDROID_EXTRA: "with_conntrack"
  CURL_TIMEOUT_API: 60
  CURL_TIMEOUT_FILE: 120
  BASE_TIMESTAMP: 1735689600

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go.outputs.version }}
      start_time: ${{ steps.time.outputs.start }}
      android_secrets_valid: ${{ steps.validate.outputs.android_secrets_valid }}
      version_code: ${{ steps.calc.outputs.code }}
    steps:
      - name: Record Start Time
        id: time
        run: echo "start=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Calculate Android Version Code
        id: calc
        run: echo "code=$(( ($(date +%s) - BASE_TIMESTAMP) / 60 ))" >> $GITHUB_OUTPUT

      - name: Get Go latest version
        id: go
        run: |
          VERSION=$(curl -m ${CURL_TIMEOUT_API} -sSL https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | jq -r '[.[] | select(.version | startswith("1.24") and (test("-") | not))][0].version')
          [ -z "$VERSION" ] && VERSION=$(curl -m ${CURL_TIMEOUT_API} -sSL https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | jq -r '[.[] | select(.version | test("-") | not)][0].version')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Validate Secrets
        id: validate
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          CHAT_ID: ${{ secrets.CHAT_ID || '' }}
          API_ID: ${{ secrets.API_ID || '' }}
          API_HASH: ${{ secrets.API_HASH || '' }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.enable_telegram }}" == "true" ]]; then
            if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$CHAT_ID" || -z "$API_ID" || -z "$API_HASH" ]]; then
              echo "::warning::Telegram secrets missing. Notifications may fail."
            fi
          fi
          
          if [[ -z "$ANDROID_KEYSTORE" || -z "$KEYSTORE_PASS" || -z "$ALIAS_NAME" || -z "$ALIAS_PASS" ]]; then
            echo "::warning::Android Keystore secrets missing."
            echo "android_secrets_valid=false" >> $GITHUB_OUTPUT
          else
            echo "android_secrets_valid=true" >> $GITHUB_OUTPUT
          fi

  puernya_version:
    runs-on: ubuntu-latest
    needs: init
    outputs:
      version: ${{ steps.puernya.outputs.version }}
      time: ${{ steps.puernya.outputs.time }}
    steps:
      - name: Checkout PuerNya
        if: ${{ github.event.inputs.skip_version_check != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: PuerNya/sing-box
          ref: building
          path: puernya-src
          fetch-depth: 0

      - name: Setup Go
        if: ${{ github.event.inputs.skip_version_check != 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}

      - name: Get PuerNya version
        id: puernya
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.skip_version_check }}" = "true" ]; then
            ver="${{ github.event.inputs.override_version }}"
            [ -z "$ver" ] && ver="unknown"
            echo "version=$ver" >> $GITHUB_OUTPUT
            echo "time=$(TZ=Asia/Shanghai date '+%Y-%m-%d')" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          cd puernya-src
          git remote set-url sekai https://github.com/SagerNet/sing-box.git 2>/dev/null || \
          git remote add sekai https://github.com/SagerNet/sing-box.git
          GIT_TERMINAL_PROMPT=0 git fetch --tags --force sekai
          
          ver=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag 2>/dev/null || \
                git describe --tags --abbrev=0 2>/dev/null || \
                git log -1 --format=%h 2>/dev/null || echo "")
          ver=$(echo "$ver" | sed 's/^v//')
          
          if [ -z "$ver" ]; then
            commit=$(git rev-parse HEAD)
            ver="dev-$(echo "$commit" | cut -c1-8)"
          fi
          
          commit_date=$(git log -1 --format=%cd --date=iso-strict 2>/dev/null || echo "")
          if [ -n "$commit_date" ]; then
            time=$(TZ=Asia/Shanghai date -d "$commit_date" '+%Y-%m-%d' 2>/dev/null || TZ=Asia/Shanghai date '+%Y-%m-%d')
          else
            time=$(TZ=Asia/Shanghai date '+%Y-%m-%d')
          fi
          
          echo "version=${ver}" >> $GITHUB_OUTPUT
          echo "time=${time}" >> $GITHUB_OUTPUT

  check:
    needs: [init, puernya_version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_update: ${{ steps.check.outputs.has_update }}
    steps:
      - name: Check versions and generate matrix
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          api_call_with_retry() {
            local url="$1"
            local retry_count=0 max_retries=3
            while [ $retry_count -lt $max_retries ]; do
              http_code=$(curl -m ${CURL_TIMEOUT_API} -sSL -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" "$url" -o /tmp/api_response.json 2>/dev/null)
              if [ "$http_code" = "200" ] && [ -s /tmp/api_response.json ]; then
                if jq empty /tmp/api_response.json >/dev/null 2>&1; then
                  cat /tmp/api_response.json
                  return 0
                fi
              fi
              retry_count=$((retry_count + 1))
              sleep $((2 ** retry_count))
            done
            return 1
          }
          
          MATRIX_JSON="[]"
          FORCE_BUILD="${{ github.event.inputs.force_build || 'false' }}"
          OVERRIDE_VERSION="${{ github.event.inputs.override_version || '' }}"
          TARGET_FILTER="${{ github.event.inputs.rebuild_target || '' }}"
          SKIP_CHECK="${{ github.event.inputs.skip_version_check || 'false' }}"
          
          # 精準讀取 release-info 分支的構建元數據，徹底擺脫 Markdown 解析依賴
          LAST_BUILD_INFO="{}"
          if [ "$SKIP_CHECK" != "true" ]; then
            LAST_BUILD_INFO=$(curl -sSL -m ${CURL_TIMEOUT_API} "https://raw.githubusercontent.com/${{ github.repository }}/release-info/build-info.json" 2>/dev/null || echo "{}")
            if ! echo "$LAST_BUILD_INFO" | jq empty 2>/dev/null; then LAST_BUILD_INFO="{}"; fi
          fi
          
          echo "" > release_notes.txt
          rm -f /tmp/has_update_flag

          check_branch() {
            local id="${1:-}"
            local repo="${2:-}"
            local branch="${3:-}"
            local sfa_repo="${4:-}"
            local sfa_branch="${5:-}"
            
            if [ -n "$TARGET_FILTER" ] && [ "$TARGET_FILTER" != "$id" ]; then
              return 0
            fi
            
            local ver="" time=""
            
            if [ -n "$OVERRIDE_VERSION" ]; then
              ver="${OVERRIDE_VERSION}"
              time="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            elif [ "$SKIP_CHECK" = "true" ]; then
              ver="unknown"
              time="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            elif [[ "$id" == "PuerNya_Building" ]]; then
              ver="${{ needs.puernya_version.outputs.version }}"
              time="${{ needs.puernya_version.outputs.time }}"
            else
              local release_data=$(api_call_with_retry "https://api.github.com/repos/$repo/releases" 2>/dev/null || echo "[]")
              if [[ "$repo" == *"reF1nd"* ]]; then
                local tag_data=$(api_call_with_retry "https://api.github.com/repos/$repo/tags" 2>/dev/null || echo "[]")
                if [[ "$branch" == *"testing"* ]]; then
                  ver=$(echo "$tag_data" | jq -r '[.[] | select(.name | type == "string" and contains("reF1nd") and test("alpha|beta|rc"))][0].name // empty' 2>/dev/null | sed 's/^v//' || true)
                else
                  ver=$(echo "$tag_data" | jq -r '[.[] | select(.name | type == "string" and contains("reF1nd") and (test("alpha|beta|rc") | not))][0].name // empty' 2>/dev/null | sed 's/^v//' || true)
                fi
              else
                if [[ "$branch" == *"testing"* ]]; then
                  ver=$(echo "$release_data" | jq -r '[.[] | select(.tag_name | type == "string" and test("alpha|beta|rc"))][0].tag_name // empty' 2>/dev/null | sed 's/^v//' || true)
                else
                  ver=$(echo "$release_data" | jq -r '[.[] | select(.tag_name | type == "string" and (test("alpha|beta|rc") | not))][0].tag_name // empty' 2>/dev/null | sed 's/^v//' || true)
                fi
              fi
              
              if [ -z "$ver" ] || [ "$ver" = "null" ]; then
                local commit_data=$(api_call_with_retry "https://api.github.com/repos/$repo/commits?sha=$branch&per_page=1" 2>/dev/null || echo "[]")
                ver=$(echo "$commit_data" | jq -r '.[0].sha // empty' 2>/dev/null | cut -c1-8 || true)
              fi
              
              if [ -n "$ver" ] && [ "$ver" != "null" ]; then
                local commit_date=$(api_call_with_retry "https://api.github.com/repos/$repo/commits/$branch" 2>/dev/null | jq -r '.commit.committer.date // empty' 2>/dev/null || echo "")
                if [ -n "$commit_date" ] && [ "$commit_date" != "null" ]; then
                  time=$(TZ=Asia/Shanghai date -d "$commit_date" '+%Y-%m-%d' 2>/dev/null || TZ=Asia/Shanghai date '+%Y-%m-%d')
                else
                  time="unknown"
                fi
              fi
            fi

            if [ -z "$ver" ] || [ "$ver" = "null" ] || [ -z "$time" ]; then
              echo "::warning::[$id] Cannot read valid version or time. Skipping."
              return 0
            fi

            if [[ "$sfa_repo" != "none" ]]; then
              if ! git ls-remote --heads "https://github.com/${sfa_repo}.git" "$sfa_branch" 2>/dev/null | grep -qw "$sfa_branch"; then
                echo "::warning::[$id] Android branch $sfa_repo/$sfa_branch not found. Disabling Android."
                sfa_repo="none"
                sfa_branch="none"
              fi
            fi
            
            local display_name="$id"
            local marker="[${id} v${ver}]"
            local branch_url="https://github.com/$repo/tree/$branch"
            
            # 使用機器讀取的歷史 JSON 比對版本
            LAST_VER=$(echo "$LAST_BUILD_INFO" | jq -r --arg id "$id" '.targets[]? | select(.target_id == $id) | .version_name // empty' 2>/dev/null | head -n 1)
            
            if [ "$FORCE_BUILD" = "true" ] || [ -n "$OVERRIDE_VERSION" ] || [ -n "$TARGET_FILTER" ] || [ "$SKIP_CHECK" = "true" ]; then
              echo "true" > /tmp/has_update_flag
              echo "- 🔄 強制構建 **[$display_name]($branch_url)** \`v$ver\` ($time) $marker" >> release_notes.txt
              MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" '. + [{"id":$id,"repo":$repo,"branch":$branch,"sfa_repo":$sfa_repo,"sfa_branch":$sfa_branch,"ver":$ver,"time":$time}]')
            elif [ "$LAST_VER" != "$ver" ] || [ -z "$LAST_VER" ]; then
              echo "true" > /tmp/has_update_flag
              echo "- ✨ 更新 **[$display_name]($branch_url)** 至 \`v$ver\`，發佈於 $time $marker" >> release_notes.txt
              MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" '. + [{"id":$id,"repo":$repo,"branch":$branch,"sfa_repo":$sfa_repo,"sfa_branch":$sfa_branch,"ver":$ver,"time":$time}]')
            fi
          }

          check_branch "SagerNet_Oldstable" "SagerNet/sing-box" "oldstable" "SagerNet/sing-box-for-android" "oldstable"
          check_branch "SagerNet_Stable" "SagerNet/sing-box" "stable" "SagerNet/sing-box-for-android" "stable"
          check_branch "SagerNet_Testing" "SagerNet/sing-box" "testing" "SagerNet/sing-box-for-android" "testing"
          check_branch "reF1nd_Oldstable" "reF1nd/sing-box" "reF1nd-oldstable" "reF1nd/sing-box-for-android" "reF1nd-oldstable"
          check_branch "reF1nd_Stable" "reF1nd/sing-box" "reF1nd-stable" "reF1nd/sing-box-for-android" "reF1nd-stable"
          check_branch "reF1nd_Testing" "reF1nd/sing-box" "reF1nd-testing" "reF1nd/sing-box-for-android" "reF1nd-testing"
          check_branch "PuerNya_Building" "PuerNya/sing-box" "building" "none" "none"

          sed -i '/^ *$/d' release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "- 📝 自動構建完成（無版本變更檢測）" > release_notes.txt
          fi

          VALIDATED_MATRIX=$(echo "$MATRIX_JSON" | jq -c '[.[] | select((.ver // empty) != "" and (.time // empty) != "")]' 2>/dev/null || echo "[]")
          if [ -z "$VALIDATED_MATRIX" ] || ! echo "$VALIDATED_MATRIX" | jq empty 2>/dev/null; then
            VALIDATED_MATRIX="[]"
          fi
          
          echo "matrix=${VALIDATED_MATRIX}" >> $GITHUB_OUTPUT
          
          if [ -f /tmp/has_update_flag ] && [ "$VALIDATED_MATRIX" != "[]" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Metadata
        if: steps.check.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-metadata
          path: release_notes.txt
          retention-days: 7

  build_core:
    needs: [init, check]
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != ''
    timeout-minutes: ${{ github.event.inputs.enable_naive == 'true' && 60 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event.inputs.enable_naive == 'true' && 2 || 8 }}
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        platform:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1, upx: true }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3, upx: true }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5, upx: false }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6, upx: false }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7, upx: true }
          - { name: linux-arm64, goos: linux, goarch: arm64, upx: true }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat, upx: false }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat, upx: false }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat, upx: false }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1, upx: true }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3, upx: true }
          - { name: windows-arm64, goos: windows, goarch: arm64, upx: true }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.platform.goos }}
      GOARCH: ${{ matrix.platform.goarch }}
      GOAMD64: ${{ matrix.platform.goamd64 }}
      GOARM: ${{ matrix.platform.goarm }}
      GOMIPS: ${{ matrix.platform.gomips }}
    steps:
      - name: Check Naive Compatibility
        id: check_naive
        run: |
          if [ "${{ github.event.inputs.enable_naive }}" = "true" ] && \
             [ "${{ matrix.platform.name }}" != "linux-amd64-v3" ] && \
             [ "${{ matrix.platform.name }}" != "windows-amd64-v3" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Commit
        if: steps.check_naive.outputs.skip != 'true'
        id: resolve
        run: |
          COMMIT="${{ github.event.inputs.build_commit || '' }}"
          COMMIT="$(echo "$COMMIT" | xargs)"
          [ -z "$COMMIT" ] && COMMIT="${{ matrix.target.branch }}"
          echo "ref=$COMMIT" >> $GITHUB_OUTPUT

      - name: Checkout Core
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          path: sing-box

      - name: Setup Go
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}
          cache: true
          cache-dependency-path: 'sing-box/go.sum'
          
      - name: Verify Go modules
        if: steps.check_naive.outputs.skip != 'true'
        run: |
          cd sing-box
          go mod tidy
          go mod download -x
          go mod verify

      - name: Fix sniff
        if: steps.check_naive.outputs.skip != 'true' && contains(matrix.target.repo, 'PuerNya')
        run: |
          cd sing-box
          if [ -f "./experimental/clashapi/trafficontrol/tracker.go" ]; then
            grep -q "sniffHosts" ./experimental/clashapi/trafficontrol/tracker.go && sed -i 's/sniffHosts/sniffHost/' ./experimental/clashapi/trafficontrol/tracker.go || true
          fi

      - name: Configure Tags and CGO
        if: steps.check_naive.outputs.skip != 'true'
        id: env
        run: |
          FINAL_TAGS="${{ env.TAGS_COMMON }}"
          if [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            FINAL_TAGS="${FINAL_TAGS},${{ env.TAGS_PUERNYA_EXTRA }}"
          fi
          
          CGO_VAL="0"
          ARCHIVE_SUFFIX=""
          ENABLE_NAIVE="${{ github.event.inputs.enable_naive || 'false' }}"
          
          if [ "$ENABLE_NAIVE" = "true" ]; then
            FINAL_TAGS="${FINAL_TAGS},with_naive_outbound"
            if [ "${{ matrix.platform.goos }}" = "windows" ]; then
              FINAL_TAGS="${FINAL_TAGS},with_purego"
            elif [ "${{ matrix.platform.goos }}" = "linux" ]; then
              ARCHIVE_SUFFIX="-glibc"
              CGO_VAL="1"
            fi
          fi
          
          FINAL_TAGS=$(echo "${FINAL_TAGS}" | tr ',' '\n' | sort -u | paste -sd,)
          echo "tags=${FINAL_TAGS}" >> $GITHUB_OUTPUT
          echo "suffix=${ARCHIVE_SUFFIX}" >> $GITHUB_OUTPUT
          echo "cgo_val=${CGO_VAL}" >> $GITHUB_OUTPUT

      - name: Fetch and Apply patches atomically
        if: steps.check_naive.outputs.skip != 'true' && contains(matrix.target.repo, 'reF1nd')
        working-directory: sing-box
        run: |
          set -euo pipefail
          git -c http.extraHeader="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            fetch https://github.com/${{ github.repository }}.git patches:patches 2>/dev/null || true
          
          for patch in concurrent_dial make_log_better fix_interrupt_connections; do
            PATCH_FILE="/tmp/patch_${patch}.patch"
            
            if git rev-parse --verify patches >/dev/null 2>&1; then
              git show "patches:sing-box/${patch}.patch" > "$PATCH_FILE" 2>/dev/null || \
              git show "patches:${patch}.patch" > "$PATCH_FILE" 2>/dev/null || true
            fi
            
            if [ ! -s "$PATCH_FILE" ]; then
              echo "::warning::Patch $patch not found in local 'patches' branch. Skipping."
              continue
            fi
            
            if [ -s "$PATCH_FILE" ]; then
              git apply -v --whitespace=fix "$PATCH_FILE" || {
                git apply -v --3way "$PATCH_FILE" && {
                  if grep -rq "^<<<<<<< " ./; then
                    echo "::error::Patch $patch left conflicts!"
                    exit 1
                  fi
                } || {
                  echo "::error::Patch $patch failed completely!"
                  exit 1
                }
              }
            fi
            rm -f "$PATCH_FILE"
          done

      - name: Free disk space for cronet toolchain
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Setup ccache
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-cgo-${{ matrix.platform.goarch }}

      - name: Export ccache compilers
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        run: |
          echo "CC=ccache gcc" >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"

      - name: Setup cronet-go
        if: steps.check_naive.outputs.skip != 'true' && github.event.inputs.enable_naive == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/cronet-go/.git" ]; then
            rm -rf "$HOME/cronet-go" || true
            CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION 2>/dev/null || echo "main")
            git init "$HOME/cronet-go"
            git -C "$HOME/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "$HOME/cronet-go" fetch --depth=1 origin "$CRONET_GO_VERSION"
            git -C "$HOME/cronet-go" checkout FETCH_HEAD
          fi
          
          TARGET="${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}"
          
          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            git -C "$HOME/cronet-go" submodule update --init --recursive --depth=1 2>/dev/null || true
            rm -f "$HOME/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg" 2>/dev/null || true
            cd "$HOME/cronet-go"
            
            if ! GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh; then
              sleep 10
              GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh || exit 1
            fi
            
            for i in 1 2 3; do
              if go run ./cmd/build-naive --target="$TARGET" download-toolchain; then break; fi
              echo "::warning::cronet toolchain download failed, retrying ($i/3)..."
              sleep $((i * 10))
              if [ "$i" -eq 3 ]; then exit 1; fi
            done
            
            go run ./cmd/build-naive --target="$TARGET" env 2>/dev/null | sed 's/^export //' >> "$GITHUB_ENV" || exit 1
            
          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            mkdir -p "$GITHUB_WORKSPACE/sing-box/dist"
            cd "$HOME/cronet-go"
            CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target="windows/${{ matrix.platform.goarch }}" -o "$GITHUB_WORKSPACE/sing-box/dist" || exit 1
          fi

      - name: Build Core
        if: steps.check_naive.outputs.skip != 'true'
        env:
          CGO_ENABLED: ${{ steps.env.outputs.cgo_val }}
        run: |
          set -euo pipefail
          cd sing-box
          mkdir -p dist
          cp LICENSE dist/ 2>/dev/null || true
          
          TAGS_STR="${{ steps.env.outputs.tags }}"
          ENABLE_NAIVE="${{ github.event.inputs.enable_naive || 'false' }}"
          if [ "$ENABLE_NAIVE" = "true" ]; then
            if [ "${{ matrix.platform.goos }}" = "windows" ]; then TAGS_STR="${TAGS_STR} (requires libcronet.dll)"; fi
            if [ "${{ matrix.platform.goos }}" = "linux" ]; then TAGS_STR="${TAGS_STR} (requires glibc)"; fi
          fi
          echo "$TAGS_STR" > dist/build_tags.txt
          echo "${{ matrix.platform.upx }}" > dist/upx_supported.txt
          
          BIN_NAME="sing-box"
          if [ "${{ matrix.platform.goos }}" = "windows" ]; then BIN_NAME="sing-box.exe"; fi
          
          go build -v -trimpath -ldflags "-checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }}' -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid=" -tags "${{ steps.env.outputs.tags }}" -o "dist/$BIN_NAME" ./cmd/sing-box
          
          # 寫入清單，防禦 GitHub Artifact 名稱漂移
          echo "{\"target_id\": \"${{ matrix.target.id }}\", \"platform\": \"${{ matrix.platform.name }}\", \"suffix\": \"${{ steps.env.outputs.suffix }}\"}" > dist/artifact-meta.json

      - name: Verify Binary Integrity
        if: steps.check_naive.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd sing-box/dist || exit 1
          BIN_NAME="sing-box"
          [ "${{ matrix.platform.goos }}" = "windows" ] && BIN_NAME="sing-box.exe"
          
          if [ ! -f "$BIN_NAME" ]; then exit 1; fi
          chmod +x "$BIN_NAME" 2>/dev/null || true
          
          BIN_SIZE=$(stat -c%s "$BIN_NAME" 2>/dev/null || stat -f%z "$BIN_NAME" 2>/dev/null || echo 0)
          if [ "$BIN_SIZE" -lt 1000000 ]; then exit 1; fi
          
          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            file "$BIN_NAME" | grep -q "ELF" || exit 1
            if [ "${{ matrix.platform.goarch }}" = "amd64" ]; then
              VERSION_OUTPUT=$("./$BIN_NAME" version 2>&1 || true)
              if ! echo "$VERSION_OUTPUT" | grep -qE "${{ matrix.target.ver }}"; then
                echo "::error::Binary version mismatch!"
                exit 1
              fi
            fi
          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            file "$BIN_NAME" | grep -qiE "^PE32.*executable" || exit 1
          fi

      - name: Upload Core
        if: steps.check_naive.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: sing-box/dist/*
          retention-days: 7

  build_android:
    needs: [init, check]
    timeout-minutes: 60
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != '' &&
      needs.init.outputs.android_secrets_valid == 'true' &&
      github.event.inputs.enable_naive != 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        android_arch:
          - { GOARCH: arm64, ABI: arm64-v8a }
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Commit
        if: ${{ matrix.target.sfa_repo != 'none' }}
        id: resolve
        run: |
          COMMIT="${{ github.event.inputs.build_commit || '' }}"
          COMMIT="$(echo "$COMMIT" | xargs)"
          [ -z "$COMMIT" ] && COMMIT="${{ matrix.target.branch }}"
          echo "ref=$COMMIT" >> $GITHUB_OUTPUT

      - name: Checkout Core
        if: ${{ matrix.target.sfa_repo != 'none' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          path: sing-box

      - name: Checkout SFA
        if: ${{ matrix.target.sfa_repo != 'none' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.sfa_repo }}
          ref: ${{ matrix.target.sfa_branch }}
          path: sing-box-for-android

      - name: Setup Go
        if: ${{ matrix.target.sfa_repo != 'none' }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}
          cache: true
          cache-dependency-path: 'sing-box/go.sum'

      - name: Verify Go modules
        if: ${{ matrix.target.sfa_repo != 'none' }}
        run: |
          cd sing-box
          go mod tidy
          go mod download -x
          go mod verify

      - name: Setup Android NDK
        if: ${{ matrix.target.sfa_repo != 'none' }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        if: ${{ matrix.target.sfa_repo != 'none' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Init gomobile & Verify SDK
        if: ${{ matrix.target.sfa_repo != 'none' }}
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          if ! gomobile init 2>&1 | tee /tmp/gomobile.log; then
            if grep -q "SDK not found" /tmp/gomobile.log; then
              echo "::warning::gomobile init failed: SDK not found. Check ANDROID_HOME."
            else
              echo "::error::gomobile init failed with unexpected error:"
              cat /tmp/gomobile.log
              exit 1
            fi
          fi

      - name: Custom Gradle Cache
        if: ${{ matrix.target.sfa_repo != 'none' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sing-box-for-android/**/*.gradle*', 'sing-box-for-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch and Apply Core patches atomically
        if: ${{ matrix.target.sfa_repo != 'none' && contains(matrix.target.repo, 'reF1nd') }}
        working-directory: sing-box
        run: |
          set -euo pipefail
          git -c http.extraHeader="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            fetch https://github.com/${{ github.repository }}.git patches:patches 2>/dev/null || true
          
          for patch in concurrent_dial make_log_better fix_interrupt_connections; do
            PATCH_FILE="/tmp/patch_${patch}.patch"
            
            if git rev-parse --verify patches >/dev/null 2>&1; then
              git show "patches:sing-box/${patch}.patch" > "$PATCH_FILE" 2>/dev/null || \
              git show "patches:${patch}.patch" > "$PATCH_FILE" 2>/dev/null || true
            fi
            
            if [ ! -s "$PATCH_FILE" ]; then
              echo "::warning::Patch $patch not found in local patches branch. Skipping."
              continue
            fi
            
            if [ -s "$PATCH_FILE" ]; then
              git apply -v --whitespace=fix "$PATCH_FILE" || {
                git apply -v --3way "$PATCH_FILE" && {
                  if grep -rq "^<<<<<<< " ./; then
                    echo "::error::Patch $patch left conflicts!"
                    exit 1
                  fi
                } || {
                  echo "::error::Patch $patch failed completely!"
                  exit 1
                }
              }
            fi
            rm -f "$PATCH_FILE"
          done

      - name: Streamline "Update" module & Apply Tweaks
        if: ${{ matrix.target.sfa_repo != 'none' }}
        run: |
          set -euo pipefail
          
          if [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]]; then
            cd sing-box-for-android
            echo " " | base64 -d > /tmp/sfa_patch.patch
            
            if ! git apply /tmp/sfa_patch.patch 2>/dev/null; then
              echo "::warning::Failed to apply Android UI Base64 patch, falling back to sed"
              MAIN_ACTIVITY="app/src/main/java/io/nekohasekai/sfa/compose/MainScreen.kt"
              if [ -f "$MAIN_ACTIVITY" ]; then
                sed -i 's/checkUpdateEnabled = true/checkUpdateEnabled = false/g' "$MAIN_ACTIVITY"
                sed -i 's/updateCheckPrompted = false/updateCheckPrompted = true/g' "$MAIN_ACTIVITY"
              else
                echo "::error::Base64 patch failed AND MainScreen.kt not found!"
                exit 1
              fi
            fi
            rm -f /tmp/sfa_patch.patch
            cd ..
          fi
          
          UPDATE_CHECKER=$(find sing-box-for-android -name "GitHubUpdateChecker.kt" -type f 2>/dev/null | head -n 1)
          if [ -n "$UPDATE_CHECKER" ]; then
            sed -i "s|REPO_URL = \".*\"|REPO_URL = \"${{ github.repository }}\"|g" "$UPDATE_CHECKER" || true
          fi

          cd sing-box-for-android
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\nGO_VERSION=%s\n' \
            "${{ needs.init.outputs.version_code }}" "${{ matrix.target.ver }}" "${{ needs.init.outputs.go_version }}" > version.properties
          
          GRADLE_KTS="app/build.gradle.kts"
          GRADLE_GROOVY="app/build.gradle"
          GRADLE_FILE=""
          if [ -f "$GRADLE_KTS" ]; then
            GRADLE_FILE="$GRADLE_KTS"
          elif [ -f "$GRADLE_GROOVY" ]; then
            GRADLE_FILE="$GRADLE_GROOVY"
          else
            echo "::error::Cannot find build.gradle(.kts)! Upstream structure changed."
            exit 1
          fi
          
          sed -Ei 's/(applicationId\s*)[=\(\s]*"[^"]+"[\)\s]*/\1= "com.android.internal.net"/' "$GRADLE_FILE"
          sed -Ei 's/(namespace\s*)[=\(\s]*"[^"]+"[\)\s]*/\1= "com.android.internal.net"/' "$GRADLE_FILE"

      - name: Build libbox.aar
        if: ${{ matrix.target.sfa_repo != 'none' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ls -d "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/"* >/dev/null 2>&1 || { echo "::error::NDK toolchains not found!"; exit 1; }
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          FINAL_TAGS="${{ env.TAGS_COMMON }},${{ env.TAGS_ANDROID_EXTRA }}"
          if [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            FINAL_TAGS="${FINAL_TAGS},${{ env.TAGS_PUERNYA_EXTRA }}"
          fi
          FINAL_TAGS=$(echo "${FINAL_TAGS}" | tr ',' '\n' | sort -u | paste -sd,)
          echo "FINAL_TAGS_EXPORT=${FINAL_TAGS}" >> $GITHUB_ENV
          
          CGO_ENABLED=0 gomobile bind -v -target android/${{ matrix.android_arch.GOARCH }} -androidapi 23 -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false -tags="${FINAL_TAGS}" -ldflags="-checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid=" ./experimental/libbox

      - name: Verify libbox.aar
        if: ${{ matrix.target.sfa_repo != 'none' }}
        run: |
          if [ ! -f "sing-box/libbox.aar" ]; then exit 1; fi
          AAR_SIZE=$(stat -c%s "sing-box/libbox.aar" 2>/dev/null || stat -f%z "sing-box/libbox.aar" 2>/dev/null || echo 0)
          if [ "$AAR_SIZE" -lt 1000000 ]; then exit 1; fi

      - name: Decode Keystore & Validate
        if: ${{ matrix.target.sfa_repo != 'none' }}
        env:
          EXPECTED_SHA1: ${{ secrets.EXPECTED_SHA1_FINGERPRINT || '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -di > ./sing-box-for-android/app/release.keystore
          if [ ! -s "./sing-box-for-android/app/release.keystore" ]; then exit 1; fi
          chmod 600 ./sing-box-for-android/app/release.keystore
          
          if ! keytool -list -keystore ./sing-box-for-android/app/release.keystore -storepass "${{ secrets.KEYSTORE_PASS }}" -alias "${{ secrets.ALIAS_NAME }}" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed. Check ALIAS_NAME and STORE password."
            exit 1
          fi
          
          if [ -n "$EXPECTED_SHA1" ]; then
            keytool -list -keystore ./sing-box-for-android/app/release.keystore -storepass "${{ secrets.KEYSTORE_PASS }}" -v 2>/dev/null | grep -q "SHA1: ${EXPECTED_SHA1}" || { echo "::error::Keystore SHA1 mismatch!"; exit 1; }
          fi

      - name: Build APK
        if: ${{ matrix.target.sfa_repo != 'none' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          
          if [ -z "${FINAL_TAGS_EXPORT:-}" ]; then
            FINAL_TAGS_EXPORT="unknown"
          fi
          
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/
          
          cd sing-box-for-android
          ./gradlew --version --console=plain >/dev/null 2>&1 || true
          chmod +x gradlew
          
          RELEASE_TASK="assembleOtherRelease"
          if ! ./gradlew --dry-run :app:${RELEASE_TASK} --console=plain >/dev/null 2>&1; then
            AVAILABLE=$(./gradlew :app:tasks --console=plain 2>/dev/null | grep -iE "^assemble.*Release$" | head -n 1 | awk '{print $1}')
            if [ -n "$AVAILABLE" ]; then
              RELEASE_TASK=${AVAILABLE}
            else
              echo "::warning::No Release task found, defaulting to ${RELEASE_TASK} (may fail)"
            fi
          fi
          
          ./gradlew :app:${RELEASE_TASK} --console=plain \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
          
          mkdir -p ../apks
          arch_abi="${{ matrix.android_arch.ABI }}"
          
          VARIANT=$(echo "${RELEASE_TASK}" | sed -E 's/^assemble([A-Za-z]+)Release$/\1/' | tr '[:upper:]' '[:lower:]')
          [ -z "$VARIANT" ] && VARIANT="other"
          APK_DIR="app/build/outputs/apk/${VARIANT}/release"
          
          apk=$(find "${APK_DIR}" -type f -name "*${arch_abi}*.apk" -print -quit 2>/dev/null)
          [ -z "$apk" ] && apk=$(find app/build/outputs/apk/ -type f -name "*${arch_abi}*.apk" -print -quit 2>/dev/null)
          
          if [ -n "$apk" ] && [ -f "$apk" ]; then
            basename_file=$(basename "$apk")
            mv -f "$apk" "../apks/SFA-${{ matrix.target.id }}-${arch_abi}-${basename_file}"
            
            if [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]]; then
              PATCHES='["concurrent_dial","make_log_better","fix_interrupt_connections"]'
            else
              PATCHES='[]'
            fi
            
            jq -n \
              --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg run_id "${{ github.run_id }}" \
              --argjson naive_enabled "${{ github.event.inputs.enable_naive || 'false' }}" \
              --arg version_code "${{ needs.init.outputs.version_code }}" \
              --arg version_name "${{ matrix.target.ver }}" \
              --arg target_repo "${{ matrix.target.repo }}" \
              --arg target_branch "${{ matrix.target.branch }}" \
              --arg build_tags "${FINAL_TAGS_EXPORT}" \
              --argjson patches "$PATCHES" \
              '{
                 target_id: "${{ matrix.target.id }}",
                 version_code: (if ($version_code | test("^[0-9]+$")) and ($version_code | tonumber > 0) then ($version_code | tonumber) else 1 end),
                 version_name: $version_name,
                 build_time: $built_at,
                 workflow_run_id: $run_id,
                 naive_enabled: $naive_enabled,
                 target_repo: $target_repo,
                 target_branch: $target_branch,
                 build_tags: $build_tags,
                 patches_applied: $patches
               }' > "../apks/SFA-${{ matrix.target.id }}-${arch_abi}-metadata.json"
          fi

      - name: Upload APK
        if: ${{ matrix.target.sfa_repo != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target.id }}-${{ matrix.android_arch.ABI }}
          path: apks/*
          retention-days: 7

  publish:
    needs: [init, check, build_core, build_android]
    if: >-
      always() &&
      (needs.init.result == 'success' || needs.init.result == 'skipped') &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      needs.check.outputs.has_update == 'true' &&
      (needs.build_core.result == 'success' || needs.build_core.result == 'partial_success' || needs.build_android.result == 'success' || needs.build_android.result == 'partial_success')
    runs-on: ubuntu-latest
    steps:
      - name: Setup UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Clean temp dir
        run: rm -rf ./tmp/* || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./tmp/

      - name: Process, Compress & Package
        run: |
          mkdir -p ./release_files
          
          package_windows() {
            local dir="$1"
            local base="$2"
            local bin_file=""
            
            if [ -f "$dir/sing-box.exe" ]; then
              bin_file="$dir/sing-box.exe"
            else
              bin_file=$(find "$dir" -maxdepth 1 -type f \( -name 'sing-box' -o -name 'sing-box.exe' \) -print -quit 2>/dev/null || echo "")
            fi
            
            if [ -n "$bin_file" ] && [ -f "$bin_file" ]; then
              mv -f "$bin_file" "sing-box.exe"
              cp "sing-box.exe" "sing-box-original.exe"
              
              UPX_SUPPORTED="false"
              [ -f "$dir/upx_supported.txt" ] && UPX_SUPPORTED=$(cat "$dir/upx_supported.txt")
              
              if [ "$UPX_SUPPORTED" = "true" ]; then
                if file "sing-box.exe" | grep -qiE "^PE32.*executable"; then
                  if ! upx -t "sing-box.exe" >/dev/null 2>&1 || ! upx --best --lzma "sing-box.exe" 2>/dev/null; then
                    upx --best "sing-box.exe" 2>/dev/null || cp "sing-box-original.exe" "sing-box.exe"
                  fi
                fi
              fi
              
              [ -f "$dir/LICENSE" ] && cp "$dir/LICENSE" . 2>/dev/null || true

              if [ -f "$dir/libcronet.dll" ]; then
                mv "$dir/libcronet.dll" .
                zip -q9 "release_files/sing-box-${base}.zip" "sing-box.exe" "libcronet.dll" $([ -f "LICENSE" ] && echo "LICENSE")
                zip -q9 "release_files/sing-box-${base}-original.zip" "sing-box-original.exe" "libcronet.dll" $([ -f "LICENSE" ] && echo "LICENSE")
                rm -f libcronet.dll
              else
                zip -q9 "release_files/sing-box-${base}.zip" "sing-box.exe" $([ -f "LICENSE" ] && echo "LICENSE")
                zip -q9 "release_files/sing-box-${base}-original.zip" "sing-box-original.exe" $([ -f "LICENSE" ] && echo "LICENSE")
              fi
              
              if [ ! -f "release_files/sing-box-${base}.zip" ] || [ "$(stat -c%s "release_files/sing-box-${base}.zip" 2>/dev/null || stat -f%z "release_files/sing-box-${base}.zip" 2>/dev/null)" -lt 1024 ]; then
                echo "::error::ZIP packaging failed or produced empty file: $base"
                exit 1
              fi
              
              rm -f "sing-box.exe" "sing-box-original.exe" "LICENSE"
            fi
          }
          
          package_linux() {
            local dir="$1"
            local base="$2"
            local bin_file=""
            
            if [ -f "$dir/sing-box" ]; then
              bin_file="$dir/sing-box"
            else
              bin_file=$(find "$dir" -maxdepth 1 -type f \( -name 'sing-box' -o -name 'sing-box.exe' \) -print -quit 2>/dev/null || echo "")
            fi
            
            if [ -n "$bin_file" ] && [ -f "$bin_file" ]; then
              mv -f "$bin_file" "sing-box"
              chmod +x "sing-box"
              cp "sing-box" "sing-box-original"
              
              UPX_SUPPORTED="false"
              [ -f "$dir/upx_supported.txt" ] && UPX_SUPPORTED=$(cat "$dir/upx_supported.txt")

              if [ "$UPX_SUPPORTED" = "true" ]; then
                if file "sing-box" | grep -qE "ELF.*executable"; then
                  if ! upx -t "sing-box" >/dev/null 2>&1 || ! upx --best --lzma "sing-box" 2>/dev/null; then
                    upx --best "sing-box" 2>/dev/null || cp "sing-box-original" "sing-box"
                  fi
                fi
                
                mkdir -p pkg_dir pkg_orig_dir
                cp "sing-box" pkg_dir/
                cp "sing-box-original" pkg_orig_dir/sing-box
                if [ -f "$dir/LICENSE" ]; then 
                  cp "$dir/LICENSE" pkg_dir/ 2>/dev/null || true
                  cp "$dir/LICENSE" pkg_orig_dir/ 2>/dev/null || true
                fi

                tar --no-same-owner -czf "release_files/sing-box-${base}.tar.gz" -C pkg_dir .
                tar --no-same-owner -czf "release_files/sing-box-${base}-original.tar.gz" -C pkg_orig_dir .
                rm -rf pkg_dir pkg_orig_dir
              else
                mkdir -p pkg_dir
                cp "sing-box" pkg_dir/
                if [ -f "$dir/LICENSE" ]; then cp "$dir/LICENSE" pkg_dir/ 2>/dev/null || true; fi
                tar --no-same-owner -czf "release_files/sing-box-${base}.tar.gz" -C pkg_dir .
                rm -rf pkg_dir
              fi
              rm -f "sing-box" "sing-box-original" "LICENSE"
            fi
          }

          for dir in ./tmp/core-*; do
            if [[ -d "$dir" ]]; then
              if [ -f "$dir/artifact-meta.json" ]; then
                target_id=$(jq -r '.target_id' "$dir/artifact-meta.json")
                platform=$(jq -r '.platform' "$dir/artifact-meta.json")
                base="${target_id}-${platform}"
              else
                base=$(basename "$dir" | sed 's/core-//' | sed 's/-[0-9]*$//')
              fi
              
              if [[ "$base" == *"windows"* ]]; then
                package_windows "$dir" "$base" || exit 1
              else
                package_linux "$dir" "$base" || exit 1
              fi
            fi
          done
          
          for dir in ./tmp/apk-*; do
            if [[ -d "$dir" ]]; then mv "$dir"/* release_files/ 2>/dev/null || true; fi
          done

          shopt -s nullglob
          META_FILES=(./release_files/*-metadata.json)
          if [ ${#META_FILES[@]} -gt 0 ]; then
            jq -s --arg run_id "${{ github.run_id }}" --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{"global_run_id": $run_id, "built_at": $built_at, "targets": .}' "${META_FILES[@]}" > release_files/build-info.json
          else
            echo "{}" > release_files/build-info.json
          fi

          cat > release_body.txt <<'BODYEOF'
          # 🚀 sing-box 自動編譯
          
          > 🔒 此 Release 已通過 [GitHub Artifact Attestations](https://github.com/advanced-security/artifact-attestations) 驗證，防範供應鏈攻擊。
          
          ## 📦 本次更新內容
          
          BODYEOF
          
          if [ -f "./tmp/workflow-metadata/release_notes.txt" ]; then 
            cat ./tmp/workflow-metadata/release_notes.txt >> release_body.txt
          fi
          
          cat >> release_body.txt <<'BODYEOF'
          
          ### 🔧 構建標籤詳情
          ```text
          BODYEOF
          
          for dir in ./tmp/core-*; do
            if [ -d "$dir" ]; then
              base=$(basename "$dir" | sed 's/core-//')
              tags="standard tags"
              [ -f "$dir/build_tags.txt" ] && tags=$(cat "$dir/build_tags.txt")
              echo "- $base: $tags" >> release_body.txt
            fi
          done
          echo '```' >> release_body.txt

      - name: Generate install scripts
        run: |
          cat > release_files/install-linux.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="sing-box"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) FILE_ARCH="amd64-v3" ;;
            aarch64) FILE_ARCH="arm64" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          echo "Fetching latest release for $FILE_ARCH..."
          ASSET_URL=$(curl -sSL "https://api.github.com/repos/$REPO/releases/tags/$TAG" | jq -r --arg arch "$FILE_ARCH" '.assets[].browser_download_url | select(test($arch) and test("tar\\.gz$") and (test("original") | not))' | head -1)
          [ -z "$ASSET_URL" ] && { echo "❌ No release found for $FILE_ARCH"; exit 1; }
          echo "Downloading $ASSET_URL ..."
          curl -fLO "$ASSET_URL" || { echo "❌ Download failed"; exit 1; }
          FILE_NAME=$(basename "$ASSET_URL")
          tar -xzf "$FILE_NAME"
          chmod +x sing-box
          sudo mv sing-box /usr/local/bin/
          echo "✅ Installation complete."
          EOF
          chmod +x release_files/install-linux.sh

      - name: Verify post-UPX integrity and Generate SHA256
        run: |
          cd release_files
          for f in *.tar.gz; do
            if [ -f "$f" ]; then tar xzf "$f" -O > /dev/null 2>&1 || exit 1; fi
          done
          for f in *.zip; do
            if [ -f "$f" ]; then unzip -t "$f" > /dev/null 2>&1 || exit 1; fi
          done
          
          sha256sum *.tar.gz *.zip *.apk 2>/dev/null | awk '{printf "| `%s` | `%s` |\n", $2, $1}' > SHA256SUMS_TABLE.md
          cat >> ../release_body.txt <<'BODYEOF'
          
          ## 🔐 SHA256 Checksums
          | 文件名稱 | SHA-256 |
          |----------|---------|
          BODYEOF
          cat SHA256SUMS_TABLE.md >> ../release_body.txt

      - name: Check if release files exist
        id: check_files
        run: |
          if ls ./release_files/* >/dev/null 2>&1; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Publish Release (Atomic Overwrite)
        if: steps.check_files.outputs.files_exist == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          HAS_TESTING="false"
          if grep -qE "(Testing|Building|testing|alpha|beta|rc)" release_body.txt; then
            HAS_TESTING="true"
          fi
          RELEASE_FLAG=""
          [ "$HAS_TESTING" = "true" ] && RELEASE_FLAG="--prerelease"
          
          if gh release view sing-box &>/dev/null; then
            gh release edit sing-box --notes-file release_body.txt $RELEASE_FLAG
          else
            gh release create sing-box --title "sing-box" --notes-file release_body.txt $RELEASE_FLAG
          fi
          
          shopt -s nullglob
          FILES=(./release_files/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No files in release_files directory!"
            exit 1
          fi
          
          gh release upload sing-box --clobber ./release_files/* || {
            echo "::error::Asset upload failed. Check API rate limits or file sizes."
            exit 1
          }

      - name: Generate Build Provenance
        if: steps.check_files.outputs.files_exist == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './release_files/*'

      - name: Update release-info branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release-info-temp
          git rm -rf . 2>/dev/null || true
          cp release_files/build-info.json ./ 2>/dev/null || echo "{}" > build-info.json
          git add build-info.json
          
          if ! git diff --cached --quiet; then
            git commit -m "build: update release metadata" || true
            git branch -M release-info
            git push origin release-info --force 2>/dev/null || true
          fi

      - name: Update build-artifacts branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-artifacts-temp
          git rm -rf . 2>/dev/null || true
          
          git checkout ${{ github.ref_name }} -- README.md LICENSE .github/workflows/ 2>/dev/null || true
          echo "* text=auto" > .gitattributes
          
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: update artifacts from successful workflow" || true
            git branch -M build-artifacts
            git push origin build-artifacts --force 2>/dev/null || true
          fi

      - name: Clean old releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 清理 Stable 版本（保留 3 個）
          gh release list --repo "${{ github.repository }}" --limit 50 --exclude-drafts | \
            grep -iv "Pre-release" | awk '{print $1}' | tail -n +4 | \
            xargs -r -I {} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
          
          # 清理 Pre-release 版本（保留 5 個）
          gh release list --repo "${{ github.repository }}" --limit 50 --exclude-drafts | \
            grep -i "Pre-release" | awk '{print $1}' | tail -n +6 | \
            xargs -r -I {} gh release delete {} --yes --cleanup-tag 2>/dev/null || true

      - name: Delete old workflow runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DELETE_BEFORE=$(date -u -d "7 days ago" +%Y-%m-%d)
          gh api "repos/${{ github.repository }}/actions/runs?status=completed&created=<${DELETE_BEFORE}" \
            --paginate --jq '.workflow_runs[].id' 2>/dev/null | while read run_id; do
            gh api "repos/${{ github.repository }}/actions/runs/$run_id" -X DELETE >/dev/null 2>&1 || true
          done

  create_issue_on_failure:
    needs: [build_core, build_android, publish]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 定時構建失敗: sing-box`,
              body: `構建在工作流 \`${context.workflow}\` 中失敗。\n\n[查看日誌](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci-failure']
            })

  telegram_notify:
    needs: [build_core, build_android, publish]
    runs-on: ubuntu-latest
    if: always() && (github.event.inputs.enable_telegram == 'true' || github.event_name == 'schedule')
    steps:
      - name: Generate Telegram Message
        id: status
        run: |
          TG_STATUS="success"
          declare -a STATUS_LINES
          
          for job in build_core build_android publish; do
            RESULT=""
            if [ "$job" = "build_core" ]; then RESULT="${{ needs.build_core.result }}"
            elif [ "$job" = "build_android" ]; then RESULT="${{ needs.build_android.result }}"
            elif [ "$job" = "publish" ]; then RESULT="${{ needs.publish.result }}"
            fi
            
            case "$RESULT" in
              success) STATUS_LINES+=("✅ ${job}: success") ;;
              failure) TG_STATUS="failed"; STATUS_LINES+=("❌ ${job}: failure") ;;
              skipped) STATUS_LINES+=("⏭️ ${job}: skipped") ;;
              *) STATUS_LINES+=("❓ ${job}: ${RESULT}") ;;
            esac
          done
          
          TG_DETAILS=$(IFS=$'\n'; echo "${STATUS_LINES[*]}")
          
          escape_tg_markdown() {
            echo "$1" | perl -pe 's/([_*\[\]()~`>#\+\-=|{}.!\\\/])/\\$1/g; s/\n/\\\n/g'
          }
          
          TG_DETAILS_SAFE=$(escape_tg_markdown "$TG_DETAILS")
          REPO_SAFE=$(escape_tg_markdown "${{ github.repository }}")
          
          if [ "$TG_STATUS" = "failed" ]; then
            MSG="❌ *sing\-box 自動編譯失敗*
          
          *構建詳情：*
          ${TG_DETAILS_SAFE}
          
          *建議操作：*
          1\. 前往 Actions頁面查看日誌
          2\. 檢查是否有 GitHub API限流"
          else
            MSG="🚀 *sing\-box 自動編譯完成*
          
          已檢測到代碼更新或觸發強制編譯，最新內核與 Android APK 已經打包完畢。
          
          *構建詳情：*
          ${TG_DETAILS_SAFE}
          
          📥 [點擊前往 GitHub下載](https://github\.com/${REPO_SAFE}/releases/tag/sing\-box)"
          fi
          
          EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1 2>/dev/null || echo "EOM")
          printf '%s\n' "TG_MESSAGE<<$EOF_MARKER" >> "$GITHUB_ENV"
          printf '%s\n' "$MSG" >> "$GITHUB_ENV"
          printf '%s\n' "$EOF_MARKER" >> "$GITHUB_ENV"
          
          echo "status=$TG_STATUS" >> $GITHUB_OUTPUT

      - name: Download release packages for TG
        if: ${{ steps.status.outputs.status == 'success' }}
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Find key files for TG
        if: ${{ steps.status.outputs.status == 'success' }}
        id: find_files
        run: |
          find_latest_file() {
            local pattern=$1
            local result=$(find dist -type f -name "$pattern" ! -name "*-original*" -print -quit 2>/dev/null)
            echo "$result"
          }
          
          ANDROID_APK=$(find dist -name "*.apk" -type f -print -quit 2>/dev/null)
          LINUX_TAR=$(find_latest_file '*linux*amd64-v3*.tar.gz')
          [ -z "$LINUX_TAR" ] && LINUX_TAR=$(find_latest_file '*linux*amd64-v3*glibc*.tar.gz')
          WINDOWS_ZIP=$(find_latest_file '*windows*amd64-v3*.zip')
          
          {
            [ -n "$ANDROID_APK" ] && [ -f "$ANDROID_APK" ] && echo "$ANDROID_APK"
            [ -n "$LINUX_TAR" ] && [ -f "$LINUX_TAR" ] && echo "$LINUX_TAR"
            [ -n "$WINDOWS_ZIP" ] && [ -f "$WINDOWS_ZIP" ] && echo "$WINDOWS_ZIP"
          } | grep -v '^$' | while read -r f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -le 52428800 ]; then
              echo "$f" >> /tmp/tg_files.txt
            else
              echo "::warning::$f exceeds 50MB Telegram limit, skipping."
            fi
          done
          
          if [ -s /tmp/tg_files.txt ]; then
            FILES_LIST=$(paste -sd',' /tmp/tg_files.txt)
            echo "files_list=${FILES_LIST}" >> "$GITHUB_OUTPUT"
            echo "skip_tg_file_upload=false" >> "$GITHUB_ENV"
          else
            echo "skip_tg_file_upload=true" >> "$GITHUB_ENV"
          fi

      - name: Telegram notification (with files)
        if: ${{ (steps.status.outputs.status == 'success' || steps.status.outputs.status == 'failed') && env.skip_tg_file_upload != 'true' }}
        uses: xz-dev/TelegramFileUploader@v1
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: ${{ env.TG_MESSAGE }}
          files: ${{ steps.find_files.outputs.files_list }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Telegram notification (text only)
        if: ${{ (steps.status.outputs.status == 'success' || steps.status.outputs.status == 'failed') && env.skip_tg_file_upload == 'true' }}
        uses: xz-dev/TelegramFileUploader@v1
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: ${{ env.TG_MESSAGE }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  update_readme:
    needs: [check, publish]
    runs-on: ubuntu-latest
    if: >-
      always() && 
      needs.check.result == 'success' && 
      needs.check.outputs.has_update == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean temp dir
        run: rm -rf ./metadata/* || true

      - name: Download Metadata
        uses: actions/download-artifact@v4
        with:
          name: workflow-metadata
          path: ./metadata/

      - name: Generate README
        run: |
          cat > README.md <<EOF
          # 🚀 sing-box 自動編譯系統
          
          > 自動檢測並編譯 [SagerNet/sing-box](https://github.com/SagerNet/sing-box)、[reF1nd/sing-box](https://github.com/reF1nd/sing-box) 和 [PuerNya/sing-box](https://github.com/PuerNya/sing-box)
          
          ## 📦 最新版本狀態 ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M UTC+8'))
          
          $(cat ./metadata/release_notes.txt 2>/dev/null || echo "暫無更新記錄")
          
          ---
          
          ## 📥 快速安裝 (Linux)
          
          使用動態路由自動安裝最新版對應架構：
          \`\`\`bash
          bash <(curl -sSL https://github.com/${{ github.repository }}/releases/download/sing-box/install-linux.sh)
          \`\`\`
          
          ## 📦 文件命名規則
          
          - **默認版本** (\`xxx.tar.gz\` / \`xxx.zip\`): UPX壓縮版（體積小）
          - **原始版本** (\`xxx-original.tar.gz\` / \`xxx-original.zip\`): 未壓縮版（兼容性好）
          - MIPS/ARMv5/v6: 僅提供原始版本（UPX不支持這些架構）
          
          ## 🛠️ 支持的版本與特性
          
          | 版本 | 分支 | 平台支持 |
          |------|------|---------|
          | SagerNet OldStable | oldstable | Linux/Windows/Android (arm64) |
          | SagerNet Stable | stable | Linux/Windows/Android (arm64) |
          | SagerNet Testing | testing | Linux/Windows/Android (arm64) |
          | reF1nd OldStable | reF1nd-oldstable | Linux/Windows/Android (arm64) |
          | reF1nd Stable | reF1nd-stable | Linux/Windows/Android (arm64) |
          | reF1nd Testing | reF1nd-testing | Linux/Windows/Android (arm64) |
          | PuerNya Building | building | Linux/Windows |
          
          ## 🔔 Telegram 通知配置
          若需啟用 Telegram 推送，請在倉庫 Secrets 中配置：
          - \`TELEGRAM_BOT_TOKEN\`, \`CHAT_ID\`, \`API_ID\`, \`API_HASH\`
          
          [🔗 前往 Releases 下載](https://github.com/${{ github.repository }}/releases/tag/sing-box)
          
          ![Build Status](https://img.shields.io/github/actions/workflow/status/${{ github.repository }}/build.yml?branch=${{ github.ref_name }})
          EOF

      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          git add README.md
          
          if ! git diff --cached --quiet; then
            git commit -m "docs: update README with latest build info"
            git push origin HEAD || {
              echo "::error::Failed to push README updates. Check for repository lock or network issues."
              exit 1
            }
          fi

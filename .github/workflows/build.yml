name: Build sing-box Core & SFA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target version (Select "all" for full sync)'
        type: choice
        options: ['all', 'reF1nd-Testing', 'reF1nd-Stable', 'Official-Alpha', 'Official-Stable']
        default: 'all'
  schedule:
    - cron: '0 */4 * * *'
  repository_dispatch:
    types: [upstream_sync]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_builds: ${{ steps.set.outputs.has_builds }}
      sfa_sha: ${{ steps.fetch_deps.outputs.sfa_sha }}
      geoip_tag: ${{ steps.fetch_deps.outputs.geoip_tag }}
      geosite_tag: ${{ steps.fetch_deps.outputs.geosite_tag }}
      meta_sha: ${{ steps.fetch_deps.outputs.meta_sha }}
      yacd_sha: ${{ steps.fetch_deps.outputs.yacd_sha }}
    steps:
      - id: fetch_deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          SFA_SHA=$(git ls-remote https://github.com/SagerNet/sing-box-for-android.git main | awk '{print $1}')
          GEOIP_TAG=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-geoip/releases/latest | jq -r .tag_name)
          GEOSITE_TAG=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-geosite/releases/latest | jq -r .tag_name)
          META_SHA=$(git ls-remote https://github.com/MetaCubeX/metacubexd.git gh-pages | awk '{print $1}')
          YACD_SHA=$(git ls-remote https://github.com/haishanh/yacd.git gh-pages | awk '{print $1}')
          
          for var in SFA_SHA GEOIP_TAG GEOSITE_TAG META_SHA YACD_SHA; do
            if [ -z "${!var}" ] || [ "${!var}" = "null" ]; then
              echo "::error::Strict Mode: Failed to fetch dependency $var. Aborting to maintain integrity."
              exit 1
            fi
          done
          
          echo "sfa_sha=$SFA_SHA" >> "$GITHUB_OUTPUT"
          echo "geoip_tag=$GEOIP_TAG" >> "$GITHUB_OUTPUT"
          echo "geosite_tag=$GEOSITE_TAG" >> "$GITHUB_OUTPUT"
          echo "meta_sha=$META_SHA" >> "$GITHUB_OUTPUT"
          echo "yacd_sha=$YACD_SHA" >> "$GITHUB_OUTPUT"

      - id: set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ github.event.inputs.branch }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch || '' }}
        run: |
          set -euo pipefail
          
          TARGETS=(
            "reF1nd/sing-box|reF1nd-testing|ref1nd-test|reF1nd-Testing|true"
            "reF1nd/sing-box|reF1nd-stable|ref1nd-stable|reF1nd-Stable|false"
            "SagerNet/sing-box|main|singbox-alpha|Official-Alpha|true"
            "SagerNet/sing-box|dev-next|singbox-stable|Official-Stable|false"
          )
          
          JSON="[]"
          HAS="false"
          
          for e in "${TARGETS[@]}"; do
            IFS='|' read -r REPO BR TAG TIT ROLLING <<< "$e"
            
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_BRANCH" != "all" ] && [ "$IN_BRANCH" != "$TIT" ]; then continue; fi
            if [ "$EVENT" = "repository_dispatch" ] && [ -n "$PAYLOAD_BRANCH" ]; then
              if [ "$PAYLOAD_BRANCH" != "$BR" ] && [ "$PAYLOAD_BRANCH" != "$TAG" ] && [ "$PAYLOAD_BRANCH" != "$TIT" ]; then continue; fi
            fi
            
            SHA=$(git ls-remote "https://github.com/${REPO}.git" "refs/heads/$BR" | awk '{print $1}')
            [ -z "$SHA" ] && continue

            TMPDIR="$(mktemp -d)"
            git clone --bare --filter=blob:none "https://github.com/${REPO}.git" "$TMPDIR"
            APP_VER=$(git --git-dir="$TMPDIR" describe --tags --abbrev=0 "$SHA" 2>/dev/null | sed 's/^v//' || true)
            rm -rf "$TMPDIR"
            
            [ -z "${APP_VER:-}" ] && APP_VER="${SHA:0:8}"
            
            if [ "$ROLLING" = "true" ]; then
              CHK_TAG="$TAG"
            else
              CHK_TAG=$(gh release list --limit 4000 --exclude-drafts --repo ${{ github.repository }} --json tagName,name --jq ".[] | select(.name | endswith(\" | $TIT\")) | .tagName" | head -n 1 || true)
            fi
            
            L_SHA="none"
            if [ -n "${CHK_TAG:-}" ] && gh release view "$CHK_TAG" --repo ${{ github.repository }} &>/dev/null; then
              L_SHA=$(gh release download "$CHK_TAG" --pattern commit.txt --repo ${{ github.repository }} -O - 2>/dev/null | head -n 1 | tr -d '[:space:]' || true)
              [ -z "$L_SHA" ] && L_SHA="none"
            fi
            
            if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "repository_dispatch" ] || [ "$SHA" != "$L_SHA" ] || [ "$L_SHA" = "none" ]; then
              JSON=$(echo "$JSON" | jq -c \
                --arg repo "$REPO" \
                --arg branch "$BR" \
                --arg tag "$TAG" \
                --arg title "$TIT" \
                --argjson rolling "$ROLLING" \
                --arg sha "$SHA" \
                --arg local_sha "$L_SHA" \
                --arg app_ver "$APP_VER" \
                '. += [{"repo": $repo, "branch": $branch, "tag": $tag, "title": $title, "rolling": $rolling, "sha": $sha, "local_sha": $local_sha, "app_ver": $app_ver}]')
              HAS="true"
            fi
          done
          
          echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"
          echo "has_builds=$HAS" >> "$GITHUB_OUTPUT"

  build_core:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.prepare.outputs.matrix).include }}
        target:
          - { os: linux, arch: amd64, amd: v3, flavor: full, upx: false }
          - { os: linux, arch: amd64, flavor: full, upx: false }
          - { os: linux, arch: arm64, flavor: full, upx: false }
          - { os: linux, arch: arm, arm: 7, flavor: full, upx: true }
          - { os: linux, arch: arm, arm: 7, flavor: lite, upx: true }
          - { os: linux, arch: arm, arm: 5, flavor: lite, upx: true }
          - { os: linux, arch: mipsle, flavor: lite, upx: true }
          - { os: linux, arch: mipsle, mips: softfloat, flavor: lite, upx: true }
          - { os: windows, arch: amd64, amd: v3, flavor: full, upx: false }
          - { os: darwin, arch: amd64, flavor: full, upx: false }
          - { os: darwin, arch: arm64, flavor: full, upx: false }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.branch }}
          fetch-depth: 0

      - name: Prepare Cache Key
        run: echo '${{ toJSON(matrix.target) }}' > .cache-key

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: |
            go.sum
            .cache-key

      - uses: crazy-max/ghaction-upx@v3
        if: matrix.target.upx == true
        with:
          install-only: true

      - name: Build Core
        run: |
          set -euo pipefail
          export GOOS=${{ matrix.target.os }}
          export GOARCH=${{ matrix.target.arch }}
          export CGO_ENABLED=0
          
          SUF=""
          if [ -n "${{ matrix.target.amd || '' }}" ]; then export GOAMD64="${{ matrix.target.amd }}"; SUF="${{ matrix.target.amd }}"; fi
          if [ -n "${{ matrix.target.arm || '' }}" ]; then export GOARM="${{ matrix.target.arm }}"; SUF="v${{ matrix.target.arm }}"; fi
          if [ -n "${{ matrix.target.mips || '' }}" ]; then export GOMIPS="${{ matrix.target.mips }}"; SUF="-${{ matrix.target.mips }}"; fi

          APP_VER="${{ matrix.branch_info.app_ver }}"
          
          if [ "${{ matrix.target.flavor }}" = "lite" ]; then
            TAGS="with_quic,with_utls,with_clash_api"
          else
            TAGS="with_gvisor,with_quic,with_utls,with_acme,with_clash_api,with_v2ray_api,with_wireguard"
          fi
          
          NAME="sing-box-${APP_VER}-${{ matrix.branch_info.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${SUF}-${{ matrix.target.flavor }}"
          if [ "${{ matrix.target.os }}" = "windows" ]; then BIN="sing-box.exe"; else BIN="sing-box"; fi
          
          LDFLAGS="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${APP_VER}-${{ matrix.branch_info.branch }}-${{ matrix.branch_info.sha }}"
          
          go build -trimpath -ldflags "$LDFLAGS" -tags "$TAGS" -o "$BIN" ./cmd/sing-box
          chmod +x "$BIN"
          
          mkdir -p output
          if [ "${{ matrix.target.os }}" = "windows" ]; then 
            zip -9 -j -q "output/${NAME}.zip" "$BIN"
          else 
            tar -czf "output/${NAME}.tar.gz" "$BIN"
          fi
          
          if [ "${{ matrix.target.upx }}" = "true" ]; then
            if upx --lzma --best "$BIN"; then
              cp "$BIN" "output/${NAME}-upx.upx"
            else
              echo "::warning::UPX compression failed for $BIN, skipping .upx output"
            fi
          fi

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'output/*'

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.branch_info.branch }}-core-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.amd || '' }}${{ matrix.target.arm != '' && format('v{0}', matrix.target.arm) || '' }}${{ matrix.target.mips != '' && format('-{0}', matrix.target.mips) || '' }}-${{ matrix.target.flavor }}
          path: output/*

  build_android:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.prepare.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.branch }}
          fetch-depth: 0
          path: core

      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ needs.prepare.outputs.sfa_sha }}
          submodules: recursive
          path: core/clients/android

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android APK
        run: |
          set -euo pipefail
          
          # 強制所有 JVM 實例 (包含 Kotlin/KSP Daemon) 啟用 Headless 模式
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$PATH:$(go env GOPATH)/bin
          
          cd core
          if ! make lib_install; then
            echo "::error::Gomobile fork installation failed."
            exit 1
          fi
          
          if ! make lib_android; then
            echo "::error::Gomobile AAR Build failed."
            exit 1
          fi
          
          mkdir -p clients/android/app/libs
          find . -maxdepth 1 -name "*.aar" -exec cp {} clients/android/app/libs/ \;
          
          cd clients/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          
          # 寫入 gradle.properties 確保 Kotlin Daemon 完全接手設定
          echo "org.gradle.jvmargs=-Djava.awt.headless=true" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Djava.awt.headless=true" >> gradle.properties
          
          keytool -genkey -v -keystore ci-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass password -keypass password -dname "CN=sing-box,O=CI,C=US"
          
          if ! ./gradlew assemblePlayRelease --no-daemon -x lint \
            -Pandroid.injected.signing.store.file=$(pwd)/ci-release.jks \
            -Pandroid.injected.signing.store.password=password \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=password; then
            echo "::error::SFA Gradle Build failed. Halting artifact generation."
            exit 1
          fi
          
          APP_VER="${{ matrix.branch_info.app_ver }}"
          
          TARGET_APK=""
          APK_FALLBACK=""
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            [ -z "$APK_FALLBACK" ] && APK_FALLBACK="$apk"
            if [[ "$apk" == *"universal"* ]]; then
              TARGET_APK="$apk"
              break
            fi
          done < <(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true)
          
          [ -z "$TARGET_APK" ] && TARGET_APK="$APK_FALLBACK"
          
          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ]; then
            echo "::error::Strict Mode: Expected APK output not found."
            exit 1
          fi
          
          mkdir -p ../../../output
          cp "$TARGET_APK" "../../../output/SFA-${APP_VER}-${{ matrix.branch_info.branch }}-universal.apk"

      - name: Check APK Existence
        id: check_apk
        run: |
          if ls output/*.apk 1> /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Attest Build Provenance
        if: steps.check_apk.outputs.exists == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'output/*.apk'

      - uses: actions/upload-artifact@v4
        if: steps.check_apk.outputs.exists == 'true'
        with:
          name: bin-${{ matrix.branch_info.branch }}-android-apk
          path: output/*.apk
          if-no-files-found: error

  release:
    needs: [prepare, build_core, build_android]
    if: always() && needs.prepare.outputs.has_builds == 'true' && needs.build_core.result == 'success' && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch_info: ${{ fromJson(needs.prepare.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch_info.repo }}
          ref: ${{ matrix.branch_info.branch }}
          fetch-depth: 0

      - name: Generate Smart Changelog
        run: |
          set -euo pipefail
          LOG_RAW=$(git log --pretty=format:"- %s (%h)" ${{ matrix.branch_info.local_sha }}..${{ matrix.branch_info.sha }} 2>/dev/null || git log --pretty=format:"- %s (%h)" -n 10 ${{ matrix.branch_info.sha }})
          
          FEAT=$(echo "$LOG_RAW" | grep -iE '^-\s*(feat|add|new|support)\b' || true)
          FIX=$(echo "$LOG_RAW" | grep -iE '^-\s*(fix|bug|patch)\b' || true)
          OTHER=$(echo "$LOG_RAW" | grep -v -iE '^-\s*(feat|add|new|support|fix|bug|patch)\b' || true)
          
          {
            echo "CHANGELOG<<EOF"
            [ -n "$FEAT" ] && echo "### ✨ Features" && echo "$FEAT"
            [ -n "$FIX" ] && echo "### 🐛 Bug Fixes" && echo "$FIX"
            [ -n "$OTHER" ] && echo "### 🔄 Other Changes" && echo "$OTHER"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-${{ matrix.branch_info.branch }}-*
          merge-multiple: true
          path: release_assets

      - name: Prepare All-in-One Assets & Determine Tag
        env:
          GEOIP_TAG: ${{ needs.prepare.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.prepare.outputs.geosite_tag }}
          META_SHA: ${{ needs.prepare.outputs.meta_sha }}
          YACD_SHA: ${{ needs.prepare.outputs.yacd_sha }}
        run: |
          set -euo pipefail
          cd release_assets
          APP_VER="${{ matrix.branch_info.app_ver }}"
          
          mkdir -p Essential-Assets/ui
          cat << 'EOF' > Essential-Assets/config.json
          { "log": { "level": "info" }, "inbounds": [{ "type": "mixed", "listen": "127.0.0.1", "listen_port": 2080 }], "outbounds": [{ "type": "selector", "tag": "proxy", "outbounds": ["direct"] }, { "type": "direct", "tag": "direct" }] }
          EOF
          
          curl -fL --retry 3 -o Essential-Assets/geoip.db "https://github.com/SagerNet/sing-geoip/releases/download/${GEOIP_TAG}/geoip.db"
          curl -fL --retry 3 -o Essential-Assets/geosite.db "https://github.com/SagerNet/sing-geosite/releases/download/${GEOSITE_TAG}/geosite.db"
          curl -fL --retry 3 -o Essential-Assets/geosite-cn.srs "https://raw.githubusercontent.com/SagerNet/sing-geosite/${GEOSITE_TAG}/rule-set/geosite-cn.srs"
          
          mkdir -p tmp_meta
          curl -fL --retry 3 -o metacubexd.zip "https://github.com/MetaCubeX/metacubexd/archive/${META_SHA}.zip"
          unzip -q metacubexd.zip -d tmp_meta/
          META_DIR=$(find tmp_meta -mindepth 1 -maxdepth 1 -type d | head -n 1)
          mv "$META_DIR" Essential-Assets/ui/metacubexd
          rm -rf tmp_meta metacubexd.zip
          
          mkdir -p tmp_yacd
          curl -fL --retry 3 -o yacd.zip "https://github.com/haishanh/yacd/archive/${YACD_SHA}.zip"
          unzip -q yacd.zip -d tmp_yacd/
          YACD_DIR=$(find tmp_yacd -mindepth 1 -maxdepth 1 -type d | head -n 1)
          mv "$YACD_DIR" Essential-Assets/ui/yacd
          rm -rf tmp_yacd yacd.zip
          
          zip -9 -r sing-box-Essential-Assets.zip Essential-Assets/
          rm -rf Essential-Assets/
          
          echo "${{ matrix.branch_info.sha }}" > commit.txt
          find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -print0 | xargs -0 sha256sum > sha256sums.txt
          
          if ls *SFA*.apk 1> /dev/null 2>&1; then echo "HAS_APK=true" >> "$GITHUB_ENV"; else echo "HAS_APK=false" >> "$GITHUB_ENV"; fi
          
          if [ "${{ matrix.branch_info.rolling }}" = "true" ]; then
            echo "REL_TAG=${{ matrix.branch_info.tag }}" >> "$GITHUB_ENV"
            echo "REL_NAME=${{ matrix.branch_info.title }} (Rolling)" >> "$GITHUB_ENV"
          else
            echo "REL_TAG=v${APP_VER}-${{ matrix.branch_info.title }}" >> "$GITHUB_ENV"
            echo "REL_NAME=v${APP_VER} | ${{ matrix.branch_info.title }}" >> "$GITHUB_ENV"
          fi

      - name: Build Release Body
        env:
          SFA_SHA: ${{ needs.prepare.outputs.sfa_sha }}
          GEOIP_TAG: ${{ needs.prepare.outputs.geoip_tag }}
          GEOSITE_TAG: ${{ needs.prepare.outputs.geosite_tag }}
          META_SHA: ${{ needs.prepare.outputs.meta_sha }}
          YACD_SHA: ${{ needs.prepare.outputs.yacd_sha }}
          SFA_RESULT: ${{ needs.build_android.result }}
        run: |
          TITLE="${{ matrix.branch_info.title }}"
          APK_EXIST="${HAS_APK}"
          
          cat << EOF > release_body.md
          ## 🚀 sing-box Core ($TITLE)
          > 🤖 自動同步上游源碼構建 | 包含完整 Build Provenance 安全認證
          
          $CHANGELOG
          
          ### 📦 資源與供應鏈追溯
          - **核心二進位檔**: 壓縮包內無資料夾嵌套，適合腳本一鍵覆蓋。
          - **一體化資源包 (Essential-Assets)**: 下載解壓後即可與核心搭配使用。外部依賴採執行當下動態鎖定 (Runtime-Locked)：
            - *GeoIP Version*: \`${GEOIP_TAG}\`
            - *Geosite Version*: \`${GEOSITE_TAG}\`
            - *Metacubexd SHA*: \`${META_SHA:0:7}\`
            - *Yacd SHA*: \`${YACD_SHA:0:7}\`
          EOF
          
          if [ "$APK_EXIST" = "true" ]; then
            echo "- **Android GUI**: 已成功編譯並附帶 SFA Universal APK 安裝包 (SFA Commit: \`${SFA_SHA:0:7}\`)。" >> release_body.md
          else
            echo "- **Android GUI**: ⚠️ 本次構建 SFA (Android) 失敗。核心發布不受影響，請維護者檢查 Action 日誌。" >> release_body.md
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_NAME }}
          prerelease: ${{ matrix.branch_info.rolling }}
          make_latest: ${{ matrix.branch_info.rolling == false && 'true' || 'false' }}
          files: release_assets/*
          body_path: release_body.md

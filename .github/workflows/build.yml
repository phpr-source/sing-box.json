name: Build sing-box
on:
  workflow_dispatch:
    inputs:
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      enable_naive:
        description: "Enable naive outbound (requires cronet)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/delete-old-workflows.yml"

env:
  TAGS_COMMON: "with_gvisor,with_quic,with_dhcp,with_utls,with_wireguard,with_clash_api"
  TAGS_ANDROID_EXTRA: "with_conntrack"

jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go.outputs.version }}
    steps:
      - name: Get Go latest version
        id: go
        run: |
          echo "version=$(curl -sSL https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | jq -r '.[0].version')" >> $GITHUB_OUTPUT

  # ==================== SagerNet sing-box versions ====================

  singbox_oldstable_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout SagerNet/sing-box oldstable
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: oldstable
          fetch-depth: 0

      - name: Get sing-box Oldstable version
        id: version
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '.[] | select(.tag_name | contains("alpha") | not and contains("beta") | not and contains("rc") | not) | .tag_name' | sort -V | tail -n 2 | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${VERSION}" | jq -r '(.published_at // .created_at)' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TAGS_COMMON }}" >> $GITHUB_OUTPUT

      - name: Compare versions with current release
        id: compare
        run: |
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          arch="sing-box Oldstable|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"
          IFS="|" read -r name version time <<< "$arch"
          if echo "${current_body}" | grep -q "${name}.*${version}.*${time}"; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
          else
            echo "skip_update=false" >> $GITHUB_OUTPUT
          fi

  singbox_oldstable_cross:
    runs-on: ubuntu-latest
    if: ${{ needs.singbox_oldstable_version.outputs.skip_update != 'true' }}
    strategy:
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
      fail-fast: false
    needs:
      - go
      - singbox_oldstable_version
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.singbox_oldstable_version.outputs.version }}
      TAGS: ${{ needs.singbox_oldstable_version.outputs.tags }}
    steps:
      - name: Checkout SagerNet/sing-box oldstable
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: oldstable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build sing-box Oldstable core
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-oldstable-${{ matrix.name }}
          path: sing-box*

  singbox_stable_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout SagerNet/sing-box stable
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: stable
          fetch-depth: 0

      - name: Get sing-box Stable version
        id: version
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '.[] | select(.tag_name | contains("alpha") | not and contains("beta") | not and contains("rc") | not) | .tag_name' | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${VERSION}" | jq -r '(.published_at // .created_at)' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TAGS_COMMON }}" >> $GITHUB_OUTPUT

      - name: Compare versions with current release
        id: compare
        run: |
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          arch="sing-box Stable|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"
          IFS="|" read -r name version time <<< "$arch"
          if echo "${current_body}" | grep -q "${name}.*${version}.*${time}"; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
          else
            echo "skip_update=false" >> $GITHUB_OUTPUT
          fi

  singbox_stable_cross:
    runs-on: ubuntu-latest
    if: ${{ needs.singbox_stable_version.outputs.skip_update != 'true' }}
    strategy:
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
      fail-fast: false
    needs:
      - go
      - singbox_stable_version
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.singbox_stable_version.outputs.version }}
      TAGS: ${{ needs.singbox_stable_version.outputs.tags }}
    steps:
      - name: Checkout SagerNet/sing-box stable
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: stable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build sing-box Stable core
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-stable-${{ matrix.name }}
          path: sing-box*

  singbox_testing_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout SagerNet/sing-box testing
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: testing
          fetch-depth: 0

      - name: Get sing-box Testing version
        id: version
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '.[] | select(.tag_name | test("alpha|beta|rc")) | .tag_name' | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${VERSION}" | jq -r '(.published_at // .created_at)' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TAGS_COMMON }}" >> $GITHUB_OUTPUT

      - name: Compare versions with current release
        id: compare
        run: |
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          arch="sing-box Testing|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"
          IFS="|" read -r name version time <<< "$arch"
          if echo "${current_body}" | grep -q "${name}.*${version}.*${time}"; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
          else
            echo "skip_update=false" >> $GITHUB_OUTPUT
          fi

  singbox_testing_cross:
    runs-on: ubuntu-latest
    if: ${{ needs.singbox_testing_version.outputs.skip_update != 'true' }}
    strategy:
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
      fail-fast: false
    needs:
      - go
      - singbox_testing_version
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.singbox_testing_version.outputs.version }}
      TAGS: ${{ needs.singbox_testing_version.outputs.tags }}
    steps:
      - name: Checkout SagerNet/sing-box testing
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: testing

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build sing-box Testing core
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-testing-${{ matrix.name }}
          path: sing-box*

  # ==================== reF1nd sing-box versions ====================

  ref1nd_oldstable_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-oldstable
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-oldstable
          fetch-depth: 0

      - name: Get sing-box reF1nd-Oldstable version
        id: version
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and (contains("alpha") | not and contains("beta") | not and contains("rc") | not)) | .name' | sort -V | tail -n 2 | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/commits/$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and (contains("alpha") | not and contains("beta") | not and contains("rc") | not)) | .name' | sort -V | tail -n 2 | head -n 1) | jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TAGS_COMMON }}" >> $GITHUB_OUTPUT

      - name: Compare versions with current release
        id: compare
        run: |
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          arch="sing-box reF1nd-Oldstable|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"
          IFS="|" read -r name version time <<< "$arch"
          if echo "${current_body}" | grep -q "${name}.*${version}.*${time}"; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
          else
            echo "skip_update=false" >> $GITHUB_OUTPUT
          fi

  ref1nd_oldstable_cross:
    runs-on: ubuntu-latest
    if: ${{ needs.ref1nd_oldstable_version.outputs.skip_update != 'true' }}
    strategy:
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
      fail-fast: false
    needs:
      - go
      - ref1nd_oldstable_version
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      VERSION: ${{ needs.ref1nd_oldstable_version.outputs.version }}
      TAGS: ${{ needs.ref1nd_oldstable_version.outputs.tags }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-oldstable
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-oldstable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build sing-box reF1nd-Oldstable core
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box

      - name: Upload files to workspace
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ref1nd-oldstable-${{ matrix.name }}
          path: sing-box*

  ref1nd_stable_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout reF1nd/sing-box reF1nd-stable
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable
          fetch-depth: 0

      - name: Get sing-box reF1nd-Stable version
        id: version
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and (contains("alpha") | not and contains("beta") | not and contains("rc") | not)) | .name' | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/commits/$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[] | select(.name | contains("reF1nd") and (contains("alpha") | not and contains("beta") | not and contains("rc") | not)) | .name' | head -n 1) | jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')

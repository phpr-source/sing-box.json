name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build all targets (Ignore version match)"
        required: false
        type: boolean
        default: false
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      enable_naive:
        description: "Enable naive outbound (Linux/Windows only, NOT supported for Android)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: write

env:
  TAGS_SAGERNET: "with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api,with_wireguard"
  TAGS_REF1ND: "with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api"
  TAGS_PUERNYA: "with_quic,with_dhcp,with_wireguard,with_shadowsocksr,with_ech,with_utls,with_clash_api,with_gvisor"
  TAGS_ANDROID_EXTRA: "with_conntrack"

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go.outputs.version }}
      start_time: ${{ steps.time.outputs.start }}
    steps:
      - name: Record Start Time
        id: time
        run: echo "start=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Get Go latest version
        id: go
        run: |
          echo "version=$(curl -sSL https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | jq -r '.[0].version')" >> $GITHUB_OUTPUT

      - name: Validate Secrets
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          CHAT_ID: ${{ secrets.CHAT_ID || '' }}
          API_ID: ${{ secrets.API_ID || '' }}
          API_HASH: ${{ secrets.API_HASH || '' }}
        run: |
          MISSING_SECRETS=""
          [ -z "$ANDROID_KEYSTORE" ] && MISSING_SECRETS="$MISSING_SECRETS ANDROID_KEYSTORE"
          [ -z "$KEYSTORE_PASS" ] && MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_PASS"
          [ -z "$ALIAS_NAME" ] && MISSING_SECRETS="$MISSING_SECRETS ALIAS_NAME"
          [ -z "$ALIAS_PASS" ] && MISSING_SECRETS="$MISSING_SECRETS ALIAS_PASS"
          
          if [ "${{ github.event.inputs.enable_telegram }}" = "true" ]; then
            [ -z "$TELEGRAM_BOT_TOKEN" ] && MISSING_SECRETS="$MISSING_SECRETS TELEGRAM_BOT_TOKEN"
            [ -z "$CHAT_ID" ] && MISSING_SECRETS="$MISSING_SECRETS CHAT_ID"
            [ -z "$API_ID" ] && MISSING_SECRETS="$MISSING_SECRETS API_ID"
            [ -z "$API_HASH" ] && MISSING_SECRETS="$MISSING_SECRETS API_HASH"
          fi
          
          if [ -n "$MISSING_SECRETS" ]; then
            echo "::warning::Missing secrets (may cause failures if targeting Android/Telegram):$MISSING_SECRETS"
          fi

  check:
    needs: init
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_update: ${{ steps.check.outputs.has_update }}
    steps:
      - name: Setup Go (Minimal)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}

      - name: Check versions and generate matrix
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          targets="[]"
          has_update="false"
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          
          current_release=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""' 2>/dev/null || echo "")
          echo "" > release_notes.txt

          check_branch() {
            local id=$1
            local repo=$2
            local branch=$3
            local sfa_repo=$4
            local sfa_branch=$5

            echo "Checking $id ($repo@$branch)..."
            
            local max_retries=3
            local retry_count=0
            local cloned="false"
            while [ $retry_count -lt $max_retries ]; do
              if git clone -b "$branch" --depth 1 "https://github.com/$repo.git" "$id" 2>/dev/null; then
                cloned="true"
                break
              else
                retry_count=$((retry_count + 1))
                if [ $retry_count -lt $max_retries ]; then
                  sleep 5
                fi
              fi
            done
            
            if [ "$cloned" = "false" ]; then 
              echo "::warning::[$id] Clone failed after $max_retries attempts. Skipping."
              return 
            fi

            cd "$id"
            if [[ "$repo" == *"PuerNya"* ]]; then
              git remote add upstream https://github.com/SagerNet/sing-box.git 2>/dev/null || true
              git fetch --tags upstream 2>/dev/null || true
            fi
            git fetch --tags --unshallow 2>/dev/null || true

            local ver=""
            if [[ "$repo" == *"SagerNet"* ]]; then
              if [[ "$branch" == *"testing"* ]]; then
                ver=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/sing-box/releases" | jq -r '[.[] | select(.tag_name | test("alpha|beta|rc"))][0].tag_name' 2>/dev/null | sed 's/^v//' || echo "")
              else
                ver=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/sing-box/releases" | jq -r '[.[] | select(.tag_name | contains("alpha") | not)][0].tag_name' 2>/dev/null | sed 's/^v//' || echo "")
              fi
            fi

            if [ -z "$ver" ] || [ "$ver" = "unknown" ] || [ "$ver" = "null" ]; then
              if command -v go >/dev/null 2>&1; then
                ver=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag 2>/dev/null || echo "")
              fi
              if [ -z "$ver" ] || [ "$ver" = "unknown" ]; then
                ver=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "")
              fi
              if [ -z "$ver" ] || [ "$ver" = "unknown" ]; then
                ver=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/tags?per_page=1" | jq -r '[.[].name | select(test("alpha|beta|rc") | not)][0]' 2>/dev/null | sed 's/^v//' || echo "unknown")
              fi
            fi
            
            local time=""
            if [[ "$repo" == *"reF1nd"* ]] && [ "$ver" != "unknown" ]; then
              time=$(curl -sfL "https://api.github.com/repos/$repo/tags" | jq -r --arg v "v$ver" '.[] | select(.name == $v) | .commit.sha' | xargs -I {} curl -sfL "https://api.github.com/repos/$repo/commits/{}" | jq -r '.commit.committer.date' | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d' 2>/dev/null || echo "")
            fi
            if [ -z "$time" ]; then
              time=$(git log -1 --format=%cd --date=format:'%Y-%m-%d' 2>/dev/null || echo "unknown")
            fi
            
            cd ..
            rm -rf "$id"

            if [ "$ver" = "unknown" ]; then 
              echo "::warning::[$id] Cannot read version. Skipping."
              return 
            fi
            
            local marker="$id|$ver|$time"
            local branch_url="https://github.com/$repo/tree/$branch"
            
            if [ "$FORCE_BUILD" = "true" ]; then
              echo "[$id] Force build triggered."
              has_update="true"
              echo "- 🔄 強制構建 **[$id]($branch_url)** \`v$ver\` ($time)" >> release_notes.txt
              echo "$marker" >> markers.txt
              targets=$(echo "$targets" | jq --arg id "$id" --arg repo "$repo" --arg branch "$branch" \
                --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" \
                '. += [{"id": $id, "repo": $repo, "branch": $branch, "sfa_repo": $sfa_repo, "sfa_branch": $sfa_branch, "ver": $ver, "time": $time}]')
            elif ! echo "$current_release" | grep -qF "${marker}"; then
              echo "[$id] Update detected: v$ver ($time)"
              has_update="true"
              echo "- ✨ 更新 **[$id]($branch_url)** 至 \`v$ver\`，發佈於 $time" >> release_notes.txt
              echo "$marker" >> markers.txt
              targets=$(echo "$targets" | jq --arg id "$id" --arg repo "$repo" --arg branch "$branch" \
                --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" \
                '. += [{"id": $id, "repo": $repo, "branch": $branch, "sfa_repo": $sfa_repo, "sfa_branch": $sfa_branch, "ver": $ver, "time": $time}]')
            else
              echo "[$id] Already up to date: v$ver"
            fi
          }

          check_branch "SagerNet_Oldstable" "SagerNet/sing-box" "oldstable" "SagerNet/sing-box-for-android" "oldstable"
          check_branch "SagerNet_Stable" "SagerNet/sing-box" "stable" "SagerNet/sing-box-for-android" "stable"
          check_branch "SagerNet_Testing" "SagerNet/sing-box" "testing" "SagerNet/sing-box-for-android" "testing"
          check_branch "reF1nd_Oldstable" "reF1nd/sing-box" "reF1nd-oldstable" "reF1nd/sing-box-for-android" "reF1nd-oldstable"
          check_branch "reF1nd_Stable" "reF1nd/sing-box" "reF1nd-stable" "reF1nd/sing-box-for-android" "reF1nd-stable"
          check_branch "reF1nd_Testing" "reF1nd/sing-box" "reF1nd-testing" "reF1nd/sing-box-for-android" "reF1nd-testing"
          check_branch "PuerNya_Building" "PuerNya/sing-box" "building" "none" "none"

          echo "matrix=${targets}" >> $GITHUB_OUTPUT
          echo "has_update=${has_update}" >> $GITHUB_OUTPUT

      - name: Generate Patch Hashes
        if: steps.check.outputs.has_update == 'true'
        run: |
          mkdir -p .github
          echo "declare -A EXPECTED_SHA256" > .github/patch_hashes.sh
          
          MATRIX='${{ steps.check.outputs.matrix }}'
          if echo "$MATRIX" | grep -q '"reF1nd"'; then
            BASE_URL="https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box"
            for patch in concurrent_dial make_log_better fix_interrupt_connections; do
              content=$(curl -sfL "${BASE_URL}/${patch}.patch" || true)
              if [ -n "$content" ]; then
                sha=$(echo "$content" | sha256sum | awk '{print $1}')
                echo "EXPECTED_SHA256[$patch]=\"$sha\"" >> .github/patch_hashes.sh
              fi
            done
          fi

      - name: Upload Metadata
        if: steps.check.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-metadata
          path: |
            markers.txt
            release_notes.txt
            .github/patch_hashes.sh

  build_core:
    needs: [init, check]
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        platform:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.platform.goos }}
      GOARCH: ${{ matrix.platform.goarch }}
      GOAMD64: ${{ matrix.platform.goamd64 }}
      GOARM: ${{ matrix.platform.goarm }}
      GOMIPS: ${{ matrix.platform.gomips }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.branch }}
          path: sing-box

      - name: Download Metadata
        uses: actions/download-artifact@v4
        with:
          name: workflow-metadata
          path: ./metadata/

      - name: Fix sniff (PuerNya only)
        if: contains(matrix.target.repo, 'PuerNya')
        run: |
          cd sing-box
          if [ -f "./experimental/clashapi/trafficontrol/tracker.go" ]; then
            grep -q "sniffHosts" ./experimental/clashapi/trafficontrol/tracker.go && \
              sed -i 's/sniffHosts/sniffHost/' ./experimental/clashapi/trafficontrol/tracker.go
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Configure Tags and CGO
        id: env
        run: |
          if [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]]; then
            FINAL_TAGS="${{ env.TAGS_REF1ND }}"
          elif [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            FINAL_TAGS="${{ env.TAGS_PUERNYA }}"
          else
            FINAL_TAGS="${{ env.TAGS_SAGERNET }}"
          fi
          
          ARCHIVE_SUFFIX=""
          if [ "${{ github.event.inputs.enable_naive }}" = "true" ]; then
            FINAL_TAGS="${FINAL_TAGS},with_naive_outbound"
            if [ "${{ matrix.platform.goos }}" = "windows" ]; then
              FINAL_TAGS="${FINAL_TAGS},with_purego"
            elif [ "${{ matrix.platform.goos }}" = "linux" ]; then
              echo "CGO_ENABLED=1" >> $GITHUB_ENV
              ARCHIVE_SUFFIX="-glibc"
            fi
          fi
          echo "tags=${FINAL_TAGS}" >> $GITHUB_OUTPUT
          echo "suffix=${ARCHIVE_SUFFIX}" >> $GITHUB_OUTPUT

      - name: Apply patches (reF1nd only)
        if: contains(matrix.target.repo, 'reF1nd')
        run: |
          cd sing-box
          if [ -f "../metadata/.github/patch_hashes.sh" ]; then
            source ../metadata/.github/patch_hashes.sh
          else
            echo "::error::Patch hashes missing!"
            exit 1
          fi
          
          for patch in concurrent_dial make_log_better fix_interrupt_connections; do
            url="https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/${patch}.patch"
            content=$(curl -sfL "$url" || echo "")
            
            if [ -z "$content" ]; then
              echo "::warning::Failed to download ${patch}"
              continue
            fi
            
            actual_sha=$(echo "$content" | sha256sum | awk '{print $1}')
            expected_sha="${EXPECTED_SHA256[$patch]}"
            
            if [ -n "$expected_sha" ] && [ "$actual_sha" = "$expected_sha" ]; then
              echo "$content" | git apply -v --whitespace=fix || echo "::warning::${patch} failed to apply"
            elif [ -z "$expected_sha" ]; then
              echo "::warning::No cached hash for ${patch}, applying without verification"
              echo "$content" | git apply -v --whitespace=fix || echo "::warning::${patch} failed to apply"
            else
              echo "::error::SHA256 mismatch for ${patch}! Expected: $expected_sha Got: $actual_sha"
              exit 1
            fi
          done

      - name: Clone cronet-go for Naive
        if: github.event.inputs.enable_naive == 'true'
        run: |
          CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION 2>/dev/null || echo "main")
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          
          TARGET="${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}"
          [ -n "${{ matrix.platform.goamd64 }}" ] && TARGET="${TARGET}/${{ matrix.platform.goamd64 }}"
          
          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            git -C ~/cronet-go submodule update --init --recursive --depth=1
            rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
            GPG_TTY=/dev/null ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh || true
            cd ~/cronet-go
            go run ./cmd/build-naive --target="$TARGET" download-toolchain
            go run ./cmd/build-naive --target="$TARGET" env >> $GITHUB_ENV
          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            cd ~/cronet-go
            CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target="$TARGET" -o "$GITHUB_WORKSPACE/sing-box/dist"
          fi

      - name: Build Core
        run: |
          cd sing-box
          mkdir -p dist
          go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }}' -s -w -buildid= -checklinkname=0" -tags "${{ steps.env.outputs.tags }}" -o "dist/sing-box" ./cmd/sing-box

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}-${{ github.run_number }}
          path: sing-box/dist/*

  build_android:
    needs: [init, check]
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check if SFA branch exists
        id: sfa_check
        run: |
          if [ "${{ matrix.target.sfa_repo }}" != "none" ] && git ls-remote --heads https://github.com/${{ matrix.target.sfa_repo }}.git ${{ matrix.target.sfa_branch }} | grep -q ${{ matrix.target.sfa_branch }}; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Android Naive Warning
        if: steps.sfa_check.outputs.exists == 'true' && github.event.inputs.enable_naive == 'true'
        run: |
          echo "::warning::⚠️ Android builds will NOT include naive proxy support."
          echo "::warning::Naive proxy is only available for Linux and Windows targets."

      - name: Checkout Core
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.branch }}
          path: sing-box

      - name: Checkout SFA
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.sfa_repo }}
          ref: ${{ matrix.target.sfa_branch }}
          path: sing-box-for-android

      - name: Setup Go
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.init.outputs.go_version }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Setup Android NDK
        if: steps.sfa_check.outputs.exists == 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Export NDK path to global env
        if: steps.sfa_check.outputs.exists == 'true'
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup OpenJDK & Gradle Cache
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Calculate Version Code
        if: steps.sfa_check.outputs.exists == 'true'
        id: version_code
        run: |
          VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Apply Streamline & Tweaks
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          cd sing-box-for-android
          
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\nGO_VERSION=%s\n' "${{ steps.version_code.outputs.code }}" "${{ matrix.target.ver }}" "${{ needs.init.outputs.go_version }}" > version.properties
          
          GRADLE_FILE="app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/applicationId\s*=\s*".*"/applicationId = "com.android.internal.net"/' "$GRADLE_FILE"
          else
            GRADLE_FILE="app/build.gradle"
            sed -i '/applicationId/s/io\..*/com.android.internal.net/' "$GRADLE_FILE" || true
          fi

          UPDATE_FILE=$(find . -name "GitHubUpdateChecker.kt" -type f 2>/dev/null | head -n 1)
          if [ -n "$UPDATE_FILE" ] && [ -f "$UPDATE_FILE" ]; then
            sed -i "s|reF1nd/sing-box-releases|${{ github.repository }}|g" "$UPDATE_FILE"
            sed -i "s|SagerNet/sing-box|${{ github.repository }}|g" "$UPDATE_FILE"
          fi

          if [[ "${{ matrix.target.repo }}" != *"PuerNya"* ]]; then
            MAIN_ACT=$(find . -path "*/compose/MainActivity.kt" -type f 2>/dev/null | head -n 1)
            if [ -n "$MAIN_ACT" ]; then
              cat > /tmp/streamline.patch << 'PATCH_EOF'
diff --git a/app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt b/app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt
--- a/app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt
+++ b/app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt
@@ -191,6 +191,10 @@
                 connection.reconnect()
 
+            // Disable built-in update checker
+            Settings.checkUpdateEnabled = false
+            Settings.updateCheckPrompted = true
+            UpdateState.clear()
+
             handleIntent(intent)
PATCH_EOF
              if ! git apply --check /tmp/streamline.patch 2>/dev/null; then
                echo "::warning::Patch cannot apply cleanly, using sed fallback"
                sed -i '/connection\.reconnect()/,/handleIntent/{ /connection\.reconnect()/a\
                        Settings.checkUpdateEnabled = false\
                        Settings.updateCheckPrompted = true\
                        UpdateState.clear()
}' "$MAIN_ACT"
              else
                git apply /tmp/streamline.patch || true
              fi
            fi
          fi

      - name: Build libbox.aar
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          if [[ "${{ matrix.target.repo }}" == *"reF1nd"* ]]; then
            FINAL_TAGS="${{ env.TAGS_REF1ND }}"
          elif [[ "${{ matrix.target.repo }}" == *"PuerNya"* ]]; then
            FINAL_TAGS="${{ env.TAGS_PUERNYA }}"
          else
            FINAL_TAGS="${{ env.TAGS_SAGERNET }}"
          fi
          
          FINAL_TAGS="${FINAL_TAGS},${{ env.TAGS_ANDROID_EXTRA }}"
          
          gomobile bind -v -o libbox.aar -target android/arm64 -androidapi 23 -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false -tags="${FINAL_TAGS}" -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }} -s -w -buildid= -checklinkname=0" ./experimental/libbox

      - name: Verify libbox.aar
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          if [ ! -f "sing-box/libbox.aar" ]; then
            echo "::error::libbox.aar not found! Build failed."
            exit 1
          fi

      - name: Decode Keystore & Build APK
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > ./sing-box-for-android/app/release.keystore
          mkdir -p sing-box-for-android/app/libs
          cp sing-box/libbox.aar sing-box-for-android/app/libs/
          
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
          
          mkdir -p ../apks
          for file in app/build/outputs/apk/other/release/*.apk; do
            if [ -f "$file" ]; then
              basename_file=$(basename "$file")
              mv -f "$file" "../apks/SFA-${{ matrix.target.id }}-${basename_file}"
              printf '{\n  "version_code": %s,\n  "version_name": "%s",\n  "build_time": "%s",\n  "workflow_run_id": "%s",\n  "naive_enabled": %s\n}\n' \
                "${{ steps.version_code.outputs.code }}" \
                "${{ matrix.target.ver }}" \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                "${{ github.run_id }}" \
                "${{ github.event.inputs.enable_naive }}" \
                > "../apks/SFA-${{ matrix.target.id }}-metadata.json"
            fi
          done

      - name: Verify APK Signature
        if: steps.sfa_check.outputs.exists == 'true'
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f -executable | sort -r | head -n 1)
          if [ -n "$APKSIGNER" ] && ls apks/*.apk >/dev/null 2>&1; then
            $APKSIGNER verify --print-certs -v apks/*.apk || echo "::warning::APK signature verification failed"
          else
            echo "::warning::apksigner not found in SDK path or no APKs to verify"
          fi

      - name: Upload APK and Metadata
        if: steps.sfa_check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target.id }}-${{ github.run_number }}
          path: apks/*

  publish:
    needs: [init, check, build_core, build_android]
    if: always() && needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./tmp/

      - name: Process, Compress & Package
        run: |
          mkdir -p ./release_files
          
          for dir in ./tmp/core-*; do
            if [[ -d "$dir" ]]; then
              base=$(basename "$dir" | sed 's/core-//' | sed 's/-[0-9]*$//') # 清除 run_number 後綴
              if [[ "$base" == *"windows"* ]]; then
                mv "$dir"/sing-box* "sing-box.exe"
                cp "sing-box.exe" "sing-box-original.exe"
                if [[ "$base" == *"amd64-v3"* ]]; then
                  upx --best --lzma "sing-box.exe" || true
                fi
                if [ -f "$dir/libcronet.dll" ]; then
                  mv "$dir"/libcronet.dll .
                  zip -q9 "release_files/sing-box-${base}.zip" "sing-box.exe" "libcronet.dll"
                  zip -q9 "release_files/sing-box-${base}-original.zip" "sing-box-original.exe" "libcronet.dll"
                  rm -f libcronet.dll
                else
                  zip -q9 "release_files/sing-box-${base}.zip" "sing-box.exe"
                  zip -q9 "release_files/sing-box-${base}-original.zip" "sing-box-original.exe"
                fi
                rm -f "sing-box.exe" "sing-box-original.exe"
              elif [[ "$base" != *"mips"* ]] && [[ "$base" != *"armv5"* ]] && [[ "$base" != *"armv6"* ]]; then
                mv "$dir"/sing-box* "sing-box"
                chmod +x "sing-box"
                cp "sing-box" "sing-box-original"
                upx --best --lzma "sing-box" || true
                tar --no-same-owner -czf "release_files/sing-box-${base}.tar.gz" "sing-box"
                tar --no-same-owner -czf "release_files/sing-box-${base}-original.tar.gz" "sing-box-original"
                rm -f "sing-box" "sing-box-original"
              else
                mv "$dir"/sing-box* "sing-box"
                chmod +x "sing-box"
                tar --no-same-owner -czf "release_files/sing-box-${base}.tar.gz" "sing-box"
                rm -f "sing-box"
              fi
            fi
          done
          
          for dir in ./tmp/apk-*; do
            if [[ -d "$dir" ]]; then mv "$dir"/* release_files/; fi
          done

          echo -e "# 🚀 sing-box 自動編譯\n\n## 📦 本次更新內容\n" > release_body.txt
          if [ -f "./tmp/workflow-metadata/release_notes.txt" ]; then 
            cat ./tmp/workflow-metadata/release_notes.txt >> release_body.txt
          fi
          
          echo "" >> release_body.txt
          echo "### ⏱️ 構建時間統計" >> release_body.txt
          echo "- **開始時間**: ${{ needs.init.outputs.start_time }}" >> release_body.txt
          END_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "- **結束時間**: $END_TIME" >> release_body.txt
          
          START_EPOCH=$(date -d "${{ needs.init.outputs.start_time }}" +%s 2>/dev/null || echo "")
          END_EPOCH=$(date -d "$END_TIME" +%s 2>/dev/null || echo "")
          if [ -n "$START_EPOCH" ] && [ -n "$END_EPOCH" ]; then
            DURATION=$((END_EPOCH - START_EPOCH))
            MINUTES=$((DURATION / 60))
            SECONDS=$((DURATION % 60))
            echo "- **總耗時**: ${MINUTES} 分 ${SECONDS} 秒" >> release_body.txt
          fi

      - name: Check if release files exist
        id: check_files
        run: |
          if ls ./release_files/* >/dev/null 2>&1; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
          else
            echo "::error::No files found to release. Build might have failed entirely."
            echo "files_exist=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Publish Release
        if: steps.check_files.outputs.files_exist == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sing-box
          name: sing-box
          body_path: release_body.txt
          files: ./release_files/*
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old workflow runs (keeping latest 5)..."
          CURRENT_RUN="${{ github.run_id }}"
          
          ALL_RUNS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != $CURRENT_RUN) | .id" 2>/dev/null || echo "")
          
          TOTAL=$(echo "$ALL_RUNS" | wc -l)
          KEEP=5
          
          if [ "$TOTAL" -gt "$KEEP" ]; then
            echo "$ALL_RUNS" | tail -n +$((KEEP + 1)) | while read run_id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>/dev/null && \
                echo "Deleted old run: $run_id" || true
            done
          fi

      - name: Clean old releases
        if: github.event.inputs.force_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_COUNT=$(gh release list --repo "${{ github.repository }}" --json tagName -q '.[] | .tagName' | wc -l)
          if [ "$RELEASE_COUNT" -gt 3 ]; then
            gh release list --repo "${{ github.repository }}" --json tagName -q '.[] | .tagName' | tail -n +4 | while read -r tag; do
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            done
          fi

  telegram_notify:
    needs: [build_core, build_android, publish]
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.enable_telegram == 'true'
    steps:
      - name: Generate Telegram Message
        id: status
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "TG_MESSAGE<<$EOF"
            if [ "${{ needs.build_core.result }}" == "failure" ] || [ "${{ needs.build_android.result }}" == "failure" ] || [ "${{ needs.publish.result }}" == "failure" ]; then
              echo "❌ **sing-box 自動編譯失敗**"
              echo ""
              echo "部分構建任務發生錯誤，請前往 GitHub Actions 頁面查看詳細錯誤日誌。"
            else
              echo "🚀 **sing-box 自動編譯完成**"
              echo ""
              echo "已檢測到代碼更新或觸發強制編譯，最新內核與 Android APK 已經打包完畢。"
              echo ""
              echo "📎 **附件為部分最新核心文件**"
              echo "[👉 點擊前往 GitHub 獲取全平台文件](https://github.com/${{ github.repository }}/releases/tag/sing-box)"
            fi
            echo "$EOF"
          } >> "$GITHUB_ENV"
          
          if [ "${{ needs.build_core.result }}" == "failure" ] || [ "${{ needs.build_android.result }}" == "failure" ] || [ "${{ needs.publish.result }}" == "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts for TG
        if: steps.status.outputs.status == 'success'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Find key files for TG
        if: steps.status.outputs.status == 'success'
        id: find_files
        run: |
          ANDROID_APK=$(find dist -name "*.apk" -type f 2>/dev/null | head -n 1)
          
          LINUX_TAR=$(find dist -name "*linux-amd64-v3*.tar.gz" ! -name "*-original*" -type f 2>/dev/null | head -n 1)
          if [ -z "$LINUX_TAR" ]; then
            LINUX_TAR=$(find dist -name "*linux-amd64*v3*glibc*.tar.gz" -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$LINUX_TAR" ]; then
            LINUX_TAR=$(find dist -name "*linux-amd64*v3*.tar.gz" -type f 2>/dev/null | head -n 1)
          fi
          
          WINDOWS_ZIP=$(find dist -name "*windows-amd64-v3*.zip" ! -name "*-original*" -type f 2>/dev/null | head -n 1)
          
          FILES=""
          [ -n "$ANDROID_APK" ] && FILES="$ANDROID_APK"
          [ -n "$LINUX_TAR" ] && FILES="$FILES%0A$LINUX_TAR"
          [ -n "$WINDOWS_ZIP" ] && FILES="$FILES%0A$WINDOWS_ZIP"
          
          echo "upload_files=$FILES" >> $GITHUB_OUTPUT

      - name: Telegram notification
        if: steps.status.outputs.status == 'success' || steps.status.outputs.status == 'failed'
        uses: xz-dev/TelegramFileUploader@v1
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: ${{ env.TG_MESSAGE }}
          files: |
            ${{ steps.find_files.outputs.upload_files }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  update_readme:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Metadata
        uses: actions/download-artifact@v4
        with:
          name: workflow-metadata
          path: ./metadata/

      - name: Generate README
        run: |
          cat > README.md <<EOF
          # 🚀 sing-box 自動編譯系統
          
          > 自動檢測並編譯 [SagerNet/sing-box](https://github.com/SagerNet/sing-box)、[reF1nd/sing-box](https://github.com/reF1nd/sing-box) 和 [PuerNya/sing-box](https://github.com/PuerNya/sing-box)
          
          ## 📦 最新版本狀態 ($(date '+%Y-%m-%d %H:%M UTC'))
          
          $(cat ./metadata/release_notes.txt 2>/dev/null || echo "暫無更新記錄")
          
          ---
          
          ## 📥 快速安裝 (Linux AMD64)
          
          \`\`\`bash
          # 獲取 SagerNet_Stable 示例
          curl -LO https://github.com/${{ github.repository }}/releases/download/sing-box/sing-box-SagerNet_Stable-linux-amd64-v3.tar.gz
          tar -xzf sing-box-SagerNet_Stable-linux-amd64-v3.tar.gz
          chmod +x sing-box
          sudo mv sing-box /usr/local/bin/
          \`\`\`
          
          ## 📦 文件命名規則
          
          - **默認版本** (\`xxx.tar.gz\` / \`xxx.zip\`): 
            - 大多數架構: 經過 UPX 壓縮，體積小，推薦大多數用戶使用。
            - MIPS/ARMv5/v6: 原始二進制（因 UPX 不支持這些架構）。
          - **完整原始版** (\`xxx-original.tar.gz\` / \`xxx-original.zip\`): 未經壓縮的原始二進制，適合殺毒軟件誤報或特殊環境（僅非 MIPS 架構提供）。
          
          ## 🛠️ 支持的版本與特性
          
          | 版本 | 分支 | 平台支持 |
          |------|------|---------|
          | SagerNet OldStable | oldstable | Linux/Windows/Android |
          | SagerNet Stable | stable | Linux/Windows/Android |
          | SagerNet Testing | testing | Linux/Windows/Android |
          | reF1nd OldStable | reF1nd-oldstable | Linux/Windows/Android |
          | reF1nd Stable | reF1nd-stable | Linux/Windows/Android |
          | reF1nd Testing | reF1nd-testing | Linux/Windows/Android |
          | PuerNya Building | building | Linux/Windows |
          
          - 架构支持完善 (amd64, arm, mips)
          - SFA Android 客戶端同步編譯 (自帶包名偽裝與在線更新劫持)
          - 自動動態拉取最新 Tag，使用時間戳控制 Android 版本升級覆蓋
          - CGO 環境動態適配，舊工作流自動清理
          - 智能雙版本構建策略，動態提供壓縮與未壓縮核心
          
          ## 🔔 Telegram 通知配置
          若需啟用 Telegram 推送，請在倉庫的 Secrets 中配置以下內容：
          - \`TELEGRAM_BOT_TOKEN\`: 你的 Bot Token (由 @BotFather 獲取)
          - \`CHAT_ID\`: 接收消息的用戶或頻道 ID
          - \`API_ID\` & \`API_HASH\`: (必須) 請在 [my.telegram.org](https://my.telegram.org) 申請獲取
          
          ## 🏗️ 编译标签 (Tags)
          \`\`\`text
          SagerNet: ${TAGS_SAGERNET}
          reF1nd: ${TAGS_REF1ND}
          PuerNya: ${TAGS_PUERNYA}
          Android Extra: ${TAGS_ANDROID_EXTRA}
          \`\`\`
          
          [🔗 前往 Releases 页面下载](https://github.com/${{ github.repository }}/releases/tag/sing-box)
          EOF

      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update README with latest build info" && git push

      - name: Backup patch hashes
        continue-on-error: true
        run: |
          if [ -f "./metadata/.github/patch_hashes.sh" ]; then
            git checkout --orphan patches-backup
            git rm -rf .
            mkdir -p .github
            cp ./metadata/.github/patch_hashes.sh .github/
            git add .github/patch_hashes.sh
            git commit -m "chore: backup patch hashes for run ${{ github.run_number }}"
            git push --force origin patches-backup
          fi

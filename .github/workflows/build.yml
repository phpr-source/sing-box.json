          TIME=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '.[] | select(.tag_name | contains("alpha") | not) | (.published_at // .created_at)' | head -n 1 | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "time=$TIME" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TAGS_COMMON }}" >> $GITHUB_OUTPUT

      - name: Check update
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
            echo "skip_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$current_body" | grep -q "sing-box Stable|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"; then

name: Update sing-box

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build all versions"
        required: false
        type: boolean
        default: false
      enable_tg:
        description: "Enable Telegram notification"
        required: true
        type: boolean
        default: false
      enable_android:
        description: "Enable Android build"
        required: true
        type: boolean
        default: true
      enable_upx:
        description: "Enable UPX compression"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/workflows/*.yml"

env:
  GO_VERSION: "~1.23.0"
  TAGS_COMMON: "with_quic,with_utls,with_clash_api,with_gvisor"

jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.go.outputs.version }}
    steps:
      - name: Get Go latest version
        id: go
        run: |
          echo "version=$(curl -sSL https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | jq -r '.[0].version')" >> $GITHUB_OUTPUT

  singbox_oldstable_version:
    runs-on: ubuntu-latest
    needs: go
    outputs:
      version: ${{ steps.version.outputs.version }}
      time: ${{ steps.version.outputs.time }}
      tags: ${{ steps.version.outputs.tags }}
      skip_update: ${{ steps.compare.outputs.skip_update }}
    steps:
      - name: Checkout oldstable
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: oldstable
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Get version info
        id: version
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '.[] | select(.tag_name | contains("alpha") | not) | .tag_name' | head -n 1 | sed 's/^v//')
          TIME=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '.[] | select(.tag_name | contains("alpha") | not) | (.published_at // .created_at)' | head -n 1 | xargs -I {} date -d '{} +8 hours' '+%Y-%m-%d')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "time=$TIME" >> $GITHUB_OUTPUT
          echo "tags=${{ env.TAGS_COMMON }}" >> $GITHUB_OUTPUT

      - name: Check update
        id: compare
        run: |
          if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
            echo "skip_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          current_body=$(curl -sSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/sing-box" | jq -r '.body // ""')
          if echo "$current_body" | grep -q "sing-box OldStable|${{ steps.version.outputs.version }}|${{ steps.version.outputs.time }}"; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
          else
            echo "skip_update=false" >> $GITHUB_OUTPUT
          fi

  singbox_oldstable_cross:
    runs-on: ubuntu-latest
    if: needs.singbox_oldstable_version.outputs.skip_update != 'true'
    needs: [go, singbox_oldstable_version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-v1, goos: linux, goarch: amd64, goamd64: v1 }
          - { name: linux-amd64-v3, goos: linux, goarch: amd64, goamd64: v3 }
          - { name: linux-armv5, goos: linux, goarch: arm, goarm: 5 }
          - { name: linux-armv6, goos: linux, goarch: arm, goarm: 6 }
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: 7 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mipsle-hardfloat, goos: linux, goarch: mipsle, gomips: hardfloat }
          - { name: windows-amd64-v1, goos: windows, goarch: amd64, goamd64: v1 }
          - { name: windows-amd64-v3, goos: windows, goarch: amd64, goamd64: v3 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      CGO_ENABLED: 0
      BUILD_VERSION: ${{ needs.singbox_oldstable_version.outputs.version }}
      BUILD_TAGS: ${{ needs.singbox_oldstable_version.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: oldstable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.go.outputs.go_version }}

      - name: Build
        run: go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${BUILD_VERSION}' -s -w -buildid=" -tags "${BUILD_TAGS}" ./cmd/sing-box

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-oldstable-${{ matrix.name }}
          path: sing-box*

  singbox_stable_version:
    runs-on: ubuntu-latest
    needs: go
    outputs:

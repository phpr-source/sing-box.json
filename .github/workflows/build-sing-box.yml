name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      rebuild_target:
        description: "Rebuild specific target only (Rebuild all by default)"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "reF1nd_Stable"
          - "reF1nd_Testing"
      rebuild_platform:
        description: "Filter platform by substring (e.g. arm64, mips)"
        required: false
        type: string
        default: ""
      build_commit:
        description: "Build specific commit SHA (leave empty for branch HEAD)"
        required: false
        type: string
        default: ""
      skip_version_check:
        description: "Skip version check API calls and build immediately"
        required: false
        type: boolean
        default: false
      force_build:
        description: "Force build all targets (Ignore version match)"
        required: false
        type: boolean
        default: false
      override_version:
        description: "Override version (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      enable_telegram:
        description: "Enable Telegram notification"
        required: false
        type: boolean
        default: false
      enable_naive:
        description: "Additionally build linux glibc/musl CLI with chromium-toolchain naive (windows/darwin and linux purego amd64/arm64 include naive by default)"
        required: false
        type: boolean
        default: false
      publish_type:
        description: "Release publishing strategy"
        required: false
        type: choice
        default: "rolling"
        options:
          - "rolling"
          - "versioned"
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-sing-box.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 絕不取消進行中的 run：publish 階段會刪除並重建 release tag，中途取消會留下
  # 混合新舊資產的同名 release。新 run 排隊等待（同組僅保留最新排隊者）。
  # 對齊 reF1nd publish.yml 的 cancel-in-progress: false 保護語義。
  cancel-in-progress: false

# 2026-10-04 借鑒上游最小權限模型：頂層僅讀，寫權限下沉到實際需要的 job
# （publish* 需 contents:write；attest 另需 id-token/attestations；finalize 推送
# README/release-info 需 contents:write；issue 自動化需 issues:write）。
permissions:
  contents: read

env:
  # Go 版本不在此配置：由 check job 從上游官方 build.yml 動態解析（當前 1.26.8，
  # 高於 go.mod 下限 1.25.5——上游官方產物即用該工具鏈編譯），三個 build job 統一取用。
  TAGS_COMMON: "badlinkname,tfogo_checklinkname0,with_gvisor,with_quic,with_utls,with_clash_api,with_wireguard,with_tailscale"
  TAGS_CLI_EXTRA: "with_dhcp,with_acme,with_ccm,with_ocm,with_cloudflared,with_usbip"
  # 2026-10-02 對齊上游：SFA 的 libbox 構建已整體切換為上游自有 build_libbox
  # 工具，其 tags/API/LDFLAGS 全部來自上游源碼（sharedTags 已含 ts_omit 瘦身
  # 清單），故原 TAGS_SFA_EXTRA/TAGS_ANDROID_EXTRA（含已移除的 with_conntrack）
  # 不再被引用而刪除。
  CURL_TIMEOUT_API: 60

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.time.outputs.start }}
      android_secrets_valid: ${{ steps.validate.outputs.android_secrets_valid }}
    steps:
      - name: Record Start Time
        id: time
        run: echo "start=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Validate Secrets
        id: validate
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || '' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          CHAT_ID: ${{ secrets.CHAT_ID || '' }}
          API_ID: ${{ secrets.API_ID || '' }}
          API_HASH: ${{ secrets.API_HASH || '' }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.enable_telegram }}" == "true" ]]; then
            if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$CHAT_ID" || -z "$API_ID" || -z "$API_HASH" ]]; then
              echo "::warning::Telegram secrets missing. Notifications may fail."
            fi
          fi
          if [[ -z "$ANDROID_KEYSTORE" || -z "$KEYSTORE_PASS" || -z "$ALIAS_NAME" || -z "$ALIAS_PASS" ]]; then
            echo "::warning::Android Keystore secrets missing."
            echo "android_secrets_valid=false" >> $GITHUB_OUTPUT
          else
            echo "android_secrets_valid=true" >> $GITHUB_OUTPUT
          fi

  check:
    needs: [init]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_update: ${{ steps.check.outputs.has_update }}
      go_version: ${{ steps.gover.outputs.go_version }}
      go_version_darwin: ${{ steps.gover.outputs.go_version_darwin }}
    steps:
      - name: Check versions and generate matrix
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api_call_with_retry() {
            local url="$1"
            local res
            if ! res=$(curl -sfL -m ${CURL_TIMEOUT_API} --retry 3 --retry-delay 5 --retry-connrefused -H "Authorization: token $GH_TOKEN" "$url"); then
              echo "::warning::API call failed for $url" >&2
              echo "[]"
            else
              echo "$res"
            fi
          }

          api_call_optional() {
            local url="$1"
            curl -sL -m ${CURL_TIMEOUT_API} --retry 2 --retry-delay 3 --retry-connrefused \
              -H "Authorization: token $GH_TOKEN" "$url" 2>/dev/null || echo "{}"
          }

          FORCE_BUILD="${{ github.event.inputs.force_build || 'false' }}"
          OVERRIDE_VERSION="${{ github.event.inputs.override_version || '' }}"
          TARGET_FILTER="${{ github.event.inputs.rebuild_target || 'all' }}"
          [ "$TARGET_FILTER" = "all" ] && TARGET_FILTER=""
          SKIP_CHECK="${{ github.event.inputs.skip_version_check || 'false' }}"

          LAST_BUILD_INFO="{}"
          if [ "$SKIP_CHECK" != "true" ]; then
            CONTENT=$(gh api "repos/${{ github.repository }}/contents/build-info.json?ref=release-info" -q ".content" 2>/dev/null || true)
            if [ -n "$CONTENT" ]; then
              LAST_BUILD_INFO=$(echo "$CONTENT" | base64 -d 2>/dev/null || echo "{}")
            fi
            if ! echo "$LAST_BUILD_INFO" | jq empty 2>/dev/null; then LAST_BUILD_INFO="{}"; fi
          fi

          echo "" > release_notes.txt
          rm -f /tmp/has_update_flag
          > /tmp/matrix.jsonl

          check_branch() {
            local id="${1:-}" repo="${2:-}" branch="${3:-}" sfa_repo="${4:-}" sfa_branch="${5:-}"

            if [ -n "$TARGET_FILTER" ] && [ "$TARGET_FILTER" != "$id" ]; then
              return 0
            fi

            local ver="" time="" commit_msg="" core_ref="" upstream_body=""

            if [ -n "$OVERRIDE_VERSION" ]; then
              ver="${OVERRIDE_VERSION}"
              core_ref="v${OVERRIDE_VERSION}"
              time="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            elif [ "$SKIP_CHECK" = "true" ]; then
              ver="$(echo "${{ github.sha }}" | cut -c1-8)"
              core_ref="$branch"
              time="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            else
              # git ls-remote 替代 REST API: 0 API 消耗、无分页限制
              local repo_url="https://github.com/$repo.git"
              local tags=$(git ls-remote --tags --refs "$repo_url" | awk -F'/' '{print $3}' | sort -V -r || echo "")
              local raw_tag=""
              if [[ "$branch" == *"testing"* ]]; then
                # 拆分 grep: 先筛 reF1nd 再筛预发布关键字, 防止顺序不匹配; || true 避免 pipefail 中断
                raw_tag=$(echo "$tags" | grep -i 'reF1nd' | grep -iE '(alpha|beta|rc)' | head -n 1 || true)
              else
                raw_tag=$(echo "$tags" | grep -i 'reF1nd' | grep -ivE '(alpha|beta|rc)' | head -n 1 || true)
              fi

              if [ -n "$raw_tag" ]; then
                ver=$(echo "$raw_tag" | sed 's/^v//')
                core_ref="$raw_tag"
                # 获取 tag 对应的 commit SHA, 精确匹配 refs/tags/ 防模糊
                local tag_sha=$(git ls-remote --tags "$repo_url" "refs/tags/${raw_tag}^{}" | awk '{print $1}')
                [ -z "$tag_sha" ] && tag_sha=$(git ls-remote --tags "$repo_url" "refs/tags/$raw_tag" | awk '{print $1}' | head -n 1)
                # 锁定 commit SHA（对齐 reF1nd resolve_source）：上游会 force-move tag，
                # 各 build job 若按 tag 名各自 checkout，同一版本号可能检出不同 commit。
                # check 阶段解析成功后统一传 SHA，matrix 全 job 检出完全一致的源码。
                # if 形式（非 && 短路）：tag_sha 为空时不能以非零退出触发 set -e。
                if [ -n "$tag_sha" ]; then core_ref="$tag_sha"; fi
                local commit_info=$(api_call_with_retry "https://api.github.com/repos/$repo/commits/$tag_sha")
              else
                # 兜底: 日期前缀 SHA, 保证单调递增
                local branch_sha=$(git ls-remote --heads "$repo_url" "refs/heads/$branch" | awk '{print $1}' | head -n 1)
                if [ -n "$branch_sha" ]; then
                  local today=$(TZ=Asia/Shanghai date '+%Y%m%d')
                  ver="${today}-$(echo "$branch_sha" | cut -c1-8)"
                  core_ref="$branch_sha"
                  local commit_info=$(api_call_with_retry "https://api.github.com/repos/$repo/commits/$branch_sha")
                else
                  echo "::warning::[$id] Cannot read commit SHA. Skipping."
                  return 0
                fi
              fi

              if [ -n "$ver" ] && [ "$ver" != "null" ]; then
                local release_info=$(api_call_optional "https://api.github.com/repos/$repo/releases/tags/v$ver")
                upstream_body=$(echo "$release_info" | jq -r '.body // empty' 2>/dev/null || echo "")
                local commit_date=$(echo "$commit_info" | jq -r '.commit.committer.date // empty' 2>/dev/null || echo "")
                commit_msg=$(echo "$commit_info" | jq -r '.commit.message // empty' 2>/dev/null | head -n 5 | sed 's/\r//g' || true)
                [ -z "$commit_msg" ] && commit_msg="無更新說明"

                if [ -n "$commit_date" ] && [ "$commit_date" != "null" ]; then
                  time=$(TZ=Asia/Shanghai date -d "$commit_date" '+%Y-%m-%d' 2>/dev/null || TZ=Asia/Shanghai date '+%Y-%m-%d')
                else
                  time="unknown"
                fi
              fi
            fi

            if [ -z "$ver" ] || [ "$ver" = "null" ] || [ -z "$time" ]; then
              echo "::warning::[$id] Cannot read valid version or time. Skipping."
              return 0
            fi

            if [[ "$sfa_repo" != "none" ]]; then
              if ! timeout 10 git ls-remote --heads "https://github.com/${sfa_repo}.git" "$sfa_branch" 2>/dev/null | grep -qw "$sfa_branch"; then
                echo "::warning::[$id] Android branch $sfa_repo/$sfa_branch not found. Disabling Android."
                sfa_repo="none"
                sfa_branch="none"
              fi
            fi

            local display_name="$id"
            local marker="[${id} v${ver}]"
            local branch_url="https://github.com/$repo/tree/$branch"

            LAST_VER=$(echo "$LAST_BUILD_INFO" | jq -r --arg id "$id" '.targets[]? | select(.target_id == $id) | .version_name // empty' 2>/dev/null | head -n 1 || true)

            if [ "$FORCE_BUILD" = "true" ] || [ -n "$OVERRIDE_VERSION" ] || [ -n "$TARGET_FILTER" ] || [ "$SKIP_CHECK" = "true" ]; then
              echo "true" > /tmp/has_update_flag
              echo "- 🔄 強制構建 **[$display_name]($branch_url)** \`v$ver\` ($time) $marker" >> release_notes.txt
              jq -n -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg core_ref "$core_ref" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" --arg msg "$commit_msg" --arg body "$upstream_body" '{id:$id, repo:$repo, branch:$branch, core_ref:$core_ref, sfa_repo:$sfa_repo, sfa_branch:$sfa_branch, ver:$ver, time:$time, msg:$msg, body:$body}' >> /tmp/matrix.jsonl
            elif [ "$LAST_VER" != "$ver" ] || [ -z "$LAST_VER" ]; then
              echo "true" > /tmp/has_update_flag
              echo "- ✨ 更新 **[$display_name]($branch_url)** 至 \`v$ver\`，發佈於 $time $marker" >> release_notes.txt
              jq -n -c --arg id "$id" --arg repo "$repo" --arg branch "$branch" --arg core_ref "$core_ref" --arg sfa_repo "$sfa_repo" --arg sfa_branch "$sfa_branch" --arg ver "$ver" --arg time "$time" --arg msg "$commit_msg" --arg body "$upstream_body" '{id:$id, repo:$repo, branch:$branch, core_ref:$core_ref, sfa_repo:$sfa_repo, sfa_branch:$sfa_branch, ver:$ver, time:$time, msg:$msg, body:$body}' >> /tmp/matrix.jsonl
            fi
          }

          check_branch "reF1nd_Stable"     "reF1nd/sing-box"   "reF1nd-stable"  "reF1nd/sing-box-for-android" "reF1nd-stable"
          check_branch "reF1nd_Testing"    "reF1nd/sing-box"   "reF1nd-testing" "reF1nd/sing-box-for-android" "reF1nd-testing"

          sed -i '/^ *$/d' release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "- 📝 自動構建完成（無版本變更檢測）" > release_notes.txt
          fi

          VALIDATED_MATRIX=$(jq -s -c '[.[] | select(.ver != null and .ver != "" and .time != null and .time != "")]' /tmp/matrix.jsonl 2>/dev/null || echo "[]")
          if [ -z "$VALIDATED_MATRIX" ] || ! echo "$VALIDATED_MATRIX" | jq empty 2>/dev/null; then
            VALIDATED_MATRIX="[]"
          fi

          echo "matrix=${VALIDATED_MATRIX}" >> $GITHUB_OUTPUT

          if [ -f /tmp/has_update_flag ] && [ "$VALIDATED_MATRIX" != "[]" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Go toolchain version
        id: gover
        run: |
          set -euo pipefail
          # 對齊上游官方產物的真實工具鏈。真相源是 reF1nd/sing-box-releases 的
          # build-{stable,testing}.yml（官方實際執行的管線）env 塊的 GO_VERSION
          # （當前 1.26.8）；源碼倉繼承自 sagernet 的 build.yml 恰好硬編碼同值，
          # 但可能與真實管線漂移，故僅作二級回退；go.mod（1.25.5 下限）三級回退。
          GO_VER=""
          for i in 1 2 3; do
            WF="$(curl -sfL -m ${CURL_TIMEOUT_API} \
              "https://raw.githubusercontent.com/reF1nd/sing-box-releases/dev/.github/workflows/build-testing.yml" || true)"
            if [ -n "$WF" ]; then
              GO_VER="$(echo "$WF" | grep -m1 -oE "GO_VERSION:[[:space:]]*'?\"?[0-9]+\.[0-9]+\.[0-9]+'?\"?" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
              [ -n "$GO_VER" ] && break
            fi
            sleep 5
          done
          if [ -z "$GO_VER" ]; then
            GO_VER="$(curl -sfL -m ${CURL_TIMEOUT_API} \
              "https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/.github/workflows/build.yml" \
              | grep -m1 -oE 'go-version:[[:space:]]*"?[0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          fi
          if [ -z "$GO_VER" ]; then
            GO_VER="$(curl -sfL -m ${CURL_TIMEOUT_API} \
              "https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/go.mod" \
              | sed -n 's/^go \([0-9.]*\)$/\1/p' | head -n1 || true)"
          fi
          if [ -z "$GO_VER" ]; then
            # 兜底：上次人工確認的上游值（2026-10-02）
            GO_VER="1.26.8"
            echo "::warning::Could not resolve upstream Go version; using last known value ${GO_VER}"
          fi
          # 第四輪對齊（2026-10-03）：上游 darwin CLI 行用獨立的 GO_VERSION_DARWIN
          # （當前與 GO_VERSION 同值 1.26.8；oldstable 管線中兩者已分叉
          # ~1.25.12/^1.25.3，證明該旋鈕真實使用）。一旦上游單獨調整 darwin
          # 工具鏈，本地 darwin 行必須跟隨而非沿用 CLI 版本，否則 darwin 產物
          # 與官方静默漂移。解析失敗時回退 GO_VER。
          GO_DARWIN_VER=""
          if [ -n "${WF:-}" ]; then
            GO_DARWIN_VER="$(echo "$WF" | grep -m1 -oE "GO_VERSION_DARWIN:[[:space:]]*'?\"?[0-9]+(\.[0-9]+)*'?\"?" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n1 || true)"
          fi
          if [ -z "$GO_DARWIN_VER" ]; then
            GO_DARWIN_VER="$GO_VER"
          fi
          echo "go_version=${GO_VER}" >> "$GITHUB_OUTPUT"
          echo "go_version_darwin=${GO_DARWIN_VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved Go toolchain: ${GO_VER} (darwin: ${GO_DARWIN_VER})"

      - name: Upload Metadata
        if: steps.check.outputs.has_update == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-metadata
          path: release_notes.txt
          retention-days: 1
          compression-level: 0

  build_core:
    needs: [init, check]
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != ''
    timeout-minutes: ${{ github.event.inputs.enable_naive == 'true' && 60 || 30 }}
    strategy:
      fail-fast: false
      # 2026-10-04：取消 enable_naive 時降到 2 的舊政策——那源自 android/darwin
      # 跳過+全矩陣 chromium 的舊語義；新語義下 chromium 僅及 linux cgo 腿，
      # 上游同類管線 max-parallel 高達 13，8 並發安全。
      max-parallel: 8
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
        platform:
          # --- x86_64 基础兼容版 (J1900/J4125/N5105 等无 AVX2 设备) ---
          - { name: linux-amd64-purego,  goos: linux, goarch: amd64, goamd64: v1, variant: purego, cgo: 0, upx: true, tags_extra: with_purego }
          - { name: linux-amd64-glibc,   goos: linux, goarch: amd64, goamd64: v1, variant: glibc,  cgo: 1, upx: true }
          - { name: linux-amd64-musl,    goos: linux, goarch: amd64, goamd64: v1, variant: musl,   cgo: 1, upx: true }
          - { name: windows-amd64,       goos: windows, goarch: amd64, goamd64: v1, upx: false, tags_extra: with_purego }
          - { name: darwin-amd64,        goos: darwin,  goarch: amd64, goamd64: v1, upx: false, cgo: "1" }

          # --- x86_64 高性能 v3 (N100/酷睿/Zen, 要求 AVX2) ---
          - { name: linux-amd64v3-purego, goos: linux, goarch: amd64, goamd64: v3, variant: purego, cgo: 0, upx: true, tags_extra: with_purego }
          - { name: linux-amd64v3-glibc,  goos: linux, goarch: amd64, goamd64: v3, variant: glibc,  cgo: 1, upx: true }
          - { name: linux-amd64v3-musl,   goos: linux, goarch: amd64, goamd64: v3, variant: musl,   cgo: 1, upx: true }
          - { name: windows-amd64v3,      goos: windows, goarch: amd64, goamd64: v3, upx: false, tags_extra: with_purego }
          - { name: darwin-amd64v3,       goos: darwin,  goarch: amd64, goamd64: v3, upx: false, cgo: "1" }
          # 對齊上游官方產品矩陣（build-testing.yml darwin-legacy 行）：補丁版 Go
          # （源碼倉 .github/setup_go_for_macos1013.sh 維護）+ MACOSX_DEPLOYMENT_TARGET
          # 10.13 + naive:false（讀 OTHERS）。為 macOS 10.13 High Sierra 用戶提供官方
          # 同款 legacy 產物。
          - { name: darwin-amd64-legacy-macos-10.13, goos: darwin, goarch: amd64, goamd64: v1, upx: false, cgo: "1", legacy_macos: "true", legacy_name: macos-10.13, macos_deployment_target: "10.13" }

          # --- ARM64 (Mac/R2S/R4S/树莓派4/5) ---
          - { name: linux-arm64-purego, goos: linux, goarch: arm64, variant: purego, cgo: 0, upx: true, tags_extra: with_purego }
          - { name: linux-arm64-glibc,  goos: linux, goarch: arm64, variant: glibc,  cgo: 1, upx: true }
          - { name: linux-arm64-musl,   goos: linux, goarch: arm64, variant: musl,   cgo: 1, upx: true }
          - { name: windows-arm64,      goos: windows, goarch: arm64, upx: false, tags_extra: with_purego }
          - { name: darwin-arm64,       goos: darwin,  goarch: arm64, upx: false, cgo: "1" }

          # --- ARMv7 (斐讯/网件/树莓派2/3) ---
          - { name: linux-armv7-purego, goos: linux, goarch: arm, goarm: 7, variant: purego, cgo: 0, upx: true, tags_extra: with_purego }
          - { name: linux-armv7-musl,   goos: linux, goarch: arm, goarm: 7, variant: musl,   cgo: 1, upx: true }

          # --- 传统嵌入式 (OpenWrt, purego + softfloat 防崩溃) ---
          - { name: linux-mipsle-purego,  goos: linux, goarch: mipsle,  gomips: softfloat, variant: purego, cgo: 0, upx: false, tags_extra: with_purego }
          - { name: linux-mips-purego,    goos: linux, goarch: mips,    gomips: softfloat, variant: purego, cgo: 0, upx: false, tags_extra: with_purego }
          - { name: linux-riscv64-purego, goos: linux, goarch: riscv64, variant: purego, cgo: 0, upx: false, tags_extra: with_purego }
          - { name: linux-riscv64-glibc,  goos: linux, goarch: riscv64, variant: glibc,  cgo: 1, upx: false }

          # --- Android CLI (Termux/ADB 用户) ---
          - { name: android-arm64,  goos: android, goarch: arm64,           ndk_triple: "aarch64-linux-android23", cgo: "1", upx: false }
          - { name: android-arm,    goos: android, goarch: arm,    goarm: 7, ndk_triple: "armv7a-linux-androideabi23", cgo: "1", upx: false }
          - { name: android-amd64,  goos: android, goarch: amd64,  goamd64: v1, ndk_triple: "x86_64-linux-android23",    cgo: "1", upx: false }
          - { name: android-amd64v3, goos: android, goarch: amd64,  goamd64: v3, ndk_triple: "x86_64-linux-android23",    cgo: "1", upx: false }
          - { name: android-386,    goos: android, goarch: 386,             ndk_triple: "i686-linux-android23",         cgo: "1", upx: false }
    runs-on: ${{ matrix.platform.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      GOOS: ${{ matrix.platform.goos }}
      GOARCH: ${{ matrix.platform.goarch }}
      GOAMD64: ${{ matrix.platform.goamd64 }}
      GOARM: ${{ matrix.platform.goarm }}
      GOMIPS: ${{ matrix.platform.gomips }}
    steps:
      - name: Platform Filter
        id: filter
        run: |
          FILTER="${{ github.event.inputs.rebuild_platform || '' }}"
          if [ -n "$FILTER" ]; then
            if [[ "${{ matrix.platform.name }}" != *"$FILTER"* ]]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Check Naive Compatibility
        id: check_naive
        if: steps.filter.outputs.skip != 'true'
        run: |
          # 2026-10-04 第八輪：naive 政策重構。舊語義（遺跡）：enable_naive=true
          # 時跳過 android/darwin 腿——那是 cronet 未接線時代的產物；如今 android
          # 恒 naive、darwin 經模塊分發庫即可 naive，跳過只會讓產物莫名消失。
          # 新語義：不再有任何腿因 naive 被跳過（skip 恆 false，下游條件不動），
          # naive 覆蓋由 Configure Tags 的「免費腿默認 naive」政策決定：
          #   - 恒 naive（與上游一一對應，無額外成本）：android、darwin 非 legacy、
          #     windows、linux purego 的 amd64/arm64（僅需隨包抽取 .so）
          #   - enable_naive=true 才 naive（需 chromium 工具鏈，成本高）：linux
          #     cgo glibc/musl（amd64/arm64 為上游同構路徑；本地獨有架構走混合模式）
          #   - 恒不 naive：darwin legacy（上游 legacy 行 naive:false）、linux mips
          #     大端（cronet-go 無 lib/linux_mips，庫不存在，2026-10-04 實查）
          # skip 輸出保留恆 false，下游步驟的 if 條件無需改動。
          echo "skip=false" >> $GITHUB_OUTPUT

          NAIVE_ELIGIBLE=false
          NEEDS_CRONET=false
          if [ "${{ matrix.platform.goos }}" = "android" ]; then
            NAIVE_ELIGIBLE=true
          elif [ "${{ matrix.platform.legacy_macos }}" = "true" ]; then
            NAIVE_ELIGIBLE=false
          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            NAIVE_ELIGIBLE=true
            NEEDS_CRONET=true
          elif [ "${{ matrix.platform.goos }}" = "darwin" ]; then
            NAIVE_ELIGIBLE=true
          elif [ "${{ matrix.platform.goos }}" = "linux" ]; then
            if [ "${{ matrix.platform.variant }}" = "purego" ]; then
              case "${{ matrix.platform.goarch }}" in
                amd64|arm64)
                  # 免費腿：僅需隨包抽取預編譯 libcronet.so（上游同款）
                  NAIVE_ELIGIBLE=true
                  NEEDS_CRONET=true
                  ;;
                mips)
                  # cronet-go 無大端 mips 預編譯庫，naive 不可用
                  NAIVE_ELIGIBLE=false
                  ;;
                *)
                  # 本地獨有 purego 架構（armv7/mipsle/riscv64）：庫存在
                  # （lib/linux_{arm,mipsle,riscv64}），僅 enable_naive 時跟隨
                  if [ "${{ github.event.inputs.enable_naive }}" = "true" ]; then
                    NAIVE_ELIGIBLE=true
                    NEEDS_CRONET=true
                  fi
                  ;;
              esac
            elif [ "${{ github.event.inputs.enable_naive }}" = "true" ]; then
              # linux cgo（glibc/musl）：chromium 工具鏈路徑
              NAIVE_ELIGIBLE=true
              NEEDS_CRONET=true
            fi
          fi
          echo "naive_eligible=${NAIVE_ELIGIBLE}" >> $GITHUB_OUTPUT
          echo "needs_cronet=${NEEDS_CRONET}" >> $GITHUB_OUTPUT

      - name: Resolve Commit
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        id: resolve
        run: |
          COMMIT="${{ github.event.inputs.build_commit || '' }}"
          COMMIT="$(echo "$COMMIT" | xargs)"
          if [ -z "$COMMIT" ]; then
            COMMIT="${{ matrix.target.core_ref }}"
          fi
          if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
            echo "::error::Resolved commit ref is empty or null!"
            exit 1
          fi
          echo "ref=$COMMIT" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # 主仓（本仓库）检出到 workspace 根：Apply Patches 依赖 ../patches/ 目录。
          # 历史缺陷：此前从未检出主仓，patches/ 不存在导致所有 build_core 静默应用 0 个
          # patch（XHTTP/autoban 等从未进入 CLI 产物）。
          sparse-checkout: |
            patches
          sparse-checkout-cone-mode: false

      - name: Checkout Core
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          path: sing-box
          fetch-depth: 1

      - name: Clean Workspace
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        working-directory: sing-box
        run: |
          git clean -fdx
          git reset --hard

      - name: Apply Patches
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        working-directory: sing-box
        run: |
          set -e
          applied=0
          for dir in "../patches/common" "../patches/${{ matrix.target.id }}"; do
            [ -d "$dir" ] || continue
            for p in "$dir"/*.patch; do
              [ -f "$p" ] || continue
              echo "::notice::Applying patch $(basename "$p")"
              # 直線套用失敗時改以 --3way 重試，上游小幅漂移可自動吸收。
              # 限制：--3way 需要補丁 index 行引用的 blob 存在於物件庫，而 Checkout Core
              # 使用 fetch-depth: 1，淺克隆通常不含這些 blob，此時回退不生效並照常報錯
              # （不會比現狀更糟，但也無法保證有效）。
              # 無論如何都要明確指出是哪個 dir 的哪個 patch 失敗，避免重演過去
              # 「只知道 Apply Patches 紅了、不知道是哪個補丁」的狀況。
              if ! git apply -v "$p" 2>/tmp/patch_err.txt; then
                echo "::warning::直接套用失敗，嘗試 --3way：$(basename "$p")"
                cat /tmp/patch_err.txt
                git apply -v --3way "$p" || {
                  echo "::error::PATCH FAILED: $(basename "$p") (dir=$dir, target=${{ matrix.target.id }})"
                  cat /tmp/patch_err.txt
                  exit 1
                }
              fi
              applied=$((applied+1))
            done
          done
          echo "Applied $applied patch(es)."

      - name: Setup Go
        # darwin legacy（macos-10.13）行改用源碼倉維護的補丁版 Go（見下一步驟）
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && matrix.platform.legacy_macos != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # 上游官方產物的真實工具鏈（由 check job 動態解析，當前 1.26.8），
          # 非再沿用 go.mod 下限 1.25.5——與官方二進制的 stdlib 級差異已對齊。
          # darwin 行取上游專用的 GO_VERSION_DARWIN（上游 Setup Go for Darwin
          # 同款，當前同值；上游單調 darwin 版本時自動跟隨），其餘行用 CLI 版本。
          go-version: "${{ matrix.platform.goos == 'darwin' && needs.check.outputs.go_version_darwin || needs.check.outputs.go_version }}"
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Setup patched Go for macOS 10.13 legacy
        # 對齊官方（build-testing.yml "Setup Go for macOS 10.13"）：腳本由上游
        # 源碼倉維護（.github/setup_go_for_macos1013.sh，帶三個補丁 commit 的
        # Go 1.26.8，恢复 macOS 10.13 支持），本地零維護隨源碼跟隨。
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && matrix.platform.legacy_macos == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sing-box/.github/setup_go_for_macos1013.sh
          echo "PATH=$HOME/go/go_osx/bin:$PATH" >> "$GITHUB_ENV"
          echo "GOROOT=$HOME/go/go_osx" >> "$GITHUB_ENV"
          "$HOME/go/go_osx/bin/go" version

      - name: Configure Tags and CGO
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        id: env
        run: |
          CGO_VAL="${{ matrix.platform.cgo || '0' }}"
          ARCHIVE_SUFFIX=""

          # 基础 tags 以 reF1nd 上游为基准：跟随源码 release/ 目录的 tag 文件自动同步
          # （上游新增 tag 如 with_openvpn/with_openconnect 无需人工维护）。
          # 老版本源码缺文件时 fallback 到 env；本地独有产品线的 env 基线
          # 经下方去重保序合并后保留。
          # 2026-10-04 第八輪：naive 政策重構後的文件選擇——與上游 Compute build
          # environment 同構：windows 非 legacy 恒讀 WINDOWS（上游 windows 行恒
          # naive）；naive 腿讀 DEFAULT；其餘讀 OTHERS。免費腿（android/darwin
          # 非 legacy/windows/linux purego amd64|arm64）默認即 naive，與上游產物
          # 對齊且無額外構建成本；linux cgo 的 naive 維持 enable_naive 門控
          # （chromium 工具鏈成本），本地獨有架構的差異參見 check_naive 步驟註釋。
          TAGS="${{ env.TAGS_COMMON }},${{ env.TAGS_CLI_EXTRA }}"
          FORCE_NAIVE=false
          if [ "${{ matrix.platform.goos }}" = "android" ]; then
            TAGS_FILE="sing-box/release/DEFAULT_BUILD_TAGS"
            FORCE_NAIVE=true
          elif [ "${{ matrix.platform.legacy_macos }}" != "true" ] && [ "${{ matrix.platform.goos }}" = "windows" ]; then
            TAGS_FILE="sing-box/release/DEFAULT_BUILD_TAGS_WINDOWS"
          elif [ "${{ steps.check_naive.outputs.naive_eligible }}" = "true" ]; then
            TAGS_FILE="sing-box/release/DEFAULT_BUILD_TAGS"
          else
            TAGS_FILE="sing-box/release/DEFAULT_BUILD_TAGS_OTHERS"
          fi
          SRC_TAGS=$(cat "$TAGS_FILE" 2>/dev/null || true)
          # tags 基準的跟隨策略（第四輪確立、第八輪隨 naive 政策擴展）：與上游
          # 存在一一對應產物的行，tags 純跟隨源碼 tag 文件——上游對文件的增刪
          # （如 testing 2026-09-27 77c97b03 "Remove dependency on gVisor" 同時
          # 從 OTHERS/WINDOWS 移除 with_gvisor）必須如實反映到產物。免費腿默認
          # naive 後，windows/darwin 非 legacy/linux purego amd64|arm64 全部成為
          # 對應行；本地獨有產品線（linux cgo 非 enable_naive、armv7/mips/mipsle/
          # riscv64 非 enable_naive）保留 env 基線疊加以維持本地 gvisor 等特性；
          # 老源碼缺 tag 文件時同樣回退 env 基線。
          HAS_COUNTERPART=false
          if [ "${{ matrix.platform.goos }}" = "android" ]; then
            HAS_COUNTERPART=true
          elif [ "${{ matrix.platform.legacy_macos }}" = "true" ]; then
            HAS_COUNTERPART=true
          elif [ "${{ steps.check_naive.outputs.naive_eligible }}" = "true" ]; then
            HAS_COUNTERPART=true
          fi
          if [ -n "$SRC_TAGS" ]; then
            if [ "$HAS_COUNTERPART" = "true" ]; then
              TAGS="$SRC_TAGS"
            else
              TAGS="${SRC_TAGS},${TAGS}"
            fi
          fi

          # 追加順序對齊上游 Compute build environment（文件序 → naive → ebpf →
          # purego/musl）：有上游對應物的腿，二進制內嵌的 -tags 串（sing-box
          # version 的 Tags 行即原串）與官方逐字一致。
          # naive：android 恒带；免費腿默認帶；linux cgo 隨 enable_naive；
          # darwin legacy（macos-10.13）恒不带（官方 legacy 行 naive:false）。
          if [ "${{ matrix.platform.legacy_macos }}" = "true" ]; then
            TAGS=$(echo "${TAGS}" | tr ',' '\n' | grep -v '^with_naive_outbound$' | grep -v '^$' | paste -sd, -)
          elif [ "$FORCE_NAIVE" = "true" ] || [ "${{ steps.check_naive.outputs.naive_eligible }}" = "true" ]; then
            TAGS="${TAGS},with_naive_outbound"
          fi

          # 上游官方（build-testing.yml Compute build environment）：linux/android
          # 在源码含 include/ebpf.go 时自动追加 with_ebpf。
          if [ "${{ matrix.platform.goos }}" = "linux" ] || [ "${{ matrix.platform.goos }}" = "android" ]; then
            if [ -f sing-box/include/ebpf.go ] && ! echo "${TAGS}" | grep -q 'with_ebpf'; then
              TAGS="${TAGS},with_ebpf"
            fi
          fi

          if [ -n "${{ matrix.platform.tags_extra }}" ]; then
            TAGS="${TAGS},${{ matrix.platform.tags_extra }}"
          fi

          case "${{ matrix.platform.variant }}" in
            musl)
              TAGS="${TAGS},with_musl"
              if [[ "${{ matrix.platform.name }}" != *-musl ]]; then ARCHIVE_SUFFIX="-musl"; fi
              if [ "${{ matrix.platform.goarch }}" = "amd64" ]; then
                sudo apt-get update && sudo apt-get install -y musl-tools
                echo "CC=musl-gcc" >> $GITHUB_ENV
              fi
              ;;
            purego)
              TAGS="${TAGS},with_purego"
              if [[ "${{ matrix.platform.name }}" != *-purego ]]; then ARCHIVE_SUFFIX="-purego"; fi
              ;;
            glibc)
              if [[ "${{ matrix.platform.name }}" != *-glibc ]]; then ARCHIVE_SUFFIX="-glibc"; fi
              ;;
            *)
              ;;
          esac

          # 去重保序（awk 首现保留）：替代 sort -u——字典序重排會讓二進制內嵌
          # -tags 串與上游「文件序 + 追加」不同（集合相同、順序不同，見上方註釋）。
          TAGS=$(echo "${TAGS}" | tr ',' '\n' | grep -v '^$' | awk '!seen[$0]++' | paste -sd, -)
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "suffix=${ARCHIVE_SUFFIX}" >> $GITHUB_OUTPUT
          echo "cgo_val=${CGO_VAL}" >> $GITHUB_OUTPUT

          # Archive name 直接使用平台名。2026-10-02 對齊上游官方：不再剝離
          # -purego 後綴——官方 linux purego 產物名即含 -purego
          # （sing-box-<ver>-linux-amd64-purego.tar.gz），剝離後的
          # linux-amd64.tar.gz 在官方命名體系中不存在，易與 glibc 產物混淆。
          ARCHIVE_NAME="${{ matrix.platform.name }}"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Install GCC cross-compilers for glibc targets
        if: >-
          steps.check_naive.outputs.skip != 'true' &&
          steps.filter.outputs.skip != 'true' &&
          steps.env.outputs.cgo_val == '1' &&
          matrix.platform.goos == 'linux' &&
          matrix.platform.variant == 'glibc' &&
          matrix.platform.goarch != 'amd64'
        run: |
          sudo apt-get update
          case "${{ matrix.platform.goarch }}" in
            arm64)    sudo apt-get install -y gcc-aarch64-linux-gnu; echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV" ;;
            arm)      sudo apt-get install -y gcc-arm-linux-gnueabihf; echo "CC=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV" ;;
            mips64le) sudo apt-get install -y gcc-mips64el-linux-gnuabi64; echo "CC=mips64el-linux-gnuabi64-gcc" >> "$GITHUB_ENV" ;;
            mipsle)   sudo apt-get install -y gcc-mipsel-linux-gnu; echo "CC=mipsel-linux-gnu-gcc" >> "$GITHUB_ENV" ;;
            mips64)   sudo apt-get install -y gcc-mips64-linux-gnuabi64; echo "CC=mips64-linux-gnuabi64-gcc" >> "$GITHUB_ENV" ;;
            mips)     sudo apt-get install -y gcc-mips-linux-gnu; echo "CC=mips-linux-gnu-gcc" >> "$GITHUB_ENV" ;;
            riscv64)  sudo apt-get install -y gcc-riscv64-linux-gnu; echo "CC=riscv64-linux-gnu-gcc" >> "$GITHUB_ENV" ;;
          esac

      - name: Setup Zig for CGO cross compilation (musl only)
        if: >-
          steps.check_naive.outputs.skip != 'true' &&
          steps.filter.outputs.skip != 'true' &&
          steps.env.outputs.cgo_val == '1' &&
          matrix.platform.goos == 'linux' &&
          matrix.platform.variant == 'musl' &&
          matrix.platform.goarch != 'amd64'
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with:
          version: 0.13.0

      - name: Export Zig CC (musl only)
        if: >-
          steps.check_naive.outputs.skip != 'true' &&
          steps.filter.outputs.skip != 'true' &&
          steps.env.outputs.cgo_val == '1' &&
          matrix.platform.goos == 'linux' &&
          matrix.platform.variant == 'musl' &&
          matrix.platform.goarch != 'amd64'
        run: |
          case "${{ matrix.platform.goarch }}" in
            arm64) echo "CC=zig cc -target aarch64-linux-musl" >> "$GITHUB_ENV"; echo "CXX=zig c++ -target aarch64-linux-musl" >> "$GITHUB_ENV" ;;
            arm)
              if [ "${{ matrix.platform.goarm }}" = "6" ]; then
                echo "CC=zig cc -target arm-linux-musleabihf -mcpu=arm1176jzf_s" >> "$GITHUB_ENV"
                echo "CXX=zig c++ -target arm-linux-musleabihf -mcpu=arm1176jzf_s" >> "$GITHUB_ENV"
              else
                echo "CC=zig cc -target arm-linux-musleabihf -mcpu=cortex_a7" >> "$GITHUB_ENV"
                echo "CXX=zig c++ -target arm-linux-musleabihf -mcpu=cortex_a7" >> "$GITHUB_ENV"
              fi
              ;;
          esac

      - name: Cache Chromium toolchain
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && steps.env.outputs.cgo_val == '1' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.platform.goarch }}-${{ matrix.platform.variant || 'default' }}-${{ hashFiles('sing-box/.github/CRONET_GO_VERSION') }}
          restore-keys: chromium-toolchain-${{ matrix.platform.goarch }}-${{ matrix.platform.variant || 'default' }}-

      - name: Free disk space for cronet toolchain
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && steps.env.outputs.cgo_val == '1' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Setup ccache
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && steps.env.outputs.cgo_val == '1' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        uses: hendrikmuhs/ccache-action@77c3f8fd59034e6f3d5c58867ded0185b48d534f # v1
        with:
          key: ${{ runner.os }}-cgo-${{ matrix.platform.goarch }}

      - name: Export ccache compilers
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && steps.env.outputs.cgo_val == '1' && github.event.inputs.enable_naive == 'true' && matrix.platform.goos == 'linux'
        run: |
          if [[ -z "${CC:-}" ]]; then
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
            echo "CXX=ccache g++" >> "$GITHUB_ENV"
          fi

      - name: Setup cronet-go
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && steps.check_naive.outputs.needs_cronet == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/cronet-go/.git" ]; then
            rm -rf "$HOME/cronet-go" || true
            CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION 2>/dev/null || echo "main")
            git init "$HOME/cronet-go"
            git -C "$HOME/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
            # 借鑒上游官方管線（build-testing.yml Clone cronet-go）：sparse-checkout
            # 排除 lib/（各架構預編譯庫，數十 MB×N，僅 purego/android/windows 路徑
            # 經 Go 模塊或單文件 sparse 抽取使用），linux cgo 路徑只需 naiveproxy
            # 源碼與 build-naive 工具，--filter=blob:none 省帶寬。
            git -C "$HOME/cronet-go" sparse-checkout set --no-cone '/*' '!/lib'
            git -C "$HOME/cronet-go" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
            git -C "$HOME/cronet-go" checkout FETCH_HEAD
          fi

          TARGET="${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}"

          if [ "${{ matrix.platform.goos }}" = "linux" ] && [ "${{ steps.env.outputs.cgo_val }}" != "1" ]; then
            # linux purego：CGO=0 动态加载模式，只需抽取预编译 libcronet.so（上游
            # build-stable.yml Extract libcronet.so 步骤同方案），无需 chromium 工具链
            CRONET_VER=$(cat sing-box/.github/CRONET_GO_VERSION 2>/dev/null || echo "main")
            LIB_PATH="lib/linux_${{ matrix.platform.goarch }}/libcronet.so"
            rm -rf "$RUNNER_TEMP/cronet-go-lib"
            git init "$RUNNER_TEMP/cronet-go-lib"
            git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIB_PATH"
            git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_VER"
            git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
            mkdir -p "$GITHUB_WORKSPACE/sing-box/dist"
            cp "$RUNNER_TEMP/cronet-go-lib/$LIB_PATH" "$GITHUB_WORKSPACE/sing-box/dist/"
            ls -la "$GITHUB_WORKSPACE/sing-box/dist/libcronet.so"
            exit 0
          fi

          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            git -C "$HOME/cronet-go" submodule update --init --recursive --depth=1 2>/dev/null || true
            rm -f "$HOME/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg" 2>/dev/null || true
            cd "$HOME/cronet-go"

            if ! GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh; then
              sleep 10
              GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh || exit 1
            fi

            # 第四輪對齊（2026-10-03，上游 build-testing.yml Download/Set Chromium
            # toolchain 同款）：上游存在 naive linux 行的架構（amd64/amd64v3/arm64），
            # musl 須用 --libc=musl 專用工具鏈/sysroot（此前誤用 glibc 工具鏈）；
            # build-naive env 原樣導入（含 CC/CXX = Chromium 自帶 clang——官方
            # naive 產物的實際編譯器。此前本地剝離 CC/CXX 落回系統 gcc，編譯器
            # 與官方不同屬結果差異）。本地獨有架構（arm/mips/mipsle/riscv64）
            # 上游無對應行，維持原狀（系統/交叉 gcc + 剝離 CC/CXX），避免
            # Chromium 工具鏈對冷門架構支持不明引入回歸。
            UPSTREAM_NAIVE_ARCH=true
            case "${{ matrix.platform.goarch }}" in
              amd64|arm64) ;;
              *) UPSTREAM_NAIVE_ARCH=false ;;
            esac
            LIBC_FLAG=""
            STRIP_CC_RE='^(CC|CXX)='
            if [ "$UPSTREAM_NAIVE_ARCH" = "true" ]; then
              if [ "${{ matrix.platform.variant }}" = "musl" ]; then
                LIBC_FLAG="--libc=musl"
              fi
              # 不剝離任何行：grep -vE 匹配不到該哨兵模式即全保留
              STRIP_CC_RE='^__KEEP_ALL_ENV_LINES__$'
            fi

            for i in 1 2 3; do
              if go run ./cmd/build-naive --target="$TARGET" $LIBC_FLAG download-toolchain; then break; fi
              echo "::warning::cronet toolchain download failed, retrying ($i/3)..."
              sleep $((i * 10))
              if [ "$i" -eq 3 ]; then exit 1; fi
            done

            go run ./cmd/build-naive --target="$TARGET" $LIBC_FLAG env 2>/dev/null | grep -E '^[A-Za-z0-9_]+=' | grep -vE "$STRIP_CC_RE" >> "$GITHUB_ENV" || exit 1

          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            # 上游方案（reF1nd build-stable.yml L505-515）：sparse-checkout 直接抽取
            # 预编译 libcronet.dll。cronet-go 的 build-naive 无 extract-lib 子命令
            # （仅 build/download-toolchain/env/generate-net-errors/package/publish），
            # 预编译库在 lib/windows_<arch>/ 模块中单文件存放。
            CRONET_VER=$(cat "$GITHUB_WORKSPACE/sing-box/.github/CRONET_GO_VERSION" 2>/dev/null || echo "main")
            LIB_PATH="lib/windows_${{ matrix.platform.goarch }}/libcronet.dll"
            rm -rf "$RUNNER_TEMP/cronet-go-lib"
            git init "$RUNNER_TEMP/cronet-go-lib"
            git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIB_PATH"
            git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_VER"
            git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
            mkdir -p "$GITHUB_WORKSPACE/sing-box/dist"
            cp "$RUNNER_TEMP/cronet-go-lib/$LIB_PATH" "$GITHUB_WORKSPACE/sing-box/dist/"
            ls -la "$GITHUB_WORKSPACE/sing-box/dist/libcronet.dll"
          fi

      - name: Setup Android NDK
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true' && matrix.platform.goos == 'android'
        uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f # v1
        with:
          ndk-version: r28
        id: ndk

      - name: Log Build Environment
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        run: |
          echo "=============================================="
          echo "🌍 Build Environment"
          echo "=============================================="
          echo "Target:        ${{ matrix.target.id }}"
          echo "Version:       ${{ matrix.target.ver }}"
          echo "Platform:      ${{ matrix.platform.name }}"
          echo "GOOS/GOARCH:   ${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}"
          echo "GOAMD64:       ${{ matrix.platform.goamd64 }}"
          echo "GOARM:         ${{ matrix.platform.goarm }}"
          echo "CGO_ENABLED:   ${{ steps.env.outputs.cgo_val }}"
          echo "Tags:          ${{ steps.env.outputs.tags }}"
          echo "UPX Supported: ${{ matrix.platform.upx }}"
          echo "Naive Enabled: ${{ github.event.inputs.enable_naive || 'false' }}"
          echo "CC:            ${CC:-not set}"
          echo "CXX:           ${CXX:-not set}"
          echo "=============================================="

      - name: Build Core
        id: build
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        env:
          CGO_ENABLED: ${{ steps.env.outputs.cgo_val }}
          # darwin legacy（macos-10.13）行注入 10.13 部署目標（官方同款）；
          # 其餘平台為空字串不生效。
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.macos_deployment_target || '' }}
        run: |
          set -euo pipefail
          cd sing-box
          mkdir -p dist
          cp LICENSE dist/ 2>/dev/null || true

          TAGS_STR="${{ steps.env.outputs.tags }}"
          # 規範 LDFLAGS 跟隨上游源碼 release/LDFLAGS 文件（與上游 build.yml 的
          # LDFLAGS_SHARED=$(cat release/LDFLAGS) 同源），含
          # -X runtime.godebugDefault=multipathtcp=0,tlssha1=1（舊 TLS SHA1 簽名
          # 兼容 + 關閉 MPTCP 默認）。歷史缺陷：此前硬編碼的
          # -X internal/godebug.defaultGODEBUG=multipathtcp=0 所指包在現行源碼中
          # 已不存在，屬靜默無效注入，導致產物缺失上述兩個 runtime 默認值。
          LDFLAGS_SHARED="$(cat release/LDFLAGS 2>/dev/null || echo '-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0')"
          LDFLAGS="${LDFLAGS_SHARED} -X 'github.com/sagernet/sing-box/constant.Version=${{ matrix.target.ver }}' -s -w -buildid="

          if [ "${{ matrix.platform.goos }}" = "linux" ] && [ "$CGO_ENABLED" = "1" ]; then
            if [ "${{ matrix.platform.variant }}" = "musl" ]; then
              # chromium musl 工具鏈（enable_naive 的 amd64/arm64 腿，與上游 musl
              # 行同構）默認靜態鏈接且上游不加 osusergo/netgo/-extldflags——跳過
              # 本地靜態化組合以逐字對齊官方（實證：上游 musl 產物即為靜態，
              # 二進制探針 file/ldd）。其餘腿（本地獨有）保留組合保證自包含。
              CHROMIUM_MUSL=false
              # ENABLE_NAIVE 是 Configure Tags 步驟的局部變量，此處（Build Core）
              # 不可引用——set -u 下未綁定即退出（run 37115970972 的 musl 腿實錯
              # "ENABLE_NAIVE: unbound variable"）。直接讀 dispatch 輸入。
              if [ "${{ github.event.inputs.enable_naive || 'false' }}" = "true" ]; then
                case "${{ matrix.platform.goarch }}" in
                  amd64|arm64) CHROMIUM_MUSL=true ;;
                esac
              fi
              if [ "$CHROMIUM_MUSL" != "true" ]; then
                LDFLAGS="$LDFLAGS -extldflags '-static'"
                TAGS_STR="$TAGS_STR,osusergo,netgo"
              fi
            fi
          fi

          echo "$TAGS_STR" > dist/build_tags.txt
          echo "${{ matrix.platform.upx }}" > dist/upx_supported.txt

          BIN_NAME="sing-box"
          if [ "${{ matrix.platform.goos }}" = "windows" ]; then BIN_NAME="sing-box.exe"; fi

          NDK_TRIPLE="${{ matrix.platform.ndk_triple || '' }}"
          if [ -n "$NDK_TRIPLE" ]; then
            # 優先使用上方 Setup Android NDK（r28，與上游官方一致）：cronet-go 的
            # libcronet.a 由較新 NDK 工具鏈編譯，鏡像預裝的 NDK 27.3 lld 不認識其
            # 重定位類型（unknown relocation 315，run 36903444010 android-arm64）。
            # r28 的 lld 可正常鏈接。僅在 r28 不可用時回退鏡像 ANDROID_NDK_HOME。
            NDK_HOME="${{ steps.ndk.outputs.ndk-path }}"
            [ -n "$NDK_HOME" ] || NDK_HOME="${ANDROID_NDK_HOME:-}"
            if [ -n "$NDK_HOME" ]; then
              export CC="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDK_TRIPLE}-clang"
              export CXX="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDK_TRIPLE}-clang++"
            fi
          fi

          # proxy.golang.org 偶發 HTTP/2 INTERNAL_ERROR（見 run 33086946550）會讓
          # 30+ 個 matrix job 集體假性失敗。這裡只重試「模組下載」這個真正的失敗點，
          # 而不是重試整條 go build——後者會讓真實編譯錯誤付出 3 倍全量編譯成本。
          dl_ok=0
          for i in 1 2 3; do
            if go mod download; then
              dl_ok=1
              break
            fi
            echo "::warning::go mod download 失敗（第 $i 次），10s 後重試…"
            sleep 10
          done
          if [ "$dl_ok" -ne 1 ]; then
            echo "::error::go mod download 連續 3 次失敗"
            exit 1
          fi

          go build -v -trimpath -ldflags "$LDFLAGS" -tags "$TAGS_STR" -o "dist/$BIN_NAME" ./cmd/sing-box

          echo "{\"target_id\": \"${{ matrix.target.id }}\", \"platform\": \"${{ matrix.platform.name }}\", \"suffix\": \"${{ steps.env.outputs.suffix }}\", \"version_name\": \"${{ matrix.target.ver }}\", \"tags\": \"$TAGS_STR\"}" > dist/artifact-meta.json

      - name: Report Build Result
        if: always() && steps.filter.outputs.skip != 'true'
        run: |
          OUTCOME="${{ steps.build.outcome }}"
          case "$OUTCOME" in
            success) STATUS="✅ Success" ;;
            failure) STATUS="❌ Failed" ;;
            skipped) STATUS="⏭️ Skipped" ;;
            *)       STATUS="❓ $OUTCOME" ;;
          esac
          echo "### ${{ matrix.platform.name }} — $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target:** ${{ matrix.target.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ matrix.target.ver }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            echo "- **Tags:** ${{ steps.env.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify Binary Integrity
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd sing-box/dist || exit 1
          BIN_NAME="sing-box"
          [ "${{ matrix.platform.goos }}" = "windows" ] && BIN_NAME="sing-box.exe"

          if [ ! -f "$BIN_NAME" ]; then
            echo "::error::Binary not found at sing-box/dist/$BIN_NAME"
            exit 1
          fi

          chmod +x "$BIN_NAME" 2>/dev/null || true

          BIN_SIZE=$(stat -c%s "$BIN_NAME" 2>/dev/null || stat -f%z "$BIN_NAME" 2>/dev/null || echo 0)
          if [ "$BIN_SIZE" -lt 500000 ]; then
             echo "::error::Binary size too small ($BIN_SIZE bytes). Build likely failed."
             exit 1
          fi

          FILE_HEADER=$(file "$BIN_NAME")
          echo "Detected: $FILE_HEADER"

          if [ "${{ matrix.platform.goos }}" = "linux" ] || [ "${{ matrix.platform.goos }}" = "android" ]; then
            if ! echo "$FILE_HEADER" | grep -qi "ELF"; then
              echo "::error::File is not a valid ELF executable!"; exit 1
            fi
          elif [ "${{ matrix.platform.goos }}" = "windows" ]; then
            if ! echo "$FILE_HEADER" | grep -qiE "PE32.*executable"; then
              echo "::error::File is not a valid PE executable!"; exit 1
            fi
          elif [ "${{ matrix.platform.goos }}" = "darwin" ]; then
            # 2026-10-05 補齊：darwin 此前只過尺寸檢查，Mach-O 從未被校驗
            if ! echo "$FILE_HEADER" | grep -qi "Mach-O"; then
              echo "::error::File is not a valid Mach-O executable!"; exit 1
            fi
          fi

          echo "✅ Verification passed."

          if [ "${{ matrix.platform.goos }}" = "linux" ]; then
            if command -v ldd &>/dev/null; then
              LDD_OUTPUT=$(ldd "$BIN_NAME" 2>&1 || true)
              echo "ldd: $LDD_OUTPUT"
              # For musl/purego builds, confirm static; glibc is expected to be dynamic (skipped)
              if [ "${{ matrix.platform.variant }}" = "musl" ] || [ "${{ matrix.platform.variant }}" = "purego" ]; then
                if echo "$LDD_OUTPUT" | grep -qi "not a dynamic executable\|statically linked"; then
                  echo "✅ Static link confirmed."
                elif echo "$LDD_OUTPUT" | grep -qi "not found\|no such file"; then
                  echo "::warning::ldd reports unresolved dynamic libraries — binary may not be statically linked."
                  echo "$LDD_OUTPUT" | grep "not found" | head -5
                else
                  echo "::warning::Expected static binary but ldd shows dynamic dependencies:"
                  echo "$LDD_OUTPUT" | grep -v "^\s*$" | head -5
                fi
              fi
            fi
          fi

      - name: Compress and Package
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        working-directory: sing-box/dist
        run: |
          BIN_NAME="sing-box"
          [ "${{ matrix.platform.goos }}" = "windows" ] && BIN_NAME="sing-box.exe"
          TARGET_ID="${{ matrix.target.id }}"
          PLATFORM="${{ matrix.platform.name }}"
          VER="${{ matrix.target.ver }}"
          UPX_SUPPORTED="${{ matrix.platform.upx }}"
          SUFFIX="${{ steps.env.outputs.suffix }}"

          mkdir -p release_files
          ARCHIVE_NAME="${{ steps.env.outputs.archive_name }}"
          STANDALONE_NAME="sing-box-${VER}-${ARCHIVE_NAME}"

          # 2026-10-02 對齊上游官方歸檔結構（build-testing.yml Archive 步驟）：
          # 包內為頂層目錄 sing-box-<ver>-<os>-<arch>[-variant]/（含二進制、LICENSE、
          # 可選 libcronet 庫），解壓不散落文件。此前為平鋪結構，屬結果差異。
          # UPX 變體目錄名追加 -upx（本地附加變體，官方無）。
          if [ "$UPX_SUPPORTED" = "true" ]; then
            cp "$BIN_NAME" "${STANDALONE_NAME}.upx.tmp"
            UPX_OK=false
            if file "$BIN_NAME" | grep -qE "ELF.*executable"; then
              if upx --best --lzma "${STANDALONE_NAME}.upx.tmp" 2>/dev/null; then
                UPX_OK=true
              fi
            fi
            if [ "$UPX_OK" = "true" ]; then
              mv "${STANDALONE_NAME}.upx.tmp" "${STANDALONE_NAME}.upx"
              # Package UPX as tar.gz, binary renamed to sing-box for script compatibility
              mkdir -p "${STANDALONE_NAME}-upx"
              cp "${STANDALONE_NAME}.upx" "${STANDALONE_NAME}-upx/$BIN_NAME"
              cp LICENSE "${STANDALONE_NAME}-upx/" 2>/dev/null || true
              # 2026-10-04 修復：UPX 變體必須與普通變體同樣攜帶 libcronet.so——
              # naive 免費腿默認開啟後，purego UPX 變體若缺 .so 會復現
              # "cronet: library not found" 啟動崩潰（tag 在而庫不在）。
              if [ -f "libcronet.so" ]; then
                cp "libcronet.so" "${STANDALONE_NAME}-upx/"
              fi
              UPX_ARCHIVE="${STANDALONE_NAME}-upx.tar.gz"
              tar --no-same-owner -czf "release_files/${UPX_ARCHIVE}" "${STANDALONE_NAME}-upx"
              rm -rf "${STANDALONE_NAME}-upx"
              echo "standalone_bin=${STANDALONE_NAME}.upx" >> $GITHUB_ENV
              # 普通變體目錄仍需建立（尾部通用打包對兩種路徑一致處理）
              mkdir -p "${STANDALONE_NAME}"
              cp "$BIN_NAME" "${STANDALONE_NAME}/"
              cp LICENSE "${STANDALONE_NAME}/" 2>/dev/null || true
            else
              rm -f "${STANDALONE_NAME}.upx.tmp"
              mkdir -p "${STANDALONE_NAME}"
              cp "$BIN_NAME" "${STANDALONE_NAME}/"
              cp LICENSE "${STANDALONE_NAME}/" 2>/dev/null || true
              echo "standalone_bin=${STANDALONE_NAME}" >> $GITHUB_ENV
            fi
          else
            mkdir -p "${STANDALONE_NAME}"
            cp "$BIN_NAME" "${STANDALONE_NAME}/"
            cp LICENSE "${STANDALONE_NAME}/" 2>/dev/null || true
            echo "standalone_bin=${STANDALONE_NAME}" >> $GITHUB_ENV
          fi

          if [ "${{ matrix.platform.goos }}" = "windows" ]; then
            ZIP_NAME="${STANDALONE_NAME}.zip"
            if [ -f "libcronet.dll" ]; then
              cp "libcronet.dll" "${STANDALONE_NAME}/"
            fi
            rm -f "release_files/${ZIP_NAME}"
            zip -q9 -r "release_files/${ZIP_NAME}" "${STANDALONE_NAME}"
            echo "package_file=${ZIP_NAME}" >> $GITHUB_ENV
          else
            TAR_NAME="${STANDALONE_NAME}.tar.gz"
            if [ -f "libcronet.so" ]; then
              cp "libcronet.so" "${STANDALONE_NAME}/"
            fi
            tar --no-same-owner -czf "release_files/${TAR_NAME}" "${STANDALONE_NAME}"
            echo "package_file=${TAR_NAME}" >> $GITHUB_ENV
          fi
          rm -rf "${STANDALONE_NAME}"

      - name: Generate Build Checksums
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        run: |
          cd sing-box/dist/release_files
          rm -f SHA256SUMS.txt
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS.txt
          echo "Generated $(wc -l < SHA256SUMS.txt) checksum(s)"

      - name: Upload Package Artifact
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: |
            sing-box/dist/release_files/*
          retention-days: 1
          compression-level: 0

      - name: Upload Standalone Binary Artifact
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: sing-box/dist/${{ env.standalone_bin }}
          retention-days: 1
          compression-level: 0

      - name: Upload Metadata Artifact
        if: steps.check_naive.outputs.skip != 'true' && steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: meta-${{ matrix.target.id }}-${{ matrix.platform.name }}${{ steps.env.outputs.suffix }}
          path: sing-box/dist/artifact-meta.json
          retention-days: 1
          compression-level: 0

  build_android:
    runs-on: ubuntu-latest
    needs: [init, check]
    timeout-minutes: 60
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != '' &&
      needs.init.outputs.android_secrets_valid == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - name: Skip if no Android client
        if: matrix.target.sfa_repo == 'none'
        run: |
          echo "::notice::Skipping Android build for ${{ matrix.target.id }} (no client configured)"
          exit 0

      - name: Checkout Repository
        if: matrix.target.sfa_repo != 'none'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # 主仓检出（patches/ 所需，见 build_core 同名步骤注释）
          sparse-checkout: |
            patches
          sparse-checkout-cone-mode: false

      - name: Checkout Core
        if: matrix.target.sfa_repo != 'none'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.core_ref }}
          path: sing-box
          fetch-depth: 0
          filter: blob:none

      - name: Clean Workspace
        if: matrix.target.sfa_repo != 'none'
        working-directory: sing-box
        run: |
          git clean -fdx
          git reset --hard

      - name: Apply Patches
        if: matrix.target.sfa_repo != 'none'
        working-directory: sing-box
        run: |
          set -e
          applied=0
          for dir in "../patches/common" "../patches/${{ matrix.target.id }}"; do
            [ -d "$dir" ] || continue
            for p in "$dir"/*.patch; do
              [ -f "$p" ] || continue
              echo "::notice::Applying patch $(basename "$p")"
              # 直線套用失敗時改以 --3way 重試，上游小幅漂移可自動吸收。
              # 限制：--3way 需要補丁 index 行引用的 blob 存在於物件庫，而 Checkout Core
              # 使用 fetch-depth: 1，淺克隆通常不含這些 blob，此時回退不生效並照常報錯
              # （不會比現狀更糟，但也無法保證有效）。
              # 無論如何都要明確指出是哪個 dir 的哪個 patch 失敗，避免重演過去
              # 「只知道 Apply Patches 紅了、不知道是哪個補丁」的狀況。
              if ! git apply -v "$p" 2>/tmp/patch_err.txt; then
                echo "::warning::直接套用失敗，嘗試 --3way：$(basename "$p")"
                cat /tmp/patch_err.txt
                git apply -v --3way "$p" || {
                  echo "::error::PATCH FAILED: $(basename "$p") (dir=$dir, target=${{ matrix.target.id }})"
                  cat /tmp/patch_err.txt
                  exit 1
                }
              fi
              applied=$((applied+1))
            done
          done
          echo "Applied $applied patch(es)."

      - name: Checkout Android Client
        # 對齊真實官方管線（sing-box-releases build-testing.yml "Checkout
        # sing-box-for-android"）：官方 SFA 直接拉 client 分支 HEAD（build 當下
        # 的 reF1nd-testing/reF1nd-stable），並非 core 的 clients/android 子模塊
        # pin——後者只是繼承自 sagernet 的源碼倉 build.yml 的做法（reF1nd 實際
        # 不跑它）。此前一度誤改為 pin 檢出，已回退。
        if: matrix.target.sfa_repo != 'none'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.target.sfa_repo }}
          ref: ${{ matrix.target.sfa_branch }}
          path: sing-box-for-android
          # termux-app submodule is required: settings.gradle.kts includes
          # :terminal-view/:terminal-emulator under third_party/termux-app.
          # Gradle 9.3.1+ hard-fails configuring a project whose dir is missing.
          # recursive 對齊官方（git submodule update --init --recursive），
          # 防 client 增加嵌套子模塊後本地漏拉。
          submodules: recursive

      - name: Restore missing Kotlin imports
        # The upstream reF1nd-stable branch of sing-box-for-android references
        # symbols whose import statements are absent, so Kotlin compilation
        # fails with "Unresolved reference" during :app:compileOtherReleaseKotlin.
        # The branch was force-pushed on 2026-08-28 and still ships without them.
        #
        # This re-adds the imports instead of suppressing or deleting anything.
        # Each one is only inserted when the usage pattern is actually present
        # and the import is genuinely missing, so the step is a no-op on branches
        # that are correct (e.g. reF1nd-testing) and stops touching the files as
        # soon as upstream restores its own imports.
        if: matrix.target.sfa_repo != 'none'
        run: |
          set -euo pipefail
          cd ./sing-box-for-android

          add_import_if_used() {
            local file="$1" import_line="$2" usage_re="$3"
            if [ ! -f "$file" ]; then
              echo "  skip (file absent): $file"
              return 0
            fi
            if grep -qF -- "$import_line" "$file"; then
              echo "  ok (already imported): $import_line"
              return 0
            fi
            # Match the usage outside the import block only.
            if ! grep -v '^import ' "$file" | grep -qE -- "$usage_re"; then
              echo "  skip (usage not found): $usage_re"
              return 0
            fi
            if [ "$(grep -c '^import ' "$file")" -eq 0 ]; then
              echo "::warning::No import block in $file; cannot insert $import_line"
              return 0
            fi
            # Insert in ASCII-sorted position rather than appending: the project
            # runs spotless + ktlint, whose import-ordering rule is NOT disabled
            # in app/build.gradle.kts. LC_ALL=C keeps the comparison byte-wise.
            LC_ALL=C awk -v imp="$import_line" '
              /^import / {
                if (!done && imp < $0) { print imp; done = 1 }
                print
                next
              }
              { print }
              END { if (!done) { print imp } }
            ' "$file" > "$file.imports.tmp"
            mv "$file.imports.tmp" "$file"
            echo "  added: $import_line"
          }

          # Log.w("MainActivity", ...) is called but android.util.Log is not imported.
          # The leading-character class excludes Screen.Log.route / LogViewModel.
          add_import_if_used \
            "app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt" \
            "import android.util.Log" \
            '(^|[^.[:alnum:]_])Log\.[a-zA-Z]'

          # Icons.Default.VisibilityOff is used but the filled variant is not
          # imported. This file already imports filled.ContentCopy, so the
          # material-icons-extended dependency is present.
          add_import_if_used \
            "app/src/main/java/io/nekohasekai/sfa/compose/screen/settings/AppSettingsScreen.kt" \
            "import androidx.compose.material.icons.filled.VisibilityOff" \
            '\.VisibilityOff([^[:alnum:]_]|$)'

      - name: Setup Go
        if: matrix.target.sfa_repo != 'none'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # 與 build_core 同源：check job 動態解析的上游官方工具鏈（當前 1.26.8）
          go-version: '${{ needs.check.outputs.go_version }}'
          cache: true
          cache-dependency-path: 'sing-box/go.sum'

      - name: Setup Android NDK
        if: matrix.target.sfa_repo != 'none'
        id: setup-ndk
        uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f # v1
        with:
          ndk-version: r28

      - name: Setup Gradle
        if: matrix.target.sfa_repo != 'none'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0（對齊上游釘版）
        with:
          cache-read-only: false

      - name: Setup OpenJDK
        if: matrix.target.sfa_repo != 'none'
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Log Build Environment
        if: matrix.target.sfa_repo != 'none'
        run: |
          echo "=============================================="
          echo "🌍 Android Build Environment"
          echo "=============================================="
          echo "Target:        ${{ matrix.target.id }}"
          echo "Version:       ${{ matrix.target.ver }}"
          echo "Core Ref:      ${{ matrix.target.core_ref }}"
          echo "SFA Branch:    ${{ matrix.target.sfa_branch }}"
          echo "Tags Common:   ${{ env.TAGS_COMMON }}"
          echo "Tags Source:   build_libbox sharedTags (upstream cmd/internal/build_libbox)"
          echo "NDK Version:   r28"
          echo "Java:          $(java -version 2>&1 | head -n 1)"
          echo "=============================================="

      - name: Stamp core version tag for libbox
        # 上游流程在構建前打 git tag（Set tag 步驟），build_libbox 經 build_shared
        # ReadTag（git describe --tags）讀取 tag 作為 constant.Version 注入。
        # 本地以 detached SHA 檢出，須補打 tag 才能獲得與上游一致的版本注入。
        if: matrix.target.sfa_repo != 'none'
        working-directory: sing-box
        run: |
          set -euo pipefail
          git tag "v${{ matrix.target.ver }}" -f
          git describe --tags

      - name: Build Library (libbox.aar)
        if: matrix.target.sfa_repo != 'none'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd sing-box

          if grep -q '^lib_install:' Makefile 2>/dev/null; then
            make lib_install
          else
            MOBILE_COMMIT=$(grep -A1 'golang.org/x/mobile.*=>' go.mod 2>/dev/null \
              | grep 'sagernet/mobile' \
              | grep -oE '[0-9a-f]{12,}' \
              | tail -1 || true)

            if [ -n "$MOBILE_COMMIT" ]; then
              echo "::notice::Installing gomobile from sagernet/mobile fork @ ${MOBILE_COMMIT}"
              go install "github.com/sagernet/mobile/cmd/gomobile@${MOBILE_COMMIT}" \
                && go install "github.com/sagernet/mobile/cmd/gobind@${MOBILE_COMMIT}"
            else
              echo "::error::No sagernet/mobile fork found. Cannot produce compatible AAR for SFA."
              exit 1
            fi
          fi

          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init || { echo "::error::gomobile init failed"; exit 1; }

          # 2026-10-02 對齊上游：改用上游自有 build_libbox 工具構建 AAR（上游
          # publish_android 同款），參數全部來自上游源碼並自動跟隨：
          # - tags = build_libbox sharedTags（naive/openvpn/openconnect/usbip +
          #   ts_omit 瘦身清單；無 gvisor/dhcp/acme/conntrack——與此前手寫 env
          #   存在多處結果差異），legacy 變體自動剔除 naive；
          # - AndroidAPI main=24 / legacy=21（此前手寫 main=23，與 client
          #   minSdk 24 不一致）；
          # - LDFLAGS 走 build_shared.LinkerFlags → release/LDFLAGS 的
          #   runtime.godebugDefault=multipathtcp=0,tlssha1=1（此前硬編碼的
          #   -X internal/godebug... 為靜默無效注入）；
          # - -trimpath/-buildvcs=false 與此前手寫一致，行為不變。
          # cronet-go 的 Android 預編譯靜態庫隨 Go 模塊分發（lib/android_*），
          # gomobile + NDK 直接鏈接，無需額外提取步驟。
          # 產出 libbox.aar + libbox-legacy.aar（build_libbox 若發現
          # ../sing-box-for-android/app/libs 會自動複製；此處尚未建立，
          # 由後續 Prepare Android Client 步驟複製）。
          go run ./cmd/internal/build_libbox -target android

          if [ ! -f "libbox.aar" ]; then echo "::error::libbox.aar not found!"; exit 1; fi
          if [ ! -f "libbox-legacy.aar" ]; then echo "::error::libbox-legacy.aar not found!"; exit 1; fi
          ls -lh libbox.aar libbox-legacy.aar

      - name: Sync client VERSION_NAME with core version
        # 對齊官方（build-testing.yml "Update VERSION_NAME for temporary tag"）：
        # client 分支 HEAD 的 version.properties 可能領先或落後本次構建的 core
        # 版本，官方在版本不匹配場景會改寫 VERSION_NAME。本地滾動構建恆做同步，
        # 保證 APK 內部 versionName 與 core 版本一致（VERSION_CODE 仍取 client 值，
        # 與官方一致）。
        if: matrix.target.sfa_repo != 'none'
        run: |
          set -euo pipefail
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${{ matrix.target.ver }}/" sing-box-for-android/version.properties
          grep '^VERSION_NAME=' sing-box-for-android/version.properties

      - name: Prepare Android Client
        if: matrix.target.sfa_repo != 'none'
        run: |
          mkdir -p ./sing-box-for-android/app/libs/
          cp -f ./sing-box/*.aar ./sing-box-for-android/app/libs/

      - name: Decode Keystore
        if: matrix.target.sfa_repo != 'none'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > ./sing-box-for-android/app/release.keystore

      - name: Build SFA APK
        if: matrix.target.sfa_repo != 'none'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ./sing-box-for-android/
          chmod +x gradlew
          
          SIGNING_ARGS=(
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore"
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}"
            -Pandroid.injected.signing.key.alias="${{ secrets.ALIAS_NAME }}"
            -Pandroid.injected.signing.key.password="${{ secrets.ALIAS_PASS }}"
          )
          
          echo "::group::Building release APKs"
          ./gradlew --build-cache --parallel :app:assembleOtherRelease "${SIGNING_ARGS[@]}"
          echo "::endgroup::"

          echo "::group::Building legacy APKs (Android 5.x)"
          ./gradlew :app:assembleOtherLegacyRelease "${SIGNING_ARGS[@]}" || echo "::warning::Legacy APK build failed (non-blocking)."
          echo "::endgroup::"

          REL_DIR="app/build/outputs/apk/other/release"
          UNIVERSAL_APK_FOUND=false
          if [ -d "$REL_DIR" ]; then
            for apk in "$REL_DIR"/*.apk; do
              if [[ "$apk" == *"universal"* ]]; then
                UNIVERSAL_APK_FOUND=true
                break
              fi
            done
          fi
          
          if [ "$UNIVERSAL_APK_FOUND" = "true" ]; then
            echo "::notice::Universal APK already produced by assembleOtherRelease."
          else
            echo "::group::Attempting separate Universal APK build"
            if ./gradlew :app:assembleUniversalRelease "${SIGNING_ARGS[@]}" 2>&1; then
              echo "::notice::Universal APK built via assembleUniversalRelease."
            else
              echo "::warning::assembleUniversalRelease task failed or not available. See log above for details."
            fi
            echo "::endgroup::"
          fi

      - name: Collect APK and Metadata
        if: matrix.target.sfa_repo != 'none'
        run: |
          cd sing-box-for-android
          mkdir -p apks
          REL_DIR="app/build/outputs/apk/other/release"
          UNIVERSAL_DIR="app/build/outputs/apk/universal/release"
          VER="${{ matrix.target.ver }}"

          for apk in "$REL_DIR"/*.apk; do
            [ -f "$apk" ] || continue
            
            ABI=""
            if [[ "$apk" == *"arm64-v8a"* ]]; then
              ABI="-arm64-v8a"
            elif [[ "$apk" == *"armeabi-v7a"* ]]; then
              ABI="-armeabi-v7a"
            elif [[ "$apk" == *"x86_64"* ]]; then
              ABI="-x86_64"
            elif [[ "$apk" == *"x86"* ]]; then
              ABI="-x86"
            elif [[ "$apk" == *"universal"* ]]; then
              ABI="-universal"
            fi
            
            new_name="SFA-${VER}${ABI}.apk"
            mv -f "$apk" "apks/$new_name"
          done

          if [ -d "$UNIVERSAL_DIR" ]; then
            for apk in "$UNIVERSAL_DIR"/*.apk; do
              [ -f "$apk" ] || continue
              new_name="SFA-${VER}-universal.apk"
              mv -f "$apk" "apks/$new_name"
            done
          fi

          LEGACY_DIR="app/build/outputs/apk/otherLegacy/release"
          if [ -d "$LEGACY_DIR" ]; then
            for apk in "$LEGACY_DIR"/*.apk; do
              [ -f "$apk" ] || continue
              # 上游官方資產名格式：SFA-<core 版本>-legacy-android-5-<abi>.apk。
              # gradle 輸出名攜帶 client 自身 versionName（可能與 core 版本不一致），
              # 故按 ABI 重建命名。歷史缺陷：此前直接在 gradle 輸出名前再拼
              # "SFA-${VER}-legacy-"，產生雙前綴文件名
              # （SFA-<ver>-legacy-SFA-<ver>-legacy-android-5-*.apk）。
              ABI=""
              case "$(basename "$apk")" in
                *universal*)   ABI="-universal" ;;
                *arm64-v8a*)   ABI="-arm64-v8a" ;;
                *armeabi-v7a*) ABI="-armeabi-v7a" ;;
                *x86_64*)      ABI="-x86_64" ;;
                *x86*)         ABI="-x86" ;;
              esac
              new_name="SFA-${VER}-legacy-android-5${ABI}.apk"
              mv -f "$apk" "apks/$new_name"
            done
          fi

          # SFA libbox tags 現由上游 build_libbox 決定；元數據僅提取其源碼中的
          # sharedTags 行（排除 darwinTags/notMemcTags），確保與實際構建一致。
          TAGS_USED="$(grep -E 'sharedTags = append' ../sing-box/cmd/internal/build_libbox/main.go 2>/dev/null | grep -oE '"[a-z_0-9]+"' | tr -d '"' | sort -u | paste -sd, -)"
          [ -n "$TAGS_USED" ] || TAGS_USED="build_libbox sharedTags (see upstream)"

          # 元數據文件名對齊官方（SFA-version-metadata.json），內容為官方欄位
          # （version_code/version_name）+ 本地擴展欄位（target_id/build 時間/tags）。
          # 2026-10-04 修復：本步驟開頭已 cd sing-box-for-android，此前 grep 又拼
          # 一層目錄前綴 → 靜默失敗 → version_code 恆為 0（上游為 client
          # version.properties 實值 2056）；並剝除可能的 CR。
          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '\r')"
          jq -n \
            --argjson version_code "${VERSION_CODE:-0}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg version_name "${{ matrix.target.ver }}" \
            --arg target_id "${{ matrix.target.id }}" \
            --arg tags "$TAGS_USED" \
            '{
              version_code: $version_code,
              version_name: $version_name,
              target_id: $target_id,
              build_time: $built_at,
              build_tags: $tags
            }' > "apks/SFA-version-metadata.json"

      - name: Generate Build Checksums
        if: matrix.target.sfa_repo != 'none'
        run: |
          cd sing-box-for-android/apks
          rm -f SHA256SUMS.txt
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS.txt
          echo "Generated $(wc -l < SHA256SUMS.txt) checksum(s)"

      - name: Upload APK Artifacts
        if: matrix.target.sfa_repo != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-${{ matrix.target.id }}
          path: |
            sing-box-for-android/apks/*.apk
            sing-box-for-android/apks/*-metadata.json
            sing-box-for-android/apks/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0

  build_apple:
    # Self-hosted runner with Xcode 26.5 (required for Swift 6 `isolated deinit`).
    # macos-latest (Xcode 16.4) cannot compile the Apple client.
    runs-on: macos-26
    needs: [init, check]
    # 2026-10-03：60 → 120。当前 client pin 包圖 26 個依賴 + Xcode 26.5 下，
    # stable apple 實際構建耗時 ~55-61min，貼著 60min 上限——job 超時在 GitHub
    # 上表現為 conclusion=cancelled 而非 failure，連續兩個 run（37098783466 後
    # 兩次 run B）都在 60min27s 整被取消，極易誤判為 runner 隨機抖動。
    # testing 側 era-skip 秒過不受影響；xcodebuild 三次重試也獲得相應餘量。
    timeout-minutes: 120
    if: >-
      needs.check.outputs.has_update == 'true' &&
      needs.check.outputs.matrix != '[]' &&
      needs.check.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # 主仓检出（patches/ 所需，见 build_core 同名步骤注释）
          sparse-checkout: |
            patches
          sparse-checkout-cone-mode: false

      - name: Checkout Core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.core_ref }}
          path: sing-box
          fetch-depth: 1
          # Shallow full fetch (no filter:blob:none) so libbox export symbols aren't
          # dropped. submodules: recursive pulls clients/apple (pinned by reF1nd to a
          # SagerNet/sing-box-for-apple commit) plus its nested Frameworks/Runestone
          # submodule so the SwiftPM Package.swift resolves. For cores on the *new*
          # libbox API the next step replaces this pinned client with latest upstream.
          submodules: recursive

      - name: Clean Workspace
        working-directory: sing-box
        run: |
          git clean -fdx
          git reset --hard

      - name: Verify Apple client matches core libbox API era
        id: era
        working-directory: sing-box
        run: |
          set -euo pipefail
          # reF1nd 上游不構建 Apple 客戶端（build-stable/testing.yml 均無 Apple job），
          # core 的 clients/apple pin 只是隨版本 bump 的副產品，不保證與 core 的
          # libbox API 匹配。testing core 的 libbox 含 fork 獨有協議要求（如
          # LookupSFTPServer/ReadSystemSSHHostKey，SagerNet 官方客戶端永遠不會實現），
          # 官方客戶端無論 pin 還是 dev 都可能不匹配（落後或超前）。
          # 策略：已知信號檢測 mismatch → 跳過 Apple 構建（job success、無產物、
          # 醒目 warning），不讓 Apple 拖垮整個 run；未知新信號仍會在 xcodebuild
          # 真失敗暴露。
          if [ ! -f experimental/libbox/command_client.go ]; then
            echo "::error::experimental/libbox/command_client.go not found — cannot determine libbox API era. Aborting."
            exit 1
          fi
          SKIP="false"
          # 信號 1（客戶端超前）：客戶端引用 Taildrop API 而 core 未導出
          # 注意 if 形式：grep && VAR=... 在無匹配時整體非零，會觸發 set -e 退出
          CORE_HAS_TAILDROP=false
          if grep -rql 'TaildropSendSession\|sendTaildropFiles' experimental/libbox/ 2>/dev/null; then
            CORE_HAS_TAILDROP=true
          fi
          CLIENT_USES_TAILDROP=false
          if grep -rql 'TaildropSendSession\|sendTaildropFiles\|LibboxTaildropChunkSize' clients/apple/Library/ 2>/dev/null; then
            CLIENT_USES_TAILDROP=true
          fi
          if [ "$CLIENT_USES_TAILDROP" = "true" ] && [ "$CORE_HAS_TAILDROP" = "false" ]; then
            SKIP="true"
            echo "::warning::Apple client (pin $(git -C clients/apple rev-parse --short HEAD 2>/dev/null || echo unknown)) uses Taildrop APIs the core does not export (client ahead of core). Skipping Apple build."
          fi
          # 信號 2（客戶端落後）：core 的 libbox 協議含 fork 獨有要求（LookupSFTPServer 等）
          # 而客戶端未實現 → Swift "does not conform to protocol"
          if [ "$SKIP" = "false" ] && grep -q 'LookupSFTPServer\|ReadSystemSSHHostKey' experimental/libbox/platform.go 2>/dev/null; then
            if ! grep -rq 'lookupSFTPServer\|readSystemSSHHostKey' clients/apple/Library/ 2>/dev/null; then
              SKIP="true"
              echo "::warning::Core libbox requires fork-exclusive platform APIs (LookupSFTPServer/ReadSystemSSHHostKey) that the official client does not implement (client behind core). Skipping Apple build."
            fi
          fi
          # 信號 3（客戶端超前於本分支 core，2026-10-01 新增）：client 子模塊的 Swift
          # 代碼引用 gomobile 生成綁定 LibboxXxx，若本分支 core 的 libbox 未導出對應
          # Go 標識符，xcodebuild 必炸 "cannot find 'LibboxXxx' in scope"（實錘案例：
          # client pin 9f828a26 引用 LibboxPromotePowerReportDraft，stable 有
          # power_report.go 而 testing 沒有 -> 僅 testing 的 apple 編譯失敗，見
          # run 36877949919）。逐個 Libbox* 符號做大小寫不敏感比對，任一缺失即 skip。
          # Swift 生成協議名的 "Protocol" 後綴（如 LibboxPlatformInterfaceProtocol，
          # 來自 core 的 PlatformInterface）必須剝掉再比，否則兩個分支都會誤報。
          if [ "$SKIP" = "false" ]; then
            while read -r sym; do
              go_name="${sym#Libbox}"
              go_name="${go_name%Protocol}"
              if ! grep -rqi "$go_name" experimental/libbox/ 2>/dev/null; then
                SKIP="true"
                echo "::warning::Pinned client references $sym but this branch's libbox does not export it (client ahead of core). Skipping Apple build."
                break
              fi
            done < <(grep -rhoE 'Libbox[A-Za-z0-9_]+' clients/apple/Library --include='*.swift' 2>/dev/null | sort -u)
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "::notice::era check done: skip=$SKIP (core Taildrop=$CORE_HAS_TAILDROP, client Taildrop=$CLIENT_USES_TAILDROP, pin=$(git -C clients/apple rev-parse --short HEAD 2>/dev/null || echo unknown))"

      - name: Apply Patches
        if: steps.era.outputs.skip != 'true'
        working-directory: sing-box
        run: |
          set -euo pipefail
          applied=0
          for dir in "../patches/common" "../patches/${{ matrix.target.id }}"; do
            [ -d "$dir" ] || continue
            for p in "$dir"/*.patch; do
              [ -f "$p" ] || continue
              echo "::notice::Applying patch $(basename "$p")"
              # 直線套用失敗時改以 --3way 重試，上游小幅漂移可自動吸收。
              # 限制：--3way 需要補丁 index 行引用的 blob 存在於物件庫，而 Checkout Core
              # 使用 fetch-depth: 1，淺克隆通常不含這些 blob，此時回退不生效並照常報錯
              # （不會比現狀更糟，但也無法保證有效）。
              # 無論如何都要明確指出是哪個 dir 的哪個 patch 失敗，避免重演過去
              # 「只知道 Apply Patches 紅了、不知道是哪個補丁」的狀況。
              if ! git apply -v "$p" 2>/tmp/patch_err.txt; then
                echo "::warning::直接套用失敗，嘗試 --3way：$(basename "$p")"
                cat /tmp/patch_err.txt
                git apply -v --3way "$p" || {
                  echo "::error::PATCH FAILED: $(basename "$p") (dir=$dir, target=${{ matrix.target.id }})"
                  cat /tmp/patch_err.txt
                  exit 1
                }
              fi
              applied=$((applied+1))
            done
          done
          echo "Applied $applied patch(es)."

      - name: Setup Go
        if: steps.era.outputs.skip != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # Go 版本由 sing-box core 的 go.mod go directive 決定（與 CLI/Android 一致）。
          # 真正的約束是 Xcode：Apple client 用了 Swift 6 `isolated deinit` 特性，
          # 需 Xcode 26.x（macos-26 runner 自帶 Xcode 26.5）。macos-latest 的 Xcode 16.4
          # 報 'isolated' deinit requires frontend flag + LibboxStringIteratorProtocol
          # has no member 'value' 等編譯器類型推導問題。
          # 與 build_core 同源：check job 動態解析的上游官方工具鏈（當前 1.26.8）
          go-version: '${{ needs.check.outputs.go_version }}'
          cache: false
          cache-dependency-path: 'sing-box/go.sum'

      - name: Install ldid
        if: steps.era.outputs.skip != 'true'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install ldid

      - name: Build Libbox.xcframework (Apple)
        if: steps.era.outputs.skip != 'true'
        working-directory: sing-box
        run: |
          if grep -q '^lib_install:' Makefile 2>/dev/null; then
            make lib_install
          else
            MOBILE_COMMIT=$(grep -A1 'golang.org/x/mobile.*=>' go.mod 2>/dev/null \
              | grep 'sagernet/mobile' \
              | grep -oE '[0-9a-f]{12,}' \
              | tail -1 || true)

            if [ -n "$MOBILE_COMMIT" ]; then
              echo "::notice::Installing gomobile from sagernet/mobile fork @ ${MOBILE_COMMIT}"
              go install "github.com/sagernet/mobile/cmd/gomobile@${MOBILE_COMMIT}" \
                && go install "github.com/sagernet/mobile/cmd/gobind@${MOBILE_COMMIT}"
            else
              echo "::error::No sagernet/mobile fork found. Cannot produce compatible framework."
              exit 1
            fi
          fi
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init || { echo "::error::gomobile init failed"; exit 1; }
          # No -platform flag → builds universal xcframework for
          # ios,iossimulator,tvos,tvossimulator,macos so both SFI (iOS)
          # and SFM (macOS) can link against the same framework.
          go run ./cmd/internal/build_libbox -target apple
          mv Libbox.xcframework clients/apple

      - name: Resolve SwiftPM packages
        if: steps.era.outputs.skip != 'true'
        working-directory: sing-box/clients/apple
        run: |
          set -euo pipefail
          rm -rf ~/Library/Caches/org.swift.swiftpm
          # Apple 官方 CI 指引：先顯式解析依賴，構建階段再以
          # -disableAutomaticPackageResolution 只按 Package.resolved 取用。
          # 背景：上游 client pin 9f828a2 的包圖比此前多了一個依賴（26 個），
          # 恰好踩中 Xcode 26.5 IDE 層的競態 bug（IDEGroup insertGroupSubitems
          # "count of array (26) differs from count of index set (25)"，exit 134），
          # 在 xcodebuild build 的包圖同步路徑上 100% 復現
          # （run 36864837989 / 36864881159 的 build_apple 連續崩潰）。
          # 解析挪到獨立步驟後，構建不再觸發該路徑；解析本身冪等且可重試。
          RP_OK=0
          for attempt in 1 2 3; do
            rm -rf DerivedData
            if xcodebuild \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -resolvePackageDependencies
            then
              RP_OK=1
              break
            fi
            echo "::warning::resolvePackageDependencies failed (attempt $attempt/3), retrying"
          done
          [ "$RP_OK" -eq 1 ] || { echo "::error::package resolution failed after 3 attempts"; exit 1; }

      - name: Build SFI (iOS, unsigned + ldid)
        if: steps.era.outputs.skip != 'true'
        working-directory: sing-box/clients/apple
        run: |
          set -euo pipefail
          # Clear SwiftPM cache to avoid stale repo references
          rm -rf ~/Library/Caches/org.swift.swiftpm
          # xcodebuild 在 runner 鏡像上有與源碼無關的偶發崩潰：SwiftPM 包圖處理
          # 拋出 "IDEGroup insertGroupSubitems" 內部異常（exit 134，見 run
          # 36864837989 的 build_apple）。清 DerivedData 後重試通常可過；
          # runner 關機信號（exit 143）重試無意義，直接放棄。
          XB_OK=0
          for attempt in 1 2 3; do
            rm -rf DerivedData
            if xcodebuild \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath DerivedData \
              build \
              -disableAutomaticPackageResolution \
              STRIP_INSTALLED_PRODUCT=NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO
            then
              XB_OK=1
              break
            else
              XB_RC=$?
            fi
            if [ "$XB_RC" -eq 143 ]; then
              echo "::error::xcodebuild aborted by runner shutdown (exit 143); not retrying"
              exit 1
            fi
            echo "::warning::xcodebuild exit $XB_RC (attempt $attempt/3): known SwiftPM flake, cleaning DerivedData and retrying"
          done
          [ "$XB_OK" -eq 1 ] || { echo "::error::xcodebuild failed after 3 attempts"; exit 1; }

          APP_PATH="DerivedData/Build/Products/Release-iphoneos/sing-box.app"
          [ -d "$APP_PATH" ] || { echo "::error::sing-box.app not produced"; exit 1; }

          # ldid 簽 entitlements（ad-hoc，TrollStore/越獄安裝用，非 Apple codesign）
          ldid -SSFI/SFI.entitlements "$APP_PATH/sing-box"
          ldid -SExtension/Extension.entitlements "$APP_PATH/PlugIns/Extension.appex/Extension" 2>/dev/null || true
          ldid -SIntentsExtension/IntentsExtension.entitlements "$APP_PATH/PlugIns/IntentsExtension.appex/IntentsExtension" 2>/dev/null || true

          # 打包 .tipa（TrollStore 可直接安裝）
          mkdir -p packages/Payload
          cp -rp "$APP_PATH" packages/Payload
          cd packages
          zip -qr sing-box.tipa Payload

      - name: Build SFM (macOS, unsigned + ldid)
        if: steps.era.outputs.skip != 'true'
        working-directory: sing-box/clients/apple
        run: |
          set -euo pipefail
          # Clear SwiftPM cache to avoid stale repo references
          rm -rf ~/Library/Caches/org.swift.swiftpm
          # 與 Build SFI 相同的 xcodebuild 偶發崩潰重試護欄（見 SFI 步驟註釋）
          XB_OK=0
          for attempt in 1 2 3; do
            rm -rf DerivedData
            if xcodebuild \
              -project sing-box.xcodeproj \
              -scheme SFM \
              -destination 'generic/platform=macOS' \
              -configuration Release \
              -sdk macosx \
              -derivedDataPath DerivedData \
              build \
              -skipPackagePluginValidation \
              -disableAutomaticPackageResolution \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO
            then
              XB_OK=1
              break
            else
              XB_RC=$?
            fi
            if [ "$XB_RC" -eq 143 ]; then
              echo "::error::xcodebuild aborted by runner shutdown (exit 143); not retrying"
              exit 1
            fi
            echo "::warning::xcodebuild exit $XB_RC (attempt $attempt/3): known SwiftPM flake, cleaning DerivedData and retrying"
          done
          [ "$XB_OK" -eq 1 ] || { echo "::error::xcodebuild failed after 3 attempts"; exit 1; }

          APP_PATH="DerivedData/Build/Products/Release/sing-box.app"
          [ -d "$APP_PATH" ] || { echo "::error::sing-box.app (macOS) not produced"; exit 1; }

          # ldid sign main binary with macOS entitlements
          ldid -SSFM/SFM.entitlements "$APP_PATH/Contents/MacOS/sing-box"
          # 寻找 appex 内部的执行文件进行签署（直接签目录无效，Mach-O 在 Contents/MacOS 下）
          shopt -s nullglob
          for ex in "$APP_PATH/Contents/PlugIns/"*.appex; do
            binary=$(find "$ex/Contents/MacOS" -type f | head -n 1)
            if [ -n "$binary" ]; then
              ldid -S "$binary" 2>/dev/null || true
            fi
          done
          shopt -u nullglob

          # Package as .zip (macOS .app bundle, not TrollStore .tipa)
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" packages/sing-box.zip

      - name: Collect Apple Artifacts
        if: steps.era.outputs.skip != 'true'
        run: |
          mkdir -p apple-out
          VER="${{ matrix.target.ver }}"
          TID="${{ matrix.target.id }}"
          SFI_TIPA="sing-box/clients/apple/packages/sing-box.tipa"
          SFM_ZIP="sing-box/clients/apple/packages/sing-box.zip"
          if [ -f "$SFI_TIPA" ]; then
            mv "$SFI_TIPA" "apple-out/SFI-${VER}.tipa"
            echo "Produced SFI-${VER}.tipa"
          else
            echo "::error::SFI .tipa not produced"
            exit 1
          fi
          if [ -f "$SFM_ZIP" ]; then
            mv "$SFM_ZIP" "apple-out/SFM-${VER}.zip"
            echo "Produced SFM-${VER}.zip"
          else
            echo "::error::SFM .zip not produced"
            exit 1
          fi
          ls -la apple-out/

      - name: Generate Build Checksums
        if: steps.era.outputs.skip != 'true'
        run: |
          cd apple-out
          rm -f SHA256SUMS.txt
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS.txt
          echo "Generated $(wc -l < SHA256SUMS.txt) checksum(s)"

      - name: Upload Apple Artifacts
        if: steps.era.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-${{ matrix.target.id }}
          path: apple-out/*
          retention-days: 1
          compression-level: 0

  publish_core:
    runs-on: ubuntu-latest
    needs: [init, check, build_core]
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Runs even if some core matrix entries fail (always()), but skips on cancel or
    # no update. Core artifacts drive the release body; android/apple jobs
    # upload their own artifacts to the same release tag independently.
    if: >-
      always() &&
      needs.check.outputs.has_update == 'true' &&
      !cancelled()
    outputs:
      release_version: ${{ steps.prepare.outputs.release_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./tmp/

      - name: Verify artifact completeness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 對齊官方 publish.yml 的 build-manifest 完整性校驗（簡化等價實現）：
          # 以「實際構建成功的 build_core 腿數」為期望值，核對下載到的 pkg-* 產
          # 物數。腿成功但 artifact 缺失（上傳/下載環節事故）會造成半截 release
          # 且無人察覺——此處硬失敗。腿本身失敗或被過濾/跳過不計入期望值，
          # 部分失敗仍可發佈其餘 target 的既有語義不變。
          # --paginate 跨頁時 --jq 會輸出多段結果，改用管道 jq -s 聚合全部頁。
          # 期望值必須按「Build Core 步驟 conclusion=success」計數，而非 job 結論：
          # rebuild_platform 過濾腿與 enable_naive 下跳過的 android 腿以 job
          # success 結束（skip 置位後全部步驟 skipped），按 job 結論計數會把
          # 過濾腿也計入期望值，聚焦重建必然誤觸本閘門
          # （run 37098783466：job 結論 54 vs 實際 pkg 16，發佈被正確拒絕但屬誤傷）。
          EXPECTED=$(gh api --paginate             "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100"             | jq -s '[.[].jobs[] | select((.name | startswith("build_core")) and ([.steps[]? | select(.name == "Build Core" and .conclusion == "success")] | length > 0))] | length')
          ACTUAL=$(find ./tmp -maxdepth 1 -type d -name "pkg-*" | wc -l)
          echo "build_core succeeded legs: ${EXPECTED}; downloaded pkg artifacts: ${ACTUAL}"
          if [ "${ACTUAL}" -lt "${EXPECTED}" ]; then
            echo "::error::Artifact completeness check failed: ${ACTUAL} pkg artifacts < ${EXPECTED} successful build_core legs. Refusing to publish a partial release."
            exit 1
          fi

      - name: Verify Build Checksums
        run: |
          set -e
          # 歷史缺陷：find 無匹配時 while 循環體一次都不執行，FAILED 恆為 0，
          # 「零產物」被當成「全部校驗通過」放行，隨後 Process 步驟照樣刪舊建新，
          # 最終兩個 rolling release 全部丟失（2026-09-26 起連日故障的根因之一）。
          # 零產物 = 構建全掛 = 在碰任何 release 之前就硬失敗。
          SUMFILES=$(find ./tmp -path "*/pkg-*" -name SHA256SUMS.txt)
          if [ -z "$SUMFILES" ]; then
            echo "::error::No package artifacts (SHA256SUMS.txt) found — build produced nothing. Aborting before any release mutation."
            exit 1
          fi
          FAILED=0
          while IFS= read -r sumfile; do
            echo "::group::Verify $(basename "$(dirname "$sumfile")")"
            (cd "$(dirname "$sumfile")" && sha256sum -c SHA256SUMS.txt) || FAILED=1
            echo "::endgroup::"
          done <<< "$SUMFILES"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Package artifact checksum verification failed, aborting release"
            exit 1
          fi
          echo "All package artifacts verified OK."

      - name: Process, Collect & Prepare Releases
        id: prepare
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PUBLISH_TYPE="${{ github.event.inputs.publish_type || 'rolling' }}"
          FIRST_VER=$(echo "$MATRIX" | jq -r '.[0].ver // "unknown"')

          rm -rf ./release_files
          mkdir -p ./release_files

          cat > /tmp/install-linux.sh << 'INSTALLEOF'
          #!/bin/bash
          set -euo pipefail

          REPO="${{ github.repository }}"
          TAG="${1:-stable}"
          [ "$TAG" = "testing" ] && TAG="sing-box-testing" || TAG="sing-box-stable"

          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64)
              if grep -q "avx2" /proc/cpuinfo 2>/dev/null; then
                # 資產命名已對齊官方（amd64v3 無連字符），此處同步否則安裝器
                # 在 AVX2 機器上匹配不到 v3 資產。
                FILE_ARCH="amd64v3"
              else
                FILE_ARCH="amd64"
              fi
              ;;
            aarch64|arm64) FILE_ARCH="arm64" ;;
            armv7l)        FILE_ARCH="armv7" ;;
            armv6l)        FILE_ARCH="armv6" ;;
            mips64)        FILE_ARCH="mips64" ;;
            mips64el)      FILE_ARCH="mips64le" ;;
            mips)          FILE_ARCH="mips" ;;
            mipsel)        FILE_ARCH="mipsle" ;;
            riscv64)       FILE_ARCH="riscv64" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac

          if pgrep -x "sing-box" > /dev/null 2>&1; then echo "sing-box is running. Stop it first."; exit 1; fi
          SUDO_CMD=""; [ "$(id -u)" -ne 0 ] && SUDO_CMD="sudo"
          WORK_DIR=$(mktemp -d); trap 'rm -rf "$WORK_DIR"' EXIT
          echo "Fetching latest release for $FILE_ARCH (tag: $TAG)..."
          ASSET_URL=$(curl -sSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | grep -oE '"browser_download_url":\s*"[^"]+"' | cut -d '"' -f 4 \
            | grep "linux" | grep -E "${FILE_ARCH}[-.]" | grep -vE "glibc|musl" \
            | grep -v -- "-upx" | grep "\.tar\.gz" | head -n 1)
          [ -z "$ASSET_URL" ] && { echo "No release found for $FILE_ARCH"; exit 1; }
          curl -fSL -o "$WORK_DIR/archive.tar.gz" "$ASSET_URL"
          tar -xzf "$WORK_DIR/archive.tar.gz" -C "$WORK_DIR"
          # 2026-10-04 修復（第二輪回歸）：歸檔自頂層目錄重構後，本腳本仍按平鋪
          # 佈局取 $WORK_DIR/sing-box——必然找不到而退出。改為在解包樹中定位。
          BIN_PATH=$(find "$WORK_DIR" -type f -name sing-box | head -n 1)
          [ -n "$BIN_PATH" ] || { echo "Binary not found in archive"; exit 1; }
          chmod +x "$BIN_PATH"
          INSTALLED_VER=$("$BIN_PATH" version 2>/dev/null | head -n1 || echo "unknown")
          echo "Binary reports: $INSTALLED_VER"
          # naive 免費腿默認開啟後，linux purego 歸檔攜帶 libcronet.so——
          # 一併安裝，否則 naive 配置觸發 "cronet: library not found"。
          SO_PATH=$(find "$WORK_DIR" -type f -name libcronet.so | head -n 1)
          if [ -n "$SO_PATH" ]; then
            $SUDO_CMD mkdir -p /usr/local/lib
            $SUDO_CMD cp "$SO_PATH" /usr/local/lib/libcronet.so
            $SUDO_CMD ldconfig 2>/dev/null || true
            echo "libcronet.so installed to /usr/local/lib."
          fi
          $SUDO_CMD mv "$BIN_PATH" /usr/local/bin/sing-box
          echo "Installation complete."
          INSTALLEOF
          chmod +x /tmp/install-linux.sh

          if ! MATRIX_LINES=$(echo "$MATRIX" | jq -c '.[]'); then
            echo "::error::Failed to parse matrix JSON"; exit 1
          fi
          if [ -z "$MATRIX_LINES" ]; then
            echo "::warning::No targets in matrix, skipping publish"
            echo "release_version=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          tag_map="{}"

          while read -r target; do
            target_id=$(echo "$target" | jq -r '.id')
            ver=$(echo "$target" | jq -r '.ver')
            upstream_body=$(echo "$target" | jq -r '.body // ""')
            commit_msg=$(echo "$target" | jq -r '.msg // ""')

            unset BUILDTAGS_MAP LINUX_FILES WINDOWS_FILES DARWIN_FILES ANDROID_FILES 2>/dev/null || true
            declare -A BUILDTAGS_MAP=() LINUX_FILES=() WINDOWS_FILES=() DARWIN_FILES=() ANDROID_FILES=()

            mkdir -p ./release_files/${target_id}/{linux,windows,darwin,android}

            if [ "$PUBLISH_TYPE" = "versioned" ]; then
              if [[ "$target_id" == *"Testing"* ]]; then
                tag_name="v${ver}-testing"; prerelease="true"; make_latest="false"
              else
                tag_name="v${ver}"; prerelease="false"; make_latest="true"
              fi
              release_title="${target_id} v${ver}"
            else
              if [[ "$target_id" == *"Testing"* ]]; then
                tag_name="sing-box-testing"; prerelease="true"; make_latest="false"
                release_title="sing-box Testing Build"
              else
                tag_name="sing-box-stable"; prerelease="false"; make_latest="true"
                release_title="sing-box Stable Build"
              fi
            fi

            tag_map=$(echo "$tag_map" | jq --arg tid "$target_id" --arg t "$tag_name" '.[$tid]=$t')

            # Collect core (linux/windows/darwin) artifacts
            for pkg_dir in ./tmp/pkg-${target_id}-*; do
              if [[ -d "$pkg_dir" ]]; then
                platform=$(basename "$pkg_dir" | sed "s/pkg-${target_id}-//")
                for f in "$pkg_dir"/*; do
                  [ -f "$f" ] || continue
                  name=$(basename "$f")
                  if [[ "$platform" == *"windows"* ]]; then
                    cp "$f" "release_files/${target_id}/windows/$name"
                    WINDOWS_FILES["$platform"]="$name"
                  elif [[ "$platform" == *"darwin"* ]]; then
                    cp "$f" "release_files/${target_id}/darwin/$name"
                    DARWIN_FILES["$platform"]="$name"
                  elif [[ "$platform" == *"android"* ]]; then
                    cp "$f" "release_files/${target_id}/android/$name"
                    ANDROID_FILES["$platform"]="$name"
                  else
                    cp "$f" "release_files/${target_id}/linux/$name"
                    LINUX_FILES["$platform"]="$name"
                  fi
                done
              fi
            done

            for meta_dir in ./tmp/meta-${target_id}-*; do
              if [[ -d "$meta_dir" ]]; then
                platform=$(basename "$meta_dir" | sed "s/meta-${target_id}-//")
                if [ -f "$meta_dir/artifact-meta.json" ]; then
                  tags=$(jq -r '.tags // ""' "$meta_dir/artifact-meta.json")
                  BUILDTAGS_MAP["$platform"]="$tags"
                fi
              fi
            done

            cp /tmp/install-linux.sh release_files/${target_id}/linux/install-linux.sh

            # Generate release body (core sections only; android/apple upload separately)
            {
              echo "# 🚀 ${release_title}"
              echo ""
              echo "> 🔒 此 Release 已通過 [GitHub Artifact Attestations](https://github.com/advanced-security/artifact-attestations) 驗證，防範供應鏈攻擊。"
              echo ""
            } > release_body.txt

            if [ -n "$upstream_body" ] && [ "$upstream_body" != "null" ]; then
              printf '%s\n' "$upstream_body" >> release_body.txt
            else
              echo "## 📝 Changelog (更新日誌)" >> release_body.txt
              if [ -n "$commit_msg" ] && [ "$commit_msg" != "null" ]; then
                echo '```text' >> release_body.txt
                commit_msg_safe=$(printf '%s' "$commit_msg" | tr '`' "'")
                printf '%s\n' "$commit_msg_safe" >> release_body.txt
                echo '```' >> release_body.txt
              else
                echo "- 無更新說明" >> release_body.txt
              fi
            fi

            echo "" >> release_body.txt
            echo "## 🔧 構建標籤" >> release_body.txt
            echo "" >> release_body.txt
            echo "<details>" >> release_body.txt
            echo "<summary>點擊展開查看詳細的構建標籤</summary>" >> release_body.txt
            echo "" >> release_body.txt
            if [ ${#BUILDTAGS_MAP[@]} -gt 0 ]; then
              for p in "${!BUILDTAGS_MAP[@]}"; do
                echo "- **${p}**: \`${BUILDTAGS_MAP[$p]}\`" >> release_body.txt
              done
            else
              echo "- 無構建標籤資訊" >> release_body.txt
            fi
            echo "" >> release_body.txt
            echo "</details>" >> release_body.txt
            echo "" >> release_body.txt

            echo "" >> release_body.txt
            echo "## 📦 Assets (產物下載)" >> release_body.txt

            if [ ${#LINUX_FILES[@]} -gt 0 ]; then
              echo "" >> release_body.txt
              echo "<details>" >> release_body.txt
              echo "<summary>🐧 Linux 產物</summary>" >> release_body.txt
              echo "" >> release_body.txt
              echo '<table>' >> release_body.txt
              echo '<tr><th>架構</th><th>文件名</th><th>說明</th></tr>' >> release_body.txt
              for plat in "${!LINUX_FILES[@]}"; do
                file_name="${LINUX_FILES[$plat]}"
                plat_display="${plat#linux-}"
                if [[ "$file_name" == *.tar.gz ]] && [[ "$file_name" == *-upx.* ]]; then
                  echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>打包壓縮檔 (UPX)</td></tr>" >> release_body.txt
                elif [[ "$file_name" == *.tar.gz ]]; then
                  echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>打包壓縮檔</td></tr>" >> release_body.txt
                else
                  echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>獨立二進制</td></tr>" >> release_body.txt
                fi
              done
              echo '</table>' >> release_body.txt
              echo "</details>" >> release_body.txt
            fi

            if [ ${#WINDOWS_FILES[@]} -gt 0 ]; then
              echo "" >> release_body.txt
              echo "<details>" >> release_body.txt
              echo "<summary>🪟 Windows 產物</summary>" >> release_body.txt
              echo "" >> release_body.txt
              echo '<table>' >> release_body.txt
              echo '<tr><th>架構</th><th>文件名</th><th>說明</th></tr>' >> release_body.txt
              for plat in "${!WINDOWS_FILES[@]}"; do
                file_name="${WINDOWS_FILES[$plat]}"
                plat_display="${plat#windows-}"
                if [[ "$file_name" == *.upx ]]; then
                  echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>獨立二進制 (UPX)</td></tr>" >> release_body.txt
                elif [[ "$file_name" == *.zip ]]; then
                  echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>打包壓縮檔</td></tr>" >> release_body.txt
                else
                  echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>獨立二進制</td></tr>" >> release_body.txt
                fi
              done
              echo '</table>' >> release_body.txt
              echo "</details>" >> release_body.txt
            fi

            if [ ${#DARWIN_FILES[@]} -gt 0 ]; then
              echo "" >> release_body.txt
              echo "<details>" >> release_body.txt
              echo "<summary>🍎 Darwin 產物</summary>" >> release_body.txt
              echo "" >> release_body.txt
              echo '<table>' >> release_body.txt
              echo '<tr><th>架構</th><th>文件名</th><th>說明</th></tr>' >> release_body.txt
              for plat in "${!DARWIN_FILES[@]}"; do
                file_name="${DARWIN_FILES[$plat]}"
                plat_display="${plat#darwin-}"
                echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>打包壓縮檔</td></tr>" >> release_body.txt
              done
              echo '</table>' >> release_body.txt
              echo "</details>" >> release_body.txt
            fi

            if [ ${#ANDROID_FILES[@]} -gt 0 ]; then
              echo "" >> release_body.txt
              echo "<details>" >> release_body.txt
              echo "<summary>📱 Android CLI 產物 (Termux)</summary>" >> release_body.txt
              echo "" >> release_body.txt
              echo '<table>' >> release_body.txt
              echo '<tr><th>架構</th><th>文件名</th><th>說明</th></tr>' >> release_body.txt
              for plat in "${!ANDROID_FILES[@]}"; do
                file_name="${ANDROID_FILES[$plat]}"
                plat_display="${plat#android-}"
                echo "<tr><td>${plat_display}</td><td><code>${file_name}</code></td><td>打包壓縮檔</td></tr>" >> release_body.txt
              done
              echo '</table>' >> release_body.txt
              echo "</details>" >> release_body.txt
            fi

            echo "" >> release_body.txt
            echo "---" >> release_body.txt
            echo "### 📜 History (歷史更新)" >> release_body.txt
            gh release list --repo "${{ github.repository }}" --limit 3 --json tagName,name,publishedAt --jq '.[] | "- \(.publishedAt[0:10]) \(.tagName): \(.name)"' >> release_body.txt || echo "- 暫無歷史記錄" >> release_body.txt

            sed -i 's/[[:space:]]*$//' release_body.txt

            (
              cd "release_files/${target_id}"
              # 條目必須與 release 頁的平鋪資產名一致：gh release upload 只取
              # basename（linux/xxx.tar.gz → xxx.tar.gz），此前把本地分層目錄前綴
              # 帶進校驗單，用戶 sha256sum -c 全部 "No such file or directory"
              # （哈希本身正確，僅路徑錯——2026-10-04 實測坐實後修正）。
              find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; | sed -E 's| \./[a-z]+/| |' > SHA256SUMS.txt
            )
            echo "" >> release_body.txt
            echo "## 🔐 SHA256 Checksums" >> release_body.txt
            echo "" >> release_body.txt
            echo '<table>' >> release_body.txt
            echo '<tr><th>文件名稱</th><th>SHA-256</th></tr>' >> release_body.txt
            awk -F'  ' '{printf "<tr><td><code>%s</code></td><td><code>%s</code></td></tr>\n", $2, $1}' "release_files/${target_id}/SHA256SUMS.txt" >> release_body.txt
            echo '</table>' >> release_body.txt

            echo "Checking if release/tag $tag_name exists..."

            # —— 產物閘門：先確認本 target 有真實歸檔產物，才允許刪舊建新。——
            # 歷史缺陷（2026-09-26 起連日兩個 rolling release 全部消失的根因）：
            # 構建全掛時 FILES 憑 install-linux.sh + 空 SHA256SUMS.txt 仍非空，
            # 先 gh release delete 毀掉舊 release，gh release create 又因上傳空
            # 校驗單 HTTP 400 失敗 → 舊已刪、新未成。必須先驗後刪，零歸檔即跳過。
            shopt -s nullglob globstar
            ARCHIVES=(
              release_files/${target_id}/**/*.tar.gz
              release_files/${target_id}/**/*.zip
            )
            shopt -u nullglob globstar
            if [ ${#ARCHIVES[@]} -eq 0 ]; then
              echo "::warning::No archive artifacts for $target_id (build failed for this target); keeping existing release $tag_name untouched and skipping publish."
              tag_map=$(echo "$tag_map" | jq --arg tid "$target_id" 'del(.[$tid])')
              continue
            fi

            if gh release view "$tag_name" --json id -q '.id' 2>/dev/null; then
              echo "Deleting existing release $tag_name..."
              gh release delete "$tag_name" --yes --cleanup-tag
            fi
            if git ls-remote --tags origin "$tag_name" | grep -q "$tag_name"; then
              echo "Deleting stray tag $tag_name..."
              git push origin ":refs/tags/$tag_name"
            fi

            FILES=("${ARCHIVES[@]}")
            [ -f "release_files/${target_id}/linux/install-linux.sh" ] && FILES+=("release_files/${target_id}/linux/install-linux.sh")
            [ -f "release_files/${target_id}/SHA256SUMS.txt" ] && FILES+=("release_files/${target_id}/SHA256SUMS.txt")

            echo "Publishing $tag_name..."
            gh release create "$tag_name" \
              --title "$release_title" \
              --notes-file release_body.txt \
              --prerelease="$prerelease" \
              --latest="$make_latest" \
              "${FILES[@]}"

            tar -czf /tmp/tg-payload-${target_id}.tar.gz -C "release_files/${target_id}" .
          done <<< "$MATRIX_LINES"

          echo "$tag_map" > release_files/tag_map.json
          echo "$MATRIX" | jq '[.[] | {target_id: .id, version_name: .ver}]' > release_files/build-info.json
          echo "release_version=${FIRST_VER}" >> $GITHUB_OUTPUT

      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: |
            release_files/**/*.tar.gz
            release_files/**/*.zip

      - name: Upload Build Info Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-info
          path: |
            release_files/build-info.json
            release_files/tag_map.json
          retention-days: 1
          compression-level: 0

      - name: Upload Telegram Payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tg-payloads
          path: /tmp/tg-payload-*.tar.gz
          retention-days: 1
          compression-level: 0

  publish_android:
    runs-on: ubuntu-latest
    needs: [check, build_android, publish_core]
    permissions:
      contents: write
    if: always() && needs.check.outputs.has_update == 'true' && !cancelled()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./tmp/

      - name: Verify Build Checksums
        run: |
          set -e
          FAILED=0
          while IFS= read -r sumfile; do
            echo "Verifying $(basename "$(dirname "$sumfile")")"
            (cd "$(dirname "$sumfile")" && sha256sum -c SHA256SUMS.txt) || FAILED=1
          done < <(find ./tmp -path "*/apk-*" -name SHA256SUMS.txt)
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::APK artifact checksum verification failed, aborting upload"
            exit 1
          fi
          echo "All APK artifacts verified OK."

      - name: Upload APKs to releases
        run: |
          set -euo pipefail
          TAG_MAP=$(cat ./tmp/build-info/tag_map.json 2>/dev/null || echo '{}')
          for apk_dir in ./tmp/apk-*; do
            [ -d "$apk_dir" ] || continue
            target_id=$(basename "$apk_dir" | sed 's/apk-//')
            tag=$(echo "$TAG_MAP" | jq -r --arg tid "$target_id" '.[$tid] // empty')
            [ -n "$tag" ] || { echo "::warning::No tag for $target_id, skipping"; continue; }
            echo "Uploading APKs from $target_id to $tag..."
            for f in "$apk_dir"/*.apk "$apk_dir"/*-metadata.json; do
              [ -f "$f" ] || continue
              # 2026-10-04：上傳重試 3 次後硬失敗——此前軟失敗（僅 warning）會
              # 留下缺資產的 release 且無人察覺（SFI 503 瞬斷事件坐實）。
              UPLOADED=false
              for attempt in 1 2 3; do
                if gh release upload "$tag" "$f" --clobber --repo ${{ github.repository }}; then
                  UPLOADED=true
                  break
                fi
                echo "::warning::Upload attempt $attempt failed for $(basename "$f")"
                sleep $((attempt * 10))
              done
              if [ "$UPLOADED" != "true" ]; then
                echo "::error::Upload failed after 3 attempts: $(basename "$f")"
                exit 1
              fi
            done

            # 2026-10-05：SFA 校驗單此前只在 artifact 內部核驗、從未發佈——
            # release 級 SHA256SUMS.txt 僅覆蓋 tar.gz/zip 歸檔，用戶無法對
            # APK 做完整性校驗。必須先改名再上傳：gh upload 以檔案基名作
            # 資產名，直接上傳會與 release 級 SHA256SUMS.txt 同名互覆
            # （2026-10-04 熱修教訓）。
            if [ -f "$apk_dir/SHA256SUMS.txt" ]; then
              SUM_ASSET="/tmp/SHA256SUMS-SFA-${target_id}.txt"
              cp "$apk_dir/SHA256SUMS.txt" "$SUM_ASSET"
              SUM_UPLOADED=false
              for attempt in 1 2 3; do
                if gh release upload "$tag" "$SUM_ASSET" --clobber --repo ${{ github.repository }}; then
                  SUM_UPLOADED=true
                  break
                fi
                echo "::warning::Upload attempt $attempt failed for $(basename "$SUM_ASSET")"
                sleep $((attempt * 10))
              done
              if [ "$SUM_UPLOADED" != "true" ]; then
                echo "::error::Upload failed after 3 attempts: $(basename "$SUM_ASSET")"
                exit 1
              fi
            fi
          done

  publish_apple:
    runs-on: ubuntu-latest
    needs: [check, build_apple, publish_core]
    permissions:
      contents: write
    if: always() && needs.check.outputs.has_update == 'true' && !cancelled()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./tmp/

      - name: Verify Build Checksums
        run: |
          set -e
          FAILED=0
          while IFS= read -r sumfile; do
            echo "Verifying $(basename "$(dirname "$sumfile")")"
            (cd "$(dirname "$sumfile")" && sha256sum -c SHA256SUMS.txt) || FAILED=1
          done < <(find ./tmp -path "*/apple-*" -name SHA256SUMS.txt)
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Apple artifact checksum verification failed, aborting upload"
            exit 1
          fi
          echo "All Apple artifacts verified OK."

      - name: Upload Apple artifacts to releases
        run: |
          set -euo pipefail
          TAG_MAP=$(cat ./tmp/build-info/tag_map.json 2>/dev/null || echo '{}')
          for apple_dir in ./tmp/apple-*; do
            [ -d "$apple_dir" ] || continue
            target_id=$(basename "$apple_dir" | sed 's/apple-//')
            tag=$(echo "$TAG_MAP" | jq -r --arg tid "$target_id" '.[$tid] // empty')
            [ -n "$tag" ] || { echo "::warning::No tag for $target_id, skipping"; continue; }
            echo "Uploading Apple artifacts from $target_id to $tag..."
            for f in "$apple_dir"/*; do
              [ -f "$f" ] || continue
              # 排除构建时校验清单：release 根级 SHA256SUMS.txt 由 publish_core 生成，
              # 避免同名覆盖导致用户校验 Linux 产物失败
              [ "$(basename "$f")" = "SHA256SUMS.txt" ] && continue
              # 2026-10-04：上傳重試 3 次後硬失敗——此前軟失敗（僅 warning）會
              # 留下缺資產的 release 且無人察覺（SFI 503 瞬斷事件坐實）。
              UPLOADED=false
              for attempt in 1 2 3; do
                if gh release upload "$tag" "$f" --clobber --repo ${{ github.repository }}; then
                  UPLOADED=true
                  break
                fi
                echo "::warning::Upload attempt $attempt failed for $(basename "$f")"
                sleep $((attempt * 10))
              done
              if [ "$UPLOADED" != "true" ]; then
                echo "::error::Upload failed after 3 attempts: $(basename "$f")"
                exit 1
              fi
            done

            # 2026-10-05：Apple 校驗單（SFI/SFM）與 SFA 同理發佈為獨立資產，
            # 先改名避免與 release 級 SHA256SUMS.txt 同名互覆。
            if [ -f "$apple_dir/SHA256SUMS.txt" ]; then
              SUM_ASSET="/tmp/SHA256SUMS-Apple-${target_id}.txt"
              cp "$apple_dir/SHA256SUMS.txt" "$SUM_ASSET"
              SUM_UPLOADED=false
              for attempt in 1 2 3; do
                if gh release upload "$tag" "$SUM_ASSET" --clobber --repo ${{ github.repository }}; then
                  SUM_UPLOADED=true
                  break
                fi
                echo "::warning::Upload attempt $attempt failed for $(basename "$SUM_ASSET")"
                sleep $((attempt * 10))
              done
              if [ "$SUM_UPLOADED" != "true" ]; then
                echo "::error::Upload failed after 3 attempts: $(basename "$SUM_ASSET")"
                exit 1
              fi
            fi
          done

  finalize:
    needs: [check, build_core, build_android, build_apple, publish_core, publish_android, publish_apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Metadata & Build Infos
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./downloads/

      - name: Merge Build Infos
        run: |
          mkdir -p metadata
          mv ./downloads/workflow-metadata/release_notes.txt ./metadata/ 2>/dev/null || echo "" > ./metadata/release_notes.txt

          TARGETS_ARRAY=$(cat ./downloads/build-info/build-info.json 2>/dev/null || echo "[]")

          jq -n \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${{ github.run_id }}" \
            --arg commit "${{ github.sha }}" \
            --argjson targets "$TARGETS_ARRAY" \
            '{
              built_at: $built_at,
              run_id: $run_id,
              commit_sha: $commit,
              targets: $targets
            }' > build-info.json

      - name: Update release-info branch via API
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const info = JSON.parse(fs.readFileSync('build-info.json', 'utf8'));
            // 歷史缺陷：全 skip 的 run（無新版可編）也會以 targets: [] 覆蓋版本基線，
            // 令下一次 check 把 LAST_VER 判成空 -> has_update=true -> 無謂的全量重建 +
            // release 刪建（2026-10-01 run 36872840381 即如此污染基線）。
            // 基線只應隨「真實構建」前進：沒有產物記錄就保持原樣不動。
            if (!Array.isArray(info.targets) || info.targets.length === 0) {
              console.log('No built targets this run; leaving release-info baseline untouched.');
              return;
            }
            const content = Buffer.from(JSON.stringify(info)).toString('base64');
            const { owner, repo } = context.repo;
            const path = 'build-info.json';
            const branch = 'release-info';

            let branchExists = true;
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch (e) {
              branchExists = false;
            }

            if (!branchExists) {
              const defaultBranch = context.payload.repository?.default_branch || 'main';
              const { data: ref } = await github.rest.repos.getBranch({ owner, repo, branch: defaultBranch });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: ref.commit.sha });
            }

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = data.sha;
            } catch (e) {}

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'build: update release metadata',
              content: content,
              branch,
              ...(sha && { sha })
            });

      - name: Append product download sections to release body
        # 2026-10-05：SFA 段自 publish_android 挪入 finalize，並新增 Apple 段。
        # 動機：publish_android/publish_apple 並行讀-改-寫同一 release body 會
        # 互相丟更新（gh release edit 是全文替換）；finalize 在兩者之後運行，
        # 是唯一寫者。段落按 release 實際資產清單生成（非本地 artifact 目錄），
        # 剝除舊段後重追加——rerun/重試冪等，內容始終與線上資產一致。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_MAP=$(cat ./downloads/build-info/tag_map.json 2>/dev/null || echo '{}')
          if [ "$TAG_MAP" = "{}" ]; then
            echo "No published tags this run; skipping release body sections."
            exit 0
          fi
          for tid in $(echo "$TAG_MAP" | jq -r 'keys[]'); do
            tag=$(echo "$TAG_MAP" | jq -r --arg tid "$tid" '.[$tid]')
            body=$(gh release view "$tag" --json body -q .body 2>/dev/null || true)
            [ -n "$body" ] || continue
            # 剝除既有 SFA/Apple 段（塊級：從各自標題到下一個 ## 標題或文末；
            # History 是 ### 標題且位於段落之前，不受影響）
            body=$(printf '%s\n' "$body" | LC_ALL=C awk '
              /^## 📱 SFA \(Android\) 下載/ || /^## 🍎 Apple 客戶端下載/ { skip=1; next }
              skip && /^## / { skip=0 }
              !skip
            ')
            assets=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[].name' 2>/dev/null || true)
            sfa=$(printf '%s\n' "$assets" | grep -E '^SFA-.*\.apk$' || true)
            apple=$(printf '%s\n' "$assets" | grep -E '^(SFI-.*\.tipa|SFM-.*\.zip)$' || true)
            {
              printf '%s\n' "$body"
              if [ -n "$sfa" ]; then
                echo ""
                echo "## 📱 SFA (Android) 下載"
                echo ""
                echo '| 檔案 | 說明 |'
                echo '|---|---|'
                printf '%s\n' "$sfa" | while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  echo "| [$name](https://github.com/${{ github.repository }}/releases/download/$tag/$name) | APK |"
                done
              fi
              if [ -n "$apple" ]; then
                echo ""
                echo "## 🍎 Apple 客戶端下載"
                echo ""
                echo '| 檔案 | 說明 |'
                echo '|---|---|'
                printf '%s\n' "$apple" | while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  case "$name" in
                    SFI-*) desc="SFI (iOS, TrollStore/越獄安裝)" ;;
                    SFM-*) desc="SFM (macOS)" ;;
                    *)     continue ;;
                  esac
                  echo "| [$name](https://github.com/${{ github.repository }}/releases/download/$tag/$name) | $desc |"
                done
              fi
            } > /tmp/body_new_${tid}.md
            gh release edit "$tag" --notes-file "/tmp/body_new_${tid}.md" --repo "${{ github.repository }}" \
              || echo "::warning::Failed to update release body for $tag"
          done

      - name: Log Build Summary
        if: always()
        run: |
          echo "### 📊 構建摘要" >> "$GITHUB_STEP_SUMMARY"
          echo "| 任務 | 執行狀態 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 核心編譯 | ${{ needs.build_core.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Android 客戶端 | ${{ needs.build_android.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Apple 客戶端 | ${{ needs.build_apple.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 核心發佈 | ${{ needs.publish_core.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Android 發佈 | ${{ needs.publish_android.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Apple 發佈 | ${{ needs.publish_apple.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "#### 📦 產物詳情" >> "$GITHUB_STEP_SUMMARY"
          echo "| 目標 | 版本 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "build-info.json" ]; then
            jq -r '.targets[]? | "| \(.target_id) | \(.version_name) |"' build-info.json >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "| N/A | N/A |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update README version block
        # 2026-10-05 閘門：僅在真實構建發生時更新。無更新 run 此前會用空 NOTES
        # 重寫版本塊（workflow-metadata artifact 不存在 → mv 失敗 → echo "" 兜底
        # 成功 → NOTES 為空串而非 '暫無更新記錄'），把上一個版本的狀態記錄清空
        # 並留下時間戳滾動的空提交（origin/main 416adf6/09a9207 兩次清空實錘）。
        if: needs.check.outputs.has_update == 'true'
        run: |
          set -euo pipefail
          # 過去本步驟以硬編碼 heredoc 全量覆蓋 README.md，凡是模板中沒有的段落都會被
          # 靜默抹掉（cf78584d 加入的 Android SFA 下載段落就是這樣丟失的）。
          # 改為只替換「最新版本狀態」區塊，其餘手工維護的內容原樣保留。
          NOTES="$(cat ./metadata/release_notes.txt 2>/dev/null || echo '暫無更新記錄')"
          HEADING="## 📦 最新版本狀態 ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M UTC+8'))"

          # 定位方式刻意採「純 ASCII 模式 + LC_ALL=C」：
          # 1) 標題含多位元組 emoji/CJK，若把這些字元寫進 pattern，會讓 pattern 本身
          #    依賴檔案與執行環境的編碼一致；改用「## 開頭且括號內含 YYYY-MM-DD 日期」
          #    這個 ASCII 特徵（README 中只有版本狀態標題帶日期）即可避開。
          #    括號內日期後可能還有時間（如 `(2026-08-27 15:05 UTC+8)`），故用 [^)]*
          #    吃到右括號，不能寫成 `日期\)`。
          # 2) LC_ALL=C 強制 grep 以位元組模式比對，結果不受 runner locale 影響
          #    （在 UTF-8 locale 下 grep 對多位元組輸入的比對行為會因實作而異）。
          # 3) 兩處都加 `|| true`：本步驟有 set -euo pipefail，grep 找不到時會直接
          #    終止 shell，下方的空值防護永遠執行不到。加 `|| true` 後指派必成功，
          #    防護才會真正生效（fail closed 而非靜默中斷）。
          BEG=$(LC_ALL=C grep -n -m1 -E '^## .*\(20[0-9]{2}-[0-9]{2}-[0-9]{2}[^)]*\)' README.md | cut -d: -f1 || true)
          if [ -z "$BEG" ]; then
            echo "::error::README.md 找不到版本狀態標題，略過更新以免覆蓋整個檔案。"
            exit 1
          fi
          # 版本狀態區塊到下一個水平分隔線為止
          REL=$(tail -n +"$((BEG + 1))" README.md | LC_ALL=C grep -n -m1 '^---[[:space:]]*$' | cut -d: -f1 || true)
          if [ -z "$REL" ]; then
            echo "::error::README.md 找不到版本狀態區塊後的 --- 分隔線，略過更新以免覆蓋整個檔案。"
            exit 1
          fi
          FIN=$((BEG + REL))

          # 內容一律經 ENVIRON 傳入：awk -v 會解釋反斜線跳脫序列，
          # 會把 release_notes 裡的字面 \n 之類內容改寫掉。
          # 行號用 +0 轉成數值，否則 awk 會拿 NR（數值）與環境變數（字串）做字串比較。
          NOTES="$NOTES" HEADING="$HEADING" BEG="$BEG" FIN="$FIN" \
          awk '
            BEGIN { beg = ENVIRON["BEG"] + 0; fin = ENVIRON["FIN"] + 0 }
            NR < beg  { print; next }
            NR == beg { print ENVIRON["HEADING"]; print ""; print ENVIRON["NOTES"]; next }
            NR < fin  { next }
                      { print }
          ' README.md > README.md.new

          mv README.md.new README.md
          echo "----- 更新後的版本狀態區塊 -----"
          sed -n "${BEG},$((FIN))p" README.md

      - name: Commit and Push README
        # 與上一步驟同一閘門：無更新 run 不觸碰 README（內容本就無變化，
        # 只會產生時間戳滾動的空提交噪音）。
        if: needs.check.outputs.has_update == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'README.md';
            const branch = '${{ github.ref_name }}';

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = data.sha;
            } catch (e) {
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'docs: update README with latest build info',
              content: Buffer.from(readme).toString('base64'),
              branch,
              ...(sha && { sha }),
              headers: { 'X-GitHub-Api-Version': '2022-11-28' }
            });

  telegram_notify:
    needs: [build_core, build_android, build_apple, publish_core, publish_android, publish_apple, finalize]
    runs-on: ubuntu-latest
    # xz-dev/TelegramFileUploader 上傳大文件無內部超時，網絡問題時會無限 hang；
    # 給 job 級超時，避免佔用 runner 到 6h 上限。Telegram 推送正常幾秒完成。
    timeout-minutes: 15
    if: always() && (github.event.inputs.enable_telegram == 'true' || github.event_name == 'schedule')
    steps:
      - name: Generate Telegram Message
        id: status
        run: |
          # Missing secrets → set status=skipped so every downstream TG step
          # (downloads, prepares, and the 6 TelegramFileUploader steps that hang
          # on empty credentials) is skipped instead of timing out the job.
          if [ -z "${{ secrets.API_ID }}" ] || [ -z "${{ secrets.API_HASH }}" ] || [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.CHAT_ID }}" ]; then
            echo "::warning::Telegram secrets missing — skipping Telegram notification and file uploads."
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          TG_STATUS="success"
          declare -a STATUS_LINES

          for job in build_core build_android build_apple publish_core publish_android publish_apple; do
            RESULT=""
            if [ "$job" = "build_core" ]; then RESULT="${{ needs.build_core.result }}"
            elif [ "$job" = "build_android" ]; then RESULT="${{ needs.build_android.result }}"
            elif [ "$job" = "build_apple" ]; then RESULT="${{ needs.build_apple.result }}"
            elif [ "$job" = "publish_core" ]; then RESULT="${{ needs.publish_core.result }}"
            elif [ "$job" = "publish_android" ]; then RESULT="${{ needs.publish_android.result }}"
            elif [ "$job" = "publish_apple" ]; then RESULT="${{ needs.publish_apple.result }}"
            fi

            case "$RESULT" in
              success) STATUS_LINES+=("${job}: success") ;;
              failure)
                if [ "$job" = "build_apple" ] || [ "$job" = "publish_apple" ]; then
                  STATUS_LINES+=("${job}: failure (non-blocking)")
                else
                  TG_STATUS="failed"; STATUS_LINES+=("${job}: failure")
                fi ;;
              skipped) STATUS_LINES+=("${job}: skipped") ;;
              *) STATUS_LINES+=("${job}: ${RESULT}") ;;
            esac
          done

          ALL_SKIPPED=true
          for job in build_core build_android build_apple publish_core publish_android publish_apple; do
            RESULT=""
            if [ "$job" = "build_core" ]; then RESULT="${{ needs.build_core.result }}"
            elif [ "$job" = "build_android" ]; then RESULT="${{ needs.build_android.result }}"
            elif [ "$job" = "build_apple" ]; then RESULT="${{ needs.build_apple.result }}"
            elif [ "$job" = "publish_core" ]; then RESULT="${{ needs.publish_core.result }}"
            elif [ "$job" = "publish_android" ]; then RESULT="${{ needs.publish_android.result }}"
            elif [ "$job" = "publish_apple" ]; then RESULT="${{ needs.publish_apple.result }}"
            fi
            if [ "$RESULT" != "skipped" ]; then ALL_SKIPPED=false; break; fi
          done

          if [ "$ALL_SKIPPED" = "true" ]; then
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          TG_DETAILS=$(IFS=$'\n'; echo "${STATUS_LINES[*]}")

          escape_tg_markdown() {
            echo "$1" | sed -e 's/\\/\\\\/g' \
                            -e 's/_/\\_/g' -e 's/\*/\\*/g' -e 's/\[/\\[/g' -e 's/\]/\\]/g' \
                            -e 's/~/\\~/g' -e 's/`/\\`/g' -e 's/>/\\>/g' -e 's/#/\\#/g' \
                            -e 's/+/\\+/g' -e 's/-/\\-/g' -e 's/=/\\=/g' -e 's/|/\\|/g' \
                            -e 's/{/\\{/g' -e 's/}/\\}/g' -e 's/!/\\!/g' \
                            -e 's/\./\\./g' -e 's/(/\\(/g' -e 's/)/\\)/g'
          }

          TG_DETAILS_SAFE=$(escape_tg_markdown "$TG_DETAILS")
          REPO_SAFE=$(escape_tg_markdown "${{ github.repository }}")

          if [ "$TG_STATUS" = "failed" ]; then
            MSG="❌ *sing\-box 自動編譯失敗*

          *構建詳情：*
          ${TG_DETAILS_SAFE}

          *建議操作：*
          1\. 前往 Actions頁面查看日誌
          2\. 檢查是否有 GitHub API限流"
          else
            MSG="🚀 *sing\-box 自動編譯完成*

          已檢測到代碼更新或觸發強制編譯，最新內核與 Android APK 已經打包完畢。

          *構建詳情：*
          ${TG_DETAILS_SAFE}

          📥 [點擊前往 GitHub下載](https://github\.com/${REPO_SAFE}/releases)"
          fi

          PAYLOAD=$(jq -n \
            --arg chat_id "${{ secrets.CHAT_ID }}" \
            --arg text "$MSG" \
            --arg parse_mode "MarkdownV2" \
            '{chat_id: $chat_id, text: $text, parse_mode: $parse_mode}')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || HTTP_CODE="000"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Telegram notification sent (HTTP $HTTP_CODE)"
          else
            echo "::warning::Telegram notification failed (HTTP $HTTP_CODE)"
          fi

          echo "status=${TG_STATUS}" >> $GITHUB_OUTPUT

      - name: Download all release packages for TG
        if: steps.status.outputs.status == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: '{tg-payloads,apk-*,apple-*}'
          merge-multiple: true

      - name: Extract TG payloads
        if: steps.status.outputs.status == 'success'
        run: |
          shopt -s nullglob
          for tgz in dist/tg-payload-*.tar.gz; do
            tar -xzf "$tgz" -C dist/
          done
          rm -f dist/tg-payload-*.tar.gz

      - name: Determine TG Version
        if: steps.status.outputs.status == 'success'
        run: |
          echo "TG_VERSION=${{ needs.publish_core.outputs.release_version || 'unknown' }}" >> $GITHUB_ENV

      - name: Prepare SFA TG Files
        if: steps.status.outputs.status == 'success'
        run: |
          files=$(find dist -type f -name "SFA-*.apk" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" =~ (alpha|beta|rc|test) ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_APK_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_APK_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_APK=true" >> $GITHUB_ENV
          fi

      - name: Send SFA APKs to Telegram
        if: env.SEND_APK == 'true'
        uses: xz-dev/TelegramFileUploader@f597b98950e55d2b15f2fc94d1410cb557d829e0 # v1（2026-10-05 釘版，供應鏈補漏）
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🤖 *SFA APK 更新*
            `${{ env.TG_APK_TAG }}`
            📦 *版本:* `${{ env.TG_VERSION }}`
          files: ${{ env.TG_APK_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Android CLI TG Files
        if: steps.status.outputs.status == 'success'
        run: |
          files=$(find dist -type f -name "sing-box-*-android-*.tar.gz" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" =~ (alpha|beta|rc|test) ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_ACLI_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_ACLI_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_ACLI=true" >> $GITHUB_ENV
          fi

      - name: Send Android CLI binaries to Telegram
        if: env.SEND_ACLI == 'true'
        uses: xz-dev/TelegramFileUploader@f597b98950e55d2b15f2fc94d1410cb557d829e0 # v1（2026-10-05 釘版，供應鏈補漏）
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            📱 *Android CLI 二進制*
            `${{ env.TG_ACLI_TAG }}`
            📦 *版本:* `${{ env.TG_VERSION }}`
          files: ${{ env.TG_ACLI_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Linux TG Files
        if: steps.status.outputs.status == 'success'
        run: |
          files=$(find dist -type f -name "sing-box-*-linux-*.tar.gz" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" =~ (alpha|beta|rc|test) ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_LINUX_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_LINUX_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_LINUX=true" >> $GITHUB_ENV
          fi

      - name: Send Linux binaries to Telegram
        if: env.SEND_LINUX == 'true'
        uses: xz-dev/TelegramFileUploader@f597b98950e55d2b15f2fc94d1410cb557d829e0 # v1（2026-10-05 釘版，供應鏈補漏）
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🐧 *Linux 二進制*
            `${{ env.TG_LINUX_TAG }}`
            📦 *版本:* `${{ env.TG_VERSION }}`
          files: ${{ env.TG_LINUX_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Windows TG Files
        if: steps.status.outputs.status == 'success'
        run: |
          files=$(find dist -type f -name "sing-box-*-windows-*.zip" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" =~ (alpha|beta|rc|test) ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_WIN_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_WIN_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_WIN=true" >> $GITHUB_ENV
          fi

      - name: Send Windows binaries to Telegram
        if: env.SEND_WIN == 'true'
        uses: xz-dev/TelegramFileUploader@f597b98950e55d2b15f2fc94d1410cb557d829e0 # v1（2026-10-05 釘版，供應鏈補漏）
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🪟 *Windows 二進制*
            `${{ env.TG_WIN_TAG }}`
            📦 *版本:* `${{ env.TG_VERSION }}`
          files: ${{ env.TG_WIN_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Darwin TG Files
        if: steps.status.outputs.status == 'success'
        run: |
          files=$(find dist -type f -name "sing-box-*-darwin-*.tar.gz" 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" =~ (alpha|beta|rc|test) ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_DARWIN_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_DARWIN_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_DARWIN=true" >> $GITHUB_ENV
          fi

      - name: Send Darwin binaries to Telegram
        if: env.SEND_DARWIN == 'true'
        uses: xz-dev/TelegramFileUploader@f597b98950e55d2b15f2fc94d1410cb557d829e0 # v1（2026-10-05 釘版，供應鏈補漏）
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🍎 *Darwin 二進制*
            `${{ env.TG_DARWIN_TAG }}`
            📦 *版本:* `${{ env.TG_VERSION }}`
          files: ${{ env.TG_DARWIN_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Prepare Apple TG Files
        if: steps.status.outputs.status == 'success'
        run: |
          files=$(find dist -type f \( -name "SFI-*.tipa" -o -name "SFM-*.zip" \) 2>/dev/null | head -10)
          if [ -n "$files" ]; then
            [[ "$files" =~ (alpha|beta|rc|test) ]] && TAG="#testing" || TAG="#stable"
            EOF_MARKER=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)
            echo "TG_APPLE_FILES<<$EOF_MARKER" >> $GITHUB_ENV
            echo "$files" >> $GITHUB_ENV
            echo "$EOF_MARKER" >> $GITHUB_ENV
            echo "TG_APPLE_TAG=$TAG" >> $GITHUB_ENV
            echo "SEND_APPLE=true" >> $GITHUB_ENV
          fi

      - name: Send Apple clients to Telegram
        if: env.SEND_APPLE == 'true'
        uses: xz-dev/TelegramFileUploader@f597b98950e55d2b15f2fc94d1410cb557d829e0 # v1（2026-10-05 釘版，供應鏈補漏）
        continue-on-error: true
        with:
          to-who: "${{ secrets.CHAT_ID }}"
          message: |
            🍎 *SFI (iOS 巨魔/越獄) 更新*
            `${{ env.TG_APPLE_TAG }}`
            📦 *版本:* `${{ env.TG_VERSION }}`
          files: ${{ env.TG_APPLE_FILES }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  create_issue_on_failure:
    # check 必須在 needs 裡：若 check 失敗，其下游全部 skip，缺了它 failure() 恆為
    # false，整個 run 紅了卻不會開單（與 close_issue_on_success 的 needs 保持對稱）。
    needs: [check, build_core, build_android, build_apple, publish_core, publish_android, publish_apple, finalize, telegram_notify]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: "🔴 定時構建失敗: sing-box"
    steps:
      - name: Collect failed jobs and steps
        run: |
          set -euo pipefail
          # 本 job 屬於當前 run，而 run 的日誌歸檔要等整個 run 結束後才產生，
          # 因此此前 `gh run view --log-failed` 在此必然取不到內容——這是歷史上
          # 7 個構建失敗 issue 錯誤日誌全空的根因。
          # 改用 Jobs API：它對 in-progress 的 run 同樣可用，可立即定位失敗作業與步驟。
          {
            echo "### 失敗作業 / 步驟（來源：Jobs API）"
            gh api --paginate \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[]
                    | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
                    | "JOB: \(.name) -> \(.conclusion)",
                      ((.steps // [])
                       | map(select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
                             | "  STEP: \(.name) -> \(.conclusion)")
                       | .[])'
          } > /tmp/error.log 2>/tmp/gh_err.log || {
            echo "無法取得作業資訊（gh api 退出碼 $?）：" > /tmp/error.log
            head -n 20 /tmp/gh_err.log >> /tmp/error.log
          }
          # 過濾條件中的 `!= null` 是必要的：本 job 執行時其他 job 仍在排隊或運行中，
          # 其 conclusion 為 null，不過濾會把「尚未執行」誤報成「失敗」。
          # run 被取消、或失敗發生在 job 之外時 Jobs API 查無失敗作業，
          # 補一行說明避免重演「錯誤日誌區塊為空」。
          [ -s /tmp/error.log ] || echo "Jobs API 未回傳失敗作業（run 可能被取消，或失敗發生在 job 之外），請直接查看 Actions 日誌。" > /tmp/error.log
          echo "----- 診斷輸出 -----"
          cat /tmp/error.log

      - name: Create or update issue
        run: |
          set -euo pipefail
          cat > issue_body.md <<EOF
          構建在工作流 \`${{ github.workflow }}\` 中失敗。

          [查看完整的 Actions 日誌](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 🔍 失敗作業 / 步驟
          \`\`\`log
          EOF
          tail -n 100 /tmp/error.log >> issue_body.md
          echo '```' >> issue_body.md

          # 以 list + 精確標題比對去重（對齊 check-patches.yml 既有範式）。
          # 不可用 --search "…in:title"：標題含 ASCII 冒號，會被搜尋語法誤解析為限定符分隔符。
          # 用 env.ISSUE_TITLE 取值，避免把標題字面量內嵌進 jq 過濾器。
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
                     --label "bug" --limit 100 --json number,title \
                     --jq '[.[] | select(.title == env.ISSUE_TITLE) | .number] | first // empty')

          if [ -n "$EXISTING" ]; then
            echo "已有開啟中的 issue #$EXISTING，改為追加評論（不再開重複單）。"
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file issue_body.md
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" --body-file issue_body.md --label "bug"
          fi

  close_issue_on_success:
    # needs 必須與 create_issue_on_failure 完全一致（含 finalize、telegram_notify），
    # 否則兩者的 success()/failure() 判據不對稱，會出現「部分流程仍失敗卻關閉 issue」。
    needs: [check, build_core, build_android, build_apple, publish_core, publish_android, publish_apple, finalize, telegram_notify]
    # 必須用 always()：上游作業在「無新版可編」時會被 skip，而 needs 中有任一 job 被 skip
    # 時，下游作業預設一併 skip（即使 success() 成立也不會執行），實測本 job 因此從未執行。
    # 改為 always() + !failure() + !cancelled()：上游任一失敗 -> 不關單；
    # 全部 skip 或全部成功 -> 正常執行（對齊 finalize 的 always() && !cancelled() 寫法）。
    # 再加 has_update 閘門：has_update=false 時所有構建作業都會 skip，「零失敗」只是
    # 沒跑任何東西，並不證明構建已恢復——曾據此把仍在失敗的 issue 提前關閉
    # （2026-10-01 #110 在 apple 仍紅時被全 skip run 關閉）。只有真的構建過
    # （has_update=true）且零失敗，才允許關單。
    if: >-
      always() &&
      !failure() &&
      !cancelled() &&
      needs.check.outputs.has_update == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close stale build-failure issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_TITLE: "🔴 定時構建失敗: sing-box"
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'bug', per_page: 100
            });
            const stale = issues.filter(i => i.title === title);
            if (stale.length === 0) {
              console.log('No stale build-failure issue to close.');
              return;
            }
            for (const i of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: `✅ 構建已恢復正常（run ${{ github.run_id }}），自動關閉此問題。`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
              console.log(`Closed #${i.number}`);
            }

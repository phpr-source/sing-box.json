name: Build Rule Sets

on:
  workflow_run:
    workflows: ["Custom Rule Merge"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      manual_name:
        required: false
      manual_url:
        required: false
  push:
    paths:
      - 'remote-rules.json'
      - 'src/**'
      - 'scripts/build_factory.py'
      - '.github/workflows/build-rules.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve Format Version
        run: |
          FMT_VER=$(curl -sL --retry 3 \
            "https://raw.githubusercontent.com/reF1nd/sing-box/refs/heads/reF1nd-testing/constant/rule.go" \
            2>/dev/null | grep -oP 'RuleSetVersionCurrent\s*=\s*RuleSetVersion\K\d+' || true)
          if [ -z "$FMT_VER" ]; then
            echo "::warning::Failed to read RuleSetVersionCurrent from upstream, falling back to 5"
            FMT_VER="5"
          fi
          echo "FORMAT_VERSION=$FMT_VER" >> "$GITHUB_ENV"
          echo "Resolved format version: $FMT_VER"

      - name: Install Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="sing-box-testing"
          ASSET_URL=$(curl -sL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.tar\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "::warning::No testing release found, falling back to stable"
            RELEASE_TAG="sing-box-stable"
            ASSET_URL=$(curl -sL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
              | jq -r '.assets[] | select(.name | test("linux-amd64.*\\.tar\\.gz$")) | .browser_download_url' \
              | head -n 1)
          fi

          if [ -z "$ASSET_URL" ]; then
            echo "::error::No Linux amd64 asset found in any release"
            exit 1
          fi

          curl -L --fail --retry 3 -o sing-box.tar.gz "$ASSET_URL"
          tar -xzf sing-box.tar.gz
          rm -f sing-box.tar.gz

          if [ ! -f "sing-box" ]; then
            FOUND=$(find . -maxdepth 2 -name "sing-box" -type f 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" ./sing-box
            fi
          fi

          if [ ! -f "sing-box" ]; then
            echo "::error::Binary not found after extraction"
            exit 1
          fi
          chmod +x sing-box

      - name: Run Factory
        run: |
          if [[ -n "${{ inputs.manual_name }}" ]]; then
            python3 scripts/build_factory.py "${{ inputs.manual_name }}" "${{ inputs.manual_url }}" --gen-readme
          else
            python3 scripts/build_factory.py --gen-readme
          fi

      - name: Commit and Push
        run: |
          SB_VER=$(./sing-box version 2>/dev/null | head -n 1 | awk '{print $3}')

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🚀 Sync Rules (V${FORMAT_VERSION}) | Core: ${SB_VER:-unknown} | $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>系統驗證中...</title> <meta http-equiv="refresh" content="1; url=https://i.ibb.co/0pDStcqs/photo-2026-02-28-08-03-35-png.jpg">

    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .loading-box {
            text-align: center;
        }
        /* 簡單的轉圈圈動畫，增加真實感 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-box">
        <div class="loader"></div>
        <p>正在加密連接，請稍候...</p>
    </div>
</body>
</html>
